人大常委会任免\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":51,"gap":false},{"id":"constitution-constitution-221","n":221,"chapter":"第六章 国家机构","title":"中级人民法院的职权 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">审理法律规定由中级人民法院管辖的第一审案件，及基层法院报请审理或上级法院指定管辖的案件\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">审理针对基层法院裁判的上诉、抗诉案件\u003c/span>，依法审理再审案件，并办理法律规定的其他审判事项\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":85,"gap":false},{"id":"constitution-constitution-222","n":222,"chapter":"第六章 国家机构","title":"高级人民法院的职权 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">审理法律规定由高级人民法院管辖的、下级报请或最高法院指定管辖的第一审案件\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">审理针对中级法院裁判的上诉、抗诉案件及再审案件\u003c/span>，依法复核有关死刑案件\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":70,"gap":false},{"id":"constitution-constitution-223","n":223,"chapter":"第六章 国家机构","title":"最高人民法院的职权 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">最高人民法院审理依法由其管辖或高级法院报请审理的第一审案件，审理有关上诉、抗诉、再审案件\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法核准死刑案件\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">监督地方各级及专门人民法院的审判工作\u003c/span>，对审判工作中具体应用法律的问题作出解释，并可发布指导性案例\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":100,"gap":false},{"id":"constitution-constitution-224","n":224,"chapter":"第六章 国家机构","title":"最高人民法院对下级法院审判工作监督的主要表现 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">依法审理有关上诉、抗诉案件，纠正下级法院裁判错误\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">对已经生效、确有错误的裁判\u003c/span>，可以依法提审或指令下级再审\u003c/li>\u003cli>\u003cspan class=\"blue\">依法复核有关死刑案件\u003c/span>，经司法解释、指导性案例等统一法律适用\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":80,"gap":false},{"id":"constitution-constitution-225","n":225,"chapter":"第六章 国家机构","title":"人民检察院的职权 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">依法侦查法律规定由检察机关办理的案件，审查并决定是否批准或决定逮捕、是否提起公诉\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法开展公益诉讼\u003c/span>\u003c/li>\u003cli>对诉讼活动、生效法律文书执行及监狱、看守所执法等依法实行法律监督\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":80,"gap":false},{"id":"constitution-constitution-226","n":226,"chapter":"第六章 国家机构","title":"最高人民检察院的职权 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">最高人民检察院领导地方各级和专门人民检察院，依法在全国范围履行法律监督职责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">对最高人民法院死刑复核活动依法实行监督\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">可对检察工作中具体应用法律的问题作出解释\u003c/span>，发布指导性案例\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":84,"gap":false},{"id":"constitution-constitution-227","n":227,"chapter":"第六章 国家机构","title":"上下级人民检察院的业务领导 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">上级检察院领导下级检察院，可以依法指令其纠正错误决定，也可以依法撤销或变更\u003c/span>\u003c/li>\u003cli>可按规定指定管辖、办理下级管辖的案件、统一调配检察人员\u003c/li>\u003cli>\u003cspan class=\"blue\">下级检察院应执行上级决定，有不同意见的可依法报告\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":88,"gap":false},{"id":"constitution-constitution-228","n":228,"chapter":"第六章 国家机构","title":"人民检察院内部的领导关系 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">检察长统一领导本院工作，副检察长协助\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">检察委员会讨论决定重大事项，实行民主集中制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">检察官在职权范围内独立办理案件并对履职负责\u003c/span>，重大疑难事项依法按程序提请检察长或检察委员会决定\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":85,"gap":false},{"id":"constitution-constitution-229","n":229,"chapter":"第六章 国家机构","title":"人民法院的基本制度 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">回避制度防止与案件有利害关系的人员影响公正\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">合议或独任审判依法适用，重大事项可提交审判委员会\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">原则上公开审判，法律另有规定的除外\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">通常实行两审终审，法律有特别规定的从其规定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">生效裁判确有错误的，依法经审判监督程序纠正\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":104,"gap":false},{"id":"constitution-constitution-230","n":230,"chapter":"第六章 国家机构","title":"人民法院的工作原则 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">人民法院依法独立行使审判权，以事实为根据、以法律为准绳\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">在适用法律上一律平等\u003c/span>，依法保障当事人诉讼权利和被告人获得辩护的权利\u003c/li>\u003cli>\u003cspan class=\"blue\">依法保障各民族公民使用本民族语言文字进行诉讼\u003c/span>，并实行司法公开和司法责任制\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":96,"gap":false},{"id":"constitution-constitution-231","n":231,"chapter":"第六章 国家机构","title":"人民检察院的工作原则 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">人民检察院依法独立行使检察权，在适用法律上一律平等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法保障公民使用本民族语言文字进行诉讼\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">坚持司法公正、司法公开，落实司法责任制\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":63,"gap":false},{"id":"constitution-constitution-232","n":232,"chapter":"第六章 国家机构","title":"人民法院、人民检察院和公安机关的关系 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">在刑事诉讼中，公安机关依法侦查，人民检察院依法审查逮捕、审查起诉和进行法律监督，人民法院依法审判\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">三机关分工负责、互相配合、互相制约\u003c/span>，以保证准确有效地执行法律\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":78,"gap":false}]},{"id":"history","name":"法制史","limit":130,"items":[{"id":"history-1794804285973","n":1,"chapter":"经典120题 / 中华法系·先秦","title":"中国传统法制的主要特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">注重和谐，维护一统\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法自君出，重权隆法，法律服务皇权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">诸法并存、民刑有分；律典编纂则诸法合体\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">家族本位、伦理法制，家国一体、礼法结合\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">调处息争，追求无讼\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>B站口诀【考法硕的君主】对应2-5点，第1点为26考试分析新增，额外补充记忆一个“胡一筒（和一统）”即可。B站口诀是记忆方法分享，一直可以参考使用。\u003c/p>","understanding":"","count":5,"chars":72,"gap":false},{"id":"history-1794804285974","n":2,"chapter":"经典120题 / 中华法系·先秦","title":"中国法制历史中的优秀传统","body":"\u003col>\u003cli>\u003cspan class=\"red\">民惟邦本，民贵君轻\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">礼法结合，综合为治，兼顾教化、规范\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">体系完备，律例并行\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">以法治官，明职课责，考选考课监察并用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法尚公平，执法原情，兼顾法理人情\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>明（民）礼系关公\u003c/p>","understanding":"","count":5,"chars":69,"gap":false},{"id":"history-1794804285975","n":3,"chapter":"经典120题 / 中华法系·先秦","title":"中华法系的背景和主要特点","body":"\u003col>\u003cli>\u003cspan class=\"red\">中华法系自夏商周发展至近代\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">儒、墨、道、法各家都影响其形成\u003c/span>，也吸收了各民族的法律经验\u003c/li>\u003cli>\u003cspan class=\"blue\">皇权至上\u003c/span>；维护宗法伦理；\u003cspan class=\"blue\">引礼入法\u003c/span>，法律不断儒家化；\u003cspan class=\"blue\">以刑为主\u003c/span>，诸法并存\u003c/li>\u003c/ol>","memory":"\u003cp>影响分内外\u003c/p>\u003cp>维护皇帝行李\u003c/p>","understanding":"","count":3,"chars":75,"gap":false},{"id":"history-1794804285976","n":4,"chapter":"经典120题 / 中华法系·先秦","title":"中华法系的现代意义和法文化的创造性转化","body":"\u003col>\u003cli>\u003cspan class=\"red\">传统制度虽退场，优秀法文化仍有价值\u003c/span>\u003c/li>\u003cli>借鉴民本、\u003cspan class=\"blue\">礼法合治、德主刑辅\u003c/span>、治国先治官、居安思危等经验\u003c/li>\u003cli>\u003cspan class=\"blue\">服务全面依法治国，增强文化自信\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须去糟粕、取精华，作创造性转化，不能复古照搬\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>古今对比→有意义、有任务\u003c/p>","understanding":"","count":4,"chars":82,"gap":false},{"id":"history-1794804285977","n":5,"chapter":"经典120题 / 中华法系·先秦","title":"中国法律起源的特点","body":"\u003col>\u003cli>\u003cspan class=\"red\">古代法的起源与宗法等级制度紧密结合，有明显的宗法伦理性质，王权和族权合一，家国一体\u003c/span>\u003c/li>\u003cli>古代法的起源主要是以“刑始于兵”和“礼源于祭祀”的形式完成\u003c/li>\u003cli>\u003cspan class=\"blue\">古代法的起源以自给自足的自然经济结构为基础\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>总是自然\u003c/p>","understanding":"","count":3,"chars":91,"gap":false},{"id":"history-1794804285978","n":6,"chapter":"经典120题 / 中华法系·先秦","title":"西周宗法制的基本原则","body":"\u003col>\u003cli>\u003cspan class=\"red\">周天子、诸侯、卿大夫、士的宗祧都实行嫡长子继承制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">大宗与小宗权利义务关系明确，相辅相成\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">家国一体，亲贵合一，等级秩序分明\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>嫡长子权义合一\u003c/p>","understanding":"","count":3,"chars":58,"gap":false},{"id":"history-1794804285979","n":7,"chapter":"经典120题 / 中华法系·先秦","title":"礼与刑的关系","body":"\u003col>\u003cli>\u003cspan class=\"red\">礼与刑相互配合，组成上古法制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">作用不同\u003c/span>：礼靠人自觉，重预防和教化；刑在犯罪后处罚\u003c/li>\u003cli>\u003cspan class=\"blue\">适用原则不同\u003c/span>：“\u003cspan class=\"blue\">礼不下庶人\u003c/span>”主要说礼为贵族设，庶人违礼也受罚；“\u003cspan class=\"blue\">刑不上大夫\u003c/span>”说刑主要防罚庶人\u003c/li>\u003cli>\u003cspan class=\"blue\">贵族犯罪常可减免，重罪一般也不用肉刑\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>联系与区别，做事要完整\u003c/p>","understanding":"","count":4,"chars":103,"gap":false},{"id":"history-1794804285980","n":8,"chapter":"经典120题 / 中华法系·先秦","title":"西周主要刑法原则","body":"\u003col>\u003cli>\u003cspan class=\"red\">老幼犯罪减免，故意杀人有例外\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">区分故意过失、惯犯偶犯\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">罪疑从轻、从赦\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宽严适中，罚罪相称\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">因时因地制宜，新国轻、乱国重、平国中\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">上下比罪，无明文参照近似条款\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">同罪异罚，特定身份享减免\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>老师最终同意下地（笑嘻嘻与周老师的故事）\u003c/p>","understanding":"","count":7,"chars":85,"gap":false},{"id":"history-1794804285981","n":9,"chapter":"经典120题 / 中华法系·先秦","title":"西周婚姻制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">西周一夫一妻，贵族可多妾\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">婚为传后、祭祖\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">父母之命，媒妁之言\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">同姓不婚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">为利子孙、结盟异姓\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">履行“六礼”程序\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">“七出”\u003c/span>：夫家可休妻\u003c/li>\u003cli>\u003cspan class=\"blue\">“三不去”\u003c/span>：即便有七出，无娘家可归、服婆家三年丧、先贫后富者也不能休\u003c/li>\u003c/ol>","memory":"\u003cp>缘起，六礼\u003c/p>\u003cp>缘灭，七出、三不去\u003c/p>","understanding":"","count":8,"chars":93,"gap":false},{"id":"history-1794804285982","n":10,"chapter":"经典120题 / 中华法系·先秦","title":"春秋时期公布成文法的事件/立法活动","body":"\u003col>\u003cli>\u003cspan class=\"red\">郑子产铸刑书于鼎，首次正式公布成文法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">晋赵鞅、荀寅铸范宣子刑书于鼎\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">郑邓析私作《竹刑》\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">晋文公《被庐之法》，涉及任官建制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">楚文王《仆区法》、庄王《茆门法》\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>第一第二、特别常态\u003c/p>\u003cp>庄王守门文王扑，晋国文公正被撸\u003c/p>","count":5,"chars":73,"gap":false},{"id":"history-1794804285983","n":11,"chapter":"经典120题 / 中华法系·先秦","title":"春秋时期成文法公布的历史意义","body":"\u003col>\u003cli>\u003cspan class=\"red\">打破刑不可知、威不可测，结束法律秘密状态\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">为成文法典、新社会关系发展创造条件\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">开辟新的集权治理方式\u003c/span>，为\u003cspan class=\"blue\">法治\u003c/span>取代礼治、后世法制完善积累经验\u003c/li>\u003c/ol>","memory":"\u003cp>公开铺路换治理（公＝公开破秘密；铺＝铺路促成文；换＝礼治换法治）\u003c/p>","understanding":"","count":3,"chars":66,"gap":false},{"id":"history-1794804285984","n":12,"chapter":"经典120题 / 中华法系·先秦","title":"战国立法指导思想","body":"\u003col>\u003cli>\u003cspan class=\"red\">一断于法\u003c/span>。将法作为衡量任何人行为的客观标准，取消\u003cspan class=\"blue\">旧贵族在法律上享有的一切特权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">刑无等级。要求制定公正的法律，平等地适用法律\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">轻罪重刑。用严刑峻法达到以法治国的目的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法布于众\u003c/span>。向全社会\u003cspan class=\"blue\">公布成文的法律\u003c/span>，否定了法律的秘密状态\u003c/li>\u003c/ol>","memory":"\u003cp>押韵/首尾\u003c/p>","understanding":"","count":4,"chars":106,"gap":false},{"id":"history-1794804285985","n":13,"chapter":"经典120题 / 中华法系·先秦","title":"《法经》的内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">盗法：侵犯财产\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">贼法\u003c/span>：人身伤害、破坏秩序\u003c/li>\u003cli>\u003cspan class=\"blue\">网法又称囚法\u003c/span>：囚禁审判\u003c/li>\u003cli>\u003cspan class=\"blue\">捕法\u003c/span>：追捕犯罪者\u003c/li>\u003cli>\u003cspan class=\"blue\">杂法\u003c/span>：其他犯罪刑罚\u003c/li>\u003cli>\u003cspan class=\"blue\">具法\u003c/span>：从轻从重等适用原则，相当于\u003cspan class=\"blue\">总则\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>体例三逻辑；金银城洗脚徒\u003c/p>","understanding":"","count":6,"chars":65,"gap":false},{"id":"history-1794804285986","n":14,"chapter":"经典120题 / 中华法系·先秦","title":"《法经》的评价","body":"\u003col>\u003cli>\u003cspan class=\"red\">第一部较系统完整的成文法典，以维护政权、私有财产为目的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">以惩盗贼为首，反对旧贵族特权，贯彻轻罪重刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">体例、内容为后世法典奠基\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>首典惩盗，重刑奠基\u003c/p>","understanding":"\u003cp>地位：第一部系统成文法典，保护政权和私产，主打轻罪重罚\u003c/p>\u003cp>内容：重点治盗贼，限制贵族特权；先写罪名再定刑罚，具法是兜底总则\u003c/p>\u003cp>影响：体例被秦汉沿用，是后世法典的模板\u003c/p>\u003cp>逻辑：定性是什么法典→里面写啥、怎么判罚→后面朝代直接照着用。\u003c/p>","count":3,"chars":60,"gap":false},{"id":"history-1794804285987","n":15,"chapter":"经典120题 / 中华法系·先秦","title":"商鞅变法的内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">改法为律：将法典的名称由“法”改称为“律”，提高法律的普遍性、公开性和强制性\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">连坐法\u003c/span>：包括同居连坐、邻伍连坐、\u003cspan class=\"blue\">军伍连坐\u003c/span>、\u003cspan class=\"blue\">职务连坐\u003c/span>等，告奸者受赏，不告奸者腰斩\u003c/li>\u003cli>\u003cspan class=\"blue\">分户令和军爵令\u003c/span>：《分户令》强制百姓分家立户，增加国家财政收入；颁布《军爵令》，奖励战功，增强国力\u003c/li>\u003c/ol>","memory":"\u003cp>改律、连坐、分户、军功\u003c/p>","understanding":"\u003cp>1.改法为律：改“法”为“律”，提升法律普遍性、公开性、强制性\u003c/p>\u003cp>2.连坐法：同居、邻伍、军伍、职务连坐，告奸受赏，不告奸腰斩\u003c/p>\u003cp>3.分户令：强制分家立户，增加财政收入\u003c/p>\u003cp>4.军爵令：奖励战功，增强国力\u003c/p>\u003cp>逻辑：改名强效力→连坐控民→分户增收→军功强国\u003c/p>","count":3,"chars":125,"gap":false},{"id":"history-1794804285988","n":16,"chapter":"经典120题 / 中华法系·先秦","title":"商鞅变法的评价商鞅变法律，评价2+2","body":"\u003col>\u003cli>\u003cspan class=\"red\">商鞅变法是战国时期影响最大、效果最为突出的社会变革\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">在政治、经济和法律制度等方面推行全面改革\u003c/span>，使秦国迅速发展和强大，\u003cspan class=\"blue\">灭六国统一天下\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">使得秦律内容比较系统完整，适用广泛，并且保持相对稳定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">从此以后，律成为历朝历代的主要法律形式\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>强秦改制，律成主流\u003c/p>","understanding":"\u003cp>是战国成效最大的变革\u003c/p>\u003cp>全面改革，让秦国变强，奠定统一基础\u003c/p>\u003cp>秦律系统完备、适用广、稳定\u003c/p>\u003cp>“律”自此成为后世主流法律形式\u003c/p>\u003cp>逻辑：变法地位→强国作用→完善秦律→确立“律”的地位\u003c/p>","count":4,"chars":109,"gap":false},{"id":"history-1794804285989","n":17,"chapter":"经典120题 / 中华法系·先秦","title":"秦朝立法指导思想","body":"\u003col>\u003cli>\u003cspan class=\"red\">缘法而治\u003c/span>\u003cspan class=\"blue\">。主张君主依据法律治理国家，反对礼治原则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法令由一统。全国实行统一的法律令，立法权掌握于君主\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">严刑重法\u003c/span>。经“深督轻罪”使“民不敢犯”，达到“\u003cspan class=\"blue\">以刑去刑\u003c/span>”的目的\u003c/li>\u003c/ol>","memory":"\u003cp>秦朝法医很严\u003c/p>","understanding":"","count":3,"chars":80,"gap":false},{"id":"history-1794804285990","n":18,"chapter":"经典120题 / 中华法系·先秦","title":"秦朝主要法律形式","body":"\u003col>\u003cli>\u003cspan class=\"red\">律：主体，稳定普遍适用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">令\u003c/span>：皇帝临时命令，效力最高\u003c/li>\u003cli>\u003cspan class=\"blue\">法律答问\u003c/span>：有法律效力的条文、术语解释\u003c/li>\u003cli>\u003cspan class=\"blue\">封诊式\u003c/span>：调查勘验审讯等程序、文书和案例\u003c/li>\u003cli>\u003cspan class=\"blue\">廷行事 emory":"\u003cp>刘邦萧何6+3\u003c/p>\u003cp>叔叔阿姨\u003c/p>\u003cp>张卫健\u003c/p>\u003cp>赵逸凡\u003c/p>","understanding":"","count":4,"chars":75,"gap":false},{"id":"history-1794804285994","n":22,"chapter":"经典120题 / 秦汉魏晋","title":"汉朝法律形式","body":"\u003col>\u003cli>\u003cspan class=\"red\">律：基本成文法，稳定通用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">令\u003c/span>：皇帝诏令，效力高于律\u003c/li>\u003cli>\u003cspan class=\"blue\">科\u003c/span>：律外单行法规，规定罪罚、行政事项\u003c/li>\u003cli>\u003cspan class=\"blue\">比\u003c/span>：无法条时参照成例判案\u003c/li>\u003c/ol>","memory":"\u003cp>律令科比，汉四形式\u003c/p>","understanding":"\u003cp>稳定主法→皇帝诏令→单行补充→判例参照\u003c/p>","count":4,"chars":54,"gap":false},{"id":"history-1794804285995","n":23,"chapter":"经典120题 / 秦汉魏晋","title":"文景时期刑制改革的内容和评价","body":"\u003col>\u003cli>\u003cspan class=\"red\">文帝除肉刑：黥改髡钳城旦舂，劓改笞300，斩左趾改笞500，斩右趾改弃市\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">景帝两次减笞\u003c/span>：500→300→200，300→200→100；《\u003cspan class=\"blue\">箠令\u003c/span>》统一刑具、部位，不许中途换人\u003c/li>\u003cli>\u003cspan class=\"blue\">刑罚趋轻、执行规范，为新五刑奠基\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":101,"gap":false},{"id":"history-1794804285996","n":24,"chapter":"经典120题 / 秦汉魏晋","title":"汉朝刑罚适用的两项重要原则","body":"\u003col>\u003cli>\u003cspan class=\"red\">上请/先请，特定官僚贵族及子孙犯罪，由皇帝裁决，常获减免\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">“亲亲得相首匿”\u003c/span>，源于孔子讲亲人相隐；首匿指藏罪犯的首谋\u003c/li>\u003cli>\u003cspan class=\"blue\">晚辈藏长辈、妻藏夫\u003c/span>，一般免追究；反过来一般也免，藏死罪由\u003cspan class=\"blue\">廷尉\u003c/span>决定是否追究\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":92,"gap":false},{"id":"history-1794804285997","n":25,"chapter":"经典120题 / 秦汉魏晋","title":"汉朝主要罪名","body":"\u003col>\u003cli>\u003cspan class=\"red\">集权罪：阿党附益、左官、非正、出界、逾制、漏泄省中语、酎金不如法、事国人过员\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">君专罪\u003c/span>：欺谩诋欺诬罔、\u003cspan class=\"blue\">废格诏书\u003c/span>、怨望诽谤、左道、矫制\u003c/li>\u003cli>\u003cspan class=\"blue\">皇帝尊安\u003c/span>：不敬、大不敬、阑入失阑、犯跸\u003c/li>\u003cli>\u003cspan class=\"blue\">政权\u003c/span>：蔽匿盗贼、见知故纵、群饮、通行饮食\u003c/li>\u003cli>\u003cspan class=\"blue\">思想\u003c/span>：腹诽\u003c/li>\u003c/ol>","memory":"\u003cp>汉朝罪名诗\u003c/p>","understanding":"","count":5,"chars":108,"gap":false},{"id":"history-1794804285998","n":26,"chapter":"经典120题 / 秦汉魏晋","title":"汉朝选拔和任用官吏的主要方法","body":"\u003col>\u003cli>\u003cspan class=\"red\">察举：长官按科目举荐，西汉始、东汉盛\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">征召\u003c/span>：皇帝\u003cspan class=\"blue\">诏举\u003c/span>对策或特聘人才\u003c/li>\u003cli>\u003cspan class=\"blue\">辟举\u003c/span>：高级官员举荐、征聘属吏\u003c/li>\u003cli>\u003cspan class=\"blue\">任子\u003c/span>：高官保\u003cspan class=\"blue\">任子\u003c/span>弟\u003c/li>\u003cli>\u003cspan class=\"blue\">太学补官\u003c/span>：学儒家经典，考试优良者任官\u003c/li>\u003c/ol>","memory":"\u003cp>查证太子屁\u003c/p>","understanding":"","count":5,"chars":73,"gap":false},{"id":"history-1794804285999","n":27,"chapter":"经典120题 / 秦汉魏晋","title":"汉朝监察制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">中央设御史台，为最高监察机关\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">地方监察机关主要是在京师设的司隶校尉和各州刺史\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">汉惠帝颁布监察法规《监御史九条》\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">汉武帝把全国分为13个监察区，每区派出刺史1人\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>中央地方两皇帝，监察机构三系统\u003c/p>","understanding":"","count":4,"chars":76,"gap":false},{"id":"history-1794804286000","n":28,"chapter":"经典120题 / 秦汉魏晋","title":"秋冬行刑","body":"\u003col>\u003cli>\u003cspan class=\"red\">汉代死刑的执行采取秋冬行刑制度\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">秋冬行刑理论渊源于西周\u003c/span>，汉朝将秋冬行刑制度化，在客观上有利于农业生产与社会秩序的稳定，又标榜了德政慎罚，故为后世法律所继承\u003c/li>\u003c/ol>","memory":"\u003cp>秋冬行刑四层次\u003c/p>","understanding":"","count":2,"chars":76,"gap":false},{"id":"history-1794804286001","n":29,"chapter":"经典120题 / 秦汉魏晋","title":"《曹魏律》/《新律》/《魏律》的内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">删繁就简，增加篇目至18篇，扩充了法典的内容，又删削了条文\u003c/span>\u003c/li>\u003cli>\ 一减\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>二死三流贞一流\u003c/p>","understanding":"","count":6,"chars":85,"gap":false},{"id":"history-1794804286012","n":40,"chapter":"经典120题 / 隋唐","title":"唐朝“十恶”的背景、内容、处罚","body":"\u003col>\u003cli>\u003cspan class=\"red\">十恶源于北齐重罪十条，隋定名、唐沿用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">谋反、谋大逆、谋叛；恶逆、不道、大不敬\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不孝、不睦、不义、内乱\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">严重破坏君权、伦理秩序，原则不得议请减赎当\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">三谋连坐且不分首从，处罚重\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>重礼尊卑无特权，三谋连坐无首从\u003c/p>","understanding":"","count":5,"chars":82,"gap":false},{"id":"history-1794804286013","n":41,"chapter":"经典120题 / 隋唐","title":"唐朝“六杀”的背景、内容、处罚","body":"\u003col>\u003cli>\u003cspan class=\"red\">谋杀：预谋\u003c/span>；\u003cspan class=\"blue\">故杀\u003c/span>：临时起杀意；\u003cspan class=\"blue\">斗杀\u003c/span>：斗殴中致死\u003c/li>\u003cli>\u003cspan class=\"blue\">误杀\u003c/span>：杀错对象；\u003cspan class=\"blue\">过失杀\u003c/span>：疏忽致死；\u003cspan class=\"blue\">戏杀\u003c/span>：嬉闹致死\u003c/li>\u003cli>\u003cspan class=\"blue\">谋杀依未伤、伤、死分别处罚；故杀通常重于谋而未遂\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">斗杀绞、持刃故杀斩，戏杀减斗杀二等，过失杀可赎\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":94,"gap":false},{"id":"history-1794804286014","n":42,"chapter":"经典120题 / 隋唐","title":"唐朝“六赃”的背景、内容、处罚","body":"\u003col>\u003cli>\u003cspan class=\"red\">六赃首列于杂律，按不法所得定刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">强盗\u003c/span>：暴力胁迫夺财；窃盗：秘密取财\u003c/li>\u003cli>\u003cspan class=\"blue\">受财枉法、不枉法\u003c/span>：收钱后是否曲法\u003c/li>\u003cli>\u003cspan class=\"blue\">受所监临财物\u003c/span>：监管官收辖内财物\u003c/li>\u003cli>\u003cspan class=\"blue\">坐赃\u003c/span>：其他官员因事取财\u003c/li>\u003cli>\u003cspan class=\"blue\">除受刑还须退赃，官除名、吏罢役\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>两个盗贼一坐下来就变成三个瘦子\u003c/p>","understanding":"","count":6,"chars":89,"gap":false},{"id":"history-1794804286015","n":43,"chapter":"经典120题 / 隋唐","title":"唐朝“保辜”的背景、含义、内容、评价","body":"\u003col>\u003cli>\u003cspan class=\"red\">殴伤后人死了，要弄清是伤害罪还是杀人罪，故设保辜\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">伤害后定期限，限满之日按受害者死伤定罪责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">辜限内主动救人可减责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">既看伤亡原因定责，也鼓励救人、减轻后果\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>唐朝保辜四层次\u003c/p>","understanding":"","count":4,"chars":73,"gap":false},{"id":"history-1794804286016","n":44,"chapter":"经典120题 / 隋唐","title":"唐朝对婚姻缔结的限制","body":"\u003col>\u003cli>\u003cspan class=\"red\">同姓不婚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">非同姓但有血缘关系的尊卑间不得为婚，违者“以奸论”\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">严禁与逃亡女子为婚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">监临官不得与监临之女为婚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">良贱之间不得为婚\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>逃官捡废铜（场景记忆法）\u003c/p>","understanding":"","count":5,"chars":58,"gap":false},{"id":"history-1794804286017","n":45,"chapter":"经典120题 / 隋唐","title":"唐朝中央司法机关","body":"\u003col>\u003cli>\u003cspan class=\"red\">大理寺掌审判：审百官和京师徒刑以上案，重审刑部移来的地方死刑案\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">刑部掌司法行政与案件复核权\u003c/span>：复核大理寺徒、流案和州县徒以上案；疑案驳回或改判，死案送大理寺重审\u003c/li>\u003cli>\u003cspan class=\"blue\">御史台纠察弹劾百官，监督另两司，也参加重大案件审理\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>材料题写意义\u003c/p>","understanding":"","count":3,"chars":103,"gap":false},{"id":"history-1794804286018","n":46,"chapter":"经典120题 / 隋唐","title":"唐律关于“告诉”的限制","body":"\u003col>\u003cli>\u003cspan class=\"red\">除谋反、谋大逆、谋叛等罪外，卑幼不得控告尊长\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">卑贱不得控告尊贵\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">在押犯人只准告狱官虐待事\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">八十岁以上、十岁以下\u003c/span>及笃疾者只准告子孙不孝或同居内受人侵害事\u003c/li>\u003cli>\u003cspan class=\"blue\">禁止投匿名信控告\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>尊长尊贵在押犯，八十笃疾匿名信\u003c/p>","understanding":"","count":5,"chars":80,"gap":false},{"id":"history-1794804286019","n":47,"chapter":"经典120题 / 隋唐","title":"唐朝法官责任制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">要求法官须严格依据律、令、格、式正文定罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">临时敕令未经立法变为永格，不能当后续判例用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">建立了同职连署制度\u003c/span>，要求有关官员共同审案判决，共同承担错判的责任，以利于互相监督，避免错判\u003c/li>\u003c/ol>","memory":"\u003cp>严格依据、准确引用、同职连署\u003c/p>","understanding":"","count":3,"chars":86,"gap":false},{"id":"history-1794804286020","n":48,"chapter":"经典120题 / 宋元","title":"宋朝的立法概况","body":"\u003col>\u003cli>\u003cspan class=\"red\">宋太祖颁《宋刑统》，中国第一部刊版印行的法典，宋朝一直用作基本法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">编敕是宋最重要、常做的立法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">编例\u003c/span>：条例是皇帝特旨\u003c/li>\u003cli>\u003cspan class=\"blue\">条法事类\u003c/span>：南宋孝宗淳熙年间把相关敕、令、格、式、指挥、申明等按事项汇编，便于判案，称《淳熙\u003cspan class=\"blue\">条法事类\u003c/span>》\u003c/li>\u003c/ol>","memory":"\u003cp>初期、中期、后期\u003c/p>","understanding":"","count":4,"chars":105,"gap":false},{"id":"history-1794804286021","n":49,"chapter":"经典120题 / 宋元","title":"宋朝的刑罚制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">宋太祖创立折杖法，实行笞杖徒流刑的折杖法，是宋初慎刑思想在刑罚制度上的体现\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">刺配是将杖刑、配役、刺面三刑同时施于一人的复合刑罚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">凌迟是以利刃零割碎剐残损肢体\u003c/span>，使受刑人在极端痛苦中缓慢死去的酷刑，这是古代死刑中最为残酷的行刑方式\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":111,"gap":false},{"id":"history-1794804286022","n":50,"chapter":"经典120题 / 宋元","title":"宋朝重法地法","body":"\u003col>\u003cli>\u003cspan class=\"red\">宋仁宗首立《窝藏重法》，严惩窝藏贼盗的犯罪，清除贼盗的社会基础\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宋英宗继承重法政策\u003c/span>，重制重法，既强调法的\u003cspan class=\"blue\">追溯力\u003c/span>，又株连罪犯亲属并籍没其家产\u003c/li>\u003cli>\u003cspan class=\"blue\">宋神宗颁行《重法地法》\u003c/span>，也称《盗贼重法》，扩大了重法的适用地区\u003c/li>\u003cli>\u003cspan class=\"blue\">宋哲宗废除重法地制度\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>仁宗首立，英神哲也很累（法制史知识歌）\u003c/p>","understanding":"","count":4,"chars":109,"gap":false},{"id":"history-1794804286023","n":51,"chapter":"经典120题 / 宋元","title":"宋朝不动产买卖契约的成立要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">先问亲邻：房亲优先，不买再问四邻\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">输钱印契\u003c/span>：交契税、官府盖印\u003c/li>\u003cli>\u003cspan class=\"blue\">过割赋税\u003c/span>：田宅税负随产权转给买方\u003c/li>\u003cli>\u003cspan class=\"blue\">原主离业\u003c/span>：卖方退出产业，交付\u003cspan class=\"blue\">实际占有\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":63,"gap":false},{"id":"history-1794804286024","n":52,"chapter":"经典120题 / 宋元","title":"宋朝的财产继承","body":"\u003col>\u003cli>\u003cspan class=\"red\">宋朝形成了一般财产继承、遗嘱继承、户绝财产继承、死亡客商财产继承等继承制度\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宋朝除沿袭家产兄弟均分制外\u003c/span>，允许在室女享受兄弟继承财产权的\u003cspan class=\"blue\">一半\u003c/span>，同时承认\u003cspan class=\"blue\">遗腹子\u003c/span>与亲生子享有同样的继承权\u003c/li>\u003cli>\u003cspan class=\"blue\">南宋又规定了户绝财产继承的办法\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>遗腹子起立，遵命！\u003c/p>","understanding":"","count":3,"chars":103,"gap":false},{"id":"history-1794804286025","n":53,"chapter":"经典120题 / 宋元","title":"宋朝“二府三司”","body":"\u003col>\u003cli>\u003cspan class=\"red\">“二府”：中书门下掌最高行政，两三名平章事行相权，另设副相参知政事分权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">“三司”管中央财赋\u003c/span>：\u003cspan class=\"blue\">盐铁司\u003c/span>管工商和兵器，\u003cspan class=\"blue\">度支司\u003c/span>管收支和漕运，\u003cspan class=\"blue\">户部司\u003c/span>管户口、赋税和榷酒\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":77,"gap":false},{"id":"history-1794804286026","n":54,"chapter":"经典120题 / 宋元","title":"宋朝选官制度/科举取士的显著发展","body":"\u003col>\u003cli>\u003cspan class=\"red\">录取和任用的范围较宽\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">殿试成为常制\u003c/span>，考生一律成为天子门生，避免了考生和主考官之间以师生之名结为同党\u003c/li>\u003cli>\u003cspan class=\"blue\">创造了“糊名”\u003c/span>（弥封）、“誉录”和回避等方法以防科场舞弊\u003c/li>\u003cli>\u003cspan class=\"blue\">考试内容虽仍侧重诗赋、经义\u003c/span>，但切近国家实际治理的\u003cspan class=\"blue\">策论\u003c/span>受到重视\u003c/li>\u003c/ol>","memory":"\u003cp>饭店舞狮\u003c/p>","understanding":"","count":4,"chars":106,"gap":false},{"id":"history-1794804286027","n":55,"chapter":"经典120题 / 宋元","title":"宋朝中央司法机关","body":"\u003col>\u003cli>\u003cspan class=\"red\">大理寺主审，管地方上报的刑事案、京师和百官犯罪，也参与审皇帝交办的重案\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">刑部管刑狱政令\u003c/span>，复核\u003cspan class=\"blue\">大理寺\u003c/span>审过的全国死刑案，也管犯罪官员的免职、赦后任用和平反\u003c/li>\u003cli>\u003cspan class=\"blue\">御史台参与审官员重案、司法官受贿案、地方疑难重案\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">皇帝亲审叫御笔断罪\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>御笔断罪的补充\u003c/p>","understanding":"","count":4,"chars":107,"gap":false},{"id":"history-1794804286028","n":56,"chapter":"经典120题 / 宋元","title":"宋朝主要司法制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">鞫谳分司制：审和判分开，鞫司问案，谳司依法量刑，互相牵制防舞弊\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">翻异别推制\u003c/span>：翻供影响重罪判断，就重审\u003c/li>\u003cli>\u003cspan class=\"blue\">务限法\u003c/span>：《宋刑统》设“婚田入务”\u003c/li>\u003cli>\u003cspan class=\"blue\">农忙不收田宅、婚姻等民事案；十月初一务开才受理\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>审判别诬陷\u003c/p>","understanding":"","count":4,"chars":88,"gap":false},{"id":"history-1794804286029","n":57,"chapter":"经典120题 / 宋元","title":"元朝监察制度的发展","body":"\u003col>\u003cli>\u003cspan class=\"red\">加强监察立法，使监察有法可依，有章可循\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">监察体制设置严密，并且赋予其较大的权限\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">重视加强对监察官本身的监督\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">体现民族歧视政策。御史大夫只给蒙古贵族\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>有法可依权限大，民族歧视重监督\u003c/p>","understanding":"","count":4,"chars":70,"gap":false},{"id":"history-1794804286030","n":58,"chapter":"经典120题 / 宋元","title":"元朝中央司法机关","body":"\u003col>\u003cli>\u003cspan class=\"red\">大宗正府：审蒙古、色目人及宗室案件，兼管贵族事务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">刑部\u003c/span>：隶\u003cspan class=\"blue\">中书省\u003c/span>，管司法行政、审判\u003c/li>\u003cli>\u003cspan class=\"blue\">宣政院\u003c/span>：管佛教、吐蕃军民政，审重大僧侣及僧俗纠纷\u003c/li>\u003c/ol>","memory":"\u003cp>元朝没有大理寺\u003c/p>","understanding":"","count":3,"chars":64,"gap":false},{"id":"history-1794804286031","n":59,"chapter":"经典120题 / 明清","title":"明朝定罪量刑的主要原则","body":"\u003col>\u003cli>\u003cspan class=\"red\">“断罪无正条”\u003c/span>\u003cspan class=\"blue\">。明律确立了“比附”类推的原则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">涉外案件采取属地主义的原则\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>唐明对比记忆\u003c/p>","understanding":"","count":2,"chars":35,"gap":false},{"id":"history-1794804286032","n":60,"chapter":"经典120题 / 明清","title":"明朝奸党罪的表现、处罚和目的","body":"\u003col>\u003cli>\u003cspan class=\"red\">官员结党乱政、曲法听上命，或巧谏宽免死罪邀买人心等，均可按奸党罪处理\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">甚至称赞大臣才德也可能入罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">通常处斩，意在消除臣下结党对皇权的威胁\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>奸党罪斩刑\u003c/p>","understanding":"","count":3,"chars":66,"gap":false},{"id":"history-1794804286033","n":61,"chapter":"经典120题 / 明清","title":"明朝犯罪与刑罚的主要特点","body":"\u003col>\u003cli>\u003cspan class=\"red\">明朝加重了对一些重点犯罪的镇压\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">明律对一些轻微触犯礼教、典礼的罪名\u003c/span>，比唐律处罚有所减轻，即“轻其轻”\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":49,"gap":false},{"id":"history-1794804286034","n":62,"chapter":"经典120题 / 明清","title":"明朝婚姻家庭与继承制度的变化","body":"\u003col>\u003cli>\u003cspan class=\"red\">明婚承唐宋，重婚礼、婚龄，父母作主\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">家长的权力进一步明确与扩大\u003c/span>：可惩罚违令子孙，也可包办婚事，责任随之加重\u003c/li>\u003cli>\u003cspan class=\"blue\">身份由嫡长子继承，家产诸子均分\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>婚姻家庭和继承，义绝家长奸生子\u003c/p>","understanding":"","count":3,"chars":67,"gap":false},{"id":"history-1794804286035","n":63,"chapter":"经典120题 / 明清","title":"明朝“一条鞭法”的含义、内容、评价","body":"\u003col>\u003cli>\u003cspan class=\"red\">一条鞭法：田赋、杂税、差役合并，折银统一征收\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按土地、人丁分担，官收官解\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">实物、劳役税转向货币税，减轻人身依附\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">征税更重土地等资产，税负与征收趋于简明\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>官收官解，人地统一\u003c/p>\u003cp>鄙人资产合理\u003c/p>","understanding":"","count":4,"chars":72,"gap":false},{"id":"history-1794804286036","n":64,"chapter":"经典120题 / 明清","title":"明朝监察制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">御史台改都察院，号风宪衙门\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">十三道御史轮巡各省\u003c/span>，叫\u003cspan class=\"blue\">巡按御史\u003c/span>；\u003cspan class=\"blue\">大事奏裁，小事立断\u003c/span>，犯罪加重两等\u003c/li>\u003cli>\u003cspan class=\"blue\">六部各设都、左、右给事中各一\u003c/span>，合称六科，监各部政务与奏章\u003c/li>\u003cli>\u003cspan class=\"blue\">明中期起巡抚管一省行政\u003c/span>，战时总督管军政，后来都成地方长官\u003c/li>\u003cli>\u003cspan class=\"blue\">提刑按察使也监察，称行在都察院或外台\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":119,"gap":false},{"id":"history-1794804286037","n":65,"chapter":"经典120题 / 明清","title":"明朝中央司法机关","body":"\u003col>\u003cli>\u003cspan class=\"red\">共同会审，称“三司会审”\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">刑部主审兼司法行政\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">死刑复核后报皇帝批准\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">大理寺复核，错案驳令改判，对了才准报请执行\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">都察院弹劾官员、参与审难案、监督执法\u003c/span>，并关押皇帝交办的要犯\u003c/li>\u003cli>\u003cspan class=\"blue\">监察御史定期巡按，监督地方审判\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":6,"chars":96,"gap":false},{"id":"history-1794804286038","n":66,"chapter":"经典120题 / 明清","title":"明朝厂卫","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">“厂”是由太监组成、直属皇帝的特务机关，包括东厂、西厂、内行厂\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">厂卫并非国家正式的司法机关\u003c/span>，但在皇帝的纵容之下，由宦官操纵，凌驾于司法机关之上，享有\u003cspan class=\"blue\">侦查\u003c/span>缉捕、监督审判、法外施刑等种种司法特权\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":94,"gap":false},{"id":"history-1794804286039","n":67,"chapter":"经典120题 / 明清","title":"明朝申明亭","body":"\u003col>\u003cli>\u003cspan class=\"red\">明初创建了申明亭，对百姓施行教化，并调处纠纷，以稳定统治秩序\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">洪武五年始设申明亭于各州县乡间\u003c/span>，由本里百姓推举正直乡里\u003cspan class=\"blue\">耆老、里长\u003c/span>主持\u003c/li>\u003cli>\u003cspan class=\"blue\">若经申明亭调解仍不愿和息，始可向官府起诉\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":84,"gap":false},{"id":"history-1794804286040","n":68,"chapter":"经典120题 / 明清","title":"明朝诉讼制度的特点","body":"\u003col>\u003cli>\u003cspan class=\"red\">严厉制裁诬告行为\u003c/span>。明律进一步加重处罚，规定诬告\u003cspan class=\"blue\">加等反坐\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">严禁越诉。“凡军民词讼，皆须自下而上陈告\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">军官、军人诉讼一般不受普通司法机构管辖\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">明确地域管辖的原则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">强调以民间半官方组织调解“息讼”\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>军地无月息\u003c/p>","understanding":"","count":5,"chars":91,"gap":false},{"id":"history-1794804286041","n":69,"chapter":"经典120题 / 明清","title":"明朝会审制度的内容和评价","body":"\u003col>\u003cli>\u003cspan class=\"red\">三司会审和九卿会审\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">朝审。高官复审已判的在押重刑犯，延续录囚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">大审\u003c/span>。皇帝定期派宦官与三法司全面查在押犯和诉冤案件，明朝独有\u003c/li>\u003cli>\u003cspan class=\"blue\">热审。暑热前处理久押未决犯，给在押囚犯减等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">体现慎刑\u003c/span>，便于皇帝监督司法、纠错；宦官把持时易流于形式\u003c/li>\u003c/ol>","memory":"\u003cp>热审未决；大审独有；朝审录囚；皇帝三司\u003c/p>","understanding":"","count":5,"chars":107,"gap":false},{"id":"history-1794804286042","n":70,"chapter":"经典120题 / 明清","title":"清朝刑事立法","body":"\u003col>\u003cli>\u003cspan class=\"red\">五刑外另有派生刑与附加刑：死刑类凌迟、枭首、戮尸\u003c/span>；流徙类充军、\u003cspan class=\"blue\">发遣\u003c/span>；附加枷号、刺字\u003c/li>\u003cli>\u003cspan class=\"blue\">充军重于流刑，分五等叫五军\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">发遣为清所创，比充军重、仅次死刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">刺字适用扩大，刑满后须任巡警之役三年\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">死刑有斩、绞立决和斩、绞监候\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":102,"gap":false},{"id":"history-1794804286043","n":71,"chapter":"经典120题 / 明清","title":"清朝维护满族特权的内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">确保满洲贵族在政权中的优越地位\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">旗人犯罪享有特权和优待\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律保护旗地旗产，禁止“旗民交产”\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>刑法、民法、行政法\u003c/p>","understanding":"","count":3,"chars":43,"gap":false},{"id":"history-1794804286044","n":72,"chapter":"经典120题 / 明清","title":"清朝人身依附关系削弱的具体表现","body":"\u003col>\u003cli>\u003cspan class=\"red\">废除匠籍制度\u003c/span>\u003cspan class=\"blue\">。手工业工人的人身权利得到了一定保障\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">雇工人的地位有所改善\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">部分贱籍豁免为良\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">奴婢可以开户为民\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>工匠贱奴都改善\u003c/p>","understanding":"","count":4,"chars":50,"gap":false},{"id":"history-1794804286045","n":73,"chapter":"经典120题 / 明清","title":"清朝债权制度的发展","body":"\u003col>\u003cli>\u003cspan class=\"red\">明确典、卖两种契约的区别\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">明确典当回赎权的年限\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">明确房屋出典后的风险责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">清代债权立法虽简单实用\u003c/span>，但与\u003cspan class=\"blue\">民间惯例\u003c/span>常有冲突，因而有时并未得到很好实施\u003c/li>\u003c/ol>","memory":"\u003cp>典卖典当房风险，简单实用有冲突\u003c/p>","understanding":"","count":4,"chars":69,"gap":false},{"id":"history-1794804286046","n":74,"chapter":"经典120题 / 明清","title":"清朝继承制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">清朝的继承仍分为身份继承和财产继承\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">禁收养异姓义子。清朝独创独子兼祧\u003c/span>：\u003cspan class=\"blue\">同父兄弟\u003c/span>两房同意，全族书面作证，一子才能继承两房香火和财产\u003c/li>\u003c/ol>","memory":"\u003cp>就当我为兄弟你伏笔\u003c/p>","understanding":"","count":2,"chars":63,"gap":false},{"id":"history-1794804286047","n":75,"chapter":"经典120题 / 明清","title":"清朝中央司法机关","body":"\u003col>\u003cli>\u003cspan class=\"red\">刑部主审\u003c/span>。审百官、京师笞杖以上案；批军、流、遣案；办地方上诉及秋审，掌司法行政和修律\u003c/li>\u003cli>\u003cspan class=\"blue\">大理寺复核死刑案件、平冤，也参加秋审热审\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">都察院为最高监察机关\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">另设宗人府、步军统领衙门、理藩院等审旗人案\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>清沿明制，刑部重要\u003c/p>","understanding":"","count":4,"chars":93,"gap":false},{"id":"history-1794804286048","n":76,"chapter":"经典120题 / 明清","title":"清朝秋审制度的背景、处理、评价","body":"\u003col>\u003cli>\u003cspan class=\"red\">秋审：每秋复核各省斩监候、绞监候，为国家大典\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">情实\u003c/span>：奏请处死；缓决：留待下年\u003c/li>\u003cli>\u003cspan class=\"blue\">可矜\u003c/span>：情可原，减免；\u003cspan class=\"blue\">可疑\u003c/span>：发回再审\u003c/li>\u003cli>\u003cspan class=\"blue\">留养承祀\u003c/span>：独子等合条件，经皇帝批准免死改罚\u003c/li>\u003cli>\u003cspan class=\"blue\">集中慎核死刑，但仍有封建等级局限\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>十环今一流\u003c/p>","understanding":"","count":5,"chars":91,"gap":false},{"id":"history-1794804286049","n":77,"chapter":"经典120题 / 明清","title":"清朝幕友胥吏","body":"\u003col>\u003cli>\u003cspan class=\"red\">幕友是官员私聘的政法顾问，俗称师爷\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">胥吏是各级政府衙门中文书工作的人员\u003c/span>，他们熟悉本地情况及当地\u003cspan class=\"blue\">审判惯例\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">幕友、胥吏往往勾结作弊\u003c/span>，敲诈勒索，贪赃枉法，使法制受到很大破坏\u003c/li>\u003c/ol>","memory":"\u003cp>司法舞弊\u003c/p>","understanding":"","count":3,"chars":81,"gap":false},{"id":"history-1794804286050","n":78,"chapter":"经典120题 / 清末变法","title":"《钦定宪法大纲》的内容和评价","body":"\u003col>\u003cli>\u003cspan class=\"red\">1908年颁，首个宪法性文件\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">正文君上大权14条，附录臣民权利义务9条\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">皇帝总揽立法行政司法军事\u003c/span>，议院不得干涉；臣民权利受法律、诏令限制\u003c/li>\u003cli>\u003cspan class=\"blue\">实质维护皇权，也推动权利意识和近代立宪\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>颁订第一分两部，正文君上附臣民\u003c/p>","understanding":"","count":4,"chars":85,"gap":false},{"id":"history-1794804286051","n":79,"chapter":"经典120题 / 清末变法","title":"《宪法重大信条十九条》的内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">辛亥革命爆发后清廷制临时宪法，采君主立宪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宪法限皇权，资政院起草议决，皇帝公布\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">仍称皇帝神圣不可侵犯，未提人民权利，没能挽救清廷\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>辛亥革命爆发后，君主立宪是政体。形缩皇权扩国总，人民权利只未提\u003c/p>","understanding":"","count":3,"chars":62,"gap":false},{"id":"history-1794804286052","n":80,"chapter":"经典120题 / 清末变法","title":"《大清现行刑律》的内容变化","body":"\u003col>\u003cli>\u003cspan class=\"red\">去六律总目，分30门\u003c/span>；婚姻、田宅、债务等民事事项\u003cspan class=\"blue\">不再科刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">删凌迟枭首戮尸刺字缘坐，保留死遣流徒、加罚金\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">增国交、选举、银元、交通电讯等罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">仍律例合编、留十恶，本质是旧律局部修改\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>取六民事不再科，设新删残确主刑。斩绞遣流徒金新，律例合编十未改\u003c/p>","understanding":"","count":4,"chars":85,"gap":false},{"id":"history-1794804286053","n":81,"chapter":"经典120题 / 清末变法","title":"《大清新刑律》的背景、内容、评价","body":"\u003col>\u003cli>\u003cspan class=\"red\">1911年颁，首部近代专门刑法典，未正式施行\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">分总则、分则，改变诸法合体\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">改用主刑、从刑体系，引入西方原则、术语，调整罪名\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">清末修律代表作，但仍受传统、皇权限制\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>谋反改内乱，国电未交换\u003c/p>\u003cp>体例抛合总分则，采用近代主从刑。引入原则和术语，调整了部分罪名主刑绞无有拘罚，褫夺公权和没收；取消十八和官服，省感化院少年犯\u003c/p>","understanding":"","count":4,"chars":77,"gap":false},{"id":"history-1794804286054","n":82,"chapter":"经典120题 / 清末变法","title":"《大清民律草案》的背景、原则、特点、评价","body":"\u003col>\u003cli>\u003cspan class=\"red\">清末民商分立\u003c/span>\u003cspan class=\"blue\">；草案由修订法律馆与礼学馆共同承担\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">采各国通行原则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">用最新合理学说\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">合国情民俗，随社会变化\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">前三编以“模范列强”为主\u003c/span>，取德式结构，参考日、德、瑞士\u003c/li>\u003cli>\u003cspan class=\"blue\">后两编以“固守国粹”为主，亲属和相关财产多用旧法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">前后风格不同，脱离实际\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>采纳各国民原则，新合理论为指导，充分考虑中国情前三模范列强，后二固守国粹。迥异严重脱节，第一产生影响\u003c/p>","understanding":"","count":7,"chars":110,"gap":false},{"id":"history-1794804286055","n":83,"chapter":"经典120题 / 清末变法","title":"清末商事立法的特点","body":"\u003col>\u003cli>\u003cspan class=\"red\">以“模范列强”“博稽中外”为立法原则，形式和内容仿西法，也吸收中国商事习惯\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">在法典编纂结构和立法技术上\u003c/span>，采取与商为便的一系列规定，鼓励私人投资近代企业\u003c/li>\u003cli>\u003cspan class=\"blue\">带有半殖民地法律的烙印\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">基本适应经济发展，是中国近代商事立法的开端\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>模范博稽半殖民，结构技术商为便，不足适应是开端（原来口诀是“照商宽”，最新教材删了几个字所以改一点，按B站口诀背也可以）\u003c/p>","understanding":"","count":4,"chars":106,"gap":false},{"id":"history-1794804286056","n":84,"chapter":"经典120题 / 清末变法","title":"礼法之争的背景、焦点、结局","body":"\u003col>\u003cli>\u003cspan class=\"red\">清末修律中，礼教派张之洞、劳乃宣与法理派争论\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">焦点\u003c/span>：干名犯义、存留养亲、无夫奸和亲属相奸、子孙违教令、卑幼能否防卫尊长\u003c/li>\u003cli>\u003cspan class=\"blue\">礼教派重伦理入刑，法理派主张区分法律道德\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">结局\u003c/span>：法理派妥协，附\u003cspan class=\"blue\">暂行章程\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>老张有礼貌，家本讲法理\u003c/p>\u003cp>沈家本\u003c/p>\u003cp>“法理派”\u003c/p>\u003cp>赵逸凡助记：卫子夫议亲\u003c/p>\u003cp>新刑律后附加五条，暂行章程加减不规\u003c/p>","understanding":"","count":4,"chars":92,"gap":false},{"id":"history-1794804286057","n":85,"chapter":"经典120题 / 清末变法","title":"清末修律的主要特点","body":"\u003col>\u003cli>\u003cspan class=\"red\">指导：借西方法律形式，维护固有统治内容\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">内容\u003c/span>：\u003cspan class=\"blue\">君主专制\u003c/span>与近代制度、术语并存\u003c/li>\u003cli>\u003cspan class=\"blue\">形式\u003c/span>：改\u003cspan class=\"blue\">诸法合体\u003c/span>，形成近代部门法雏形\u003c/li>\u003cli>\u003cspan class=\"blue\">实质\u003c/span>：维护君主政体，不是真正民主，未反映人民要求\u003c/li>\u003c/ol>","memory":"\u003cp>指导思想中西合，内容保守形先进，编纂改变成雏形，实质君主不民主\u003c/p>","understanding":"","count":4,"chars":78,"gap":false},{"id":"history-1794804286058","n":86,"chapter":"经典120题 / 清末变法","title":"清末修律的影响/评价","body":"\u003col>\u003cli>\u003cspan class=\"red\">导致中华法系走向解体\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">为中国法律的近代化奠定了基础\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">在一定程度引进和传播了西方近现代法律学说和法律制度\u003c/span>\u003c/li>\u003cli>在客观上有助于推动中国资本主义的发展和法学教育的近代化\u003c/li>\u003c/ol>","memory":"\u003cp>奠姐推船\u003c/p>","understanding":"","count":4,"chars":76,"gap":false},{"id":"history-1794804286059","n":87,"chapter":"经典120题 / 清末变法","title":"清末领事裁判权的背景和内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">领事裁判权：外国领事等在中国对本国侨民按本国法审判，侵犯中国司法主权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">中外、不同外国人争讼通常按被告所属国管辖\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">同国侨民由本国领事审\u003c/span>；无此特权的外国人作被告，仍由中国管辖\u003c/li>\u003c/ol>","memory":"\u003cp>中有——两有——不同——有无\u003c/p>","understanding":"","count":3,"chars":83,"gap":false},{"id":"history-1794804286060","n":88,"chapter":"经典120题 / 清末变法","title":"清末司法组织体制的调整","body":"\u003col>\u003cli>\u003cspan class=\"red\">刑部改法部，管司法行政\u003c/span>\u003cspan class=\"blue\">；省按察使司改提法使司\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">大理寺改大理院，为最高审判机关\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">各级审判厅内设检察厅\u003c/span>，实行审检合署，检察负责侦查、\u003cspan class=\"blue\">公诉\u003c/span>、监督等\u003c/li>\u003c/ol>","memory":"\u003cp>大理寺院刑法部，审检合署检察厅\u003c/p>","understanding":"","count":3,"chars":68,"gap":false},{"id":"history-1794804286061","n":89,"chapter":"经典120题 / 清末变法","title":"清末诉讼审判制度的改革","body":"\u003col>\u003cli>\u003cspan class=\"red\">四级三审，建立近代审判层级\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">引入公诉、附带民事诉讼、代理、证据、保释和律师辩护\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">采用公开、回避、辩论、预审、合议、公判、复审等制度\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">考试任用法官检察官，改良监狱；改革未充分落实\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>四三刑民保证律，初规法检改监狱。审判避开复合议，但并未能真实施\u003c/p>","understanding":"","count":4,"chars":85,"gap":false},{"id":"history-1794804286062","n":90,"chapter":"经典120题 / 民国时期","title":"《中华民国临时政府组织大纲》的内容和评价","body":"\u003col>\u003cli>\u003cspan class=\"red\">辛亥革命后，各省都督府代表经大纲，筹建临时政府\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">首次以法废帝制，仿美国设总统制共和国\u003c/span>\u003c/li>\u003cli>为以孙中山为首的中华民国南京临时政府的成立提供了法律依据；\u003cspan class=\"blue\">第一次以法律的形式确认共和政体的诞生\u003c/span>，也是《临时约法》的基础\u003c/li>\u003c/ol>","memory":"\u003cp>双首临时大总统，立法参议司法所\u003c/p>","understanding":"","count":3,"chars":100,"gap":false},{"id":"history-1794804286063","n":91,"chapter":"经典120题 / 民国时期","title":"《中华民国临时约法》的内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">明确宣示中华民国为统一的民主共和国\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">确立了资产阶级民主共和国的政治体制和国家制度\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">规定人民享有广泛的权利及应尽之义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">确认保护私有财产的原则，解除清廷对私人资本发展的限制\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>宣统民主共和国，确立资产体制度，规定民权及义务，确认私财受保护\u003c/p>","understanding":"","count":4,"chars":82,"gap":false},{"id":"history-1794804286064","n":92,"chapter":"经典120题 / 民国时期","title":"《中华民国临时约法》的特点","body":"\u003col>\u003cli>\u003cspan class=\"red\">由总统制改责任内阁制，限制袁世凯\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">扩大参议院立法、同意、弹劾权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">修改须议员2/3以上或临时大总统提议\u003c/span>，议员\u003cspan class=\"blue\">4/5\u003c/span>以上出席，出席者\u003cspan class=\"blue\">3/4\u003c/span>以上同意\u003c/li>\u003c/ol>","memory":"\u003cp>责任内阁限总统，扩参立法弹同意\u003c/p>\u003cp>修改程序很特别，3提4赞5出席\u003c/p>","understanding":"","count":3,"chars":69,"gap":false},{"id":"history-1794804286065","n":93,"chapter":"经典120题 / 民国时期","title":"《中华民国临时约法》的评价","body":"\u003col>\u003cli>\u003cspan class=\"red\">近代首部资产阶级共和国性质宪法文件，否定君主专制、确认民主共和与自由原则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">肯定辛亥成果，符合当时进步趋势，也反映部分民主要求\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">受阶级、时代限制，立宪观念与技术均有缺陷\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>性质两肯一否定，符合发展映人民，因人立法局限性\u003c/p>","understanding":"","count":3,"chars":81,"gap":false},{"id":"history-1794804286066","n":94,"chapter":"经典120题 / 民国时期","title":"南京临时政府司法改革的主要措施","body":"\u003col>\u003cli>\u003cspan class=\"red\">确立司法独立的原则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">禁止刑讯\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">禁止体罚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">试行公开审判及陪审制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">试行律师制度\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>司法独立禁刑体，试行二审和律师\u003c/p>","understanding":"","count":5,"chars":33,"gap":false},{"id":"history-1794804286067","n":95,"chapter":"经典120题 / 民国时期","title":"北洋政府立法活动的特点","body":"\u003col>\u003cli>\u003cspan class=\"red\">采用、删改清末新订之法律，常以其为蓝本\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">采用西方资本主义国家的某些立法原则，沿用民主共和形式\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">制定颁布众多单行法规，涉及刑事、治安、民商\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">判例和解释例成为重要的法律渊源\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>采删清末西原则\u003c/p>\u003cp>制单判解成渊源\u003c/p>","understanding":"","count":4,"chars":81,"gap":false},{"id":"history-1794804286068","n":96,"chapter":"经典120题 / 民国时期","title":"《中华民国宪法草案》（天坛宪草）的背景和内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">天坛宪草：北洋首部宪法草案，三权分立、意在限袁\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">确认责任内阁\u003c/span>，总理任命须众院同意；限制总统解散国会等权\u003c/li>\u003cli>\u003cspan class=\"blue\">总统任5年、连任一次\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">独立审计院，参院选审计员，总统不得任免\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>郑国人机\u003c/p>","understanding":"","count":4,"chars":79,"gap":false},{"id":"history-1794804286069","n":97,"chapter":"经典120题 / 民国时期","title":"《中华民国约法》（袁记约法）的内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">袁记约法推翻临时约法的民主共和安排，建立个人独裁\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">取消责任内阁，扩张总统权力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">废国会，设名义立法院\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">基本权利受“法律范围内”等限制，可被任意压缩\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>助记：否实取设有前提\u003c/p>","understanding":"","count":4,"chars":69,"gap":false},{"id":"history-1794804286070","n":98,"chapter":"经典120题 / 民国时期","title":"南京国民政府的立法阶段","body":"\u003col>\u003cli>\u003cspan class=\"red\">【1927—1936年】，国民党政权“法统”的形成时期\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">【1937—1945年】\u003c/span>，国民党政权“法统”的\u003cspan class=\"blue\">发展时期\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">【1946—1949年】\u003c/span>，国民党政权“法统”的\u003cspan class=\"blue\">完善和崩溃时期\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>形成和发展，完善就崩溃\u003c/p>","understanding":"","count":3,"chars":84,"gap":false},{"id":"history-1794804286071","n":99,"chapter":"经典120题 / 民国时期","title":"南京国民政府的法律体系","body":"\u003col>\u003cli>\u003cspan class=\"red\">仿大陆法系，以法典为核心\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">1928至1937年先后公布六类法规\u003c/span>：\u003cspan class=\"blue\">宪法\u003c/span>、\u003cspan class=\"blue\">民法\u003c/span>、\u003cspan class=\"blue\">民诉法\u003c/span>、\u003cspan class=\"blue\">刑法\u003c/span>、\u003cspan class=\"blue\">刑诉法\u003c/span>、\u003cspan class=\"blue\">行政法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">汇编采取“以法典为纲、以相关法规为目”\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">三个层次\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>法典法规和两例\u003c/p>","understanding":"","count":4,"chars":74,"gap":false},{"id":"history-1794804286072","n":100,"chapter":"经典120题 / 民国时期","title":"南京国民政府法律制度的主要特点","body":"\u003col>\u003cli>\u003cspan class=\"red\">以孙中山的“遗教”为立法的根本原则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">特别法多于普通法，其效力往往也高于普通法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">形成了以《六法全书》为标志的国家成文法律体系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不成文法在法律体系中占据重要地位\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>他姨不行\u003c/p>","understanding":"","count":4,"chars":75,"gap":false},{"id":"history-1794804286073","n":101,"chapter":"经典120题 / 民国时期","title":"《中国国民党训政纲领》（训政纲领）的内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">1928年训政纲领确立一党治国、以党训政\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国民党全国代表大会代国民大会行使政权\u003c/span>，闭会由中执委代行\u003c/li>\u003cli>\u003cspan class=\"blue\">国民政府受党中央领导，中央政治会议直接指导政府\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">训政保姆论为一党专政提供说辞\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>确立方针两时期，人民保姆训政者\u003c/p>","understanding":"","count":4,"chars":84,"gap":false},{"id":"history-1794804286074","n":102,"chapter":"经典120题 / 民国时期","title":"《中华民国训政时期约法》的内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">以根本法的形式确认《训政纲领》的“党治”原则，建立国民党一党专政的国家制度\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">规定五院制的政府组织形式\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">罗列一系列公民权利与自由，但又多加限制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">利用国家的名义，发展官僚资本\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>确见五萝莉\u003c/p>","understanding":"","count":4,"chars":82,"gap":false},{"id":"history-1794804286075","n":103,"chapter":"经典120题 / 民国时期","title":"《中华民国宪法》（南京国民政府）的内容和评价","body":"\u003col>\u003cli>\u003cspan class=\"red\">以三民主义、五权宪法安排国家制度\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国民大会名义最高但权有限；总统制，设五院相互牵制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">列人民权利义务，中央地方分权、省县自治\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">标志训政结束、形式宪政开始\u003c/span>，是近代较系统完整的宪法成果\u003c/li>\u003c/ol>","memory":"\u003cp>三五大会高又限，形式总统受制约\u003c/p>\u003cp>人民权利和义务\u003c/p>\u003cp>中央地方省县权\u003c/p>","understanding":"","count":4,"chars":86,"gap":false},{"id":"history-1794804286076","n":104,"chapter":"经典120题 / 民国时期","title":"1935年《中华民国刑法》的主要特点","body":"\u003col>\u003cli>\u003cspan class=\"red\">继受西方刑法原则，同时保留宗法伦理制度\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">侵害尊亲加重、同居相隐、亲族盗窃特别处理\u003c/span>，纳妾不作重婚\u003c/li>\u003cli>\u003cspan class=\"blue\">时间效力从新从轻，保安处分原则从新\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">社会防卫主义，设少年等感化、监控措施\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>继受采纳时空效，社会防卫增保安\u003c/p>","understanding":"","count":4,"chars":81,"gap":false},{"id":"history-1794804286077","n":105,"chapter":"经典120题 / 民国时期","title":"《中华民国民法》的背景、内容、评价","body":"\u003col>\u003cli>\u003cspan class=\"red\">首部正式民法典，采用德国式总则、债、物权、亲属、继承五编\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">采社会本位、无过失责任等新制度\u003c/span>；无法可依时用习惯、法理\u003c/li>\u003cli>\u003cspan class=\"blue\">维护私有财产和地主土地权；亲属继承保留固有伦理\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">推动民法近代化，未解决根本民生问题\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>社会本位吸学理，维护固有习法理（按最新表述改了口诀）\u003c/p>\u003cp>前三德日瑞、后二多传统、水准基本达、民生未解决\u003c/p>","understanding":"","count":4,"chars":95,"gap":false},{"id":"history-1794804286078","n":106,"chapter":"经典120题 / 民国时期","title":"南京国民政府诉讼审判制度的特点","body":"\u003col>\u003cli>\u003cspan class=\"red\">采取严密的侦查制度，检察官、司法警察、宪兵、军士都能侦查，尤以检察官权大\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">实行“自由心证”的诉讼证据原则\u003c/span>：法官凭\u003cspan class=\"blue\">内心确信\u003c/span>决定证据是否采信、有多大证明力\u003c/li>\u003cli>\u003cspan class=\"blue\">实行秘密审判制度和陪审制度\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">扩大并强化军事和军法机关的审判，以刑事特别法扩权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">维护帝国主义在华军队的特权\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>真心特大度\u003c/p>","understanding":"","count":5,"chars":124,"gap":false},{"id":"history-1794804286079","n":107,"chapter":"经典120题 / 革命根据地","title":"《中华苏维埃共和国宪法大纲》的内容和评价","body":"\u003col>\u003cli>\u003cspan class=\"red\">规定苏维埃国家性质是工人和农民的民主专政国家\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">规定苏维埃国家政治制度是工农兵代表大会\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">规定并保障苏维埃国家公民的权利和义务\u003c/span>，并尽力提供物质保障\u003c/li>\u003cli>\u003cspan class=\"blue\">规定苏维埃国家的外交政策\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宪政经验不足，受“左”倾思想影响而有缺陷\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>外公姓郑\u003c/p>","understanding":"","count":5,"chars":101,"gap":false},{"id":"history-1794804286080","n":108,"chapter":"经典120题 / 革命根据地","title":"《井冈山土地法》和《兴国土地法》","body":"\u003col>\u003cli>\u003cspan class=\"red\">《井冈山土地法》是工农民主政权的第一部土地立法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">工农民主政权中期的土地立法以《兴国土地法》为代表\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>第一代表，越来越好（记住“第一”和“代表”两个定性，总体都是变好）备注：B站原题没有错，只是最新教材删掉了，所以替换为本题。B站原题也可背诵\u003c/p>","understanding":"","count":2,"chars":47,"gap":false},{"id":"history-1794804286081","n":109,"chapter":"经典120题 / 革命根据地","title":"《中华苏维埃共和国土地法》的主要内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">没收地主、富农、反革命和农村公共土地\u003c/span>；没收地主豪绅、军阀财产，废债务契约\u003c/li>\u003cli>\u003cspan class=\"blue\">优先贫雇农、中农，以乡为单位，按人口或兼劳力均分\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">富农不反革命且自食其力，可分坏田\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">当时不禁土地出租买卖，条件具备后土地国有\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>没收分配有利于，规定土地所有权，左倾问题很严重，地主不分富坏田\u003c/p>","understanding":"","count":4,"chars":96,"gap":false},{"id":"history-1794804286082","n":110,"chapter":"经典120题 / 革命根据地","title":"《中华苏维埃共和国婚姻法》的主要内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">婚姻自由、男女平等，废不合理旧制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">男20、女18岁可结婚；离婚自由，保障子女、财产处理\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">非婚生子女与婚生子女权利平等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保护红军婚姻\u003c/span>：妻要求离婚通常须夫同意，长期无信有例外\u003c/li>\u003cli>\u003cspan class=\"blue\">重点保护妇女儿童\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>自费三年并领证，私保红鲤有办法\u003c/p>","understanding":"","count":5,"chars":90,"gap":false},{"id":"history-1794804286083","n":111,"chapter":"经典120题 / 革命根据地","title":"《陕甘宁边区施政纲领》的主要内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">明确阐述抗日民主政权的主要任务，是《抗日救国十大纲领》确定的“抗日”“团结”“民主”，团结各阶层和抗日党派，动员抗战\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">加强政权民主建设。参议会是民意机关，选同级政府\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">改进司法制度，厉行廉洁政治\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">规定边区的基本文化经济政策\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>明家改规\u003c/p>","understanding":"","count":4,"chars":107,"gap":false},{"id":"history-1794804286084","n":112,"chapter":"经典120题 / 革命根据地","title":"抗日民主政权（以陕甘宁边区为代表）土地立法的主要内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">保护土地所有权，承认依法使用、收益、处分\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">减租25%后交租，不许多收、预收、收押租、欠租计息\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保障永佃，无法定理由不得撤佃\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">利息已超本金1倍停息还本，超2倍本息均停\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>保护双权土和佃，减租交租减利息\u003c/p>","understanding":"","count":4,"chars":79,"gap":false},{"id":"history-1794804286085","n":113,"chapter":"经典120题 / 革命根据地","title":"抗日民主政权劳动立法的主要内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">工人有权自由组织工会\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">实行10小时工作制\u003c/span>(陕甘宁边区为\u003cspan class=\"blue\">8小时\u003c/span>)，加班应征得工人的同意，并支付加班工资\u003c/li>\u003cli>\u003cspan class=\"blue\">按照各地的具体经济条件实行最低工资标准\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">实行安全生产防护\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>工人工会十小时，最低工资有安全\u003c/p>","understanding":"","count":4,"chars":76,"gap":false},{"id":"history-1794804286086","n":114,"chapter":"经典120题 / 革命根据地","title":"抗日民主政权婚姻立法的主要内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">男女平等、婚姻自由、一夫一妻、保护妇儿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">最低婚龄通常男20、女18\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">增订婚、解除婚约规定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">双方自愿离婚登记即可；单方依列举条件处理\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">规定离婚财产分配、子女抚养\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>增加离婚基地\u003c/p>","understanding":"","count":5,"chars":75,"gap":false},{"id":"history-1794804286087","n":115,"chapter":"经典120题 / 革命根据地","title":"抗日民主政权的刑法原则和主要罪名","body":"\u003col>\u003cli>\u003cspan class=\"red\">镇压与宽大结合，平等保障人权，反对威吓报复、重感化教育\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">汉奸罪\u003c/span>：以破坏抗战为目的\u003c/li>\u003cli>\u003cspan class=\"blue\">破坏坚壁财物罪\u003c/span>：勾敌挖索、盗毁坚壁物资\u003c/li>\u003cli>\u003cspan class=\"blue\">贪污罪\u003c/span>：各根据地立单行规定，范围通常较广\u003c/li>\u003c/ol>","memory":"\u003cp>真人教育\u003c/p>","understanding":"","count":4,"chars":78,"gap":false},{"id":"history-1794804286088","n":116,"chapter":"经典120题 / 革命根据地","title":"马锡五审判方式","body":"\u003col>\u003cli>\u003cspan class=\"red\">马锡五在巡回审判中贯彻群众路线，深入农村，调查研究，实事求是地了解案情\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依靠群众，教育群众，尊重群众意见\u003c/span>\u003c/li>\u003cli>把中国共产党\u003cspan class=\"blue\">群众\u003c/span>路线的工作方针创造性地运用到审判工作中去的\u003cspan class=\"blue\">司法民主\u003c/span>的崭\u003cspan class=\"blue\">新形式\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>了解群众新形式\u003c/p>","understanding":"","count":3,"chars":89,"gap":false},{"id":"history-1794804286089","n":117,"chapter":"经典120题 / 革命根据地","title":"人民调解制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">调解方式：民间调解、群众团体调解、政府调解、司法调解\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">调解原则\u003c/span>：双方自愿；以法律为准绳，照顾善良风俗；调解\u003cspan class=\"blue\">不是诉讼必经程序\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">调解的范围\u003c/span>：民事纠纷和\u003cspan class=\"blue\">轻微刑事案件\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">调解处理方式\u003c/span>：一般有赔礼道歉、认错、赔偿损失或抚慰金等\u003c/li>\u003cli>\u003cspan class=\"blue\">调解一般需制作和解书\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>元芳出书有范围，人民调解好制度\u003c/p>","understanding":"","count":5,"chars":114,"gap":false},{"id":"history-1794804286090","n":118,"chapter":"经典120题 / 革命根据地","title":"《陕甘宁边区宪法原则》的主要内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">采取人民代表会议制，以保证人民管理政权机关\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保障人民享有广泛的民主权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">确立边区的人民司法原则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">确立边区的经济文化政策\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>人质斯文\u003c/p>","understanding":"","count":4,"chars":56,"gap":false},{"id":"history-1794804286091","n":119,"chapter":"经典120题 / 革命根据地","title":"《中国土地法大纲》的主要内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">废封建、半封建土地剥削，实行耕者有其田\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依靠贫雇农、团结中农，正确对待地主富农、保护工商\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">以乡村为单位按人口平均分地，确认农民所有权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">由农民大会、贫农团大会等执行\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>废实耕者有其田，依团保正是原则，乡为单位人均分，确权执行保工商\u003c/p>","understanding":"","count":4,"chars":78,"gap":false},{"id":"history-1794804286092","n":120,"chapter":"经典120题 / 革命根据地","title":"解放战争时期刑事立法的主要内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">惩办战争罪犯\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">镇压地主恶霸与肃清政治土匪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">取缔反动党团及特务组织\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">解散一切反动会道门迷信组织\u003c/span>\u003c/li>\u003cli>对惩治扰乱金融、贪污、盗窃、诈骗、吸毒贩毒等犯罪作了规定\u003c/li>\u003c/ol>","memory":"\u003cp>姐去城镇规定犯罪\u003c/p>","understanding":"","count":5,"chars":71,"gap":false},{"id":"history-1794804286093","n":121,"chapter":"教材新增 / 教材新增","title":"西周“嘉石”之制","body":"\u003col>\u003cli>\u003cspan class=\"red\">西周有“嘉石”之制，是拘押轻罪犯者的惩罚制度，属秋官大司寇之职\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">嘉石也称“文石”\u003c/span>，指有纹理的美石，用以感化莠民，使之产生自悔，改恶从善\u003c/li>\u003cli>\u003cspan class=\"blue\">嘉石之制是以感化教育为主的惩戒刑\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>制度简述；背景介绍；评价适用\u003c/p>","understanding":"","count":3,"chars":82,"gap":false},{"id":"history-1794804286094","n":122,"chapter":"教材新增 / 教材新增","title":"北洋政府民事法律体系","body":"\u003col>\u003cli>\u003cspan class=\"red\">“现行律民事有效部分”，含《大清现行刑律》民事条款、服制和《大清户部则例》的户口、田赋租税等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">前民法典时代的实质民法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">条文简略，用民事单行法令补充具体问题\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">成文法不足时\u003c/span>，大理院用判例和解释例解释并填补漏洞；习惯法和条理也可补充\u003c/li>\u003c/ol>","memory":"\u003cp>内容和评价；问题及解决①；问题及解决②\u003c/p>","understanding":"","count":4,"chars":110,"gap":false},{"id":"history-1794804286095","n":123,"chapter":"教材新增 / 教材新增","title":"北洋政府《民律草案》","body":"\u003col>\u003cli>\u003cspan class=\"red\">民律草案未能正式完成立法程序\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">吸收现行律民事条文和大理院判例、解释例\u003c/span>，继受外国法更成熟\u003c/li>\u003cli>\u003cspan class=\"blue\">另有商事、经济单行法规，适应商品经济、推动民族资本\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>背景；内容（本国、外国、价值）；商事补充\u003c/p>","understanding":"","count":3,"chars":67,"gap":false},{"id":"history-1794804286096","n":124,"chapter":"教材新增 / 教材新增","title":"唐朝市场管理制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">重农抑商、士农工商分业\u003c/span>\u003cspan class=\"blue\">；市令、市丞管理交易\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">定价公平，故意不平按差额坐赃论\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">规格、度量衡须合标准并定期校验\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">严禁强买强卖、串通抬压价格\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">查禁伪劣，追究经济、刑事责任\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>NYC补充（材料分析答题素材）：\u003c/p>","understanding":"","count":5,"chars":78,"gap":false},{"id":"history-1794804286097","n":125,"chapter":"增补50题 / 先秦秦","title":"理解“嫡长子继承制”","body":"\u003col>\u003cli>\u003cspan class=\"red\">宗法制下，继承制度的核心是嫡长子继承制，西周将它定为基本制度\u003c/span>\u003c/li>\u003cli>西周的宗法制着眼于解决周天子及各级贵族的爵封继承和宗祧继承问题，同时也解决财产继承问题\u003c/li>\u003cli>\u003cspan class=\"blue\">各级贵族的领地和世袭身份只能由正妻\u003c/span>（嫡妻）所生的长子继承\u003c/li>\u003c/ol>","memory":"\u003cp>NYC补充：爵封继承是指爵位与封地的继承\u003c/p>","understanding":"","count":3,"chars":101,"gap":false},{"id":"history-1794804286098","n":126,"chapter":"增补50题 / 先秦秦","title":"西周的司法制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">司法机构\u003c/span>。\u003cspan class=\"blue\">大司寇\u003c/span>助周王主管全国司法；小司寇办狱讼，司刑、司刺、掌囚、掌戮分工\u003c/li>\u003cli>\u003cspan class=\"blue\">刑事诉讼与民事诉讼\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">五听\u003c/span>，也叫五声。看辞（言语）、色（脸色）、气（呼吸）、耳（听觉）、目（眼神）判断陈述真假\u003c/li>\u003cli>\u003cspan class=\"blue\">有主观性\u003c/span>，但比夏商神判进步，是审判心理运用的萌芽，后世沿用\u003c/li>\u003c/ol>","memory":"\u003cp>财货相告民听讼，束矢一百箭；相告以罪刑断狱，钧金三十铜\u003c/p>","understanding":"","count":4,"chars":120,"gap":false},{"id":"history-1794804286099","n":127,"chapter":"增补50题 / 先秦秦","title":"秦朝的主要刑名/刑种","body":"\u003col>\u003cli>\u003cspan class=\"red\">死刑：种类多、执行残酷\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">肉刑\u003c/span>：墨、劓、斩趾、宫等\u003c/li>\u003cli>\u003cspan class=\"blue\">作刑\u003c/span>：限制自由并强制无偿劳役\u003c/li>\u003cli>\u003cspan class=\"blue\">财产刑\u003c/span>：缴一定财产\u003c/li>\u003cli>\u003cspan class=\"blue\">耻辱刑\u003c/span>：髡剃发、耐剃须等\u003c/li>\u003c/ol>","memory":"\u003cp>听秦朝法制歌-晴天，歌词：髡剃头发，耐剃去犯人胡须\u003c/p>","understanding":"","count":5,"chars":58,"gap":false},{"id":"history-1794804286100","n":128,"chapter":"增补50题 / 秦汉魏晋","title":"秦朝的经济立法","body":"\u003col>\u003cli>\u003cspan class=\"red\">农业管理与自然资源保护立法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">官营手工业管理立法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">市场与货币管理立法\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":31,"gap":false},{"id":"history-1794804286101","n":129,"chapter":"增补50题 / 秦汉魏晋","title":"秦朝的司法制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">皇帝最高审判，廷尉审疑难上诉诏狱，御史大夫也审大案\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">告发、官吏纠举起诉\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">讯狱为审问，治狱为定罪；重证据，容刑讯但不提倡\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">勘验笔录曰爰书，封财产曰封守\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">读鞫宣判，不服乞鞫再审；过失错判曰失刑\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>NYC补充：“不直”有出罪、有入罪，“纵囚”只有单纯出罪\u003c/p>","understanding":"","count":5,"chars":90,"gap":false},{"id":"history-1794804286102","n":130,"chapter":"增补50题 / 秦汉魏晋","title":"汉朝立法指导思想","body":"\u003col>\u003cli>\u003cspan class=\"red\">汉初兴盛黄老学说，确立黄老的无为而治为指导思想，体现为“轻徭薄赋”和“约法省刑”\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">轻徭薄赋旨在休养生息，约法省刑旨在纠正秦法繁苛\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">汉武帝时从黄老无为思想转变为儒家思想\u003c/span>，主张“\u003cspan class=\"blue\">独尊儒术\u003c/span>”“德主刑辅”\u003c/li>\u003c/ol>","memory":"\u003cp>NYC补充：“德主刑辅”思想是对先秦儒家“宽猛相济”“隆礼重法”思想的继承与发展\u003c/p>","understanding":"","count":3,"chars":96,"gap":false},{"id":"history-1794804286103","n":131,"chapter":"增补50题 / 秦汉魏晋","title":"汉朝的盐铁酒专卖","body":"\u003col>\u003cli>\u003cspan class=\"red\">汉武帝时为了增加财政收入，将盐、铁、酒等有关人民生计的产品由国家专营，制定法律严禁私人生产和销售，称为“禁榷”\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">酒类专卖称榷酤\u003c/span>，中央设太官，地方设\u003cspan class=\"blue\">榷酤官\u003c/span>，组织酒类生产\u003c/li>\u003cli>\u003cspan class=\"blue\">两汉时期对敢与朝廷争利的商人给予严厉打击\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":102,"gap":false},{"id":"history-1794804286104","n":132,"chapter":"增补50题 / 秦汉魏晋","title":"汉朝的重农抑商政策","body":"\u003col>\u003cli>\u003cspan class=\"red\">重农抑商，限商采矿冶铁煮盐\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">商人禁丝衣车马、买田，子孙受仕进限制，税役加重\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">告缗令重征商人财产税，鼓励告发隐匿财产\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">盐铁等实行国家禁榷专卖\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>NYC总结：汉朝贯彻重农抑商政策的三个途径——对商业课以重税、对商人实行歧视、对\u003c/p>","understanding":"","count":4,"chars":66,"gap":false},{"id":"history-1794804286105","n":133,"chapter":"增补50题 / 秦汉魏晋","title":"汉朝的对外贸易立法","body":"\u003col>\u003cli>\u003cspan class=\"red\">对外贸易活跃，丝绸之路发展，国家以法律管理贸易\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">对西域、中亚贸易给予优惠\u003c/span>，部分通商无种类、数量限制，并礼遇外商\u003c/li>\u003cli>\u003cspan class=\"blue\">促进与周边各民族、国家的交流\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":68,"gap":false},{"id":"history-1794804286106","n":134,"chapter":"增补50题 / 秦汉魏晋","title":"汉朝的皇帝制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">汉朝皇权得到加强，越来越神秘化、法律化\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">为突出皇帝至尊地位\u003c/span>，皇帝称号及其相关的称谓都进一步法律化、制度化，如蔡邕在《\u003cspan class=\"blue\">独断\u003c/span>》中有相关记载\u003c/li>\u003c/ol>","memory":"\u003cp>NYC补充：蔡邕，东汉名士、文学家、书法家，是才女蔡文姬的父亲\u003c/p>","understanding":"","count":2,"chars":66,"gap":false},{"id":"history-1794804286107","n":135,"chapter":"增补50题 / 秦汉魏晋","title":"汉朝的中枢与地方行政机构","body":"\u003col>\u003cli>\u003cspan class=\"red\">汉初三公九卿，后大司徒、大司马、大司空分民政、军事、土木\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">中朝、尚书台兴起，削弱三公相权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">地方郡县与王国、侯国并存\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">西汉郡县两级，县下乡里亭；东汉末形成州郡县三级\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":78,"gap":false},{"id":"history-1794804286108","n":136,"chapter":"增补50题 / 秦汉魏晋","title":"汉朝的诉讼与审判制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">起诉叫告劾：告像自诉，劾像公诉\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">原则逐级告劾；冤狱可越级报皇帝\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">治安官吏须纠举犯罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">审讯叫鞫狱，沿用五听\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不服可在三个月内乞鞫（申请重审），过期不听\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">录囚制度\u003c/span>：皇帝或上级复查在押案，监督下级、平冤清积案\u003c/li>\u003c/ol>","memory":"","understanding":"","count":6,"chars":96,"gap":false},{"id":"history-1794804286109","n":137,"chapter":"增补50题 / 秦汉魏晋","title":"理解“八议”与“官当”","body":"\u003col>\u003cli>\u003cspan class=\"red\">八议：八类特权者犯罪，普通机关不得径审，经议后请皇帝裁定减免\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">八类为亲、故、贤、能、功、贵、勤、宾\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">官当\u003c/span>：允许官员以官爵抵罪，体现官僚等级特权\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":69,"gap":false},{"id":"history-1794804286110","n":138,"chapter":"增补50题 / 秦汉魏晋","title":"新五刑的初步形成","body":"\u003col>\u003cli>\u003cspan class=\"red\">曹魏恢复五刑之名\u003c/span>；晋用\u003cspan class=\"blue\">死、徒、笞、罚金、赎刑\u003c/span>；北魏定死、流、徒、鞭、杖，以劳役为主；北周按轻重排杖、鞭、徒、流、死，首创按路程分\u003cspan class=\"blue\">五等流刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">缩小族刑、缘坐范围\u003c/span>，少用肉刑和酷刑，\u003cspan class=\"blue\">废宫刑\u003c/span>，死刑执行方式渐少\u003c/li>\u003cli>\u003cspan class=\"blue\">流刑用于减死，新五刑初步成型\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":112,"gap":false},{"id":"history-1794804286111","n":139,"chapter":"增补50题 / 秦汉魏晋","title":"魏晋南北朝时期的司法制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">中央司法机关的变化\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">尚书台（省）的审判权逐步扩大\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">登闻鼓直诉制度\u003c/span>。西晋有大冤可击鼓，直诉中央甚至皇帝，便于查错纠冤\u003c/li>\u003cli>\u003cspan class=\"blue\">死刑复奏制度\u003c/span>。死刑报皇帝批准才执行，既示慎刑，也让皇帝掌审判最高权\u003c/li>\u003cli>\u003cspan class=\"blue\">刑讯制度。北魏重枷大杖；梁测罚，陈测立\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":107,"gap":false},{"id":"history-1794804286112","n":140,"chapter":"增补50题 / 秦汉魏晋","title":"唐朝的主要法律典籍","body":"\u003col>\u003cli>\u003cspan class=\"red\">武德律开唐律先河，贞观律定型\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">永徽律及疏议\u003c/span>：现存最早最完整古代法典\u003c/li>\u003cli>\u003cspan class=\"blue\">开元律修正过时条款\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">唐六典\u003c/span>：记六部官制、行政制度\u003c/li>\u003cli>\u003cspan class=\"blue\">大中刑律统类\u003c/span>：律分\u003cspan class=\"blue\">121门\u003c/span>，附相关令格式敕，开刑统体例\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":82,"gap":false},{"id":"history-1794804286113","n":141,"chapter":"增补50题 / 隋唐","title":"唐朝民事立法中关于所有权的规定","body":"\u003col>\u003cli>\u003cspan class=\"red\">唐朝推行均田制，严格保护根据均田制而取得的土地所有权，严禁占田过限，严格控制口分田的买卖\u003c/span>\u003c/li>\u003cli>遗失物、埋藏物、漂流物、山林矿山的所有权归属都有明确规定\u003c/li>\u003cli>\u003cspan class=\"blue\">对山间野外的自生、无主之物\u003c/span>，唐律规定了“\u003cspan class=\"blue\">加功所有\u003c/span>”的原则，对山野无主物，由首先对其实施收集的劳动者所有\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":123,"gap":false},{"id":"history-1794804286114","n":142,"chapter":"增补50题 / 隋唐","title":"唐朝的契约关系","body":"\u003col>\u003cli>\u003cspan class=\"red\">契约有买卖、租赁、雇佣、借贷、寄托、承揽等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">土地原则禁卖，例外须申报；动产卖方担质量数量责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">借为使用特定物，贷为消费非特定物；有息出举、无息负债\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">债不还可经官牵掣财产，无财可役身折酬\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":89,"gap":false},{"id":"history-1794804286115","n":143,"chapter":"增补50题 / 隋唐","title":"唐朝婚姻的解除","body":"\u003col>\u003cli>\u003cspan class=\"red\">唐律规定以“七出”“三不去”和“义绝”为婚姻解除的要件\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">“义绝”指夫妻情义已绝\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">唐还有“和离”的规定，即承认夫妻双方自愿离婚的效力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">符合法定义绝条件者，须离异\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>NYC补充：夫妻一方对于对方的亲属实施侵害行为，或者夫妻双方亲属之间发生侵害行为，\u003c/p>","understanding":"","count":4,"chars":76,"gap":false},{"id":"history-1794804286116","n":144,"chapter":"增补50题 / 隋唐","title":"唐朝的官吏管理制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">科举重明经、进士\u003c/span>\u003cspan class=\"blue\">；及第仅得资格，经吏部释褐试才任官\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">考课以四善二十七最，分三等九级，定升降奖罚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">通常70岁致仕\u003c/span>，兼看健康；\u003cspan class=\"blue\">五品以上\u003c/span>须皇帝准，其余吏部备案\u003c/li>\u003c/ol>","memory":"\u003cp>NYC补充：身即体貌丰伟；言即言词辨正；书即楷法遒美；判即文理优长\u003c/p>\u003cp>NYC补充：六品以下官致仕，本人首先向尚书省提出申请，再由尚书省统一奏请皇帝，由\u003c/p>","understanding":"","count":3,"chars":74,"gap":false},{"id":"history-1794804286117","n":145,"chapter":"增补50题 / 隋唐","title":"唐朝的土地立法","body":"\u003col>\u003cli>\u003cspan class=\"red\">均田法施行，唐朝形成国家所有和私人所有两种土地所有制形式\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国有土地\u003c/span>：\u003cspan class=\"blue\">口分田\u003c/span>限制买卖，人死收回；职分田按官阶作俸禄；公廨田供机关开支，禁私卖\u003c/li>\u003cli>\u003cspan class=\"blue\">私有土地\u003c/span>：永业田和部分宅地\u003c/li>\u003cli>\u003cspan class=\"blue\">占田过限最高徒一年\u003c/span>；人少地多的\u003cspan class=\"blue\">宽乡\u003c/span>除外，为鼓励垦荒，但须报官立案防逃税\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":116,"gap":false},{"id":"history-1794804286118","n":146,"chapter":"增补50题 / 隋唐","title":"唐朝的赋役立法","body":"\u003col>\u003cli>\u003cspan class=\"red\">唐前期沿用隋制，以均田制为基础，实行租庸调法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">唐中期以后，均田制被破坏殆尽，租庸调法亦难以实施\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">两税法的推行\u003c/span>，既增加了国家\u003cspan class=\"blue\">赋税收入\u003c/span>，又削弱了大户的特权，有利于户籍整理，也有利于社会的安定\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":91,"gap":false},{"id":"history-1794804286119","n":147,"chapter":"增补50题 / 隋唐","title":"唐朝的禁榷制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">唐中期财政开支日繁，于开元九年开始征取盐税，肃宗至德元年实行盐的专卖\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">同时严禁私盐运销，设置十三巡院厉行缉私\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">唐德宗建中年间令征茶税，之后茶税法全面推行\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">安史之乱中开始实行榷酤制度，此后反复禁弛\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":94,"gap":false},{"id":"history-1794804286120","n":148,"chapter":"增补50题 / 隋唐","title":"唐朝市场管理制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">重农抑商，明定士、农、工、商分业，以法律管交易、保护买卖双方\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">州县设市令、丞。市令按质量分类定价，定价不公要担责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">商品用统一规格和标准\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":65,"gap":false},{"id":"history-1794804286121","n":149,"chapter":"增补50题 / 隋唐","title":"唐朝的对外贸易制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">陆路仅准官督互市\u003c/span>\u003cspan class=\"blue\">。绕关交易、外商擅入，同样治罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">海路开放\u003c/span>，在\u003cspan class=\"blue\">蕃坊\u003c/span>居住经商；唐创市舶制度，首发外贸征税令\u003c/li>\u003cli>\u003cspan class=\"blue\">武则天在广州设市舶使，是首个外贸专职官署\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">市舶税\u003c/span>：\u003cspan class=\"blue\">舶脚\u003c/span>是船入境税；\u003cspan class=\"blue\">抽分\u003c/span>取龙香、沉香、丁香、白豆蔻四货的十分之一进奉；收市是外货交易市税\u003c/li>\u003cli>\u003cspan class=\"blue\">部分货物限制出口\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":124,"gap":false},{"id":"history-1794804286122","n":150,"chapter":"增补50题 / 隋唐","title":"唐朝的“死刑复（覆）奏”制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">一般三复奏：处死前一日两次，当天一次，让皇帝慎定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">恶逆以上、部曲或奴婢杀主，一复奏即可处死\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":44,"gap":false},{"id":"history-1794804286123","n":151,"chapter":"增补50题 / 宋代","title":"宋朝对国家政权机构的调整","body":"\u003col>\u003cli>\u003cspan class=\"red\">中书门下主行政，平章事行相权，参知政事分权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">枢密院掌军事，三司掌财，神宗时三司并户部\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">路设安抚、转运、提刑、常平四司\u003c/span>，分别管军政、财赋、司法、常平等\u003c/li>\u003cli>\u003cspan class=\"blue\">四司平列互制、直隶皇帝，路下府州军监同级\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":92,"gap":false},{"id":"history-1794804286124","n":152,"chapter":"增补50题 / 宋代","title":"宋朝官员的考课制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">宋朝官员的考课，京朝官由审官院掌考，州县官由考课院掌考\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">州县考“四善三最”\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">
