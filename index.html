>\u003c/ol>","memory":"","understanding":"","count":2,"chars":67,"gap":false},{"id":"jurisprudence-1794829194945","n":64,"chapter":"法律要素与法律体系","title":"法律规则与法律条文 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律条文是规则的文字载体，两者不一一对应\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">一条可表达一项、部分或多项规则，也可能只定义概念\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">一项完整规则也可分散在多条中表达\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":60,"gap":false},{"id":"jurisprudence-1794829194946","n":65,"chapter":"法律要素与法律体系","title":"法律规则的种类 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">按内容：授权性、义务性及权义复合规则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按功能\u003c/span>：调整性、\u003cspan class=\"blue\">构成性\u003c/span>规则\u003c/li>\u003cli>\u003cspan class=\"blue\">按确定程度\u003c/span>：\u003cspan class=\"blue\">确定性\u003c/span>、委任性、准用性规则\u003c/li>\u003cli>\u003cspan class=\"blue\">按能否协商变更\u003c/span>：\u003cspan class=\"blue\">强行性\u003c/span>、任意性规则\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>判断规则类型，先看它是给人选择、要求人做或不做，还是既给权力又要求履行职责。\u003c/p>","count":4,"chars":67,"gap":false},{"id":"jurisprudence-1794829194947","n":66,"chapter":"法律要素与法律体系","title":"法律规则的逻辑结构 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">假定条件：什么人、什么情况下适用规则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行为模式\u003c/span>：可以、应当、不得怎样做\u003c/li>\u003cli>\u003cspan class=\"blue\">法律后果\u003c/span>：\u003cspan class=\"blue\">遵守\u003c/span>或\u003cspan class=\"blue\">违反\u003c/span>要求，会受到何种肯定、否定评价和处理\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先看什么情况适用，再看人该怎么做，最后看照做或不照做会有什么法律后果。\u003c/p>","count":3,"chars":62,"gap":false},{"id":"jurisprudence-1794829194948","n":67,"chapter":"法律要素与法律体系","title":"法律原则的含义和作用 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律原则指可以作为法律规则的基础或本源的综合性、稳定性原理和原则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">可抽象，可具体，同样有法的强制力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律原则可以指导立法和解释\u003c/span>，在缺少具体规则时帮助填补漏洞\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>规则写得不清楚时，原则能指导解释；没有具体规则可用时，原则也能帮助补缺。\u003c/p>","count":3,"chars":76,"gap":false},{"id":"jurisprudence-1794829194949","n":68,"chapter":"法律要素与法律体系","title":"法律原则的种类 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">按产生基础，分为公理性原则和政策性原则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按适用范围，分为基本原则和具体原则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按内容，分为实体性原则和程序性原则\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":53,"gap":false},{"id":"jurisprudence-1794829194950","n":69,"chapter":"法律要素与法律体系","title":"法律规则与法律原则的区别 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">内容：规则具体明确，原则综合、较抽象\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">范围\u003c/span>：规则针对某类行为，原则覆盖更广\u003c/li>\u003cli>\u003cspan class=\"blue\">适用\u003c/span>：规则通常全有或全无，原则需结合案情权衡\u003c/li>\u003cli>\u003cspan class=\"blue\">作用\u003c/span>：原则指导规则形成、解释，并填补漏洞\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>规则通常问符不符合规定；几个原则碰在一起时，往往要比较哪一个在这个案件中更重要。\u003c/p>","count":4,"chars":78,"gap":false},{"id":"jurisprudence-1794829194951","n":70,"chapter":"法律要素与法律体系","title":"法律概念的含义和功能 ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">法律概念是法律要素之一，是对法律现象或法律事实的共同特征进行概括后形成的法律范畴\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">它明确法律用语和适用范围\u003c/span>，使人们能理解法律，并帮助立法者和裁判者准确、统一地表达和适用法律\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先说明什么叫「法人」，后面的法律条文才不用反复解释这个词。\u003c/p>","count":2,"chars":85,"gap":false},{"id":"jurisprudence-1794829194952","n":71,"chapter":"法律要素与法律体系","title":"法律概念的种类 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">按涉及因素：主体、事实、关系、客体概念\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按涉及内容\u003c/span>：涉人、涉事、涉物概念\u003c/li>\u003cli>\u003cspan class=\"blue\">按涵盖范围\u003c/span>：一般法律概念、部门法律概念\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":54,"gap":false},{"id":"jurisprudence-1794829194953","n":72,"chapter":"法律要素与法律体系","title":"法律体系的含义与特点 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律体系是把一国现行的全部法律规范，按一定标准和原则划分为不同法律部门后形成的有内在联系的统一整体\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">它以一国现行法为范围\u003c/span>，以\u003cspan class=\"blue\">法律部门\u003c/span>为组成部分，各部门既有分工又相互协调\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":83,"gap":false},{"id":"jurisprudence-1794829194954","n":73,"chapter":"法律要素与法律体系","title":"法律部门的含义和特征 ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">法律部门，是一国按一定标准和原则划分的同类法律规范的总称\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">它由调整同类社会关系的规范组成\u003c/span>，有\u003cspan class=\"blue\">相对独立性\u003c/span>，又与其他\u003cspan class=\"blue\">法律部门\u003c/span>一起构成\u003cspan class=\"blue\">法律体系\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":67,"gap":false},{"id":"jurisprudence-1794829194955","n":74,"chapter":"法律要素与法律体系","title":"法律部门的划分标准和原则 ★  ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">划分法律部门的主要标准是法律所调整的社会关系，辅助标准是法律调整的方法\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">划分时要从本国实际出发\u003c/span>，尽量做到分类明确、范围适当，并便于学习和适用\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先看规则管的是哪类事情；只看事情还分不清时，再看法律用什么手段来管。\u003c/p>","count":2,"chars":69,"gap":false},{"id":"jurisprudence-1794829194956","n":75,"chapter":"法律要素与法律体系","title":"法律部门、法律制度与规范性法律文件 ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">法律部门按同类社会关系、调整方法划分，是法律规范的集合\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">法律制度围绕某类事项组成，可属于一个或跨越多个部门\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">规范性法律文件是规范的载体\u003c/span>，一份文件可能包含不同部门的规范\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一个法律部门可以包含多个制度，一个法律文件也可以同时写进不同法律部门的规定。\u003c/p>","count":3,"chars":81,"gap":false},{"id":"jurisprudence-1794829194957","n":76,"chapter":"法律要素与法律体系","title":"当代中国法律体系的特色 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">以宪法为统帅、法律为主干，行政法规、地方性法规等共同组成\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">体现社会主义本质、中国统一而多层次的国情\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">开放发展、与时俱进\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">继承优秀传统、借鉴人类法治文明\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">适应改革开放和现代化建设\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":84,"gap":false},{"id":"jurisprudence-1794829194958","n":77,"chapter":"法律要素与法律体系","title":"当代中国法律体系的构成 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">宪法及宪法相关法、民商法、行政法、经济法、社会法、刑法、程序法等组成有机整体\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">环境、军事等规范亦有相应领域与体系\u003c/span>，部门间分工协作、协调统一\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":68,"gap":false},{"id":"jurisprudence-1794829194959","n":78,"chapter":"法律要素与法律体系","title":"加强和完善以下几个方面的立法 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">加强政治、经济、文化、社会、生态文明等领域立法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">推进科学、民主立法\u003c/span>：代表和公众参与，立法前论证、后评估，完善草案审议、备案审查、法规清理\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":67,"gap":false},{"id":"jurisprudence-1794829194960","n":79,"chapter":"法律要素与法律体系","title":"如何提高立法质量 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">坚持科学立法\u003c/span>。从实际出发，调查问题、论证方案，并经实施后的评估发现漏洞\u003c/li>\u003cli>\u003cspan class=\"blue\">坚持民主立法\u003c/span>。听取群众、专家和有关方面的意见，使规则回应实际需求\u003c/li>\u003cli>\u003cspan class=\"blue\">坚持依法立法\u003c/span>。遵循宪法、权限和程序，协调相关规定，把条文写得明确、可执行\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先摸清问题再写规则，写完还要检查规则能不能解决问题。\u003c/p>","count":3,"chars":103,"gap":false},{"id":"jurisprudence-1794829194961","n":80,"chapter":"立法","title":"立法的含义和特征 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">立法：有立法权或经授权的国家机关，依法定职权、程序创制、认可、修改、废止规范性法律文件\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主体特定，运用专门技术，是系统、多层次法律创制活动\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">将统治阶级或人民意志上升为国家意志，形成普遍规范\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":92,"gap":false},{"id":"jurisprudence-1794829194962","n":81,"chapter":"立法","title":"立法权、立法体制的概念 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">立法权：国家机关依法创制、认可、修改、废止规范性法律文件的权力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">立法体制\u003c/span>：\u003cspan class=\"blue\">立法权\u003c/span>限的配置及行使制度\u003c/li>\u003cli>\u003cspan class=\"blue\">我国统一而分层次；党的领导与人大主导相统一\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":69,"gap":false},{"id":"jurisprudence-1794829194963","n":82,"chapter":"立法","title":"我国现行的立法体制及其原因 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">我国实行统一而分层次的立法体制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">单一制要求权力适度集中于中央\u003c/span>；人大制度要求集中于\u003cspan class=\"blue\">国家权力机关\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">地域、民族差异要求地方和自治立法\u003c/span>；改革开放需要一定行政\u003cspan class=\"blue\">立法权\u003c/span>限\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>国家立法要统一，同时允许不同层级在权限内按实际情况制定规则。\u003c/p>","count":3,"chars":76,"gap":false},{"id":"jurisprudence-1794829194964","n":83,"chapter":"立法","title":"党领导立法与人大主导立法 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">党领导与人大主导相辅相成，统一党的领导、人民当家作主\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">党把握方针、规划、建议、重大问题和队伍，保证政治方向\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">人大依法组织立法、协调审议、把关草案\u003c/span>，发挥权力机关主导作用\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":81,"gap":false},{"id":"jurisprudence-1794829194965","n":84,"chapter":"立法","title":"合宪和国家法制统一原则 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">1立法遵循宪法：（内）以宪法为依据，符合宪法的理念和要求，遵循宪法的基本原则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">2依法立法述合宪原则的前提下，立法还应遵循《立法法》\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">3立法维护法制统一\u003c/span>：（\u003cspan class=\"blue\">内容\u003c/span>）法制统一原则指立法应依照法定的\u003cspan class=\"blue\">权限和程序\u003c/span>，从国家\u003cspan class=\"blue\">整体利益出发\u003c/span>，维护社会主义法制的统一和尊严\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":123,"gap":false},{"id":"jurisprudence-1794829194966","n":85,"chapter":"立法","title":"民主原则 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">内容民主：从最广大人民根本利益出发，体现人民意志\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">程序民主\u003c/span>：立法\u003cspan class=\"blue\">主体\u003c/span>产生\u003cspan class=\"blue\">民主\u003c/span>，过程公开，保障人民多途径有序参与\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":54,"gap":false},{"id":"jurisprudence-1794829194967","n":86,"chapter":"立法","title":"科学原则 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">立法从实际出发（前）：立法要从现实国情出发\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">科学合理规定权利义务1、权力责任（中）\u003c/span>：合理规定\u003cspan class=\"blue\">公民法人和其他组织\u003c/span>的权利义务\u003c/li>\u003cli>\u003cspan class=\"blue\">法律规范明确、具体\u003c/span>，有\u003cspan class=\"blue\">针对性和可执行性\u003c/span>（\u003cspan class=\"blue\">语言\u003c/span>、\u003cspan class=\"blue\">内容\u003c/span>）（后）\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":88,"gap":false},{"id":"jurisprudence-1794829194968","n":87,"chapter":"立法","title":"立法程序的含义和特点 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">立法程序：有权机关创制、认可、修改、废止规范性文件所遵循的法定步骤和方式\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法定、贯穿各环节，规定立法步骤方法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">制定法律通常经过提出、审议、表决通过、公布\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先由有权机关提出或审议，再按法定步骤表决、公布，立法才能有效地走完程序。\u003c/p>","count":3,"chars":74,"gap":false},{"id":"jurisprudence-1794829194969","n":88,"chapter":"法律实施","title":"法律实施的含义、内容和意义 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律实施：法在社会生活中被实际施行\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">内容包括执法、司法、守法等活动\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">意义\u003c/span>：把纸面规范落实为现实权利义务，维护秩序并\u003cspan class=\"blue\">实现\u003c/span>法律价值\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":61,"gap":false},{"id":"jurisprudence-1794829194970","n":89,"chapter":"法律实施","title":"法律实施的状况与评价 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">宪法实施监督机制仍须完善\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">部分地方存在有法不依、执法不严、违法不究\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">食品药品、环保、安全生产等民生领域问题突出\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">滥权、失职、执法犯法、徇私枉法损害法律权威\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":74,"gap":false},{"id":"jurisprudence-1794829194971","n":90,"chapter":"法律实施","title":"法律实现的含义 ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">法律实现指法律的要求在社会生活中被转化为现实\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">vs\u003c/span>：\u003cspan class=\"blue\">法律实现\u003c/span>=\u003cspan class=\"blue\">法律实施\u003c/span>+法律实效：\u003cspan class=\"blue\">法律实现与法律实施不同\u003c/span>，\u003cspan class=\"blue\">法律实施是\u003c/span>法在社会生活中被实际施行，\u003cspan class=\"blue\">法律实现\u003c/span>是\u003cspan class=\"blue\">法律实施\u003c/span>的\u003cspan class=\"blue\">目的\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>法律实施看人们有没有依法行动，法律实现还看法律要求有没有真正达到。\u003c/p>","count":2,"chars":82,"gap":false},{"id":"jurisprudence-1794829194972","n":91,"chapter":"法律实施","title":"影响法律实现的因素 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国家阶级本质\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">规范反映统治阶级或人民意志的程度\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律适应社会生活、经济发展的程度\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国家机关贯彻法治原则的程度\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">社会成员的法律意识、法律文化水平\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":67,"gap":false},{"id":"jurisprudence-1794829194973","n":92,"chapter":"法律实施","title":"执法的含义和特点 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">执法是有权的行政机关及依法获得授权、受委托的组织等，依照法定职权和程序，行使行政管理职权、履行职责、实施法律的活动\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">执法有行政管理性\u003c/span>，通常由执法主体依法主动开展；执法主体、权限和程序都须符合法律规定\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":98,"gap":false},{"id":"jurisprudence-1794829194974","n":93,"chapter":"法律实施","title":"执法的原则（总论） ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">依法行政：主体、内容、程序合法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">严格执法\u003c/span>：严谨、严明、严肃、公正\u003c/li>\u003cli>\u003cspan class=\"blue\">合理行政、比例原则\u003c/span>：公正裁量，损害最小且利益均衡\u003c/li>\u003cli>\u003cspan class=\"blue\">正当程序\u003c/span>：依法办理、听取\u003cspan class=\"blue\">意见\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">效率\u003c/span>：及时、低\u003cspan class=\"blue\">成本\u003c/span>有效\u003c/li>\u003cli>\u003cspan class=\"blue\">诚实守信\u003c/span>：信息真实、保护信赖\u003c/li>\u003cli>\u003cspan class=\"blue\">权责统一\u003c/span>：有权必担责\u003c/li>\u003c/ol>","memory":"","understanding":"","count":7,"chars":104,"gap":false},{"id":"jurisprudence-1794829194975","n":94,"chapter":"法律实施","title":"依法行政原则 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">行政主体、权限、内容、程序均须有法律依据\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不得越权、滥权或违法增加义务、减损权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行政机关须依法履职，既不乱作为，也不能该管不管\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":62,"gap":false},{"id":"jurisprudence-1794829194976","n":95,"chapter":"法律实施","title":"严格执法原则 ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">严格执法原则的概念：严格执法是对政府机关及其公职人员提出的重要执法原则，它与依法行政属于同一范畴\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">执法者应严谨、严肃、严明、公正地执法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">反对任性执法、选择性执法、钓鱼式执法等非正常执法模式\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":92,"gap":false},{"id":"jurisprudence-1794829194977","n":96,"chapter":"法律实施","title":"合理性原则（合理行政原则） ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">行政裁量须公正、合理、适当\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">相同情况平等对待，差别待遇有正当理由\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">考虑相关因素、排除无关因素\u003c/span>，符合公理、公序良俗，不任性裁量\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":60,"gap":false},{"id":"jurisprudence-1794829194978","n":97,"chapter":"法律实施","title":"比例原则（广义） ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">比例原则要求行政机关既实现行政目的，也尽可能少损害相对人的权益\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">妥当性。采取的手段要有助于实现正当的行政目的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">必要性。有多个有效手段时，选对相对人权益损害最小的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">均衡性\u003c/span>。手段造成的不利影响不得与所要实现的\u003cspan class=\"blue\">公共利益\u003c/span>明显失衡\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>手段要能达到目的；有几个办法都能达到时选损害小的；付出的代价还不能明显超过收获。\u003c/p>","count":4,"chars":107,"gap":false},{"id":"jurisprudence-1794829194979","n":98,"chapter":"法律实施","title":"正当程序原则 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">执法须遵循法定步骤、方式、顺序、时限\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不得单方面武断处理\u003c/span>，应公开透明，听取当事人陈述、申辩，依法保障参与、回避等程序权利\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":59,"gap":false},{"id":"jurisprudence-1794829194980","n":99,"chapter":"法律实施","title":"讲求效率原则 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">效率以行政合法为前提，不可为快而违法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主动履职，及时回应相对人请求\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">用尽可能低的成本取得尽可能好的执法效果\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":51,"gap":false},{"id":"jurisprudence-1794829194981","n":100,"chapter":"法律实施","title":"诚实守信原则 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">公布信息须全面、准确、真实\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保护合理信赖，原则上不得任意撤销、变更已生效行政决定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">因法定理由、公共利益确需变更的，依法定程序并依法补偿\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>政府已经作出的决定让人合理信赖，就不能想改就改；依法变更时还要依法保护受影响的利益。\u003c/p>","count":3,"chars":65,"gap":false},{"id":"jurisprudence-1794829194982","n":101,"chapter":"法律实施","title":"权责统一原则 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">行政效能（积）要由法律、法规赋予其相应执法手段\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行政责任（消）违法或不当行使职权，应依法承担法律责任\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":49,"gap":false},{"id":"jurisprudence-1794829194983","n":102,"chapter":"法律实施","title":"司法的含义和特点 ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">司法是国家司法机关依照法定职权和程序，具体适用法律处理案件的专门活动\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">司法主体特定\u003c/span>，主要处理具体案件；司法依照\u003cspan class=\"blue\">法定程序\u003c/span>进行，有权威性\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>执法重在依法管理，司法重在依法办理具体案件。\u003c/p>","count":2,"chars":65,"gap":false},{"id":"jurisprudence-1794829194984","n":103,"chapter":"法律实施","title":"法的适用情形及司法权 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">司法用于解决争端、制裁违法犯罪、恢复合法权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">审判权\u003c/span>：法院依法审理，作出判决、裁定\u003c/li>\u003cli>\u003cspan class=\"blue\">检察权\u003c/span>：检察机关依法行使法律监督等职权\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":59,"gap":false},{"id":"jurisprudence-1794829194985","n":104,"chapter":"法律实施","title":"司法的原则（总论） ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">依法独立行使职权：专属性、合法性、独立性并受监督\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法治\u003c/span>：以\u003cspan class=\"blue\">事实\u003c/span>为根据、\u003cspan class=\"blue\">法律\u003c/span>为准绳\u003c/li>\u003cli>\u003cspan class=\"blue\">责任\u003c/span>：权责统一，违法办案受追究\u003c/li>\u003cli>\u003cspan class=\"blue\">公正\u003c/span>：实体与\u003cspan class=\"blue\">程序公正\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">平等\u003c/span>：适用、\u003cspan class=\"blue\">保护\u003c/span>、\u003cspan class=\"blue\">责任\u003c/span>、诉讼地位\u003cspan class=\"blue\">平等\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":82,"gap":false},{"id":"jurisprudence-1794829194986","n":105,"chapter":"法律实施","title":"司法法治原则的含义和要求 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">以事实为根据，以法律为准绳\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">重证据、调查研究，不轻信口供\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">遵守实体法、程序法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">正确处理依法办事与党的政策指导关系，不以政策代替法律\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":62,"gap":false},{"id":"jurisprudence-1794829194987","n":106,"chapter":"法律实施","title":"司法平等原则 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">适用平等：同等情形同等适用法律\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">诉讼平等\u003c/span>：依法\u003cspan class=\"blue\">保障诉讼权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保护平等\u003c/span>：\u003cspan class=\"blue\">权利\u003c/span>受侵害均得救济，\u003cspan class=\"blue\">反对歧视\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">责任平等\u003c/span>：\u003cspan class=\"blue\">违法犯罪\u003c/span>依法追究，\u003cspan class=\"blue\">反对特权\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":65,"gap":false},{"id":"jurisprudence-1794829194988","n":107,"chapter":"法律实施","title":"司法机关依法独立行使职权原则 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">司法权的专属性\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">司法权行使的合法性\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">司法权行使的独立性\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">司法权受到监督和约束\u003c/span>：党：国家权力机关：上下级、同级：其他：行政、检察、企事业单位、社会团体、民主党派、人民群众、舆论\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":84,"gap":false},{"id":"jurisprudence-1794829194989","n":108,"chapter":"法律实施","title":"司法责任原则 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">司法责任制：按权责统一，对司法权形成约束\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法保障司法机关及人员履职\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">对违法、犯罪办案行为依法追责\u003c/span>，做到有权必有责、用权受监督\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>谁有权办案，谁就要对怎样办案负责；追责本身也必须符合法定条件和程序。\u003c/p>","count":3,"chars":61,"gap":false},{"id":"jurisprudence-1794829194990","n":109,"chapter":"法律实施","title":"司法公正原则 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">司法公正原则（过程、结果\u003c/span>\u003cspan class=\"blue\">；公平、正义）；实体公正\u003c/span>：司法\u003cspan class=\"blue\">裁判\u003c/span>的\u003cspan class=\"blue\">结果公正\u003c/span>；\u003cspan class=\"blue\">程序公正\u003c/span>：司法\u003cspan class=\"blue\">过程\u003c/span>的\u003cspan class=\"blue\">公正\u003c/span>；\u003cspan class=\"blue\">裁判人员\u003c/span>的中立性；\u003cspan class=\"blue\">当事人\u003c/span>地位的平等性，司法\u003cspan class=\"blue\">活动\u003c/span>的合法性、\u003cspan class=\"blue\">独立性\u003c/span>、有效性，及\u003cspan class=\"blue\">裁判结果\u003c/span>的\u003cspan class=\"blue\">公正\u003c/span>性，都是司法\u003cspan class=\"blue\">公正\u003c/span>的必然要求和体现\u003c/li>\u003c/ol>","memory":"","understanding":"","count":1,"chars":108,"gap":false},{"id":"jurisprudence-1794829194991","n":110,"chapter":"法律实施","title":"司法改革的含义以及坚持正确的方向和原则 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">司法改革是在宪法框架内完善司法机关、制度\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">坚持正确政治方向\u003c/span>，以\u003cspan class=\"blue\">宪法\u003c/span>为根本\u003cspan class=\"blue\">遵循\u003c/span>，\u003cspan class=\"blue\">依法有序推进\u003c/span>，以提高\u003cspan class=\"blue\">司法公信力\u003c/span>为根本\u003cspan class=\"blue\">尺度\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">重点保证公正司法，完善配套制度与法治队伍\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":78,"gap":false},{"id":"jurisprudence-1794829194992","n":111,"chapter":"法律实施","title":"司法改革的主要任务 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">完善依法独立公正行使审判、检察权的制度\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">优化职权配置、推进严格司法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保障群众参与、加强人权保障和司法监督\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">建设高素质法治队伍\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":59,"gap":false},{"id":"jurisprudence-1794829194993","n":112,"chapter":"法律实施","title":"落实司法责任制 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">让审理者裁判、让裁判者负责，解决审者不判、判者不审\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法官、检察官对案件质量依法承担终身责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">完善权力运行和监督制约，目标是让群众感受公平正义\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":68,"gap":false},{"id":"jurisprudence-1794829194994","n":113,"chapter":"法律实施","title":"落实司法责任制配套性措施 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法官检察官入额遴选办法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">员额退出实施办法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">科学分案办法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">领导干部办案分级考核和定期通报\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">信息化大数据辅助办案\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">加大民族地区法官检察官培养力度）\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":6,"chars":66,"gap":false},{"id":"jurisprudence-1794829194995","n":114,"chapter":"法律实施","title":"完善人权司法保障制度 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">人权司法保障，是在司法活动中尊重和保障基本人权，保障诉讼当事人依法享有的权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">完善制度\u003c/span>，要遵循\u003cspan class=\"blue\">法治\u003c/span>原则、依法约束\u003cspan class=\"blue\">司法权力\u003c/span>，防止违法取证和错误裁判\u003c/li>\u003cli>\u003cspan class=\"blue\">保障当事人的诉讼权利\u003c/span>，并经申诉、复审等\u003cspan class=\"blue\">法定途径\u003c/span>为受侵害的权利提供\u003cspan class=\"blue\">救济\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>让当事人有机会辩护、避免无罪的人被定罪、给错误处理留下救济途径，都是司法保障人权。\u003c/p>","count":3,"chars":105,"gap":false},{"id":"jurisprudence-1794829194996","n":115,"chapter":"法律实施","title":"保证公正司法、提高司法公信力的改革要求 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">依法独立公正行使审判权和检察权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">优化司法职权配置\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">推进严格公正司法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">加强对司法活动的监督\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保障人民群众参与司法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">加强人权司法保障\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":6,"chars":59,"gap":false},{"id":"jurisprudence-1794829194997","n":116,"chapter":"法律实施","title":"守法的含义和全民守法的意义 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">广义的守法是按法律行事，可包括公民、组织和国家机关依法活动\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">全民守法有助于把写在纸上的规则落实到日常生活\u003c/span>，维护\u003cspan class=\"blue\">法律权威\u003c/span>和社会秩序\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>不做法律禁止的事是守法，按要求履行义务也是守法。\u003c/p>","count":2,"chars":63,"gap":false},{"id":"jurisprudence-1794829194998","n":117,"chapter":"法律实施","title":"守法的要素 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">主体：依法须守法的所有机关、组织、个人，含境内外国组织、外国人、无国籍人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">范围\u003c/span>：由法源决定，含规范及有约束力的裁判、合同等\u003c/li>\u003cli>\u003cspan class=\"blue\">内容\u003c/span>：履行\u003cspan class=\"blue\">积极\u003c/span>、\u003cspan class=\"blue\">消极\u003c/span>义务，依法行使权利\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>回答守法要素，就是说清谁要守、要守什么、怎样才算守。\u003c/p>","count":3,"chars":79,"gap":false},{"id":"jurisprudence-1794829194999","n":118,"chapter":"法律实施","title":"守法的原因 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">正当论：认同法律正当性\u003c/span>；契约论：同意和承诺\u003c/li>\u003cli>\u003cspan class=\"blue\">功利论\u003c/span>：守法能增益、避风险；威慑论：畏惧强制惩罚\u003c/li>\u003cli>\u003cspan class=\"blue\">各说均有局限；守法还受习惯、道德、认同和信仰共同影响\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":71,"gap":false},{"id":"jurisprudence-1794829195000","n":119,"chapter":"法律实施","title":"守法的状态 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">最低状态：不违法犯罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">中层状态\u003c/span>：依法办事\u003c/li>\u003cli>\u003cspan class=\"blue\">高级状态\u003c/span>：外在内在不论是外在行为，还是\u003cspan class=\"blue\">内在动机\u003c/span>都符合\u003cspan class=\"blue\">法的精神和要求\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":52,"gap":false},{"id":"jurisprudence-1794829195001","n":120,"chapter":"法律实施","title":"法律监督的含义和意义 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律监督：机关、组织、公民依法监督法律活动是否合法\u003c/span>；狭义主要指国家监督\u003c/li>\u003cli>\u003cspan class=\"blue\">作用\u003c/span>：保障民主、法制统一和法律实施，防止权力滥用，维护合法权益\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>法律监督通过发现并纠正违法用权或不依法办事的问题，保证法律真正执行。\u003c/p>","count":2,"chars":66,"gap":false},{"id":"jurisprudence-1794829195002","n":121,"chapter":"法律实施","title":"当代中国的法律监督 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国家监督：权力机关居核心、主导，另有行政、监察、司法等监督\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">社会监督\u003c/span>：政党、\u003cspan class=\"blue\">社会组织\u003c/span>、公众、舆论等监督\u003c/li>\u003cli>\u003cspan class=\"blue\">依法形成监督合力，不能用社会监督代替法定职权\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":72,"gap":false},{"id":"jurisprudence-1794829195003","n":122,"chapter":"法律实施","title":"我国《监察法》制定的重要意义与主要原则 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">是坚持党内监督与国家监察有机统一\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">是加强宪法实施\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">是坚持和加强党对反腐败工作的领导\u003c/span>\u003c/li>\u003cli>是贯彻落实党中央深化国家\u003cspan class=\"blue\">监察体制改革\u003c/span>决策部署的重大举措\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":66,"gap":false},{"id":"jurisprudence-1794829195004","n":123,"chapter":"法律实施","title":"我国《监察法》制定所遵循的思路和原则 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">坚持正确政治方向\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">坚持与宪法修改保持一致\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">坚持问题导向\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">坚持科学立法、民主立法、依法立法\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":41,"gap":false},{"id":"jurisprudence-1794829195005","n":124,"chapter":"法律职业与法律方法","title":"法律职业的含义和特征（含法律职业成熟的标志） ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">法律职业是以法官、检察官、律师等为代表，由受过专门法律训练、具备法律技能、遵守职业伦理的法律人形成的职业共同体\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">其主要特征是职业专门化、技能专业化\u003c/span>，有共同的\u003cspan class=\"blue\">职业伦理\u003c/span>和一定\u003cspan class=\"blue\">行业自治\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":88,"gap":false},{"id":"jurisprudence-1794829195006","n":125,"chapter":"法律职业与法律方法","title":"法律职业任职条件 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">须具国籍、成年、选举被选举权等资格，符合法定学历、考试要求\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">禁入\u003c/span>：\u003cspan class=\"blue\">故意犯罪\u003c/span>受刑、开除\u003cspan class=\"blue\">公职\u003c/span>、相关执业或职业资格被吊销\u003c/li>\u003cli>考试禁考期限未满、终身职业禁入、法定\u003cspan class=\"blue\">严重失信\u003c/span>等也受限制\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":83,"gap":false},{"id":"jurisprudence-1794829195007","n":126,"chapter":"法律职业与法律方法","title":"法官伦理 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">核心：公正、廉洁、为民\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保证司法公正，确保司法廉洁，坚持司法为民\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">忠诚司法事业，维护司法形象\u003c/span>\u003c/li>\u003cli>适用于依法任职的法院院长、副院长、审委会委员、\u003cspan class=\"blue\">审判\u003c/span>员等\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":71,"gap":false},{"id":"jurisprudence-1794829195008","n":127,"chapter":"法律职业与法律方法","title":"检察官伦理 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">核心：忠诚、公正、清廉、文明\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">公正理念、维护法制统一\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">廉洁操守、自觉受监督\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">为民宗旨、保障人民权益\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">忠诚品格、政治本色\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">担当精神、强化法律监督\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":6,"chars":66,"gap":false},{"id":"jurisprudence-1794829195009","n":128,"chapter":"法律职业与法律方法","title":"律师伦理 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">律师伦理：维护正义、执业为民、忠诚信念、信仰法治、恪守诚信、履职敬业\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">禁止私揽收费、牟取争议利益、恶意串通\u003c/span>\u003c/li>\u003cli>禁止违规会见行贿、伪造或诱逼假证、煽动非法解决争议、扰乱诉讼仲裁\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>律师要为委托人依法维护权益，同时不能靠造假、行贿或泄密来帮助当事人。\u003c/p>","count":3,"chars":84,"gap":false},{"id":"jurisprudence-1794829195010","n":129,"chapter":"法律职业与法律方法","title":"法官的义务 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">守宪守法、秉公办案，不徇私枉法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保障诉讼权利，维护国家、公共及个人组织合法利益\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保守国家、审判秘密及获知的商业秘密、个人隐私\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">接受法律和群众监督，以案释法，履行其他法定义务\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":83,"gap":false},{"id":"jurisprudence-1794829195011","n":130,"chapter":"法律职业与法律方法","title":"律师的禁止行为 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">不得私自受托收费、收额外利益\u003c/span>；借服务\u003cspan class=\"blue\">牟取\u003c/span>争议权益；与对方\u003cspan class=\"blue\">恶意串通\u003c/span>损害委托人\u003c/li>\u003cli>\u003cspan class=\"blue\">不得违规会见、行贿或诱导行贿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不得伪造诱逼假证、妨碍取证\u003c/span>，煽动非法解决争议，扰乱法庭仲裁秩序\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":82,"gap":false},{"id":"jurisprudence-1794829195012","n":131,"chapter":"法律职业与法律方法","title":"法律解释的含义和特征 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律解释：人或组织对法律规定含义作说明\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">对象是法律规定，常因待处理案件引起\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">受价值取向影响\u003c/span>，也须结合条文与整体相互理解，受解释学循环约束\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>把规定放回具体案件，说明它说的是什么意思、适用于哪些情况，就是法律解释。\u003c/p>","count":3,"chars":66,"gap":false},{"id":"jurisprudence-1794829195013","n":132,"chapter":"法律职业与法律方法","title":"法律解释的必要性 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">把抽象概括规则具体化\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">弥补立法缺憾\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">调和法律稳定与社会变化\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">消除理解分歧、统一适用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">普及法律知识、开展法治教育\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":51,"gap":false},{"id":"jurisprudence-1794829195014","n":133,"chapter":"法律职业与法律方法","title":"法律解释的分类 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">按解释的主体和效力，分为正式解释和非正式解释\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按解释的尺度，分为字面解释、限制解释和扩张解释\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":45,"gap":false},{"id":"jurisprudence-1794829195015","n":134,"chapter":"法律职业与法律方法","title":"法律解释的方法 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">文义：看字面\u003c/span>；历史：看制定背景、沿革\u003c/li>\u003cli>\u003cspan class=\"blue\">系统\u003c/span>：看其在\u003cspan class=\"blue\">法律体系\u003c/span>中的联系和位置\u003c/li>\u003cli>\u003cspan class=\"blue\">目的\u003c/span>：看立法要实现什么\u003c/li>\u003cli>\u003cspan class=\"blue\">社会学\u003c/span>：衡量\u003cspan class=\"blue\">社会效果\u003c/span>、利益\u003c/li>\u003cli>\u003cspan class=\"blue\">比较法\u003c/span>：参考外国立法、判例、经验\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>同一句话可从文字、制定背景、上下条文和立法目的等不同方向解释，但结论要能说出理由。\u003c/p>","count":5,"chars":75,"gap":false},{"id":"jurisprudence-1794829195016","n":135,"chapter":"法律职业与法律方法","title":"立法解释的内容和主要任务 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">全国人大常委会解释法律，与法律同等效力\u003c/span>；也有宪法解释职权\u003c/li>\u003cli>\u003cspan class=\"blue\">任务\u003c/span>：适应发展、明确新含义；澄清实施\u003cspan class=\"blue\">疑义\u003c/span>；处理\u003cspan class=\"blue\">法条\u003c/span>及有关解释\u003cspan class=\"blue\">冲突\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">解释须守宪法、法律权限与程序\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":74,"gap":false},{"id":"jurisprudence-1794829195017","n":136,"chapter":"法律职业与法律方法","title":"司法解释的内容和作用 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">司法解释：最高司法机关解释司法中具体应用法律问题，含最高法审判解释、最高检检察解释及联合解释\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">作用\u003c/span>：具体化概括规则、补充不足、适应发展、统一认识、协调办案\u003c/li>\u003cli>\u003cspan class=\"blue\">两高解释冲突依法提请全国人大常委会处理\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":95,"gap":false},{"id":"jurisprudence-1794829195018","n":137,"chapter":"法律职业与法律方法","title":"行政解释的内容 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">行政解释：国务院及主管部门依法对有关法律、行政法规作解释\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">包括行政法规本身含义及行政工作具体适用问题\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不得违宪违法，不得以解释越权创设规则\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":67,"gap":false},{"id":"jurisprudence-1794829195019","n":138,"chapter":"法律职业与法律方法","title":"法律推理的含义和特征 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">以法律与事实两个已知的判断为前提，法律推理应用范围广泛，立法、执法、司法、法律监督，乃至公民的法律意识中都有法律推理\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">运用科学的方法和规则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">为法律适用提供正当理由\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">的一种逻辑思维活动\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":88,"gap":false},{"id":"jurisprudence-1794829195020","n":139,"chapter":"法律职业与法律方法","title":"实质推理（辩证推理） ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">矛盾命题-辩证最佳：矛盾命题-辩证最佳的概念：实质推理是依据价值、目的、原则、道德、政策、公理等，借助于辩证思维，当作为推理前提的是两个或两个以上的的法律命题相互矛盾时，从中选择出最佳的命题，以解决法律问题的一种思维活动\u003c/span>\u003c/p>","memory":"","understanding":"\u003cp>规则之间或事实与规则出现冲突，单靠套公式得不出答案，就要比较理由并选更合适的结论。\u003c/p>","count":1,"chars":110,"gap":false},{"id":"jurisprudence-1794829195021","n":140,"chapter":"法律职业与法律方法","title":"形式推理 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">演绎（2014）：一般到特殊：必然性：（主要）成文法国家\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">归纳\u003c/span>：特殊到一般：或然性：（主要）\u003cspan class=\"blue\">判例法\u003c/span>国家：在没\u003cspan class=\"blue\">有现成法律规则或原则\u003c/span>时，从以往判例中\u003cspan class=\"blue\">总结\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">类比\u003c/span>：个别到个别：或然性：（主要）\u003cspan class=\"blue\">判例法\u003c/span>国家：在两个案件的\u003cspan class=\"blue\">事实存在相似性\u003c/span>时，推定\u003cspan class=\"blue\">适用的法律及判决结果也相似\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>演绎是拿一般规则处理个案；归纳是从多个个案总结规则；类比是比较两个案件的关键相似处。\u003c/p>","count":3,"chars":126,"gap":false},{"id":"jurisprudence-1794829195022","n":141,"chapter":"法律职业与法律方法","title":"法律论证的含义、特征和正当性标准 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律论证：为裁判理由的合法性、合理性、正当性提供证明，结论具有可废止性\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">标准\u003c/span>：程序合理、逻辑有效、效果最优、内容融贯、依据客观\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":62,"gap":false},{"id":"jurisprudence-1794829195023","n":142,"chapter":"法律关系","title":"法律关系的含义和特征 ★  ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">法律关系是以法律规范为依据产生，以主体之间的权利和义务为内容的一种特殊社会关系\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">法律关系是依法建立的社会关系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律关系有意志性\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律关系以法律上的权利和义务为内容\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>法律规定买卖双方的权利义务；一签合同，这些规则就落实到这一对买家和卖家身上。\u003c/p>","count":4,"chars":78,"gap":false},{"id":"jurisprudence-1794829195024","n":143,"chapter":"法律关系","title":"法律关系的分类 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">基本、普通关系：是否由宪法及宪法性规范确认\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">平权、隶属关系\u003c/span>：主体地位是否\u003cspan class=\"blue\">平等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">绝对、相对关系\u003c/span>：义务人是否特定\u003c/li>\u003cli>\u003cspan class=\"blue\">调整、保护关系\u003c/span>：\u003cspan class=\"blue\">合法行为\u003c/span>形成，还是违法后保护、制裁形成\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先确定在按什么标准分，再答类别；例如看义务人是否特定，才能区分绝对和相对法律关系。\u003c/p>","count":4,"chars":79,"gap":false},{"id":"jurisprudence-1794829195025","n":144,"chapter":"法律关系","title":"法律关系主体的含义和范围 ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">构成要素的含义：法律关系的主体指法律关系的参加者\u003c/span>，即法律关系中权利的享有者和义务的承担者\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">构成要素的范围\u003c/span>：自然人\u003cspan class=\"blue\">法人\u003c/span>国家其他\u003cspan class=\"blue\">社会组织\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":65,"gap":false},{"id":"jurisprudence-1794829195026","n":145,"chapter":"法律关系","title":"法律关系主体的权利能力、行为能力 ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">权利能力，是依法享有权、承担义务的资格\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">行为能力，是依法以自己行为取得权利、承担义务的能力\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>小孩可以拥有财产，这是有权利能力；能不能独立买卖这份财产，要看有没有相应的行为能力。\u003c/p>","count":2,"chars":44,"gap":false},{"id":"jurisprudence-1794829195027","n":146,"chapter":"法律关系","title":"法律权利与法律义务 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">权利：法律赋予主体自主作出行为、要求他人作为或不作为的资格\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">义务\u003c/span>：法律要求主体作为或不作为的约束\u003c/li>\u003cli>\u003cspan class=\"blue\">二者相联系、相对应\u003c/span>，不得只享\u003cspan class=\"blue\">权利\u003c/span>不尽义务；权力是依法履行公共职能的\u003cspan class=\"blue\">权限\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":82,"gap":false},{"id":"jurisprudence-1794829195028","n":147,"chapter":"法律关系","title":"权利和权力的区别 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">主体：权利通常属个人、组织，公权力属获授权机关、人员\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">自由度\u003c/span>：\u003cspan class=\"blue\">权利\u003c/span>通常可依法放弃、转让；公权力不得任意放弃、转让\u003c/li>\u003cli>\u003cspan class=\"blue\">强制\u003c/span>：权力直接行使国家强制，\u003cspan class=\"blue\">权利\u003c/span>通常须经公权力保护\u003c/li>\u003cli>\u003cspan class=\"blue\">宪法分别使用职权、权限、权利等表述\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>个人的部分权利可以放弃或转让，公职人员手里的法定职权则必须依法行使，不能随意送人或放弃。\u003c/p>","count":4,"chars":97,"gap":false},{"id":"jurisprudence-1794829195029","n":148,"chapter":"法律关系","title":"法律关系客体的范围 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">物：可依法支配、有价值的客观实体\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行为\u003c/span>：义务人为权利人利益所作的作为、不作为\u003c/li>\u003cli>\u003cspan class=\"blue\">精神产品\u003c/span>：智力活动成果\u003c/li>\u003cli>\u003cspan class=\"blue\">人身利益\u003c/span>：生命、身体、人格身份等利益\u003c/li>\u003cli>\u003cspan class=\"blue\">数据信息\u003c/span>：数据形式的有价值资讯\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":81,"gap":false},{"id":"jurisprudence-1794829195030","n":149,"chapter":"法律关系","title":"物理的物成为法律关系客体须具备的条件 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">应得到法律的认可\u003c/span>\u003cspan class=\"blue\">。（法）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">应为人类所认识和控制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有经济价值。（经济）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须有独立性。（独立）\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":42,"gap":false},{"id":"jurisprudence-1794829195031","n":150,"chapter":"法律关系","title":"法律关系产生、变更与消灭（法律关系的演变） ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律关系的演变，包括产生、变更和消灭\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律规范是抽象前提，法律事实是直接原因\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>同一笔买卖中，签约建立关系，双方改价改变内容，履行完毕后相应债务终止。\u003c/p>","count":2,"chars":37,"gap":false},{"id":"jurisprudence-1794829195032","n":151,"chapter":"法律关系","title":"法律事实的含义、特征和分类 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律事实：能引起法律关系产生、变更、消灭的事实\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须获法律规范确认，是客观事实与法律评价的结合\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">事件不以当事人意志为转移\u003c/span>；行为与人的意志有关；多个事实可构成事实组合\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>同一件事只有在法律规定它会带来某种后果时，才是这个法律关系里的法律事实。\u003c/p>","count":3,"chars":79,"gap":false},{"id":"jurisprudence-1794829195033","n":152,"chapter":"法律责任与法律制裁","title":"法律责任的主要内容 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律责任是行为人因违法、违约或法律另有规定而须承担的不利法律后果\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">承担法律责任须有法律依据，并由国家强制力保证落实\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律责任可以惩罚违法者、救济受损权益，并预防类似行为\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":82,"gap":false},{"id":"jurisprudence-1794829195034","n":153,"chapter":"法律责任与法律制裁","title":"法律责任的构成 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">责任主体：依法具责任资格的个人、组织\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">违法行为\u003c/span>：违反义务或越权、侵权\u003c/li>\u003cli>\u003cspan class=\"blue\">损害结果\u003c/span>：人身、财产、精神等损失\u003c/li>\u003cli>\u003cspan class=\"blue\">因果关系\u003c/span>：行为引起损害\u003c/li>\u003cli>\u003cspan class=\"blue\">主观过错\u003c/span>：故意、过失；特殊\u003cspan class=\"blue\">责任\u003c/span>可依法不以\u003cspan class=\"blue\">过错\u003c/span>为条件\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":85,"gap":false},{"id":"jurisprudence-1794829195035","n":154,"chapter":"法律责任与法律制裁","title":"归责的含义和原则 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">归责：有权机关依法判断、确认、追究、减免法律责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">责任法定\u003c/span>：预先有法律依据\u003c/li>\u003cli>\u003cspan class=\"blue\">责任自负\u003c/span>：原则上由本人承担\u003c/li>\u003cli>\u003cspan class=\"blue\">责罚相称\u003c/span>：匹配危害及主观恶性\u003c/li>\u003cli>\u003cspan class=\"blue\">因果联系\u003c/span>：查清行为与结果及主观因素的关系\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先判断为什么能让这个人承担责任，再用归责原则说明承担多少、由谁承担。\u003c/p>","count":5,"chars":83,"gap":false},{"id":"jurisprudence-1794829195036","n":155,"chapter":"法律责任与法律制裁","title":"免责的含义和条件 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">免责：出现法定条件，部分或全部减免既有责任，区别于本来无责\u003c/span>\u003c/li>\u003cli>形式包括不诉、时效、有效补救、自助、自首\u003cspan class=\"blue\">立功\u003c/span>及依法协议\u003cspan class=\"blue\">免责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须满足具体法律条件，不能把任何道歉、和解都当免责\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>免责一般是在责任原本成立的前提下，因符合法定条件而免除全部或部分责任。\u003c/p>","count":3,"chars":82,"gap":false},{"id":"jurisprudence-1794829195037","n":156,"chapter":"法律责任与法律制裁","title":"法律制裁的概念 ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">法律制裁的概念法律制裁是由特定的国家机关对违法者（或违约者）依其应承担法律责任而实施的强制性惩罚措施\u003c/span>\u003c/p>","memory":"","understanding":"","count":1,"chars":50,"gap":false},{"id":"jurisprudence-1794829195038","n":157,"chapter":"法律责任与法律制裁","title":"法律制裁的种类 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">刑事制裁针对犯罪行为\u003c/span>\u003cspan class=\"blue\">，例如依法判处罚金或徒刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">民事制裁针对应承担民事责任行为，例如责令赔偿损失\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行政制裁针对行政违法或有关岗位违纪违法\u003c/span>，可涉及\u003cspan class=\"blue\">行政处罚\u003c/span>和处分\u003c/li>\u003cli>\u003cspan class=\"blue\">违宪制裁针对违反宪法行为或规范\u003c/span>，例如依法纠正与宪法抵触的规定\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":106,"gap":false},{"id":"jurisprudence-1794829195039","n":158,"chapter":"法治","title":"法治的含义 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法治：以完备、良好的法律规则治理国家，公权力与社会活动受法约束\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法制\u003c/span>：静态指法律制度，动态含制定、实施、监督\u003c/li>\u003cli>\u003cspan class=\"blue\">法治强调法律至上、权利保障和民主基础，不只是有法律\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>法治要有良法，也要保障法律能约束公权力、保护权利，并通过正当程序落实。\u003c/p>","count":3,"chars":78,"gap":false},{"id":"jurisprudence-1794829195040","n":159,"chapter":"法治","title":"法治与法制的区别 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">内涵：法治含制度运行与法律至上、权利保障\u003c/span>；法制侧重法律制度及实施\u003c/li>\u003cli>\u003cspan class=\"blue\">内容\u003c/span>：法治要求\u003cspan class=\"blue\">良法\u003c/span>，不只规范有效\u003c/li>\u003cli>\u003cspan class=\"blue\">政治基础\u003c/span>：法治与民主联系，法制可见于不同制度\u003c/li>\u003cli>\u003cspan class=\"blue\">人与法\u003c/span>：法治要求法高于个人意志\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":85,"gap":false},{"id":"jurisprudence-1794829195041","n":160,"chapter":"法治","title":"法治与人治的区别 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">基础：法治以民主为基础，人治通常依个人、少数人统治\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依据\u003c/span>：法治依反映共同意志的法律，\u003cspan class=\"blue\">人治\u003c/span>依个人意志\u003c/li>\u003cli>\u003cspan class=\"blue\">冲突时\u003c/span>：法治中法律优先，\u003cspan class=\"blue\">人治\u003c/span>中个人意志\u003cspan class=\"blue\">高于\u003c/span>法\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":70,"gap":false},{"id":"jurisprudence-1794829195042","n":161,"chapter":"法治","title":"法治与民主 ★  ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">民主是以公民意志为合法性基础的国家制度，涉及国体、政体\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">民主是法治基础，没有民主难有真正法治\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法治是民主保障，民主须以法定规则、程序运行\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":66,"gap":false},{"id":"jurisprudence-1794829195043","n":162,"chapter":"法治","title":"社会主义法治与社会主义民主的关系 ★  ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">民主是法治的政治基础、力量源泉，决定法律创制质量并推动法治发展\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">法治确认人民当家作主地位，保障民主权利自由\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">规范民主范围、程序、方式，是保卫民主的武器\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":73,"gap":false},{"id":"jurisprudence-1794829195044","n":163,"chapter":"法治","title":"法律至上原则 ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">法律至上是法治区别于人治的根本标志、首要条件\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">宪法至上是其核心\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律在社会规范体系中具最高权威\u003c/span>，\u003cspan class=\"blue\">其他\u003c/span>规范不得否定法律效力或与之冲突\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":63,"gap":false},{"id":"jurisprudence-1794829195045","n":164,"chapter":"法治","title":"权利保障原则 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律面前人人平等，排除特权、歧视\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">权利义务相一致，依法定界限行使权利、承担义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国家尊重和保障人权，是法治价值目标的归宿\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":58,"gap":false},{"id":"jurisprudence-1794829195046","n":165,"chapter":"法治","title":"权力制约原则 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国家权力须合理分工、有效制约\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">既靠权力相互制约，也靠法律监督约束\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">尤其制约行政权，要求严格依法行政，防止滥权\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":52,"gap":false},{"id":"jurisprudence-1794829195047","n":166,"chapter":"法治","title":"正当程序原则 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">理论基础是自然公正\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">公权力须按公正程序、用公正方法行使\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">任何人不得作自己案件的法官\u003c/span>，须听取当事人意见，保障程序正义\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>即使想得到正确结果，也要按公正步骤办事，例如事先通知并听取受影响的人说话。\u003c/p>","count":3,"chars":55,"gap":false},{"id":"jurisprudence-1794829195048","n":167,"chapter":"法治","title":"社会主义法治（依法治国）的含义 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">依法治国（=社会主义法治），就是广大人民群众在党的领导下，依照宪法和法律规定，经各种途径和形式管理国家事务，管理经济文化事业，管理社会事务，保证国家各项工作都依法进行，逐步实现社会主义民主的制度化、法律化\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法治国是党领导人民治理国家的基本方略\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":121,"gap":false},{"id":"jurisprudence-1794829195049","n":168,"chapter":"法治","title":"法治思维的含义及关注的内容 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法治思维：依社会主义法治逻辑观察、分析、解决问题\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">以法律为判断、办事准绳\u003c/span>，重合法性、权利义务、证据、\u003cspan class=\"blue\">程序\u003c/span>和权力边界\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":56,"gap":false},{"id":"jurisprudence-1794829195050","n":169,"chapter":"法治","title":"法治思维的不同理解 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">规则思维\u003c/span>。办事先找\u003cspan class=\"blue\">法律依据\u003c/span>，按照\u003cspan class=\"blue\">公开、统一\u003c/span>的规则作决定\u003c/li>\u003cli>\u003cspan class=\"blue\">平等思维\u003c/span>。对情况相同的人适用相同标准，合理对待实际差异\u003c/li>\u003cli>\u003cspan class=\"blue\">权力受制约\u003c/span>。公权力依法取得并在法定范围内使用，\u003cspan class=\"blue\">接受监督\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">程序思维\u003c/span>。处理事情须遵循法定程序，保障受影响者参与和陈述意见\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":111,"gap":false},{"id":"jurisprudence-1794829195051","n":170,"chapter":"法治","title":"法治方式与法治思维 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法治方式广义上包括立法执法司法守法监督\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法治方式与法治思维是外在和内在的关系，\u003c/span>：\u003cspan class=\"blue\">法治方式\u003c/span>就是\u003cspan class=\"blue\">法治思维\u003c/span>实际作用于人行为的\u003cspan class=\"blue\">外在表现\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">要提高运用法治思维和法治方式\u003c/span>：深化改革、推动发展、化解矛盾、维护稳定的能力\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>法治思维是先用法律想清楚该怎么办，法治方式是按这个判断实际去办。\u003c/p>","count":3,"chars":99,"gap":false},{"id":"jurisprudence-1794829195052","n":171,"chapter":"法治","title":"全面依法治国的基本原则 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">坚持党的领导\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">坚持人民主体地位\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律面前人人平等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法治国与以德治国相结合\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">从中国实际出发\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":41,"gap":false},{"id":"jurisprudence-1794829195053","n":172,"chapter":"法治","title":"全面依法治国的总目标 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">总目标：建设中国特色社会主义法治体系，建设社会主义法治国家\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">体系\u003c/span>含完备\u003cspan class=\"blue\">法律规范\u003c/span>、高效实施、严密监督、有力保障、完善\u003cspan class=\"blue\">党内法规\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">三共同推进、三一体建设\u003c/span>，落实立法执法司法守法，推进治理现代化\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":90,"gap":false},{"id":"jurisprudence-1794829195054","n":173,"chapter":"法治","title":"中国特色社会主义法治体系 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">完善法律规范体系：重点立法、民主科学立法、宪法实施监督\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">建设高效实施体系\u003c/span>：\u003cspan class=\"blue\">依法决策\u003c/span>、\u003cspan class=\"blue\">公开\u003c/span>、\u003cspan class=\"blue\">执法\u003c/span>改革、严格公正文明\u003cspan class=\"blue\">执法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">严密监督权力，有力保障队伍与制度\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">完善党内法规，坚持党领导全面依法治国\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":91,"gap":false},{"id":"jurisprudence-1794829195055","n":174,"chapter":"法治","title":"坚持依法治国、依法执政、依法行政共同推进 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">依法治国：党领导人民依宪法法律治理国家、经济文化和社会事务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法执政\u003c/span>：党依宪法法律、党内法规治国理政、管党治党\u003c/li>\u003cli>\u003cspan class=\"blue\">依法行政\u003c/span>：政府\u003cspan class=\"blue\">依法\u003c/span>行使管理权、履行职责；三者相互联系、共同推进\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>依法治国管全局，依法执政管党怎样领导，依法行政管政府怎样依法履职。\u003c/p>","count":3,"chars":85,"gap":false},{"id":"jurisprudence-1794829195056","n":175,"chapter":"法治","title":"坚持法治国家、法治政府、法治社会一体建设 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法治国家：权力依法运行，保障法律权威、权利与程序公正，是建设目标\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法治政府\u003c/span>：职权、程序、责任法定，依法全面履职，是重点\u003c/li>\u003cli>\u003cspan class=\"blue\">法治社会\u003c/span>：全民尊法守法、组织依法自治，是基础\u003c/li>\u003cli>\u003cspan class=\"blue\">三者相互支撑，一体建设\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>国家的权力要依法运行，政府要依法办事，社会成员和组织也要在法律下活动，三方面要一起推进。\u003c/p>","count":4,"chars":91,"gap":false},{"id":"jurisprudence-1794829195057","n":176,"chapter":"法治","title":"全面依法治国的基本格局 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">科学立法：尊重规律、实际、民意，完善程序，是前提\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">严格执法\u003c/span>：依法、严明、严肃，规范公正文明\u003c/li>\u003cli>\u003cspan class=\"blue\">公正司法\u003c/span>：规范\u003cspan class=\"blue\">权力\u003c/span>、\u003cspan class=\"blue\">监督\u003c/span>运行、保障人权\u003c/li>\u003cli>\u003cspan class=\"blue\">全民守法\u003c/span>：普法学法、尊重权威，是基础\u003c/li>\u003cli>\u003cspan class=\"blue\">建设高素质法治队伍\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":90,"gap":false},{"id":"jurisprudence-1794829195058","n":177,"chapter":"法治","title":"在法治轨道上全面建设社会主义现代化国家 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">中国式现代化（1+5+2须）：中国式现代化是中国共产党领导的社会主义现代化（政）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法治轨道上推进\u003c/span>：（有）\u003cspan class=\"blue\">全面依法治国\u003c/span>是我国社会主义建设伟大\u003cspan class=\"blue\">实践\u003c/span>的基本\u003cspan class=\"blue\">经验\u003c/span>（以前），是全面建设社会主义现代化国家的必然\u003cspan class=\"blue\">要求\u003c/span>（现在），是\u003cspan class=\"blue\">提高\u003c/span>党治国理政水平的重要途径\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":119,"gap":false},{"id":"jurisprudence-1794829195059","n":178,"chapter":"法与社会","title":"法与社会的相互作用 ★  ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">社会是法的基础：（静）法是社会的产物：（动）社会是法的基础\u003c/span>，即\u003cspan class=\"blue\">社会是法\u003c/span>赖以\u003cspan class=\"blue\">产生或形成\u003c/span>的\u003cspan class=\"blue\">基础\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">法是社会关系的调整器\u003c/span>：调：法对社会的调整，是调和冲突的利益，保证\u003cspan class=\"blue\">社会秩序得以确立和维护\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>现实社会的需要会推动法律变化，法律又会反过来改变人们处理社会关系的方式。\u003c/p>","count":2,"chars":88,"gap":false},{"id":"jurisprudence-1794829195060","n":179,"chapter":"法与社会","title":"社会治理的内涵 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">社会治理：政府、社会组织、企事业、社区、个人依法合作、协商，管理公共事务，实现公共利益\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">党的领导、政府主导，多元主体参与\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">以人民利益为核心，是以人民为中心的法治化多元治理\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":83,"gap":false},{"id":"jurisprudence-1794829195061","n":180,"chapter":"法与社会","title":"当代中国社会主义法在社会治理中的作用 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">规范政治权力运行\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">化解复杂矛盾、维护稳定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">追求公平正义\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">坚持以人民为中心\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">引导公众广泛参与，形成多元治理合力\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":50,"gap":false},{"id":"jurisprudence-1794829195062","n":181,"chapter":"法与社会","title":"依法治理网络空间 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">依法治理网络空间：把法治延伸至网络，健全综合治理体系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">制度\u003c/span>：\u003cspan class=\"blue\">立改废释\u003c/span>并举，完善网络法\u003c/li>\u003cli>\u003cspan class=\"blue\">意识\u003c/span>：依法治网与以德润网结合\u003c/li>\u003cli>\u003cspan class=\"blue\">安全\u003c/span>：依法防风险，保障公民\u003cspan class=\"blue\">安全\u003c/span>用网\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":72,"gap":false},{"id":"jurisprudence-1794829195063","n":182,"chapter":"法与社会","title":"通过法律实现“共建共治共享”的社会治理新理念 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">社会治理法治化：完善党委领导、政府负责、多方参与的制度\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">共建\u003c/span>：发挥\u003cspan class=\"blue\">人民团体\u003c/span>、\u003cspan class=\"blue\">社会组织\u003c/span>作用\u003c/li>\u003cli>\u003cspan class=\"blue\">共治\u003c/span>：推进多层次、多领域依法治理\u003c/li>\u003cli>\u003cspan class=\"blue\">共享\u003c/span>：增强安全感，依法多元化解纠纷，成果由人民共享\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>大家都能参与建设和治理，也能共享治理成果，法律把参与、分工和保障固定下来。\u003c/p>","count":4,"chars":84,"gap":false},{"id":"jurisprudence-1794829195064","n":183,"chapter":"法与社会","title":"法和经济的关系 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">经济基础决定法的性质、内容和发展变化\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法反作用于经济\u003c/span>：选择确认、促进保障、调控引导，也可能阻碍\u003c/li>\u003cli>\u003cspan class=\"blue\">法属上层建筑，不能脱离经济条件任意设计\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>经济关系决定法律制度的基本样子，法律又能通过保护权利、明确规则来影响经济活动。\u003c/p>","count":3,"chars":65,"gap":false},{"id":"jurisprudence-1794829195065","n":184,"chapter":"法与社会","title":"法与社会主义市场经济的关系 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律确认市场主体独立地位\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保障契约关系、市场交易秩序\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">维护自由平等竞争\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">提供宏观调控依据和边界\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">适应开放经济，运用国际规则；市场经济须有法治保障\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":68,"gap":false},{"id":"jurisprudence-1794829195066","n":185,"chapter":"法与社会","title":"法与科技的相互影响 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">科技推动法律内容、调整领域、概念原则、运行机制及法学教育变化\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律为科技提供发展环境、行为准则、激励保障\u003c/span>，并防范科技滥用风险\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>技术进步会带来新的法律问题，法律又能保护创新、约束技术滥用。\u003c/p>","count":2,"chars":61,"gap":false},{"id":"jurisprudence-1794829195067","n":186,"chapter":"法与社会","title":"法与国家的关系 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国家推动法产生发展，国家权力创制并保障法律实施\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法确认国家权力合法性，组织完善国家机构\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">制约监督权力\u003c/span>，提升运行\u003cspan class=\"blue\">效率\u003c/span>；国家与法相互支持、相互制约\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":69,"gap":false},{"id":"jurisprudence-1794829195068","n":187,"chapter":"法与社会","title":"法与政治的区别 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">反映经济关系：政治集中表达利益，法用规则、程序使之制度化\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">表现重点\u003c/span>：政治重组织，法重规则秩序\u003c/li>\u003cli>\u003cspan class=\"blue\">调整机制\u003c/span>：政治经政治行为过程，法经权利义务确认保障\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":70,"gap":false},{"id":"jurisprudence-1794829195069","n":188,"chapter":"法与社会","title":"法与政治的联系（相互作用） ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">政治影响法的产生、内容、实施，法往往反映并服务一定政治\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法确认政治制度\u003c/span>，调整权力\u003cspan class=\"blue\">运行\u003c/span>、制约\u003cspan class=\"blue\">政治\u003c/span>权力，\u003cspan class=\"blue\">影响政治发展\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">二者联系紧密但不能用政治替代法律\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":71,"gap":false},{"id":"jurisprudence-1794829195070","n":189,"chapter":"法与社会","title":"法与政策的关系 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">一致：经济基础、阶级意志、指导思想、根本目的相同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">区别\u003c/span>：法体现国家意志，政策体现政党意志；\u003cspan class=\"blue\">表现形式\u003c/span>不同\u003c/li>\u003cli>\u003cspan class=\"blue\">法靠国家强制\u003c/span>，政策靠组织等保障；法律通常更稳定、程序化\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>政策可以指出治理方向，涉及普遍约束或限制权利时，还要看是否有法律依据并按法律程序办理。\u003c/p>","count":3,"chars":77,"gap":false},{"id":"jurisprudence-1794829195071","n":190,"chapter":"法与社会","title":"中国社会主义法与中国共产党政策的关系 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">我国法与党的政策本质一致，外部形式、表达方式不同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">党的政策是法的重要内容和指导\u003c/span>，法是贯彻\u003cspan class=\"blue\">政策\u003c/span>、加强领导的\u003cspan class=\"blue\">基本手段\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">政策促进法律实现，党在宪法法律范围内活动\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不能割裂对立，也不能简单等同\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":89,"gap":false},{"id":"jurisprudence-1794829195072","n":191,"chapter":"法与社会","title":"法律意识的概念 ★  ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">法律意识是人们在法律生活中对法和法律现象形成的认识、感受和评价\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">它以法律现象为对象\u003c/span>，包含对法律的认知，也包含对法律是否合理、公正的\u003cspan class=\"blue\">价值判断\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按主体可分为个人、群体和社会法律意识\u003c/span>；按认知阶段可分为\u003cspan class=\"blue\">法律心理\u003c/span>和\u003cspan class=\"blue\">法律思想体系\u003c/span>；还可按专业性和社会政治地位分类\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>知道规则是什么、觉得规则公不公平、愿不愿按它行事，都与法律意识有关。\u003c/p>","count":3,"chars":122,"gap":false},{"id":"jurisprudence-1794829195073","n":192,"chapter":"法与社会","title":"法律意识与法律实践的作用 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律意识在很大程度上制约和影响着法律实践活动\u003c/span>\u003c/li>\u003cli>法律实践不可避免地要受到该社会法律文化观念及\u003cspan class=\"blue\">法律意识\u003c/span>的\u003cspan class=\"blue\">制约和影响\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":54,"gap":false},{"id":"jurisprudence-1794829195074","n":193,"chapter":"法与社会","title":"法律文化的概念和特点 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律文化：法律制度及人们对法律的态度、信念、心理、习惯、学说等构成的整体\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">含制度形态、观念形态两个层面\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">特征\u003c/span>：多样性、\u003cspan class=\"blue\">阶级性\u003c/span>、\u003cspan class=\"blue\">相对独立性\u003c/span>、民族性\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>写进法典的规则和制度是制度层面；人们对法律的看法和习惯是观念层面。\u003c/p>","count":3,"chars":70,"gap":false},{"id":"jurisprudence-1794829195075","n":194,"chapter":"法与社会","title":"当代中国的法律文化 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">中国传统法律文化长期积累，在当代仍有影响\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">社会主义建设\u003c/span>中形成的法律文化是当代中国法律文化的重要组成部分\u003c/li>\u003cli>苏联法律文化和西方法律文化也曾影响中国的法律理论和制度\u003c/li>\u003cli>\u003cspan class=\"blue\">建设当代中国法律文化\u003c/span>，应继承优秀法律传统，也要总结和吸收外国的有益经验\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":112,"gap":false},{"id":"jurisprudence-1794829195076","n":195,"chapter":"法与社会","title":"弘扬社会主义法治精神、建设社会主义法治文化 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法治权威源于人民内心拥护、真诚信仰\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">使守法内化于心、外化于行，形成守法光荣、违法可耻风气\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">以法治政府建设、严谨司法、严格执法培养公民自觉守法\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":68,"gap":false},{"id":"jurisprudence-1794829195077","n":196,"chapter":"法与社会","title":"法与道德的区别 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">形式：法以规范文件等表达，道德多在观念习惯中\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">尺度\u003c/span>：法重合法有效，道德重善恶\u003c/li>\u003cli>\u003cspan class=\"blue\">范围\u003c/span>：法主要调行为，道德还调内心\u003c/li>\u003cli>\u003cspan class=\"blue\">内容\u003c/span>：法兼设权利义务，道德偏义务\u003c/li>\u003cli>\u003cspan class=\"blue\">产生\u003c/span>：法由国家创制，道德自发积累\u003c/li>\u003cli>\u003cspan class=\"blue\">保障\u003c/span>：法靠国家强制，道德靠舆论、良心\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>道德主要靠内心自觉和社会评价，法律还可以由国家强制实施，两者管的事情也不完全相同。\u003c/p>","count":6,"chars":103,"gap":false},{"id":"jurisprudence-1794829195078","n":197,"chapter":"法与社会","title":"法与道德的联系 ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">道德是法的理论、价值、社会基础，可评价法、补法律漏洞\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">法将基本道德要求制度化，以权利义务及制裁保障实施\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律也传播道德、推动新道德形成\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":65,"gap":false},{"id":"jurisprudence-1794829195079","n":198,"chapter":"法与社会","title":"社会主义法与社会主义道德的关系 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">社会主义道德为法提供价值标准、社会基础和推动力量\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">社会主义法传播、保障道德，依法确认基本道德要求\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">二者目标一致，相互支持，须依法治国与以德治国相结合\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":72,"gap":false},{"id":"jurisprudence-1794829195080","n":199,"chapter":"法与社会","title":"法与道德的冲突及解决 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">冲突可表现为道德不许而法律允许，或法律不许而道德认可\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">结果可能是法律调整以适应合理道德\u003c/span>，也可能通过法治实践改变旧道德\u003c/li>\u003cli>\u003cspan class=\"blue\">提高立法质量\u003c/span>，减少漏洞和不必要冲突，不以个人道德代替法律\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>法律允许的行为仍可能受道德批评；道德上想帮人，也不能直接越过法律要求。\u003c/p>","count":3,"chars":85,"gap":false},{"id":"jurisprudence-1794829195081","n":200,"chapter":"法与社会","title":"法与宗教的联系与区别 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">联系：均影响行为、秩序，宗教曾影响法律，法也规范宗教活动\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">产生\u003c/span>：法由国家制定认可，宗教依特定信仰形成\u003c/li>\u003cli>\u003cspan class=\"blue\">实施\u003c/span>：法靠国家强制，宗教靠信仰教规\u003c/li>\u003cli>\u003cspan class=\"blue\">范围\u003c/span>：法依法普遍适用，教规主要约束信众\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":85,"gap":false},{"id":"jurisprudence-1794829195082","n":201,"chapter":"法与社会","title":"我国法律在处理宗教问题中的作用 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律保障公民的宗教信仰自由，保护正常的宗教活动\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律为宗教事务提供管理规则\u003c/span>，同时维护公共秩序和他人的合法权益\u003c/li>\u003cli>不得利用宗教破坏社会秩序、损害公民身体健康或妨碍国家教育制度\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>个人可以选择信不信教；宗教活动影响公共生活时，仍要遵守法律。\u003c/p>","count":3,"chars":83,"gap":false}]},{"id":"constitution","name":"宪法","limit":130,"items":[{"id":"constitution-constitution-1","n":1,"chapter":"第一章 宪法基本理论","title":"宪法的形式特征 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">内容的根本性\u003c/span>。宪法规定国家根本制度、国家机构和公民基本权利义务等根本问题\u003c/li>\u003cli>\u003cspan class=\"blue\">效力的最高性\u003c/span>。宪法是其他法律的立法依据，一切法律、行政法规和地方性法规不得同宪法相抵触\u003c/li>\u003cli>\u003cspan class=\"blue\">制定和修改程序的特殊性\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":90,"gap":false},{"id":"constitution-constitution-2","n":2,"chapter":"第一章 宪法基本理论","title":"宪法的实质特点 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">宪法是公民权利的保障书\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宪法是民主制度法律化的基本形式\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宪法集中体现各种政治力量的对比关系\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":43,"gap":false},{"id":"constitution-constitution-3","n":3,"chapter":"第一章 宪法基本理论","title":"宪法的形式分类 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">按效力和修改程序，分刚性宪法与柔性宪法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按是否有统一宪法典，分成文宪法与不成文宪法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按制定主体和方式\u003c/span>，分君主颁布的钦定宪法、君主与人民或其代表协商的协定宪法，及人民或其代表制定的民定宪法\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":91,"gap":false},{"id":"constitution-constitution-4","n":4,"chapter":"第一章 宪法基本理论","title":"马克思主义的宪法分类 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">以宪法的阶级本质及其建立的经济基础为标准，分为资本主义类型的宪法和社会主义类型的宪法\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":1,"chars":42,"gap":false},{"id":"constitution-constitution-5","n":5,"chapter":"第一章 宪法基本理论","title":"依宪治国的含义 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">坚持依法治国首先要坚持依宪治国，坚持依法执政首先要坚持依宪执政\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宪法体现人民共同意志\u003c/span>，一切国家机关、组织和个人都应以宪法为根本活动准则\u003c/li>\u003cli>\u003cspan class=\"blue\">维护宪法的尊严和实施，就是维护人民根本利益\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":87,"gap":false},{"id":"constitution-constitution-6","n":6,"chapter":"第一章 宪法基本理论","title":"宪法与依宪治国的关系 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">二者是规范与实践的关系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依宪治国把宪法要求落实到国家治理中\u003c/span>，使纸面上的规定真正发挥作用\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":42,"gap":false},{"id":"constitution-constitution-7","n":7,"chapter":"第一章 宪法基本理论","title":"英、美、法三国宪法的产生及其特点 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">近代宪法随资本主义经济和政治的发展而产生，受启蒙思想影响\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">英国经资产阶级革命逐步形成不成文宪法\u003c/span>，《权利法案》等确立议会地位\u003c/li>\u003cli>\u003cspan class=\"blue\">美国1787年宪法是世界上第一部近代成文宪法\u003c/span>，实行联邦制和分权制衡\u003c/li>\u003cli>\u003cspan class=\"blue\">法国经大革命发表《人权宣言》\u003c/span>，1791年制定成文宪法，突出人权保障\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":126,"gap":false},{"id":"constitution-constitution-8","n":8,"chapter":"第一章 宪法基本理论","title":"宪法的发展及其趋势 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">公民基本权利的范围扩大，人权保障受到更多重视\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国家治理任务增加，政府职能扩大\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">经合宪性审查加强宪法实施\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宪法发展受到国际人权规则和各国制度交流的影响\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":71,"gap":false},{"id":"constitution-constitution-9","n":9,"chapter":"第一章 宪法基本理论","title":"新中国宪法的历史沿革 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">1949年共同纲领在建国初起临时宪法作用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">1954年首部社会主义类型宪法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">1975、1978年先后制定宪法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">1982年现行宪法\u003c/span>，1988、1993、1999、2004、2018年修正\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":88,"gap":false},{"id":"constitution-constitution-10","n":10,"chapter":"第一章 宪法基本理论","title":"我国现行宪法的内容和特点 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">序言总结历史经验，规定国家根本任务和指导思想\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">总纲确立国家根本制度\u003c/span>，维护国家统一和民族团结，规定民族区域自治和特别行政区制度\u003c/li>\u003cli>\u003cspan class=\"blue\">公民基本权利和义务一章强化权利保障\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国家机构一章恢复并完善国家机构体系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">末章规定国旗、国歌、国徽和首都\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":110,"gap":false},{"id":"constitution-constitution-11","n":11,"chapter":"第一章 宪法基本理论","title":"我国宪法修正案的重要总结 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">1988：私营经济、土地使用权转让\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">1993\u003c/span>：社会主义市场经济\u003c/li>\u003cli>\u003cspan class=\"blue\">1999\u003c/span>：依法治国、非公经济地位\u003c/li>\u003cli>\u003cspan class=\"blue\">2004\u003c/span>：人权、私产保护、征收征用补偿\u003c/li>\u003cli>\u003cspan class=\"blue\">2018\u003c/span>：习近平新时代思想、党的领导、监察委员会、宪法宣誓等\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":95,"gap":false},{"id":"constitution-constitution-12","n":12,"chapter":"第一章 宪法基本理论","title":"人民主权原则 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">人民主权又称主权在民，国家最高权力属于人民\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">我国\u003c/span>，国家的一切权力属于人民，人民经全国人大和地方各级人大行使国家权力\u003c/li>\u003cli>\u003cspan class=\"blue\">人民还依照法律\u003c/span>，经各种途径和形式管理国家事务、经济和文化事业、社会事务\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":91,"gap":false},{"id":"constitution-constitution-13","n":13,"chapter":"第一章 宪法基本理论","title":"基本人权原则 ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">基本人权是人作为人应享有的基本权利\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">我国宪法规定国家尊重和保障人权\u003c/span>，专章规定公民基本权利和义务\u003c/li>\u003cli>\u003cspan class=\"blue\">国家既要防止权利受到侵害\u003c/span>，也要经立法和制度保障权利能行使\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":74,"gap":false},{"id":"constitution-constitution-14","n":14,"chapter":"第一章 宪法基本理论","title":"权力制约与监督原则 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国家权力应依法受到制约和监督，以防滥用并保障公民权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">人民经选举和监督制约权力\u003c/span>，公民可依法批评、建议、申诉、控告和检举\u003c/li>\u003cli>\u003cspan class=\"blue\">人大及其常委会监督由人大产生的有关机关\u003c/span>，各机关依照法定职权分工，并在法定事项中互相制约\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":101,"gap":false},{"id":"constitution-constitution-15","n":15,"chapter":"第一章 宪法基本理论","title":"法治原则 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国家机关行使职权须以宪法和法律为依据，不能超越法定权限\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宪法优位。宪法有最高法律效力，其他规范不得与其抵触\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律保留。依法只能由法律规定的重要事项，应由法律规定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">审判独立\u003c/span>。人民法院依法独立行使审判权，不受行政机关、社会团体和个人干涉\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":113,"gap":false},{"id":"constitution-constitution-16","n":16,"chapter":"第一章 宪法基本理论","title":"宪法规范的概念和特点 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">宪法规范是调整宪法关系的法律规范\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">效力最高，其他法律规范不得与其抵触\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">立法有原则性，往往先定基本规则，再由法律具体规定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">实施有多层次性\u003c/span>，可以直接实施，也可以由其他规范具体落实\u003c/li>\u003cli>\u003cspan class=\"blue\">内容有政治性，涉及根本制度和国家权力运行\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":104,"gap":false},{"id":"constitution-constitution-17","n":17,"chapter":"第一章 宪法基本理论","title":"宪法规范所调整的社会关系的特点 ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">调整的是国家制度、公民基本权利义务等宏观、根本的关系\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">关系一方通常是国家\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":35,"gap":false},{"id":"constitution-constitution-18","n":18,"chapter":"第一章 宪法基本理论","title":"宪法规范的种类 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">组织权限规范，规定国家机构的设置、职权和运行程序\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">权利义务规范，规定公民的基本权利和义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宪法委托规范，要求有关机关经立法等方式具体落实\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宪法指示规范，确定国家活动的目标或方向\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":85,"gap":false},{"id":"constitution-constitution-19","n":19,"chapter":"第二章 宪法的制定和实施","title":"宪法制定、制宪权、修宪权和立法权的概念 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">宪法制定是制宪主体行使制宪权、创制宪法的活动\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">制宪权是人民创制宪法的原生性权力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">修宪权是依据宪法修改宪法的派生性权力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">立法权是依照宪法制定、修改和废止普通法律的权力\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":79,"gap":false},{"id":"constitution-constitution-20","n":20,"chapter":"第二章 宪法的制定和实施","title":"制宪主体、制宪机关与起草机构的概念和不同 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">制宪主体是掌握制宪权的人民\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">制宪机关依法代表人民行使制宪权，负责审议并经宪法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宪法起草机构负责拟订、修改草案\u003c/span>，通常是临时性机构，本身无权经宪法\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":69,"gap":false},{"id":"constitution-constitution-21","n":21,"chapter":"第二章 宪法的制定和实施","title":"宪法制定的程序 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">成立制宪机构\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">拟订并提出宪法草案\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依特别程序审议、经草案\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">公布宪法\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":30,"gap":false},{"id":"constitution-constitution-22","n":22,"chapter":"第二章 宪法的制定和实施","title":"中国宪法的制定 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">1949年中国人民政治协商会议第一届全体会议经《共同纲领》，起临时宪法作用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">1954年人民广泛讨论宪法草案\u003c/span>，由第一届全国人大第一次会议审议经，体现人民作为制宪主体\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":80,"gap":false},{"id":"constitution-constitution-23","n":23,"chapter":"第二章 宪法的制定和实施","title":"宪法解释的概念、分类和方法 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">宪法解释是有权机关依法说明宪法规范的含义、内容和适用范围\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按有无法律效力，分正式解释和非正式解释\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">文义解释看条文文字\u003c/span>，目的解释看规范目的，体系解释结合条文的位置及其与其他条文的关系\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":88,"gap":false},{"id":"constitution-con
