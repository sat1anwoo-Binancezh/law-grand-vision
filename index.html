stitution-24","n":24,"chapter":"第二章 宪法的制定和实施","title":"宪法解释的体制 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">立法机关解释\u003c/span>\u003cspan class=\"blue\">。由立法机关解释宪法，如英国\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">司法机关解释。法院经审理案件解释宪法，如美国\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">专门机关解释\u003c/span>。由专设的宪法法院或宪法委员会等机关解释，如德国的宪法法院\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":77,"gap":false},{"id":"constitution-constitution-25","n":25,"chapter":"第二章 宪法的制定和实施","title":"中国宪法的解释体制、理由及其问题 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">我国由全国人大常委会行使宪法解释权，属于立法机关解释体制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">常委会经常开展工作\u003c/span>，并且熟悉立法和宪法实施情况，便于解释\u003c/li>\u003cli>\u003cspan class=\"blue\">原稿指出，解释启动、审议和公布等程序需要进一步明确\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":81,"gap":false},{"id":"constitution-constitution-26","n":26,"chapter":"第二章 宪法的制定和实施","title":"宪法修改的概念、类型及程序 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">宪法修改是有权机关依照法定程序调整宪法规范\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按范围\u003c/span>，分全面修改和部分修改，我国现行宪法经宪法修正案作部分修改\u003c/li>\u003cli>\u003cspan class=\"blue\">一般经过提案、审议、表决和公布\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":68,"gap":false},{"id":"constitution-constitution-27","n":27,"chapter":"第二章 宪法的制定和实施","title":"中国的宪法修改的体制 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">全国人民代表大会有权修改宪法\u003c/span>\u003c/li>\u003cli>全国人大常委会或五分之一以上的全国人大代表可以提出修宪议案\u003c/li>\u003cli>\u003cspan class=\"blue\">须经全国人大以全体代表三分之二以上的多数经\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":64,"gap":false},{"id":"constitution-constitution-28","n":28,"chapter":"第二章 宪法的制定和实施","title":"合宪性审查的概念 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">合宪性审查是特定机关以宪法为依据，审查有关规范性文件或行使公权力行为是否符合宪法，并依法处理的制度\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":1,"chars":49,"gap":false},{"id":"constitution-constitution-29","n":29,"chapter":"第二章 宪法的制定和实施","title":"合宪性审查的模式 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">立法机关审查，由立法机关判断是否合宪\u003c/span>，如英国的传统模式\u003c/li>\u003cli>\u003cspan class=\"blue\">司法机关审查，由普通法院在案件中审查，如美国\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">专门机关审查，由专门设立的宪法法院等机关审查，如德国\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":75,"gap":false},{"id":"constitution-constitution-30","n":30,"chapter":"第二章 宪法的制定和实施","title":"合宪性审查的方式 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">按是否依附具体案件，分具体审查与抽象审查\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按审查时间，分事先审查与事后审查\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":36,"gap":false},{"id":"constitution-constitution-31","n":31,"chapter":"第二章 宪法的制定和实施","title":"中国宪法监督制度的完善 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">进一步明确全国人大及其常委会等有关机关的监督职责与分工\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">明确法律、法规、规章等规范的审查范围和处理规则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">完善审查启动、审查办理和结果处理程序\u003c/span>，使监督能实际运行\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":77,"gap":false},{"id":"constitution-constitution-32","n":32,"chapter":"第二章 宪法的制定和实施","title":"我国的宪法宣誓制度 ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">宪法宣誓是国家工作人员就职时依法公开宣誓效忠宪法的制度\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">由人大及其常委会选举或决定任命\u003c/span>，及政府、监察委员会、法院、检察院任命等法定人员，按规定组织单独或集体宣誓\u003c/li>\u003cli>\u003cspan class=\"blue\">它有助于树立宪法权威\u003c/span>，督促国家工作人员遵守宪法、依法履职\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":107,"gap":false},{"id":"constitution-constitution-33","n":33,"chapter":"第三章 立法制度","title":"国内正式法律渊源 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">宪法有最高法律效力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国务院制定行政法规\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有权机关可依授权制定经济特区法规等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国务院有关部门制定部门规章\u003c/span>，有权的地方人民政府制定地方政府规章\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":66,"gap":false},{"id":"constitution-constitution-34","n":34,"chapter":"第三章 立法制度","title":"全国人大及其常委会的立法程序 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">提出\u003c/span>\u003cspan class=\"blue\">。政府等法定机关可提案\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">审议\u003c/span>。依法列入议程，经有关会议和专门委员会审议，常委会一般三审\u003c/li>\u003cli>\u003cspan class=\"blue\">表决。由全体代表或全体常委会组成人员过半数经\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">公布。由国家主席签署主席令公布\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":81,"gap":false},{"id":"constitution-constitution-35","n":35,"chapter":"第三章 立法制度","title":"效力的冲突及解决 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">有位阶关系的，上位法优于下位法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">部门规章与地方政府规章冲突，由国务院裁决\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">地方性法规与部门规章不一致\u003c/span>，国务院认为应适用地方性法规的，在该地方适用地方性法规\u003c/li>\u003cli>\u003cspan class=\"blue\">设区的市地方性法规与省级政府规章不一致的\u003c/span>，由省级人大常委会依法处理\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":108,"gap":false},{"id":"constitution-constitution-36","n":36,"chapter":"第三章 立法制度","title":"立法备案 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">有关规范性文件应自公布起三十日内依法报送备案\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行政法规报全国人大常委会\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有批准环节的，按法定主体及渠道报送\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":51,"gap":false},{"id":"constitution-constitution-37","n":37,"chapter":"第三章 立法制度","title":"各类规范性法律文件的改变和撤销 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">全国人大可改变或撤销其常委会不适当的决定\u003c/span>\u003c/li>\u003cli>全国人大常委会可撤销同宪法、法律相抵触的行政法规等下位规范\u003c/li>\u003cli>\u003cspan class=\"blue\">国务院可改变或撤销不适当的部门规章和地方政府规章\u003c/span>\u003c/li>\u003cli>地方人大及其常委会依职权对本级或下级有关规范作改变、撤销等处理\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":104,"gap":false},{"id":"constitution-constitution-38","n":38,"chapter":"第三章 立法制度","title":"全国人大常委会的立法审查（中国宪法监督制度） ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">审查对象包括行政法规、地方性法规、自治条例和单行条例、有关授权立法、司法解释等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">可以主动审查、专项审查\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">发现与宪法或法律抵触的，先沟通、提出书面审查意见\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":74,"gap":false},{"id":"constitution-constitution-39","n":39,"chapter":"第三章 立法制度","title":"国务院的立法审查程序 ★","body":"\u003cp class=\"gap\">原资料未提供此项完整正文，保留位置供补充。\u003c/p>","memory":"","understanding":"\u003cp>原资料未提供此项完整正文，保留位置供补充。\u003c/p>","count":0,"chars":0,"gap":true},{"id":"constitution-constitution-40","n":40,"chapter":"第三章 立法制度","title":"2023年《立法法》修改的内容及意义总结 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">明确全国人大可授权常委会制定有关法律，将法律保留中的仲裁制度改为仲裁基本制度\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">完善合宪性审查和备案审查\u003c/span>，紧急法律案可依法一次审议后交付表决\u003c/li>\u003cli>\u003cspan class=\"blue\">建立基层立法联系点\u003c/span>，完善设区的市立法权限和区域协同立法\u003c/li>\u003cli>这些修改有利于提高立法质量、扩大公众参与、维护法制统一\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":122,"gap":false},{"id":"constitution-constitution-41","n":41,"chapter":"第四章 国家基本制度","title":"国家性质的概念和地位 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国家性质又称国体，说明各阶级在国家中的地位，主要看谁掌握国家权力、依靠谁\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国体是国家制度的核心\u003c/span>，决定政权组织形式，政权组织形式也反作用于国体\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":69,"gap":false},{"id":"constitution-constitution-42","n":42,"chapter":"第四章 国家基本制度","title":"人民民主专政的概念与实质 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">我国是工人阶级领导的、以工农联盟为基础的人民民主专政的社会主义国家\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">对人民实行民主\u003c/span>，对破坏国家制度和社会秩序的敌对势力依法实行专政\u003c/li>\u003cli>\u003cspan class=\"blue\">人民民主专政实质上是无产阶级专政，并体现我国具体国情\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":90,"gap":false},{"id":"constitution-constitution-43","n":43,"chapter":"第四章 国家基本制度","title":"人民民主专政的阶级结构 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">工人阶级是领导力量，工农联盟是阶级基础\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">知识分子是工人阶级的一部分，是社会主义建设的依靠力量\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">广泛的爱国统一战线是人民民主专政的重要特色\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":66,"gap":false},{"id":"constitution-constitution-44","n":44,"chapter":"第四章 国家基本制度","title":"爱国统一战线的范围和特征 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">爱国统一战线包括全体社会主义劳动者、社会主义事业的建设者、拥护社会主义的爱国者、拥护祖国统一的爱国者、致力于中华民族伟大复兴的爱国者\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">它由中国共产党领导，以爱国为共同基础，有广泛性\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":89,"gap":false},{"id":"constitution-constitution-45","n":45,"chapter":"第四章 国家基本制度","title":"中国的所有制形式 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">公有制经济包括全民所有制、劳动群众集体所有制，及混合所有制经济中的国有和集体成分\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">非公有制经济包括个体经济、私营经济等\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":58,"gap":false},{"id":"constitution-constitution-46","n":46,"chapter":"第四章 国家基本制度","title":"中国的基本经济制度和分配制度 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">我国在社会主义初级阶段坚持公有制为主体、多种所有制经济共同发展\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">坚持按劳分配为主体、多种分配方式并存\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">实行社会主义市场经济\u003c/span>，以市场配置资源，并依法实行宏观调控\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":77,"gap":false},{"id":"constitution-constitution-47","n":47,"chapter":"第四章 国家基本制度","title":"中国各种所有制经济的地位、国家保护政策 ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">国有经济是国民经济中的主导力量，国家保障其巩固和发展\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">集体经济是公有制经济的重要组成部分\u003c/span>，国家保护其合法权益并帮助发展\u003c/li>\u003cli>\u003cspan class=\"blue\">非公有制经济是社会主义市场经济的重要组成部分\u003c/span>，国家保护其合法权益，鼓励、支持和引导发展，并依法监督管理\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":109,"gap":false},{"id":"constitution-constitution-48","n":48,"chapter":"第四章 国家基本制度","title":"中国公有制经济的所有权归属 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">矿藏、水流和城市土地属于国家所有\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">森林、山岭、草原、荒地、滩涂等原则上属于国家所有\u003c/span>，法律规定属于集体所有的除外\u003c/li>\u003cli>\u003cspan class=\"blue\">农村和城市郊区的土地\u003c/span>，除法律规定属于国家的外，属于集体所有\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":83,"gap":false},{"id":"constitution-constitution-49","n":49,"chapter":"第四章 国家基本制度","title":"《宪法》对土地所有权和国家土地管理政策的规定 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">城市土地属国家所有，农村和城市郊区土地原则上属集体所有，法律另有规定的除外\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">为公共利益需要，国家可依法征收或征用土地并给予补偿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">禁止非法转让土地\u003c/span>，土地使用权可依法转让，使用者须合理利用土地\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":92,"gap":false},{"id":"constitution-constitution-50","n":50,"chapter":"第四章 国家基本制度","title":"《宪法》对集体经济的规定 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">农村集体经济实行以家庭承包经营为基础、统分结合的双层经营体制，生产、供销、信用等合作经济属集体所有制经济\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">城镇各行业中的合作经济也属集体所有制经济\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国家保护城乡集体经济组织合法权益\u003c/span>，鼓励、指导和帮助其发展\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":100,"gap":false},{"id":"constitution-constitution-51","n":51,"chapter":"第四章 国家基本制度","title":"“五个文明”的协调发展 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">物质文明提供发展基础，政治文明提供制度保障，精神文明提供思想动力，社会文明体现民生和社会进步，生态文明保障可持续发展\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":1,"chars":58,"gap":false},{"id":"constitution-constitution-52","n":52,"chapter":"第四章 国家基本制度","title":"物质文明的含义 ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">物质文明是人类改造自然形成的物质成果，表现为生产力进步与物质生活改善\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">发展生产、推动科技进步、改善生活\u003c/span>，可以提升物质文明水平\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":61,"gap":false},{"id":"constitution-constitution-53","n":53,"chapter":"第四章 国家基本制度","title":"国家改善人民物质和文化生活在《宪法》中的规定 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国家合理安排积累和消费，兼顾国家、集体和个人的利益，在发展生产的基础上逐步改善人民的物质生活和文化生活\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":1,"chars":51,"gap":false},{"id":"constitution-constitution-54","n":54,"chapter":"第四章 国家基本制度","title":"政治文明的含义 ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">社会主义政治文明的本质是人民民主\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">坚持党的领导、人民当家作主、依法治国有机统一\u003c/span>，分别体现政治保障、根本要求和治国方式\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":57,"gap":false},{"id":"constitution-constitution-55","n":55,"chapter":"第四章 国家基本制度","title":"精神文明的含义 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">精神文明包括文化教育建设和思想道德建设\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">推动教育、科学、文化、卫生、体育等事业发展\u003c/span>，提高全社会文化素质\u003c/li>\u003cli>\u003cspan class=\"blue\">开展理想、道德、文化、纪律和法治教育\u003c/span>，培育和践行社会主义核心价值观\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":83,"gap":false},{"id":"constitution-constitution-56","n":56,"chapter":"第四章 国家基本制度","title":"社会文明的含义 ★  ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">社会文明是社会建设取得的成果和社会进步的程度\u003c/span>\u003c/p>\u003col>\u003cli>包括社会主体、社会观念、社会行为、社会制度和社会关系五个方面，既看人怎样与他人相处，也看制度能否保障社会有序运行\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":78,"gap":false},{"id":"constitution-constitution-57","n":57,"chapter":"第四章 国家基本制度","title":"加强社会文明建设的要求 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">完善教育体系，促进受教育机会公平\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">完善医疗卫生服务和社会保障体系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">促进就业，完善收入分配制度\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">改进社会治理和公共服务，提升民生保障水平\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":64,"gap":false},{"id":"constitution-constitution-58","n":58,"chapter":"第四章 国家基本制度","title":"生态文明的含义 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">生态文明是遵循人与自然、社会和谐发展规律取得的物质和精神成果\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">基本要求是尊重、顺应和保护自然\u003c/span>，节约资源、保护环境，推动绿色发展\u003c/li>\u003cli>\u003cspan class=\"blue\">宪法规定国家保护和改善生活环境、生态环境\u003c/span>，防治污染和其他公害\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":92,"gap":false},{"id":"constitution-constitution-59","n":59,"chapter":"第四章 国家基本制度","title":"政权组织形式的概念、类型和地位 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">政权组织形式又称政体，是组织和实现国家权力的方式及机关体系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主要有君主制和共和制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国体决定政体，政体反作用于国体\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":54,"gap":false},{"id":"constitution-constitution-60","n":60,"chapter":"第四章 国家基本制度","title":"人民代表大会制度的概念和特征 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">人民代表大会制度是我国的根本政治制度\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">人民依法选举代表组成各级人大\u003c/span>，各级人大产生有关国家机关，这些机关对人大负责、受人大监督\u003c/li>\u003cli>\u003cspan class=\"blue\">人大对人民负责、受人民监督，依法实行民主集中制\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":84,"gap":false},{"id":"constitution-constitution-61","n":61,"chapter":"第四章 国家基本制度","title":"人民代表大会制度是中国的根本政治制度 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">它直接体现人民民主专政的国家性质\u003c/span>\u003c/li>\u003cli>它把国家的一切权力属于人民落实到人民选举代表、经人大管理国家事务的制度中\u003c/li>\u003cli>\u003cspan class=\"blue\">它是国家机关组织运行和其他相关政治制度的基础\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":74,"gap":false},{"id":"constitution-constitution-62","n":62,"chapter":"第四章 国家基本制度","title":"人民代表大会制度的组织原则——民主集中制 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">人民代表大会制度实行民主集中制\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":1,"chars":15,"gap":false},{"id":"constitution-constitution-63","n":63,"chapter":"第四章 国家基本制度","title":"民主集中制在《宪法》中的规定 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">全国人大和地方各级人大由民主选举产生，对人民负责，受人民监督\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行政机关、监察机关、审判机关和检察机关由人大产生\u003c/span>，对人大负责，受人大监督\u003c/li>\u003cli>\u003cspan class=\"blue\">中央和地方职权的划分\u003c/span>，遵循中央统一领导下充分发挥地方主动性、积极性的原则\u003c/li>\u003cli>\u003cspan class=\"blue\">各机关在依法分工的基础上协调工作\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":118,"gap":false},{"id":"constitution-constitution-64","n":64,"chapter":"第四章 国家基本制度","title":"人民代表大会制度的优越性及完善 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">优越性是保障人民当家作主、使国家权力统一有效行使，并在中央领导下发挥地方积极性\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">完善方向包括坚持党的领导\u003c/span>，完善人大制度及其程序，加强人大自身建设，提高代表履职和人大监督实效\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":85,"gap":false},{"id":"constitution-constitution-65","n":65,"chapter":"第四章 国家基本制度","title":"选举制度的概念和功能 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">选举制度是如何产生代表机关的代表和有关国家工作人员的原则、程序和方法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">它让公民参与国家管理\u003c/span>，为代表机关取得民主基础，也使选民和原选举单位能监督代表\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":72,"gap":false},{"id":"constitution-constitution-66","n":66,"chapter":"第四章 国家基本制度","title":"选举的普遍性原则 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">凡年满十八周岁的中国公民，原则上都有选举权和被选举权，不因民族、性别、财产、教育程度等而受区别\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法被剥夺政治权利的人除外\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":60,"gap":false},{"id":"constitution-constitution-67","n":67,"chapter":"第四章 国家基本制度","title":"选举权的平等性原则 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">选民在选举中的法律地位平等，依法受到同等对待\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">一人只有一个投票权，每票效力平等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">城乡按相同人口比例分配代表名额\u003c/span>，同时依法保障各地区、各民族和各方面有适当数量的代表\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":79,"gap":false},{"id":"constitution-constitution-68","n":68,"chapter":"第四章 国家基本制度","title":"直接选举与间接选举并用原则 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">直接选举由选民直接投票，适用于县、不设区的市、市辖区及乡镇等层级\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">间接选举由下一级人大选举上一级人大代表\u003c/span>，适用于全国、省级、设区的市和自治州等层级\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":72,"gap":false},{"id":"constitution-constitution-69","n":69,"chapter":"第四章 国家基本制度","title":"选举主持人 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">直接选举由选举委员会主持，县级人大常委会领导本级和乡级选举委员会的工作\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">间接选举由相应级别人大常委会主持本级人大代表的选举\u003c/span>，下一级人大会议的主席团主持会议投票\u003c/li>\u003cli>\u003cspan class=\"blue\">港澳全国人大代表选举按专门办法，由全国人大常委会主持\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":104,"gap":false},{"id":"constitution-constitution-70","n":70,"chapter":"第四章 国家基本制度","title":"差额选举原则 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">差额选举是候选人数多于应选名额\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">直接选举的候选人数应多于应选名额三分之一至一倍\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">任期内代表出缺补选时，候选人数可以多于或等于应选名额\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":64,"gap":false},{"id":"constitution-constitution-71","n":71,"chapter":"第四章 国家基本制度","title":"秘密投票原则 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">人大代表选举一律采用无记名投票，并设置秘密写票处\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不能写选票的选民可委托信任的人代写\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":41,"gap":false},{"id":"constitution-constitution-72","n":72,"chapter":"第四章 国家基本制度","title":"选民名单公布及救济 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">选民名单须在选举日二十日前公布\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">对名单有异议的\u003c/span>，自公布起五日内向选举委员会申诉，委员会应在三日内处理\u003c/li>\u003cli>\u003cspan class=\"blue\">不服处理决定的，可在选举日五日以前向人民法院起诉\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":73,"gap":false},{"id":"constitution-constitution-73","n":73,"chapter":"第四章 国家基本制度","title":"选区划分 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">选区可以按居住状况划分，也可以按生产单位、事业单位、工作单位划分\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">每个选区选一至三名代表\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">本行政区域各选区每一代表所代表的人口数应大体相等\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":67,"gap":false},{"id":"constitution-constitution-74","n":74,"chapter":"第四章 国家基本制度","title":"选民登记 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">经登记确认的选民资格长期有效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不能行使选举权的精神病患者\u003c/span>，经选举委员会确认，不列入选民名单\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":44,"gap":false},{"id":"constitution-constitution-75","n":75,"chapter":"第四章 国家基本制度","title":"提名主体和范围 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">各政党、各人民团体可单独或联合推荐，选民或代表十人以上亦可联名推荐\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">推荐人数不得超过本选区或选举单位的应选名额\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":54,"gap":false},{"id":"constitution-constitution-76","n":76,"chapter":"第四章 国家基本制度","title":"候选人名单的确定 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">直选在选举日十五日前公布初步名单，七日前公布正式名单\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">间选提名、酝酿时间不得少于两天\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":41,"gap":false},{"id":"constitution-constitution-77","n":77,"chapter":"第四章 国家基本制度","title":"候选人介绍 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">推荐者应介绍所推荐的候选人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">直选可组织候选人与选民见面、回答问题\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":31,"gap":false},{"id":"constitution-constitution-78","n":78,"chapter":"第四章 国家基本制度","title":"投票形式和当选比例 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">直选可设投票站、召开选举大会或使用流动票箱\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">直选由选区全体选民过半数参加才有效\u003c/span>，候选人获参加投票选民过半数方可当选\u003c/li>\u003cli>\u003cspan class=\"blue\">另行选举按得票多少当选\u003c/span>，直选得票不得少于选票的三分之一，间选仍须全体代表过半数\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":95,"gap":false},{"id":"constitution-constitution-79","n":79,"chapter":"第四章 国家基本制度","title":"代表当选的确认 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">选举委员会或人大主席团依法判断选举结果是否有效并宣布结果\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">代表资格审查委员会审查当选代表资格\u003c/span>，提出报告，由有权机关确认并公布\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":61,"gap":false},{"id":"constitution-constitution-80","n":80,"chapter":"第四章 国家基本制度","title":"选举委员会的职责 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">划分选区、分配代表名额，确定选举日期\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">登记并核查选民，公布名单、处理异议\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">确定并组织介绍候选人，主持投票\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">确认并公布选举结果和其他选举信息，办理法定其他事项\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":75,"gap":false},{"id":"constitution-constitution-81","n":81,"chapter":"第四章 国家基本制度","title":"代表的补选 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">代表任期内出缺，由原选区或原选举单位补选\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">县级以上地方人大闭会期间\u003c/span>，其常委会可依法补选上一级人大代表\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":49,"gap":false},{"id":"constitution-constitution-82","n":82,"chapter":"第四章 国家基本制度","title":"代表的罢免 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">直选代表罢免由原选区选民提出，县级五十人以上、乡级三十人以上联名\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">采用无记名投票。直选罢免须原选区全体选民过半数经\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":56,"gap":false},{"id":"constitution-constitution-83","n":83,"chapter":"第四章 国家基本制度","title":"代表的辞职 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">代表可书面提出辞职\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">经相应机关全体组成人员或全体代表过半数经\u003c/span>，并依法备案、公告\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":38,"gap":false},{"id":"constitution-constitution-84","n":84,"chapter":"第四章 国家基本制度","title":"代表职务的暂停与终止 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">涉刑被羁押，或依法被判处管制、拘役、有期徒刑且未被剥夺政治权利、正在服刑的，暂时停止执行代表职务\u003c/span>\u003c/li>\u003cli>迁出或调离本行政区域、辞职获准、未经批准两次缺席本级人大会议、被罢免、丧失中国国籍、依法被剥夺政治权利或丧失行为能力等，代表资格终止\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":114,"gap":false},{"id":"constitution-constitution-85","n":85,"chapter":"第四章 国家基本制度","title":"对选举的破坏 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">以金钱财物贿赂，使用暴力、威胁、欺骗，伪造文件、虚报票数，或打击报复控告、检举者等，属于破坏选举\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法给予治安管理处罚或追究刑事责任\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":65,"gap":false},{"id":"constitution-constitution-86","n":86,"chapter":"第四章 国家基本制度","title":"2025年《全国人民代表大会和地方各级人民代表大会代表法》的重要修改及其意义总结（超纲补充） ★  ★","body":"\u003cp class=\"gap\">原资料未提供此项完整正文，保留位置供补充。\u003c/p>","memory":"","understanding":"\u003cp>原资料未提供此项完整正文，保留位置供补充。\u003c/p>","count":0,"chars":0,"gap":true},{"id":"constitution-constitution-87","n":87,"chapter":"第四章 国家基本制度","title":"政党的概念和特征 ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">政党是由一定阶级或阶层的积极分子组成、为取得、掌握或影响国家政权而活动的政治组织\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">它有共同的政治纲领、一定组织纪律，并持续组织政治活动\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":66,"gap":false},{"id":"constitution-constitution-88","n":88,"chapter":"第四章 国家基本制度","title":"政党制度的概念和类型 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">政党制度规定政党怎样参与政治、与政权怎样联系及政党之间怎样相处\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按社会制度，可分资本主义和社会主义政党制度\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":52,"gap":false},{"id":"constitution-constitution-89","n":89,"chapter":"第四章 国家基本制度","title":"政党与近代民主政治 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">政党是近代民主政治发展的产物\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">政党使选举、议会活动和政治竞争更有组织\u003c/span>，也推动了近代民主政治的发展\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":47,"gap":false},{"id":"constitution-constitution-90","n":90,"chapter":"第四章 国家基本制度","title":"中国政党制度的概念和内容 ★  ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">我国实行中国共产党领导的多党合作和政治协商制度，是一项基本政治制度\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">中国共产党是执政党，各民主党派是参政党\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">经政治协商、参政议政、民主监督等方式开展合作\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":74,"gap":false},{"id":"constitution-constitution-91","n":91,"chapter":"第四章 国家基本制度","title":"中国人民政治协商会议的性质和主要职能 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">中国人民政治协商会议是中国人民爱国统一战线的组织，是中国共产党领导的多党合作和政治协商的重要机构\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主要职能是政治协商、民主监督、参政议政\u003c/span>，履职主要经协商、建议和批评\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":81,"gap":false},{"id":"constitution-constitution-92","n":92,"chapter":"第四章 国家基本制度","title":"国家结构形式的概念和类型 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国家结构形式说明国家整体与组成部分、中央与地方之间怎样分权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">单一制由统一的中央领导，地方职权依据中央法律确定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">联邦制由联邦与成员组成\u003c/span>，依联邦宪法划分职权，联邦和成员分别设有机关并在权限内立法\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":93,"gap":false},{"id":"constitution-constitution-93","n":93,"chapter":"第四章 国家基本制度","title":"中国的国家结构形式、形成原因 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">我国是统一的多民族国家，实行单一制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">长期形成的统一国家传统、各民族共同缔造国家的历史\u003c/span>，及维护国家统一、民族团结和协调发展的需要，决定了该选择\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":69,"gap":false},{"id":"constitution-constitution-94","n":94,"chapter":"第四章 国家基本制度","title":"中国的行政区划变更的法律程序 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">全国人大批准省、自治区、直辖市的建置\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国务院批准省、自治区、直辖市的区域划分\u003c/span>，及自治州、县、自治县、市的建置和区域划分\u003c/li>\u003cli>\u003cspan class=\"blue\">省、直辖市人民政府决定乡、民族乡、镇的建置和区域划分\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":84,"gap":false},{"id":"constitution-constitution-95","n":95,"chapter":"第四章 国家基本制度","title":"民族区域自治的概念及其特征 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">民族区域自治是在国家统一领导下，在少数民族聚居的地方设立自治地方和自治机关，依法行使自治权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">它以少数民族聚居为基础\u003c/span>，以宪法和法律为依据，自治地方是国家不可分离的部分\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":81,"gap":false},{"id":"constitution-constitution-96","n":96,"chapter":"第四章 国家基本制度","title":"民族区域自治的优越性 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">将国家统一与民族自治结合起来，维护国家整体利益和各民族合法权益\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">符合少数民族聚居与散居并存的实际\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">便于因地制宜发展经济文化，巩固民族平等、团结与互助\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":72,"gap":false},{"id":"constitution-constitution-97","n":97,"chapter":"第四章 国家基本制度","title":"民族关系在《宪法》中的规定 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">各民族一律平等，国家保障少数民族合法权益，维护平等团结互助和谐关系，禁止歧视、压迫和破坏民族团结行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国家帮助少数民族地区发展经济和文化\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">少数民族聚居地方实行区域自治\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":81,"gap":false},{"id":"constitution-constitution-98","n":98,"chapter":"第四章 国家基本制度","title":"民族区域自治地方及其类型 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">民族自治地方分为自治区、自治州、自治县三级\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">可由一个少数民族聚居区建立\u003c/span>，也可由多个少数民族聚居区联合建立\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":51,"gap":false},{"id":"constitution-constitution-99","n":99,"chapter":"第四章 国家基本制度","title":"民族自治地方的自治机关、属性及组成特点 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">自治机关是自治区、自治州、自治县的人大和人民政府，兼具一般地方国家机关职权与自治权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">本级人大代表中\u003c/span>，实行区域自治的民族和其他民族应有适当名额\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":69,"gap":false},{"id":"constitution-constitution-100","n":100,"chapter":"第四章 国家基本制度","title":"民族自治地方自治机关的自治权 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">自治机关可依法制定自治条例和单行条例，并按程序报批\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不适合当地实际的上级决定、命令等\u003c/span>，依法报批后可变通执行或停止执行\u003c/li>\u003cli>\u003cspan class=\"blue\">在法定权限内管理财政、经济建设和科教文卫等事务\u003c/span>，经国务院批准可组织维护社会治安的公安部队\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":101,"gap":false},{"id":"constitution-constitution-101","n":101,"chapter":"第四章 国家基本制度","title":"特别行政区的概念、特征与地位 ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">特别行政区是国家依宪法和法律设立、实行特别制度的地方行政区域，直辖于中央人民政府\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">特区内实行的制度由全国人大以法律规定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">特区依法享有高度自治权\u003c/span>，基本法规定原有资本主义制度和生活方式五十年不变\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":93,"gap":false},{"id":"constitution-constitution-102","n":102,"chapter":"第四章 国家基本制度","title":"中央对特别行政区行使的权力 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">中央管理与特别行政区有关外交和防务，依法决定有关紧急状态\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">中央人民政府任命行政长官和行政机关主要官员\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">全国人大常委会依法解释基本法，全国人大依法修改基本法\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":75,"gap":false},{"id":"constitution-constitution-103","n":103,"chapter":"第四章 国家基本制度","title":"特别行政区的高度自治权 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">特别行政区依法享有行政管理权、立法权、独立的司法权和终审权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">特区可依法自行管理本地事务\u003c/span>，并按基本法和中央授权处理有关对外事务\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":61,"gap":false},{"id":"constitution-constitution-104","n":104,"chapter":"第四章 国家基本制度","title":"特别行政区的行政主导 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">行政长官是特别行政区首长，代表特区并领导政府\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">政府提出法案、预算案等重要议案，政府议案优先列入议程\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行政长官可依法将法案发回重议，在法定条件下解散立法会\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":74,"gap":false},{"id":"constitution-constitution-105","n":105,"chapter":"第四章 国家基本制度","title":"特别行政区行政与立法之间的关系 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">制约\u003c/span>。以香港为例，涉政府政策的议员法案须经行政长官书面同意\u003c/li>\u003cli>\u003cspan class=\"blue\">立法会以全体议员三分之二以上再经\u003c/span>，长官须在一个月内签署或依法处理\u003c/li>\u003cli>\u003cspan class=\"blue\">重选的立法会仍坚持原决定，符合条件的长官须辞职\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">配合。政府提案，立法会审议，行政长官签署公布\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":106,"gap":false},{"id":"constitution-constitution-106","n":106,"chapter":"第四章 国家基本制度","title":"特别行政区的司法独立 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">特别行政区享有独立司法权和终审权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">各级法院依法独立审判，司法人员履行审判职责不受干涉\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律规定的国防、外交等国家行为不属特区法院管辖\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":64,"gap":false},{"id":"constitution-constitution-107","n":107,"chapter":"第四章 国家基本制度","title":"特别行政区官员的任职条件 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">行政长官：本区永久居民中的中国公民，满40岁、通常连续居住20年\u003c/span>；香港另须在外国无居留权\u003c/li>\u003cli>\u003cspan class=\"blue\">主要官员通常居住15年，国籍等依基本法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">立法会主席\u003c/span>：香港40岁、居住20年且无外国居留权；澳门按其基本法，不可直接套香港条件\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":105,"gap":false},{"id":"constitution-constitution-108","n":108,"chapter":"第四章 国家基本制度","title":"特别行政区的行政机关 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">特区政府是特区的行政机关，依法对立法会负责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行政长官是特区首长\u003c/span>，代表特区，对中央人民政府和特区负责，由本地选举或协商产生并由中央人民政府任命\u003c/li>\u003cli>政府负责执行法律、制定政策、提出预算和法案、管理行政事务\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":97,"gap":false},{"id":"constitution-constitution-109","n":109,"chapter":"第四章 国家基本制度","title":"特别行政区的立法机关 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">立法会是特区立法机关，依法组成\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主要职权包括制定、修改和废除法律\u003c/span>，审核和经财政预算，批准税收和公共开支，听取施政报告并质询，按法定程序提出弹劾案\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":71,"gap":false},{"id":"constitution-constitution-110","n":110,"chapter":"第四章 国家基本制度","title":"特别行政区的审判机关 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">特别行政区各级法院行使审判权，设终审法院\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">香港还设高等法院、区域法院、裁判署法庭等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法官依据司法和专业才能选用，由行政长官按法定程序任命\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":66,"gap":false},{"id":"constitution-constitution-111","n":111,"chapter":"第四章 国家基本制度","title":"特别行政区的检察机关 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">香港由律政司主管刑事检察工作，不受任何干涉\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">澳门检察院独立行使检察职能\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":34,"gap":false},{"id":"constitution-constitution-112","n":112,"chapter":"第四章 国家基本制度","title":"基层群众性自治组织的概念及特征 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">居民委员会、村民委员会是在一定居住区域设立、由居民或村民依法选举产生的基层群众性自治组织\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有基层性、群众性和自治性\u003c/span>，实行自我管理、自我教育、自我服务、自我监督，依法开展自治\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":85,"gap":false},{"id":"constitution-constitution-113","n":113,"chapter":"第四章 国家基本制度","title":"基层群众自治制度的问题与完善 ★  ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">常见问题是人员能力不足、经费不足、自治地位不明确或承接过多非自治事项\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">完善方向是加强人员培训和经费保障\u003c/span>，明确自治与协助事项的边界，健全议事、公开和群众监督制度\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":78,"gap":false},{"id":"constitution-constitution-114","n":114,"chapter":"第四章 国家基本制度","title":"居民委员会、村民委员会的性质与设立 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">居民委员会、村民委员会是基层群众性自治组织\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">居委会按便于居民自治的原则设置\u003c/span>，设立、撤销和规模调整由有关地方政府依法决定\u003c/li>\u003cli>\u003cspan class=\"blue\">村委会按村民居住状况、人口等设置\u003c/span>，由乡镇政府提出，经村民会议讨论同意后报县级政府批准\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":100,"gap":false},{"id":"constitution-constitution-115","n":115,"chapter":"第四章 国家基本制度","title":"居民委员会、村民委员会与其他主体的关系 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">社区或村党组织领导和支持居委会、村委会依法行使职权，保障群众自治\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">基层政府及其派出机关给予指导、支持和帮助\u003c/span>，居委会、村委会依法协助有关工作\u003c/li>\u003cli>\u003cspan class=\"blue\">两委向相应居民或村民会议、代表会议负责并报告工作\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":92,"gap":false},{"id":"constitution-constitution-116","n":116,"chapter":"第四章 国家基本制度","title":"居民委员会、村民委员会的组成与下设机构 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">居委会由主任、副主任和委员共五至九人组成，村委会由主任、副主任和委员共三至七人组成\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">成员由群众依法选举，任期五年\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":55,"gap":false},{"id":"constitution-constitution-117","n":117,"chapter":"第四章 国家基本制度","title":"居民委员会、村民委员会的下设委员会与小组 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">两委可按需要设人民调解、治安保卫、公共卫生等委员会\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">两委可分设居民小组或村民小组，组长依法推选产生\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":48,"gap":false},{"id":"constitution-constitution-118","n":118,"chapter":"第四章 国家基本制度","title":"居民委员会、村民委员会选举的准备活动 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">选举由居民或村民选举委员会主持，其成员依法推选\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法登记年满十八周岁且有选举权的人员\u003c/span>，同一人不得重复登记\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":51,"gap":false},{"id":"constitution-constitution-119","n":119,"chapter":"第四章 国家基本制度","title":"居民委员会、村民委员会选举的提名候选人 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">居委会候选人由社区党组织或十名以上选民联名提名\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">受过刑事处罚等法定不适任人员不得列为候选人\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":44,"gap":false},{"id":"constitution-constitution-120","n":120,"chapter":"第四章 国家基本制度","title":"居民委员会、村民委员会选举规则的对比 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">居委会由全体选民或户代表选举时，过半数参加才有效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">候选人须获投票人员过半数选票\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":38,"gap":false},{"id":"constitution-constitution-121","n":121,"chapter":"第四章 国家基本制度","title":"居民委员会、村民委员会选举后的配套制度 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">罢免须说明理由，被提请者有权申辩\u003c/span>\u003c/li>\u003cli>村委会须五分之一以上有选举权村民或三分之一以上村民代表联名提出\u003c/li>\u003cli>\u003cspan class=\"blue\">成员辞职、职务终止或出缺时，按法定程序办理并组织补选\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":73,"gap":false},{"id":"constitution-constitution-122","n":122,"chapter":"第四章 国家基本制度","title":"居民委员会、村民委员会的选举与罢免总结 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">居委会选举候选人由社区党组织或十名以上选民提名，可由全体选民、户代表或居民代表投票\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">罢免时按主体和比例判断是否有权提出\u003c/span>，再分别核对参投和经的票数\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":71,"gap":false},{"id":"constitution-constitution-123","n":123,"chapter":"第四章 国家基本制度","title":"居民委员会、村民委员会的职责与组织协商 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">两委办理本地区公共事务和公益事业，调解纠纷，协助维护治安，向政府反映群众意见，并依法协助政府工作\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">村委会依法管理集体所有的土地和其他财产，支持合作经济\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">涉及群众利益的公共事项，可组织有关主体协商并推动落实\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":100,"gap":false},{"id":"constitution-constitution-124","n":124,"chapter":"第四章 国家基本制度","title":"居民会议与村民会议 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">居民会议由年满十八周岁的居民或户代表组成\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">由两委召集\u003c/span>，十分之一以上有关群众或三分之一以上代表提议时应召集\u003c/li>\u003cli>\u003cspan class=\"blue\">居民或户代表过半数出席\u003c/span>，村民会议须村民过半数或户代表三分之二以上出席，决定经到会人员过半数经\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":97,"gap":false},{"id":"constitution-constitution-125","n":125,"chapter":"第四章 国家基本制度","title":"居民代表会议与村民代表会议 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">代表会议由两委成员和居民或村民代表组成\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">居民、村民代表至少占组成人员五分之四\u003c/span>\u003c/li>\u003cli>村民代表会议和居民代表会议均须有三分之二以上组成人员参加\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":65,"gap":false},{"id":"constitution-constitution-126","n":126,"chapter":"第四章 国家基本制度","title":"居民委员会、村民委员会的工作保障与责任 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">政府依法为两委开展工作提供经费、场所和培训等保障，公益事业所需经费依法筹集\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">两委成员应依法办事，接受群众监督\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":53,"gap":false},{"id":"constitution-constitution-127","n":127,"chapter":"第四章 国家基本制度","title":"居务监督机构与村务监督机构 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">居民、村民可依法推选相关监督机构，监督居务、村务公开及财务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">村务监督机构应有懂财会或管理的人员\u003c/span>，村委会成员及其近亲属不得担任\u003c/li>\u003cli>\u003cspan class=\"blue\">监督机构向相应群众会议和代表会议负责\u003c/span>，可依法列席有关会议\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":89,"gap":false},{"id":"constitution-constitution-128","n":128,"chapter":"第四章 国家基本制度","title":"居务公开与村务公开 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">居委会、村委会负责公开居务、村务，相关监督机构监督公开\u003c/span>\u003c/li>\u003cli>公开事项包括会议决定及执行情况、财务收支、涉及群众利益的事项等\u003c/li>\u003cli>\u003cspan class=\"blue\">一般事项定期公开，重大事项及时公开\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":75,"gap":false},{"id":"constitution-constitution-129","n":129,"chapter":"第四章 国家基本制度","title":"居务、村务的档案、民主评议与经济审计 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">两委依法建立居务、村务档案，记录选举、会议、财务和公益事务等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">居委会、村委会成员接受民主评议\u003c/span>，通常每年至少一次，由相应监督机构主持\u003c/li>\u003cli>\u003cspan class=\"blue\">依照规定开展任期和离任经济责任审计\u003c/span>，重点核查财务收支、资产管理及项目资金使用\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":102,"gap":false},{"id":"constitution-constitution-130","n":130,"chapter":"第五章 公民的基本权利和义务","title":"公民的概念以及公民与人民的区别 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">公民是有一国国籍的自然人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">公民是法律概念\u003c/span>，可指个人，其权利和义务由宪法、法律规定\u003c/li>\u003cli>\u003cspan class=\"blue\">公民的范围通常比人民广，二者不能相互替代\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":59,"gap":false},{"id":"constitution-constitution-131","n":131,"chapter":"第五章 公民的基本权利和义务","title":"基本权利与人权的概念及区别 ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">人权是人作为人应享有的权利\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">人权为基本权利提供价值依据\u003c/span>，宪法将重要的人权要求转化为可依法保障的基本权利\u003c/li>\u003cli>\u003cspan class=\"blue\">二者在主体、范围和保障形式上有区别\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":67,"gap":false},{"id":"constitution-constitution-132","n":132,"chapter":"第五章 公民的基本权利和义务","title":"公民基本权利的主体 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">公民是宪法基本权利的主要主体\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">外国人、无国籍人依法享有适合其身份的权利\u003c/span>，但一般不享有中国公民特有的政治权利\u003c/li>\u003cli>\u003cspan class=\"blue\">法人能否享有某项基本权利，要看该权利的性质和法律规定\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":78,"gap":false},{"id":"constitution-constitution-133","n":133,"chapter":"第五章 公民的基本权利和义务","title":"公民基本权利限制的概念、形式与原则 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">为解决权利冲突或保护公共利益，宪法和法律可以对基本权利的行使作必要限制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按依据分为宪法限制和法律限制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">限制须明确，公民应能知道界限\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":63,"gap":false},{"id":"constitution-constitution-134","n":134,"chapter":"第五章 公民的基本权利和义务","title":"公民的基本权利（总论） ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">公民的基本权利包括平等权、政治权利和自由、宗教信仰自由、人身自由、财产权、社会文化权利、监督权，及特定群体依法享有的权利\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":1,"chars":60,"gap":false},{"id":"constitution-constitution-135","n":135,"chapter":"第五章 公民的基本权利和义务","title":"平等权的内容及我国《宪法》中的规定 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">公民在法律面前一律平等，平等享有权和履行义务，不得享有特权或受到歧视\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">平等既涉及法律的适用，也涉及法律规则本身\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">基于正当目的、与目的有合理联系且程度适当的区别对待\u003c/span>，可以成立\u003c/li>\u003cli>\u003cspan class=\"blue\">宪法同时规定国家尊重和保障人权\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":99,"gap":false},{"id":"constitution-constitution-136","n":136,"chapter":"第五章 公民的基本权利和义务","title":"政治权利的内容（总论）及我国《宪法》中的规定 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">政治权利是公民参与国家政治生活的权利和自由\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宪法规定公民依法享有选举权和被选举权\u003c/span>，及言论、出版、集会、结社、游行、示威的自由\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":61,"gap":false},{"id":"constitution-constitution-137","n":137,"chapter":"第五章 公民的基本权利和义务","title":"选举权与被选举权 ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">选举权是依法选举代表等人员的权利，被选举权是依法当选的资格和权利\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">年满十八周岁的中国公民\u003c/span>，依法享有选举权和被选举权，不因民族、性别、职业、财产等受到区别\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":75,"gap":false},{"id":"constitution-constitution-138","n":138,"chapter":"第五章 公民的基本权利和义务","title":"言论自由的概念、分类与限制 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">言论自由是公民依法表达意见、传播思想的自由\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按表达方式，可分口头表达、书面表达及其他表达形式\u003c/span>\u003c/li>\u003cli>行使言论自由不得损害国家、社会、集体的利益和其他公民的合法权利，并受法律规定的必要限制\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":88,"gap":false},{"id":"constitution-constitution-139","n":139,"chapter":"第五章 公民的基本权利和义务","title":"出版自由的概念与限制 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">出版自由是公民依法经出版物表达意见和传播思想的自由\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">出版物的制作、出版和传播应遵守法律\u003c/span>，不得损害国家利益、社会公共利益和他人的合法权利\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":66,"gap":false},{"id":"constitution-constitution-140","n":140,"chapter":"第五章 公民的基本权利和义务","title":"集会、游行、示威自由的概念、特征以及限制 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">集会是在露天公共场所聚集表达意愿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">三者属于有共同目的的集体表达\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":30,"gap":false},{"id":"constitution-constitution-141","n":141,"chapter":"第五章 公民的基本权利和义务","title":"结社自由的概念、特征、分类以及限制 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">结社自由是公民依法为共同宗旨组成社会团体的自由\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">既保障个人组建、加入或不加入团体\u003c/span>，也保障团体依法自主活动\u003c/li>\u003cli>\u003cspan class=\"blue\">按宗旨可分政治性结社和非政治性结社\u003c/span>，按目的可分营利性与非营利性结社\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":84,"gap":false},{"id":"constitution-constitution-142","n":142,"chapter":"第五章 公民的基本权利和义务","title":"宗教信仰自由的概念与内容 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">宗教信仰自由是公民按照自己的意愿决定信教或不信教的自由\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">可以选择信仰何种宗教、何种教派，也可以改变信仰\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法参加或不参加宗教活动，正常宗教活动受国家保护\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":74,"gap":false},{"id":"constitution-constitution-143","n":143,"chapter":"第五章 公民的基本权利和义务","title":"宗教信仰自由在《宪法》中的规定 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">公民有宗教信仰自由\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国家保护正常宗教活动\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宗教团体和宗教事务不受外国势力支配\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":36,"gap":false},{"id":"constitution-constitution-144","n":144,"chapter":"第五章 公民的基本权利和义务","title":"人身自由的内容（总论） ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">广义的人身自由包括人身自由不受侵犯、人格尊严不受侵犯、住宅不受侵犯，及通信自由和通信秘密受保护\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":1,"chars":47,"gap":false},{"id":"constitution-constitution-145","n":145,"chapter":"第五章 公民的基本权利和义务","title":"人身自由在《宪法》中的规定 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">公民人身自由不受侵犯\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">禁止非法拘禁和以其他方法非法剥夺、限制人身自由\u003c/span>，禁止非法搜查公民身体\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":44,"gap":false},{"id":"constitution-constitution-146","n":146,"chapter":"第五章 公民的基本权利和义务","title":"公民的人格尊严不受侵犯及《宪法》中的规定 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">公民的人格尊严不受侵犯\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":1,"chars":11,"gap":false},{"id":"constitution-constitution-147","n":147,"chapter":"第五章 公民的基本权利和义务","title":"公民的住宅不受侵犯及《宪法》中的规定 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">公民的住宅不受侵犯\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宪法明令禁止非法搜查或非法侵入公民住宅\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":28,"gap":false},{"id":"constitution-constitution-148","n":148,"chapter":"第五章 公民的基本权利和义务","title":"通信自由和通信秘密及《宪法》中的规定 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">公民的通信自由和通信秘密受法律保护\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">因国家安全或追查刑事犯罪需要\u003c/span>，由公安机关或检察机关依照法定程序检查通信\u003c/li>\u003cli>\u003cspan class=\"blue\">除此以外\u003c/span>，任何组织或个人不得侵犯公民通信自由和通信秘密\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":79,"gap":false},{"id":"constitution-constitution-149","n":149,"chapter":"第五章 公民的基本权利和义务","title":"财产权的内容及在我国《宪法》中的规定 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">财产分为公共财产和私人财产，公共财产包括国有和集体所有财产\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">社会主义公共财产神圣不可侵犯\u003c/span>，公民合法的私有财产不受侵犯\u003c/li>\u003cli>\u003cspan class=\"blue\">为公共利益需要\u003c/span>，国家可依法对私有财产征收或征用，并给予补偿\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":86,"gap":false},{"id":"constitution-constitution-150","n":150,"chapter":"第五章 公民的基本权利和义务","title":"社会文化权利的概念、特点（总论） ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">社会文化权利是公民在社会生活和文化教育领域依法享有的权利\u003c/span>\u003c/li>\u003cli>包括劳动权、休息权、社会保障权、受教育权及科学、文艺等文化活动的自由\u003c/li>\u003cli>\u003cspan class=\"blue\">这类权利往往需要国家经公共服务、制度和资源提供保障\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":87,"gap":false},{"id":"constitution-constitution-151","n":151,"chapter":"第五章 公民的基本权利和义务","title":"劳动权概念及其在《宪法》中的规定 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">劳动权是有劳动能力的公民依法获得劳动机会、参加劳动并取得报酬的权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国家创造劳动就业条件\u003c/span>，加强劳动保护，改善劳动条件，并在发展生产的基础上提高劳动报酬和福利待遇\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":79,"gap":false},{"id":"constitution-constitution-152","n":152,"chapter":"第五章 公民的基本权利和义务","title":"休息权、休假制度及其在《宪法》中的规定 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">休息权是劳动者在劳动外享有休息的权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宪法规定国家发展休息、休养设施\u003c/span>，规定工作时间和休假制度\u003c/li>\u003cli>依法经每日工时、每周休息、法定节假日和带薪年休假等制度保障\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":74,"gap":false},{"id":"constitution-constitution-153","n":153,"chapter":"第五章 公民的基本权利和义务","title":"社会保障权的概念及其在《宪法》中的规定 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">社会保障权是公民在年老、疾病、丧失劳动能力等情形下依法获得帮助的权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宪法规定公民在上述情形下有权从国家和社会获得物质帮助\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国家发展社会保险、社会救济和医疗卫生事业\u003c/span>，依法保障退休人员生活，并扶助残疾公民\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":99,"gap":false},{"id":"constitution-constitution-154","n":154,"chapter":"第五章 公民的基本权利和义务","title":"文化教育权及其在《宪法》中的规定 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">公民有受教育的权利和义务，国家依法发展教育事业\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">公民有科学研究、文学艺术创作和其他文化活动的自由\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国家对有益于人民的创造性工作给予鼓励和帮助\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":68,"gap":false},{"id":"constitution-constitution-155","n":155,"chapter":"第五章 公民的基本权利和义务","title":"公民监督权的内容及其在《宪法》的规定 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">公民有权对国家机关和工作人员提出批评、建议，对违法失职行为提出申诉、控告或检举\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不得捏造或歪曲事实进行诬告陷害\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">因国家机关或工作人员侵犯权利而受到损失的\u003c/span>，依法有取得赔偿的权利\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":85,"gap":false},{"id":"constitution-constitution-156","n":156,"chapter":"第五章 公民的基本权利和义务","title":"特定群体的权利（总论） ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">特定群体在基本权利的一般保障外，依法享有针对其处境的特别保护\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宪法保护妇女、母亲、儿童、老年人及残疾公民等的权益\u003c/span>，也保护华侨、归侨和侨眷，并依法保障残疾军人、烈士家属等\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":83,"gap":false},{"id":"constitution-constitution-157","n":157,"chapter":"第五章 公民的基本权利和义务","title":"保护妇女权益在我国《宪法》的规定 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">妇女在政治、经济、文化、社会和家庭生活等方面享有同男子平等的权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国家保护妇女的权利和利益\u003c/span>，实行男女同工同酬，培养和选拔妇女干部\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":63,"gap":false},{"id":"constitution-constitution-158","n":158,"chapter":"第五章 公民的基本权利和义务","title":"保护婚姻、家庭、母亲和儿童在《宪法》中的规定 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">婚姻、家庭、母亲和儿童受国家保护\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">父母有抚养教育未成年子女的义务\u003c/span>，成年子女有赡养扶助父母的义务\u003c/li>\u003cli>\u003cspan class=\"blue\">禁止破坏婚姻自由，禁止虐待老人、妇女和儿童\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":67,"gap":false},{"id":"constitution-constitution-159","n":159,"chapter":"第五章 公民的基本权利和义务","title":"保护华侨、归侨和侨眷权利和利益在《宪法》中的规定 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国家保护华侨的正当权利和利益\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国家保护归侨和侨眷的合法权利和利益\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":31,"gap":false},{"id":"constitution-constitution-160","n":160,"chapter":"第五章 公民的基本权利和义务","title":"公民的基本义务的内容（总论） ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">公民有遵守宪法和法律、维护国家统一与民族团结、维护祖国安全荣誉和利益、依法服兵役和参加民兵组织、依法纳税等义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">劳动和受教育既是权利也是义务\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":69,"gap":false},{"id":"constitution-constitution-161","n":161,"chapter":"第五章 公民的基本权利和义务","title":"维护国家统一和民族团结 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">公民有维护国家统一和全国各民族团结的义务\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":1,"chars":20,"gap":false},{"id":"constitution-constitution-162","n":162,"chapter":"第五章 公民的基本权利和义务","title":"遵守宪法和法律 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">公民须遵守宪法和法律，并保守国家秘密、爱护公共财产、遵守劳动纪律、遵守公共秩序、尊重社会公德\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":1,"chars":46,"gap":false},{"id":"constitution-constitution-163","n":163,"chapter":"第五章 公民的基本权利和义务","title":"维护祖国安全、荣誉和利益的概念和内容 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">公民有维护祖国安全、荣誉和利益的义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">安全包括维护国家主权、统一和领土完整\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">公民不得有危害祖国安全、荣誉和利益行为\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":55,"gap":false},{"id":"constitution-constitution-164","n":164,"chapter":"第五章 公民的基本权利和义务","title":"依法服兵役和参加民兵组织 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">保卫祖国、抵抗侵略是每个中国公民的神圣职责\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":1,"chars":21,"gap":false},{"id":"constitution-constitution-165","n":165,"chapter":"第五章 公民的基本权利和义务","title":"依法纳税 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">公民有依照法律纳税的义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">税收是国家依法取得财政收入的方式\u003c/span>，有强制性、无偿性和固定性\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":41,"gap":false},{"id":"constitution-constitution-166","n":166,"chapter":"第六章 国家机构","title":"国家机构的概念和特点 ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">国家机构是国家为实现其职能建立的国家机关总和\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">它有阶级性、历史性和特殊的强制性\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">它还有组织性和协调性\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":48,"gap":false},{"id":"constitution-constitution-167","n":167,"chapter":"第六章 国家机构","title":"党的领导原则 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">中国共产党领导是中国特色社会主义最本质的特征\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">党的领导贯穿国家机构各方面\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":35,"gap":false},{"id":"constitution-constitution-168","n":168,"chapter":"第六章 国家机构","title":"民主集中制原则 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">民主集中制把民主讨论、选举和监督与统一决策、执行结合起来\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国家权力机关由民主选举产生，对人民负责、受人民监督\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">中央统一领导与发挥地方主动性相结合\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":70,"gap":false},{"id":"constitution-constitution-169","n":169,"chapter":"第六章 国家机构","title":"责任制原则 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国家机关及其工作人员应对决定、行使职权和履行职责的结果负责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">人大对人民负责，有关国家机关依法对人大及其常委会负责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">各机关根据职权性质依法实行相应集体负责或个人负责制度\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":81,"gap":false},{"id":"constitution-constitution-170","n":170,"chapter":"第六章 国家机构","title":"法治原则的内容及主要表现 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国家机关依法设立，在法定权限和程序内履职，接受法律监督\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">立法应符合宪法和法律\u003c/span>，行政机关须依法行政，审判、检察机关依法独立行使职权\u003c/li>\u003cli>\u003cspan class=\"blue\">任何组织和个人都不得有超越宪法和法律的特权\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":84,"gap":false},{"id":"constitution-constitution-171","n":171,"chapter":"第六章 国家机构","title":"精简原则、工作责任制及联系群众原则 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国家机关应实行精简原则，减少不必要的机构和环节\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">实行工作责任制和工作人员培训、考核制度\u003c/span>，提高工作质量和效率\u003c/li>\u003cli>\u003cspan class=\"blue\">国家机关和工作人员应联系群众、听取意见和建议\u003c/span>，接受监督，为人民服务\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":85,"gap":false},{"id":"constitution-constitution-172","n":172,"chapter":"第六章 国家机构","title":"各级人民代表大会的性质、组成及任期 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">全国人大是最高国家权力机关，地方各级人大是地方国家权力机关\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">各级人大由依法选举产生的代表组成\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">各级人大每届任期五年\u003c/span>，全国人大遇法定特殊情况可依程序推迟选举\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":75,"gap":false},{"id":"constitution-constitution-173","n":173,"chapter":"第六章 国家机构","title":"各级人大常务委员会的性质、组成及任期 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">人大常委会是本级人大的常设机关\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">全国人大常委会由委员长、副委员长、秘书长、委员组成\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">组成人员由本级人大依法选举\u003c/span>，不得担任依法不兼任的职务，任期与本级人大相同\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":76,"gap":false},{"id":"constitution-constitution-174","n":174,"chapter":"第六章 国家机构","title":"全国人大、县级以上地方各级人大的会议制度 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">全国人大和县级以上地方各级人大一般每年至少举行一次会议，由本级常委会召集，新一届第一次会议由上届常委会依法召集\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">预备会议选举主席团、秘书长，决定会议议程等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">达到法定提议条件可临时召集，法定人员按规定列席\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":99,"gap":false},{"id":"constitution-constitution-175","n":175,"chapter":"第六章 国家机构","title":"乡级人民代表大会的会议制度 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">乡级人大通常每年至少举行两次会议，由主席团召集\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">会议须有全体代表三分之二以上出席\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">乡级人大依法选举主席、副主席\u003c/span>，由主席团主持会议、依法安排闭会期间有关工作\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":75,"gap":false},{"id":"constitution-constitution-176","n":176,"chapter":"第六章 国家机构","title":"各级人大常委会的会议制度 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">常委会会议一般至少每两个月举行一次，必要时可临时召集\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">会议须过半数组成人员出席\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有关机关负责人和其他依法应列席人员按规定列席\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":60,"gap":false},{"id":"constitution-constitution-177","n":177,"chapter":"第六章 国家机构","title":"全国人大及其常委会的工作制度 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">全国人大及其常委会经法定程序处理法律案、其他议案和报告\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">提出议案后\u003c/span>，由主席团或委员长会议等依程序决定列入议程，再由有关会议和专门委员会审议\u003c/li>\u003cli>\u003cspan class=\"blue\">法律案由全体代表或全体常委会组成人员过半数经\u003c/span>，国家主席依法公布\u003c/li>\u003cli>\u003cspan class=\"blue\">会议还依法办理人事、询问和质询等事项\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":117,"gap":false},{"id":"constitution-constitution-178","n":178,"chapter":"第六章 国家机构","title":"地方各级人大及其常委会的工作制度 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">地方人大和常委会依法受理议案、审议、表决并公布决定或法规\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主席团或主任会议依法处理列入议程等事项\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">议案一般由全体代表或全体常委会组成人员过半数经\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":70,"gap":false},{"id":"constitution-constitution-179","n":179,"chapter":"第六章 国家机构","title":"全国人大与全国人大常委会的立法权 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">全国人大修改宪法，制定和修改刑事、民事、国家机构等基本法律\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">全国人大常委会制定和修改其他法律\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">全国人大常委会有权解释法律\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":58,"gap":false},{"id":"constitution-constitution-180","n":180,"chapter":"第六章 国家机构","title":"地方各级人大与地方各级人大常委会的立法权 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">省级人大及其常委会依法制定地方性法规\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">民族自治地方人大可依法制定自治条例和单行条例\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":40,"gap":false},{"id":"constitution-constitution-181","n":181,"chapter":"第六章 国家机构","title":"全国人大与全国人大常委会的重大事项决定权 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">全国人大审查和批准国民经济和社会发展计划、国家预算及执行情况报告，决定省级建置、特别行政区的设立及其制度、战争和和平等重大事项\u003c/span>\u003c/li>\u003cli>全国人大常委会在人大闭会期间依法审查批准计划和预算调整，决定特赦、动员、紧急状态等法定事项\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":108,"gap":false},{"id":"constitution-constitution-182","n":182,"chapter":"第六章 国家机构","title":"地方各级人大与地方各级人大常委会的决定权 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">地方人大审查批准本行政区域的经济社会发展计划、预算及执行情况，依法讨论决定重大事项和项目\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">地方人大常委会在闭会期间依法讨论决定有关重大事项\u003c/span>，审查批准本级预算调整、决算等\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":83,"gap":false},{"id":"constitution-constitution-183","n":183,"chapter":"第六章 国家机构","title":"全国人大与全国人大常委会的人事任免权 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">全国人大选举和罢免国家主席、副主席、中央军委主席、国家监察委员会主任、最高法院院长、最高检察院检察长等，依法决定国务院及中央军委有关人选\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">闭会期间\u003c/span>，全国人大常委会依法决定国务院、中央军委部分人选，并任免监察、审判、检察等机关的有关人员\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":116,"gap":false},{"id":"constitution-constitution-184","n":184,"chapter":"第六章 国家机构","title":"地方各级人大与地方各级人大常委会的人事任免权 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">地方人大依法选举、罢免本级政府领导人员及其他依法应选举的负责人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">闭会期间\u003c/span>，地方人大常委会依法决定部分组成人员的任免和有关负责人的代理事项\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":67,"gap":false},{"id":"constitution-constitution-185","n":185,"chapter":"第六章 国家机构","title":"全国人大与全国人大常委会的监督权 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">全国人大监督宪法实施，审议有关机关工作报告，可依法改变或撤销全国人大常委会不适当的决定\u003c/span>\u003c/li>\u003cli>全国人大常委会监督宪法实施和国务院、中央军委、国家监委、最高法院、最高检察院的工作\u003c/li>\u003cli>监督可经听取报告、执法检查、询问质询、调查和依法撤销有关规范等方式进行\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":119,"gap":false},{"id":"constitution-constitution-186","n":186,"chapter":"第六章 国家机构","title":"地方各级人大与地方各级人大常委会的监督权 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">地方人大监督宪法、法律等在本行政区域的遵守和执行，依法监督本级机关工作\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">地方人大常委会监督本级政府、监察委员会、法院、检察院\u003c/span>，可听取和审议报告、开展执法检查、依法处理不适当的决定和命令\u003c/li>\u003cli>\u003cspan class=\"blue\">地方人大可依法改变或撤销本级常委会不适当的决议\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":114,"gap":false},{"id":"constitution-constitution-187","n":187,"chapter":"第六章 国家机构","title":"2022年《中华人民共和国地方各级人民代表大会和地方各级人民政府组织法》修改意义总结（超纲补充） ★  ★","body":"\u003cp class=\"gap\">原资料未提供此项完整正文，保留位置供补充。\u003c/p>","memory":"","understanding":"\u003cp>原资料未提供此项完整正文，保留位置供补充。\u003c/p>","count":0,"chars":0,"gap":true},{"id":"constitution-constitution-188","n":188,"chapter":"第六章 国家机构","title":"各级人大专门委员会的性质、产生和任期 ★  ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">专门委员会是人大按专业分工设立的常设辅助机构\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">成员依法从代表中产生\u003c/span>，人民代表大会会议期间由主席团提名、大会经\u003c/li>\u003cli>\u003cspan class=\"blue\">任期与本届人大相同\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":62,"gap":false},{"id":"constitution-constitution-189","n":189,"chapter":"第六章 国家机构","title":"全国人大专门委员会的设立 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">全国人大设民族、宪法和法律、监察和司法、财政经济、教育科学文化卫生、外事、华侨、环境与资源保护、农业与农村、社会建设等专门委员会，按专业分工开展工作\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":1,"chars":74,"gap":false},{"id":"constitution-constitution-190","n":190,"chapter":"第六章 国家机构","title":"全国人大专门委员会的职权 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">审议本级人大或常委会交付的议案，提出属于其职权范围的议案和报告\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">研究有关法律案、规范性文件、质询事项等，提出意见\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">就职责相关问题开展调查研究\u003c/span>，在人大及其常委会领导下协助监督、执法检查和代表建议办理\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":96,"gap":false},{"id":"constitution-constitution-191","n":191,"chapter":"第六章 国家机构","title":"全国人大及其常委会调查委员会 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">全国人大及其常委会认为必要时，可以组织特定问题调查委员会\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">委员会由主任委员、副主任委员和委员组成\u003c/span>，由主席团或委员长会议依法提名，提交相应全体会议经\u003c/li>\u003cli>\u003cspan class=\"blue\">调查后提出报告，由人大或常委会依法作出相应决定\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":95,"gap":false},{"id":"constitution-constitution-192","n":192,"chapter":"第六章 国家机构","title":"地方各级调查委员会 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">县级以上地方各级人大及其常委会可以组织特定问题调查委员会\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">大会由主席团或十分之一以上代表书面联名提议\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">委员会向组织它的人大或常委会报告调查结果\u003c/span>，由其依法作出决定\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":78,"gap":false},{"id":"constitution-constitution-193","n":193,"chapter":"第六章 国家机构","title":"全国人民代表大会代表在全国人大会议期间的工作 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">出席会议，审议各项议案和报告，依法提出议案、建议、批评和意见\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">参加选举、决定人选，依法提出罢免案\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">进行询问和质询，可以依法提议组织特定问题调查委员会\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":72,"gap":false},{"id":"constitution-constitution-194","n":194,"chapter":"第六章 国家机构","title":"全国人民代表大会代表在全国人大闭会期间的工作 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">按安排开展视察，提出建议、批评和意见，但不直接处理所视察单位的问题\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">可向全国人大常委会提出建议\u003c/span>，依法提议临时召集全国人大会议\u003c/li>\u003cli>\u003cspan class=\"blue\">可应邀列席全国人大常委会、专门委员会会议\u003c/span>，并按规定列席原选举单位的人大及其常委会会议\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":103,"gap":false},{"id":"constitution-constitution-195","n":195,"chapter":"第六章 国家机构","title":"全国人民代表大会代表享有的权利 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">出席会议，参加审议、表决和选举\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法提出议案、建议、批评、意见及询问、质询、罢免案\u003c/span>\u003c/li>\u003cli>依法享有言论免责、人身特别保障和执行代表职务所需的时间、物质等保障\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":73,"gap":false},{"id":"constitution-constitution-196","n":196,"chapter":"第六章 国家机构","title":"全国人民代表大会代表享有的义务 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">模范遵守宪法和法律，依法保守国家秘密\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">同原选举单位和人民群众保持密切联系，听取和反映意见\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按时出席人大会议\u003c/span>，认真审议，参加视察等履职活动，接受监督\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":71,"gap":false},{"id":"constitution-constitution-197","n":197,"chapter":"第六章 国家机构","title":"国家主席的性质和地位 ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">中华人民共和国主席是我国的国家元首，是国家机构的一部分\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">国家主席代表国家进行法定活动\u003c/span>，象征国家主权、国家统一和民族团结，依照宪法行使职权\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":67,"gap":false},{"id":"constitution-constitution-198","n":198,"chapter":"第六章 国家机构","title":"国家主席的产生和任期 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">有选举权和被选举权、年满四十五周岁的中国公民可被选为国家主席、副主席\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">由全国人大选举，任期同全国人大每届任期\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主席缺位由副主席继任，副主席缺位由全国人大补选\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":76,"gap":false},{"id":"constitution-constitution-199","n":199,"chapter":"第六章 国家机构","title":"国家主席的职权 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国家主席公布法律，依法发布特赦令、动员令等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">根据全国人大及其常委会的决定依法任免国务院组成人员\u003c/span>，根据常委会决定派遣和召回驻外全权代表\u003c/li>\u003cli>\u003cspan class=\"blue\">代表国家进行国事活动、接受外国使节\u003c/span>，依法批准或废除条约和重要协定\u003c/li>\u003cli>\u003cspan class=\"blue\">根据全国人大常委会决定授予国家勋章和国家荣誉称号\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":121,"gap":false},{"id":"constitution-constitution-200","n":200,"chapter":"第六章 国家机构","title":"《中华人民共和国国家勋章和国家荣誉称号法》 ★","body":"\u003cp class=\"gap\">原资料未提供此项完整正文，保留位置供补充。\u003c/p>","memory":"","understanding":"\u003cp>原资料未提供此项完整正文，保留位置供补充。\u003c/p>","count":0,"chars":0,"gap":true},{"id":"constitution-constitution-201","n":201,"chapter":"第六章 国家机构","title":"各级行政机关的性质、地位、组成和任期 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国务院即中央人民政府，是最高国家权力机关的执行机关，也是最高国家行政机关\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">地方各级人民政府是本级国家权力机关的执行机关\u003c/span>，也是地方国家行政机关，由正副行政首长及其他法定人员组成\u003c/li>\u003cli>\u003cspan class=\"blue\">各级政府每届任期同本级人大\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":99,"gap":false},{"id":"constitution-constitution-202","n":202,"chapter":"第六章 国家机构","title":"国务院的工作指导思想 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国务院坚持中国共产党的领导，坚持以人民为中心，依法履行政府职能\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">贯彻党的路线方针政策和决策部署\u003c/span>，建设职能科学、权责法定、执法严明、公开公正、廉洁高效、守法诚信的法治政府\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":83,"gap":false},{"id":"constitution-constitution-203","n":203,"chapter":"第六章 国家机构","title":"国务院的领导体制 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国务院实行总理负责制，各部、各委员会实行部长、主任负责制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">总理依法提名有关组成人员\u003c/span>，领导国务院工作，召集和主持全体会议、常务会议\u003c/li>\u003cli>\u003cspan class=\"blue\">重大问题依法经会议讨论\u003c/span>，由总理作出决定，国务院发布的行政法规、决定、命令等由总理签署\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":105,"gap":false},{"id":"constitution-constitution-204","n":204,"chapter":"第六章 国家机构","title":"国务院的机构设置 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国务院的机构包括办公厅、组成部门、直属特设机构、直属机构、办事机构、由组成部门管理的国家行政机构及直属事业单位\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">各类机构分别承担综合协调、行政管理或公共服务等工作\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":80,"gap":false},{"id":"constitution-constitution-205","n":205,"chapter":"第六章 国家机构","title":"地方各级人民政府的机构设置 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">地方政府根据工作需要和精干原则设置工作部门\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">工作部门的设立、增加、减少或合并\u003c/span>，依层级和法定程序报批、备案\u003c/li>\u003cli>\u003cspan class=\"blue\">工作部门受本级政府统一领导\u003c/span>，并依法接受上级主管部门的业务指导或领导\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":84,"gap":false},{"id":"constitution-constitution-206","n":206,"chapter":"第六章 国家机构","title":"国务院的会议制度 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国务院会议分全体会议和常务会议，均由总理召集和主持\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">全体会议由全体组成人员参加\u003c/span>，讨论决定政府工作中的重大事项\u003c/li>\u003cli>\u003cspan class=\"blue\">常务会议由总理、副总理、国务委员、秘书长组成\u003c/span>，讨论决定重要事项，审议法律草案、行政法规草案等\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":99,"gap":false},{"id":"constitution-constitution-207","n":207,"chapter":"第六章 国家机构","title":"国务院的职权 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">制定行政法规、行政措施、决定命令，依法提案\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">统一领导部委、地方行政，改变撤销有关不当决定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">编制执行经济社会计划、预算\u003c/span>，管理经济教育民政外交国防等\u003c/li>\u003cli>\u003cspan class=\"blue\">依法管行政区划、人事任免，决定省级部分地区紧急状态\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":95,"gap":false},{"id":"constitution-constitution-208","n":208,"chapter":"第六章 国家机构","title":"地方各级人民政府的职权 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">执行本级人大及其常委会的决议和上级行政机关的决定、命令，依法发布决定和命令\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">领导所属部门和下级政府\u003c/span>，依法改变或撤销不适当的命令、指示和决定\u003c/li>\u003cli>\u003cspan class=\"blue\">依法管理辖区经济、教育、民政、卫生、生态等事务\u003c/span>，保护公民合法权益，办理上级交办事项\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":109,"gap":false},{"id":"constitution-constitution-209","n":209,"chapter":"第六章 国家机构","title":"2024《国务院组织法》修改内容的意义总结 ★  ★","body":"\u003cp class=\"gap\">原资料未提供此项完整正文，保留位置供补充。\u003c/p>","memory":"","understanding":"\u003cp>原资料未提供此项完整正文，保留位置供补充。\u003c/p>","count":0,"chars":0,"gap":true},{"id":"constitution-constitution-210","n":210,"chapter":"第六章 国家机构","title":"中央军事委员会的性质、地位及其组成 ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">中央军事委员会是国家的最高军事领导机关，领导全国武装力量\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">由主席、副主席和委员组成\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":40,"gap":false},{"id":"constitution-constitution-211","n":211,"chapter":"第六章 国家机构","title":"中央军事委员会的领导体制 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">中央军委实行主席负责制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">重大问题依规定集体讨论，由主席决定\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":28,"gap":false},{"id":"constitution-constitution-212","n":212,"chapter":"第六章 国家机构","title":"监察委员会的性质、地位及其组成 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">各级监察委员会是行使国家监察职能的专责机关，调查职务违法和职务犯罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国家监察委员会是最高监察机关\u003c/span>，地方按法律规定设立监察委员会\u003c/li>\u003cli>\u003cspan class=\"blue\">监察委员会由主任、副主任和委员组成\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":79,"gap":false},{"id":"constitution-constitution-213","n":213,"chapter":"第六章 国家机构","title":"监察委员会的领导体制与其他机关的关系 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国家监察委员会领导地方各级监察委员会，上级监察委员会领导下级监察委员会\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">监察委员会依法独立行使监察权\u003c/span>，不受行政机关、社会团体和个人干涉\u003c/li>\u003cli>\u003cspan class=\"blue\">办理职务违法和职务犯罪案件\u003c/span>，应与审判机关、检察机关及执法部门互相配合、互相制约\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":105,"gap":false},{"id":"constitution-constitution-214","n":214,"chapter":"第六章 国家机构","title":"《监察法》修改的内容和意义 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">完善派驻、派出和依法再派出制度，扩大监察覆盖\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">增设强制到案、责令候查、管护等措施\u003c/span>，完善留置规定，按调查需要适用并保障相关人员权益\u003c/li>\u003cli>\u003cspan class=\"blue\">健全禁闭与特约监察员监督制度\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":77,"gap":false},{"id":"constitution-constitution-215","n":215,"chapter":"第六章 国家机构","title":"人民法院的性质、地位及其组成 ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">人民法院是国家审判机关，依法独立行使审判权\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">设最高人民法院、地方各级人民法院和专门人民法院\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">人民法院依法设院长、副院长、审判委员会委员和法官等\u003c/span>，对产生它的国家权力机关负责\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":83,"gap":false},{"id":"constitution-constitution-216","n":216,"chapter":"第六章 国家机构","title":"人民检察院的性质、地位及其组成 ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">人民检察院是国家的法律监督机关，依法独立行使检察权\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">设最高人民检察院、地方各级人民检察院和专门人民检察院\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">各级检察院设检察长、副检察长和检察官等\u003c/span>，依法律对有关国家权力机关负责，上级检察院领导下级检察院\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":98,"gap":false},{"id":"constitution-constitution-217","n":217,"chapter":"第六章 国家机构","title":"人民法院审判委员会的组成及职能 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">审判委员会由院长、副院长和若干资深法官组成，人数为单数\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">总结审判经验，讨论决定重大、疑难、复杂案件的法律适用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">讨论本院生效裁判、调解书是否应再审\u003c/span>，讨论决定其他审判工作重大问题\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":85,"gap":false},{"id":"constitution-constitution-218","n":218,"chapter":"第六章 国家机构","title":"人民检察院检察委员会的组成及职能 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">检察委员会由检察长、副检察长和若干资深检察官组成，人数为单数\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">总结检察工作经验\u003c/span>，讨论决定重大、疑难、复杂案件，及其他检察工作重大问题\u003c/li>\u003cli>\u003cspan class=\"blue\">地方检察长不同意多数意见\u003c/span>，办理案件的报上一级检察院决定，重大事项可报上一级检察院或本级人大常委会决定\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":115,"gap":false},{"id":"constitution-constitution-219","n":219,"chapter":"第六章 国家机构","title":"各级人民法院的产生及任期 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">最高人民法院院长由全国人大选举和罢免，地方各级法院院长由本级人大选举和罢免\u003c/span>\u003c/li>\u003cli>副院长、审判委员会委员、庭长、副庭长和审判员等由院长依法提请相应人大常委会任免\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":76,"gap":false},{"id":"constitution-constitution-220","n":220,"chapter":"第六章 国家机构","title":"人民检察院的人事任免 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">各级人大依法选举、罢免本级检察长\u003c/span>\u003c/li>\u003cli>副检察长、检察委员会委员和检察员由本级检察长依法提请本级
