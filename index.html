s=\"blue\">审判时怀孕不适用死刑，含羁押期间怀孕\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">审判时已满75周岁原则上不适用死刑\u003c/span>，但以特别残忍手段致人死亡的除外\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>未成年看犯罪时，怀孕和已满75周岁看审判时，前两者不判死刑，老人特别残忍致死另有例外。\u003c/p>","count":3,"chars":75,"gap":false},{"id":"criminal-1794794335482","n":144,"chapter":"第十三章 刑罚概述 / 法条分析题","title":"死缓期满怎么处理","body":"\u003col>\u003cli>\u003cspan class=\"red\">死缓是死刑执行方式，不是独立主刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">重大立功含阻止、检举重大犯罪\u003c/span>，协助抓捕、重大创造革新、舍己救人等\u003c/li>\u003cli>\u003cspan class=\"blue\">仅死缓期间故意犯罪且情节恶劣\u003c/span>，才报最高法核准执行死刑；期满后犯罪不适用\u003c/li>\u003cli>\u003cspan class=\"blue\">限制减刑者减无期、25年有期后\u003c/span>，实际执行至少\u003cspan class=\"blue\">25年\u003c/span>、\u003cspan class=\"blue\">20年\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>死缓不是新刑种，两年内的表现才决定有无执行死刑的可能，重大立功能减刑，部分人还会被限制减刑。\u003c/p>","count":4,"chars":112,"gap":false},{"id":"criminal-1794794335483","n":145,"chapter":"第十三章 刑罚概述 / 法条分析题","title":"死缓从何时开始算","body":"\u003col>\u003cli>\u003cspan class=\"red\">判决确定之日：死缓判决发生法律效力之日，死缓期间由此起算\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">判决执行之日\u003c/span>：生效判决交付执行机关开始执行之日\u003c/li>\u003cli>\u003cspan class=\"blue\">两者不同，死缓期满减有期的刑期自死缓期满起算\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>判决确定日是判决生效那天，判决执行日是刑罚实际开始执行那天，两个日子用途不一样。\u003c/p>","count":3,"chars":73,"gap":false},{"id":"criminal-1794794335484","n":146,"chapter":"第十三章 刑罚概述 / 法条分析题","title":"剥夺政治权利何时起算","body":"\u003col>\u003cli>\u003cspan class=\"red\">附加剥夺政治权利虽尚未开始计算，其效力已及于主刑执行期间，无须另行宣告\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">剥夺范围\u003c/span>：选举、被选举权；六项政治自由；国家机关任职权；国有公司、企事业单位、人民团体领导职务任职权\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>剥夺政治权利虽通常在主刑之后起算，但主刑执行时也不能行使这些被剥夺的权利。\u003c/p>","count":2,"chars":85,"gap":false},{"id":"criminal-1794794335485","n":147,"chapter":"第十四章 量刑 / 简答题","title":"量刑的概念、功能、特征、原则","body":"\u003col>\u003cli>\u003cspan class=\"red\">量刑：法院确认有罪后，决定是否判刑、刑种刑期及是否立即执行\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">把法定罪刑关系落实为具体刑罚，衔接定罪与执行\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">特征\u003c/span>：主体为法院，依据刑法，前提是犯罪，内容是刑罚裁量\u003c/li>\u003cli>\u003cspan class=\"blue\">原则\u003c/span>：以犯罪事实为根据，\u003cspan class=\"blue\">以法律为准绳\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>量刑是在定罪后由法院按犯罪事实、性质、情节和危害来决定判不判、判什么和判多重。\u003c/p>","count":4,"chars":96,"gap":false},{"id":"criminal-1794794335486","n":148,"chapter":"第十四章 量刑 / 简答题","title":"量刑情节的概念、特征、种类","body":"\u003col>\u003cli>\u003cspan class=\"red\">量刑情节：法院决定判轻、判重或免除刑罚时应考虑的事实\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">与是否成立犯罪相区分\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">反映行为的社会危害和犯罪人的人身危险性\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">直接影响刑罚轻重或是否免罚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法是否明定，分法定与酌定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法定情节按范围分总则性与分则性\u003c/span>，前者一般适用，后者用于特定罪\u003c/li>\u003cli>\u003cspan class=\"blue\">按功能分从重、从轻、减轻、免除处罚\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>量刑情节是用来调刑罚轻重的事实，按有无法律明文和影响方向可分为不同种。\u003c/p>","count":7,"chars":128,"gap":false},{"id":"criminal-1794794335487","n":149,"chapter":"第十四章 量刑 / 简答题","title":"从轻处罚情节和从重处罚情节的适用","body":"\u003col>\u003cli>\u003cspan class=\"red\">有法定从轻或从重处罚情节，在法定刑幅度内量刑\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>从轻从重是在该进的法定刑档里挑轻或挑重，都不能跨出原档。\u003c/p>","count":1,"chars":22,"gap":false},{"id":"criminal-1794794335488","n":150,"chapter":"第十四章 量刑 / 简答题","title":"减轻处罚情节的种类和基本适用规则","body":"\u003col>\u003cli>\u003cspan class=\"red\">减轻处罚分法定减轻与酌定减轻\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法定减轻\u003c/span>：有\u003cspan class=\"blue\">法定减轻\u003c/span>情节，应在法定刑以下判刑\u003c/li>\u003cli>\u003cspan class=\"blue\">酌定减轻\u003c/span>：无\u003cspan class=\"blue\">法定减轻\u003c/span>情节，但案件情况特殊，报\u003cspan class=\"blue\">最高人民法院核准\u003c/span>后可以减轻\u003c/li>\u003cli>\u003cspan class=\"blue\">看本案应适用的法定刑幅度，不看该罪所有刑档的总最低刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">可减刑种或刑期，须低于本档最低刑\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>减轻必须降到原档最低刑以下，法定情节按法定规则降档，特殊案件走最高法院核准。\u003c/p>","count":5,"chars":113,"gap":false},{"id":"criminal-1794794335489","n":151,"chapter":"第十四章 量刑 / 简答题","title":"酌定情节的概念和种类","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：人民法院从审判经验中总结出来的，在刑罚裁量过程中灵活掌握、酌情适用的情节\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">犯罪的动机\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">犯罪的手段\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">犯罪的时间、地点\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">犯罪侵害的对象\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">犯罪造成的损害结果\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">罪犯的一贯表现\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">犯罪后的态度\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>酌定情节不是法条逐个列好的，而由法院结合犯罪之前、当时和之后的情况斟酌轻重。\u003c/p>","count":8,"chars":86,"gap":false},{"id":"criminal-1794794335490","n":152,"chapter":"第十四章 量刑 / 简答题","title":"一般累犯的概念及其构成条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">一般累犯：已成年，前后均故意犯罪，前罪判有期以上、后罪应判有期以上\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">后罪在前罪主刑执行完毕或赦免后5年内发生\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">过失犯罪、不满18岁犯罪不适用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">应从重，不得缓刑、假释；判死缓可限制减刑\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一般累犯先看前后是否都是故意、刑罚够不够重，再看旧刑执行完或赦免后5年内是否再犯，并排除未成年人犯罪。\u003c/p>","count":4,"chars":88,"gap":false},{"id":"criminal-1794794335491","n":153,"chapter":"第十四章 量刑 / 简答题","title":"特别累犯的概念及其构成条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">特别累犯：因危害国家安全、恐怖活动、黑社会性质组织犯罪受刑罚，执行完毕或赦免后，又犯其中任一类罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">前后可为三类中的不同罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不限刑种、刑罚轻重、时间间隔\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">未成年犯罪不按累犯；成立后应从重，禁缓刑、假释\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>特别累犯看前后是否都是危害国家安全、恐怖活动或黑社会性质组织犯罪，旧刑执行完或赦免后再犯不限间隔。\u003c/p>","count":4,"chars":96,"gap":false},{"id":"criminal-1794794335492","n":154,"chapter":"第十四章 量刑 / 简答题","title":"累犯和再犯的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">再犯：再次犯罪的人\u003c/span>；累犯是具法定条件的再犯\u003c/li>\u003cli>\u003cspan class=\"blue\">累犯限制前后罪的性质、刑罚及间隔；一般再犯无这些限制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">一般累犯须前罪刑罚执行完毕或赦免后\u003c/span>，在法定期间再犯；累犯应从重且不得缓刑、假释\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>再犯只是又犯了罪，累犯还得满足前后罪、刑罚或时间条件，成立后有从重等限制。\u003c/p>","count":3,"chars":86,"gap":false},{"id":"criminal-1794794335493","n":155,"chapter":"第十四章 量刑 / 简答题","title":"一般自首的概念和成立条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">一般自首：犯罪后自动投案\u003c/span>，\u003cspan class=\"blue\">如实供述\u003c/span>本人罪行\u003c/li>\u003cli>\u003cspan class=\"blue\">投案须主动\u003c/span>；通常在未受讯问、未\u003cspan class=\"blue\">被采取强制措施\u003c/span>时向司法机关投案\u003c/li>\u003cli>\u003cspan class=\"blue\">如实供述本人应承担责任的主要犯罪事实\u003c/span>，包括单独、共同犯罪\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一般自首要先主动把自己交给司法机关，再如实交代主要犯罪事实。\u003c/p>","count":3,"chars":79,"gap":false},{"id":"criminal-1794794335494","n":156,"chapter":"第十四章 量刑 / 简答题","title":"特别自首的概念和成立条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">特别自首：已受强制措施或服刑者\u003c/span>，\u003cspan class=\"blue\">如实供述\u003c/span>尚未掌握的本人其他罪行\u003c/li>\u003cli>\u003cspan class=\"blue\">主体为嫌疑人、被告人、服刑者\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须交代未掌握的其他罪行\u003c/span>；异种罪按自首，同种罪通常按坦白等处理\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>已经被采取强制措施或正在服刑，也能因如实交代司法机关还没掌握的本人其他罪行而以自首论。\u003c/p>","count":3,"chars":75,"gap":false},{"id":"criminal-1794794335495","n":157,"chapter":"第十四章 量刑 / 简答题","title":"数罪自首的认定","body":"\u003col>\u003cli>\u003cspan class=\"red\">主动投案并如实交代全部数罪，全案成立自首\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">只交代一部分异种罪，仅交代的罪成立自首\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">对同种数罪，看是否如实供述主要犯罪事实\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">数罪后特别自首\u003c/span>：\u003cspan class=\"blue\">被采取强制措施\u003c/span>或正在服刑者，交代司法机关未掌握的本人异种罪，以自首论\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>犯了多项罪要分开看，主动投案如实交代的部分算自首，被控制后新交代的异种罪可以按特别自首。\u003c/p>","count":4,"chars":100,"gap":false},{"id":"criminal-1794794335496","n":158,"chapter":"第十四章 量刑 / 简答题","title":"自首与坦白的界限","body":"\u003col>\u003cli>\u003cspan class=\"red\">自首：主动投案并如实供述自己的罪行，或被采取强制措施、正在服刑的人如实供述司法机关尚未掌握的本人其他罪行\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">坦白\u003c/span>：被动归案后\u003cspan class=\"blue\">如实供述\u003c/span>自己的罪行，可从轻，避免特别严重后果的可减轻\u003c/li>\u003cli>\u003cspan class=\"blue\">同\u003c/span>：都如实交代自己做的事、接受审查裁判，均可依法从宽\u003c/li>\u003cli>\u003cspan class=\"blue\">异\u003c/span>：一般\u003cspan class=\"blue\">自首\u003c/span>多一个主动投案，特别\u003cspan class=\"blue\">自首\u003c/span>供述的是未掌握的其他罪\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>主动投案并如实交代通常是自首，被抓后才如实交代已掌握的罪通常是坦白，二者从宽幅度不同。\u003c/p>","count":4,"chars":141,"gap":false},{"id":"criminal-1794794335497","n":159,"chapter":"第十四章 量刑 / 简答题","title":"一般立功的成立条件和处理原则","body":"\u003col>\u003cli>\u003cspan class=\"red\">主体是已到案的犯罪嫌疑人或被告人，亲友替其帮忙不能算他立功\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">时间是到案后至判决确定前\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">揭发他人犯罪且查实\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">提供侦破其他案件的重要线索且查实\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">阻止他人犯罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">协助抓捕其他犯罪嫌疑人，含同案犯\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">其他有利于国家和社会的突出表现\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">处理\u003c/span>：一般立功可以从轻或\u003cspan class=\"blue\">减轻处罚\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>到案后揭发、提供线索、阻止犯罪、协助抓捕或作其他突出贡献，达到查证等要求才算一般立功。\u003c/p>","count":8,"chars":119,"gap":false},{"id":"criminal-1794794335498","n":160,"chapter":"第十四章 量刑 / 简答题","title":"重大立功的成立条件和处理原则","body":"\u003col>\u003cli>\u003cspan class=\"red\">主体为罪犯，发生在到案后至判决确定前\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">检举重大犯罪或提供重大线索且查实\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">阻止重大犯罪、协助抓捕重大嫌疑人含同案犯\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有其他对国家社会的重大贡献\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有重大立功，可减轻或免除处罚\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>立功的对象或贡献达到重大程度，就可减轻或免除处罚，重不重要要看案件刑罚、影响或实际贡献。\u003c/p>","count":5,"chars":81,"gap":false},{"id":"criminal-1794794335499","n":161,"chapter":"第十四章 量刑 / 简答题","title":"数罪并罚的概念、特点","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">数罪并罚，指对一行为人所犯数罪合并处罚的制度\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">必须是一行为人犯有数罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">一行为人所犯的数罪必须发生于法定的时间界限之内\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">必须在对数罪分别定罪量刑的基础上\u003c/span>，按法定的并罚原则、并罚范围和并罚方法（刑期计算方式），决定执行的刑罚\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一人犯了数罪，先分别定罪量刑，再按法律规则算最终执行的刑罚。\u003c/p>","count":4,"chars":107,"gap":false},{"id":"criminal-1794794335500","n":162,"chapter":"第十四章 量刑 / 简答题","title":"数罪并罚的各种原则","body":"\u003col>\u003cli>\u003cspan class=\"red\">数罪并罚原则是决定各罪刑罚如何合并执行的规则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">并科\u003c/span>：各罪刑罚直接相加\u003c/li>\u003cli>\u003cspan class=\"blue\">吸收\u003c/span>：重罪\u003cspan class=\"blue\">吸收\u003c/span>轻罪，或重刑\u003cspan class=\"blue\">吸收\u003c/span>轻刑\u003c/li>\u003cli>\u003cspan class=\"blue\">限制加重\u003c/span>：以最重刑为基础，在规定限度内加重\u003c/li>\u003cli>\u003cspan class=\"blue\">折中\u003c/span>：按刑种和组合，分别采用\u003cspan class=\"blue\">并科\u003c/span>、\u003cspan class=\"blue\">吸收\u003c/span>或\u003cspan class=\"blue\">限制加重\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>多罪刑罚可以直接相加，由重刑吸收轻刑，以最重刑为基础限度内加重，或按不同情况混合使用。\u003c/p>","count":5,"chars":95,"gap":false},{"id":"criminal-1794794335501","n":163,"chapter":"第十四章 量刑 / 简答题","title":"我国刑法中的数罪并罚原则及其特点","body":"\u003col>\u003cli>\u003cspan class=\"red\">我国数罪并罚：限制加重为主，吸收、并科为辅的折中原则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">三种原则各适用于特定刑种，无一种普遍适用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">吸收与限制加重互相排斥\u003c/span>；并科相对独立，可与其他原则配合\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>我国并罚主要用限制加重，特定组合用吸收，另有要继续执行的刑罚用并科。\u003c/p>","count":3,"chars":73,"gap":false},{"id":"criminal-1794794335502","n":164,"chapter":"第十四章 量刑 / 简答题","title":"我国数罪并罚原则的基本适用规则","body":"\u003col>\u003cli>\u003cspan class=\"red\">吸收：最重是死刑，只执行一个死刑\u003c/span>；最重是无期，只执行一个无期\u003c/li>\u003cli>\u003cspan class=\"blue\">限制加重\u003c/span>：在最高单刑以上、总和刑期以下定执行刑期\u003c/li>\u003cli>\u003cspan class=\"blue\">并科\u003c/span>：有期徒刑或拘役执行完后，管制仍要执行\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>死刑或无期吸收其他主刑，同类有期等按上限加重，管制和附加刑遇到法律规定则另执行。\u003c/p>","count":3,"chars":75,"gap":false},{"id":"criminal-1794794335503","n":165,"chapter":"第十四章 量刑 / 简答题","title":"适用数罪并罚原则的不同情况","body":"\u003col>\u003cli>\u003cspan class=\"red\">不同法律条件下适用数罪并罚原则的具体规则，分为以下3种情形\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">判决宣告以前一人犯数罪的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">判决宣告后，服刑期间发现漏罪的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">判决宣告后，服刑期间又犯新罪的\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>判前已有多罪正常并罚，刑没执行完时发现漏罪先并后减，后来又犯新罪先减后并。\u003c/p>","count":4,"chars":71,"gap":false},{"id":"criminal-1794794335504","n":166,"chapter":"第十四章 量刑 / 简答题","title":"缓刑的考验期限和考察","body":"\u003col>\u003cli>\u003cspan class=\"red\">考验期从判决确定起算\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">守法服从监督\u003c/span>，按要求报告活动、会客，离开所居住的市县或迁居须批准，有禁止令的要遵守\u003c/li>\u003cli>\u003cspan class=\"blue\">考验期内依法实行社区矫正\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">撤销情形\u003c/span>：有新罪、发现漏罪，或严重违反监督管理规定、禁止令\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>缓刑用一段时间观察人能否守规矩，期间有新罪、漏罪或严重违规就撤销，守过期则原刑不再执行。\u003c/p>","count":4,"chars":92,"gap":false},{"id":"criminal-1794794335505","n":167,"chapter":"第十四章 量刑 / 法条分析题","title":"从轻从重怎么量刑","body":"\u003col>\u003cli>\u003cspan class=\"red\">从重、从轻均须在对应法定刑幅度内，较无该情节的类似犯罪判重或判轻\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法定刑限度包括具体适用刑档的刑种、刑期\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不同于减轻\u003c/span>：减轻通常要进入下一量刑幅度\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>从重从轻都在具体犯罪对应的法定档里选偏重或偏轻的刑，不能把整个罪名的刑罚范围当成本档。\u003c/p>","count":3,"chars":70,"gap":false},{"id":"criminal-1794794335506","n":168,"chapter":"第十四章 量刑 / 法条分析题","title":"减轻处罚怎么量刑","body":"\u003col>\u003cli>\u003cspan class=\"red\">减轻处罚在具体法定刑幅度以下，不包含该幅度最低刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有数个刑档的，应在下一个幅度判刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">无法定减轻情节但案情特殊，可逐级报最高法核准酌定减轻\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>减轻处罚的法定刑以下不含本档最低刑，没有法定从宽情节时，须案情特殊且最高法院核准。\u003c/p>","count":3,"chars":66,"gap":false},{"id":"criminal-1794794335507","n":169,"chapter":"第十四章 量刑 / 法条分析题","title":"赃物与作案物品怎么处理","body":"\u003col>\u003cli>\u003cspan class=\"red\">追缴：收回违法所得\u003c/span>；退赔：原物不能追回时，责令赔偿相应损失\u003c/li>\u003cli>\u003cspan class=\"blue\">被害人的合法财产及时返还\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">违禁品、供犯罪所用的本人财物应没收\u003c/span>；不得以罚金、没收财产替代赔偿\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>违法所得追缴或退赔，被害人自己的合法财产及时还，违禁品和作案用的本人财物依法没收。\u003c/p>","count":3,"chars":73,"gap":false},{"id":"criminal-1794794335508","n":170,"chapter":"第十四章 量刑 / 法条分析题","title":"一般累犯怎么认定","body":"\u003col>\u003cli>\u003cspan class=\"red\">特赦免除特定人刑罚\u003c/span>\u003cspan class=\"blue\">；假释是服刑达标后附条件提前释放\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">一般累犯5年从前罪主刑执行完毕或赦免起算\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">累犯应从重，不得缓刑、假释；判死缓可限制减刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">缓刑期满原判刑罚未实际执行\u003c/span>，不作为一般累犯的前罪执行完毕\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一般累犯的起点看前罪主刑执行完或赦免，假释看期满，缓刑期满原刑未执行所以不能这样算累犯。\u003c/p>","count":4,"chars":95,"gap":false},{"id":"criminal-1794794335509","n":171,"chapter":"第十四章 量刑 / 法条分析题","title":"自首看主动到案和如实供述","body":"\u003col>\u003cli>\u003cspan class=\"red\">自动投案：未被发觉，或虽发觉但未被讯问、采取强制措施时，主动直接向司法机关投案\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">如实供述\u003c/span>：交代本人实施、应本人担责的主要罪行\u003c/li>\u003cli>\u003cspan class=\"blue\">强制措施\u003c/span>：拘传、取保候审、监视居住、拘留、逮捕\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先看被讯问或采取强制措施前有没有主动到案，再看有没有如实交代本人主要犯罪事实。\u003c/p>","count":3,"chars":84,"gap":false},{"id":"criminal-1794794335510","n":172,"chapter":"第十四章 量刑 / 法条分析题","title":"立功和重大立功","body":"\u003col>\u003cli>\u003cspan class=\"red\">立功：揭发犯罪、提供重要线索且查实，阻止犯罪、协助抓捕或其他突出贡献\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">重大立功\u003c/span>：上述事项涉及重大犯罪、重大嫌疑人，或有其他\u003cspan class=\"blue\">重大贡献\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">一般立功可从轻或减轻；重大立功可减轻或免除\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>揭发、给线索、阻止犯罪、帮抓人等可立功，达到重大案件或重大贡献门槛才是重大立功。\u003c/p>","count":3,"chars":85,"gap":false},{"id":"criminal-1794794335511","n":173,"chapter":"第十四章 量刑 / 法条分析题","title":"发现漏罪先并后减","body":"\u003col>\u003cli>\u003cspan class=\"red\">发现漏罪：先并后减，先将原判与漏罪并罚，再扣已执行刑期\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">漏罪是原判前已犯、判决时未处理的其他罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">适用期间\u003c/span>：判决生效后至\u003cspan class=\"blue\">刑罚执行完毕\u003c/span>前\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>原判宣告后、主刑执行完前发现漏判的旧罪，先把新判的漏罪和原判并起来，再扣已服刑期。\u003c/p>","count":3,"chars":64,"gap":false},{"id":"criminal-1794794335512","n":174,"chapter":"第十四章 量刑 / 法条分析题","title":"再犯新罪先减后并","body":"\u003col>\u003cli>\u003cspan class=\"red\">服刑中犯新罪：先减后并，原判减去已执行刑期，再将余刑与新罪并罚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">新罪发生在判决宣告后、前罪主刑执行完毕前\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">附加刑未执行完\u003c/span>，不等于\u003cspan class=\"blue\">主刑\u003c/span>未完；这一算法体现对服刑再犯从严\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>原判宣告后、主刑执行完前又犯新罪，先扣前罪已服刑期，再把前罪余刑和新罪的刑罚合并。\u003c/p>","count":3,"chars":80,"gap":false},{"id":"criminal-1794794335513","n":175,"chapter":"第十五章 刑罚执行制度 / 简答题","title":"减刑的概念和条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">减刑：执行中依法减轻管制、拘役、有期、无期原判刑罚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">悔改或立功可减；重大立功应减\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">实际执行\u003c/span>：管制拘役有期不少于原刑\u003cspan class=\"blue\">1/2\u003c/span>，无期至少\u003cspan class=\"blue\">13年\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">一般死缓减刑通常至少15年\u003c/span>；限制减刑死缓减无期至少\u003cspan class=\"blue\">25年\u003c/span>、减\u003cspan class=\"blue\">25年\u003c/span>有期至少\u003cspan class=\"blue\">20年\u003c/span>，不计死缓期\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>服刑守规、确有悔改或立功可以减，有重大立功应当减，减完还必须服够相应的最低刑期。\u003c/p>","count":4,"chars":112,"gap":false},{"id":"criminal-1794794335514","n":176,"chapter":"第十五章 刑罚执行制度 / 简答题","title":"减刑与改判的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">改判是原判决在认定事实或适用法律上确有错误时，按第二审程序或审判监督程序，撤销原判决，重新判决\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">减刑则是在肯定原判决的基础上\u003c/span>，根据罪犯在\u003cspan class=\"blue\">服刑期间的表现\u003c/span>，按照法定条件和程序，将原判刑罚适当减轻\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>减刑是原判没错、后来服刑表现好而少服一点，改判则是发现原判该纠正或依法重新作出判决。\u003c/p>","count":2,"chars":94,"gap":false},{"id":"criminal-1794794335515","n":177,"chapter":"第十五章 刑罚执行制度 / 简答题","title":"减刑与减轻处罚的区别","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">减轻处罚是人民法院根据罪犯有的法定或酌定减轻处罚情节，依法在法定刑以下判处刑罚\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">减刑则是在判决确定以后的服刑期间\u003c/span>，对正在服刑的罪犯，依法将原判刑罚适当减轻\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>减轻处罚是判刑时判到原档以下，减刑是刑罚执行中因悔改或立功依法缩短原刑。\u003c/p>","count":2,"chars":76,"gap":false},{"id":"criminal-1794794335516","n":178,"chapter":"第十五章 刑罚执行制度 / 简答题","title":"假释的概念和条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">假释：有期、无期服刑达标后，悔改、无再犯危险而附条件释放，考虑社区影响\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有期至少原刑1/2、无期至少13年；死缓减刑依法另计\u003c/span>\u003c/li>\u003cli>累犯及法定严重暴力犯罪判\u003cspan class=\"blue\">10年以上\u003c/span>有期、无期者\u003cspan class=\"blue\">不得假释\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法终身监禁、有能力却拒履财产判项者不予假释\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有期和无期罪犯须服满规定时间、表现好且无再犯危险才可能提前出狱，累犯和部分严重暴力犯不能假释。\u003c/p>","count":4,"chars":110,"gap":false},{"id":"criminal-1794794335517","n":179,"chapter":"第十五章 刑罚执行制度 / 简答题","title":"假释的考验期及其考察","body":"\u003col>\u003cli>\u003cspan class=\"red\">期间依法实行社区矫正\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有期徒刑按未执行刑期\u003c/span>，无期徒刑为\u003cspan class=\"blue\">10年\u003c/span>，都从假释之日起算\u003c/li>\u003cli>\u003cspan class=\"blue\">守法、接受监督\u003c/span>，按规定报告活动和会客，离开所居住市县或\u003cspan class=\"blue\">迁居须批准\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">考察有无新罪、漏罪或违反监管规定\u003c/span>，期满无撤销情形视为原刑已执行完毕\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>假释后仍要接受考察，有期按未服完的时间、无期按10年计算，平安过完才视为原刑执行完毕。\u003c/p>","count":4,"chars":103,"gap":false},{"id":"criminal-1794794335518","n":180,"chapter":"第十五章 刑罚执行制度 / 简答题","title":"假释与释放的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">假释与释放虽然都是在形式上解除监禁，恢复受押人的人身自由，但在性质上是有区别的\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>假释是带条件先出狱还要考察，释放是依法结束关押，不一定有这段考察。\u003c/p>","count":1,"chars":39,"gap":false},{"id":"criminal-1794794335519","n":181,"chapter":"第十五章 刑罚执行制度 / 简答题","title":"假释与减刑的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">假释限有期、无期\u003c/span>\u003cspan class=\"blue\">；减刑还可适用于管制、拘役\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">假释只能一次，减刑可多次\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">假释附考验期\u003c/span>，违法可撤销；减刑无考验期，已减刑期不因再犯恢复\u003c/li>\u003cli>\u003cspan class=\"blue\">假释立即附条件释放；减刑有余刑仍须执行\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>假释改变服刑地点和状态，有考察期会被撤销，减刑直接减少原刑的种类或期限。\u003c/p>","count":4,"chars":82,"gap":false},{"id":"criminal-1794794335520","n":182,"chapter":"第十五章 刑罚执行制度 / 简答题","title":"假释与缓刑的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">假释适用于有期、无期且先服部分刑\u003c/span>；缓刑限拘役、\u003cspan class=\"blue\">3年以下\u003c/span>有期，原则上不执行原刑\u003c/li>\u003cli>\u003cspan class=\"blue\">假释在执行中裁定\u003c/span>，依据悔改和无再犯危险；缓刑判决时宣告，结合罪情、悔罪等\u003c/li>\u003cli>\u003cspan class=\"blue\">两者均附考验期，可因法定事由撤销\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>缓刑在判刑时给观察机会，假释是在已服部分刑后带条件放出来，门槛、期限和出问题的处理不同。\u003c/p>","count":3,"chars":90,"gap":false},{"id":"criminal-1794794335521","n":183,"chapter":"第十五章 刑罚执行制度 / 简答题","title":"假释与监外执行的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">假释适用于有期、无期，须服刑达标、悔改且无再犯危险\u003c/span>；监外执行针对法定特殊情况\u003c/li>\u003cli>\u003cspan class=\"blue\">监外执行通常适用有期、拘役\u003c/span>；无期仅怀孕或哺乳本人婴儿妇女可适用\u003c/li>\u003cli>\u003cspan class=\"blue\">假释违法可撤销，监外条件消失可收监\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">撤销假释不抵假释期间；合法监外执行期间通常计入刑期\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>假释是符合条件提前离开监狱并受考察，监外执行是因病等法定情况把同一刑罚暂时放到外面执行。\u003c/p>","count":4,"chars":111,"gap":false},{"id":"criminal-1794794335522","n":184,"chapter":"第十五章 刑罚执行制度 / 法条分析题","title":"服刑中怎么算立功","body":"\u003col>\u003cli>\u003cspan class=\"red\">立功：阻止犯罪、检举或提供线索查实、协助抓捕，技术革新、抗灾排险等突出贡献\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">重大立功\u003c/span>：阻止、揭发重大犯罪，抓重大嫌疑人，发明或重大革新、舍己救人、抗灾排险突出等\u003c/li>\u003cli>\u003cspan class=\"blue\">有悔改或立功可减刑；重大立功应减刑\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>服刑中帮抓人、阻止或揭发犯罪等可以立功，事情或贡献达到重大程度的便是重大立功。\u003c/p>","count":3,"chars":96,"gap":false},{"id":"criminal-1794794335523","n":185,"chapter":"第十五章 刑罚执行制度 / 法条分析题","title":"假释看什么出去守什么规矩","body":"\u003col>\u003cli>\u003cspan class=\"red\">悔改须认罪悔罪、守法守监规、接受教育、积极劳动\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">无再犯危险\u003c/span>：结合一贯表现、悔改、年龄、身体等判断，不等于仅口头保证\u003c/li>\u003cli>\u003cspan class=\"blue\">假释后须守法服从监督\u003c/span>，报告活动，遵守会客规定；离开市县或迁居须批准\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>假释前看是否认错守规、积极改造且未来不易再犯，出去以后仍要按要求报告、会客和外出。\u003c/p>","count":3,"chars":89,"gap":false},{"id":"criminal-1794794335524","n":186,"chapter":"第十五章 刑罚执行制度 / 法条分析题","title":"假释何时撤销","body":"\u003col>\u003cli>\u003cspan class=\"red\">假释考验期犯新罪，撤销后先减后并\u003c/span>；发现漏罪，撤销后\u003cspan class=\"blue\">先并后减\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">违法或违反监管且未构成新罪，撤销并收监执行余刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">期满后发现考验期内新罪\u003c/span>，未过\u003cspan class=\"blue\">追诉时效\u003c/span>仍撤销并罚；期满后才发现漏罪，不撤销假释\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>假释期内犯新罪先减后并，发现漏罪先并后减，严重违反监管但没犯新罪则撤销后收监服余刑。\u003c/p>","count":3,"chars":90,"gap":false},{"id":"criminal-1794794335525","n":187,"chapter":"第十六章 刑罚消灭制度 / 简答题","title":"刑罚消灭的概念、法定原因","body":"\u003col>\u003cli>\u003cspan class=\"red\">刑罚消灭，指针对特定犯罪人的刑罚权因法定事由而归于消灭\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">刑罚执行完毕\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">缓刑考验期满\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">假释考验期满\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">犯罪人死亡\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">超过时效期限\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">赦免\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>服完刑或遇到法律规定的终止原因，就不再判刑或继续执行，例如死亡、赦免或时效完成。\u003c/p>","count":7,"chars":58,"gap":false},{"id":"criminal-1794794335526","n":188,"chapter":"第十六章 刑罚消灭制度 / 简答题","title":"追诉时效的概念和追诉期限的规定","body":"\u003col>\u003cli>\u003cspan class=\"red\">追诉时效：国家依法追究犯罪刑责的有效期限\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法定最高刑不满5年\u003c/span>，时效\u003cspan class=\"blue\">5年\u003c/span>；满\u003cspan class=\"blue\">5年\u003c/span>不足\u003cspan class=\"blue\">10年\u003c/span>，时效\u003cspan class=\"blue\">10年\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">最高刑10年以上有期\u003c/span>，时效\u003cspan class=\"blue\">15年\u003c/span>；无期、死刑，时效\u003cspan class=\"blue\">20年\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">20年后认为须追诉，报最高检核准\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>追诉期限按法定最高刑分5、10、15和20年，无期或死刑满20年仍要追诉需最高检核准。\u003c/p>","count":4,"chars":93,"gap":false},{"id":"criminal-1794794335527","n":189,"chapter":"第十六章 刑罚消灭制度 / 简答题","title":"追诉期限的起算","body":"\u003col>\u003cli>\u003cspan class=\"red\">追诉期限从犯罪起计算\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">犯罪行为有连续或继续状态的\u003c/span>（即\u003cspan class=\"blue\">连续犯\u003c/span>和继续犯），其追诉期限从犯罪行为终了起计算\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>追诉一般从犯罪成立时起算，连续或持续犯罪要等行为真正停下才起算。\u003c/p>","count":2,"chars":49,"gap":false},{"id":"criminal-1794794335528","n":190,"chapter":"第十六章 刑罚消灭制度 / 简答题","title":"追诉时效的中断、追诉时效的延长","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">时效中断指在追诉期限内，因发生法定事由而使已经过了的时效期间归于无效，法定事由消失后重新计算追诉期限的制度\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">时效延长指在追诉期限内\u003c/span>，因发生法定事由而使追究犯罪人的刑事责任\u003cspan class=\"blue\">不受追诉期限限制\u003c/span>的制度\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>追诉期内又犯新罪，前罪重新算时间，立案或受理后逃避等法定情形则不受追诉期限限制。\u003c/p>","count":2,"chars":95,"gap":false},{"id":"criminal-1794794335529","n":191,"chapter":"第十六章 刑罚消灭制度 / 简答题","title":"大赦与特赦的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">大赦：面向不特定多数犯罪人，可在判决前或后，既赦罪又赦刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">特赦\u003c/span>：面向特定已判刑者，只免全部或部分刑罚执行，不赦罪\u003c/li>\u003cli>\u003cspan class=\"blue\">大赦后前罪不作累犯依据\u003c/span>；特赦后再犯符合条件仍可成立累犯\u003c/li>\u003cli>\u003cspan class=\"blue\">我国宪法规定特赦\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>大赦通常对一类人免罪或免刑，特赦面向特定已定罪的人免除刑罚执行，定罪结果仍在。\u003c/p>","count":4,"chars":90,"gap":false},{"id":"criminal-1794794335530","n":192,"chapter":"第十六章 刑罚消灭制度 / 法条分析题","title":"哪些情况不限追诉时限","body":"\u003col>\u003cli>\u003cspan class=\"red\">追诉期限延长：法定情形不受通常追诉期限限制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">立案侦查或法院受理后逃避侦查、审判\u003c/span>，期限不受限；单纯未投案不等于逃避\u003c/li>\u003cli>\u003cspan class=\"blue\">被害人在期限内控告，应立案却未立案，也不受限\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">防止逃避追诉或机关失职使犯罪漏罚\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>立案或受理后逃避，以及被害人及时控告而应立不立，都不能靠时间拖过追诉期限。\u003c/p>","count":4,"chars":93,"gap":false},{"id":"criminal-1794794335531","n":193,"chapter":"第十六章 刑罚消灭制度 / 法条分析题","title":"追诉期限从哪天算","body":"\u003col>\u003cli>\u003cspan class=\"red\">追诉期限从犯罪成立日起算\u003c/span>；行为有连续、继续状态的，从结束日起算\u003c/li>\u003cli>\u003cspan class=\"blue\">追诉期限内又犯罪\u003c/span>，前罪期限从后罪之日起\u003cspan class=\"blue\">重新计算\u003c/span>，称追诉时效中断\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一般从犯罪成立时开始算追诉，连续或继续的等停下再算，期限内又犯新罪则前罪从新罪之日重算。\u003c/p>","count":2,"chars":62,"gap":false}]},{"id":"civil","name":"民法","limit":150,"items":[{"id":"civil-1794843503001","n":1,"chapter":"绪论与民事法律关系","title":"民法的概念及其理解","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：民法是调整平等主体之间的人身关系和财产关系的法律规范的总和\u003c/span>\u003c/p>","memory":"","understanding":"\u003cp>平等的人买东西、结婚或处理名誉纠纷时，管这些事的规则合在一起就是民法。\u003c/p>","count":1,"chars":32,"gap":false},{"id":"civil-1794843503002","n":2,"chapter":"绪论与民事法律关系","title":"民法的性质","body":"\u003col>\u003cli>\u003cspan class=\"red\">私法：调整平等主体人身、财产关系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">权利法\u003c/span>：确认、\u003cspan class=\"blue\">保护\u003c/span>民事权利\u003c/li>\u003cli>\u003cspan class=\"blue\">实体法\u003c/span>：规定实体权利义务\u003c/li>\u003cli>\u003cspan class=\"blue\">市场经济基本法\u003c/span>：规范财产归属、流转\u003c/li>\u003cli>\u003cspan class=\"blue\">市民社会基本法\u003c/span>：调整平等主体日常生活\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>民法给平等的人定相处和交易的规矩，也说明每个人究竟有什么权利。\u003c/p>","count":5,"chars":76,"gap":false},{"id":"civil-1794843503003","n":3,"chapter":"绪论与民事法律关系","title":"民法解释的概念及其必要","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：民法规范有待明确时，有权主体依法定权限和程序，运用一定方法探求规范的含义\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">必要性\u003c/span>：澄清条文意思，\u003cspan class=\"blue\">填补\u003c/span>法律漏洞，使规则能适用于\u003cspan class=\"blue\">具体\u003c/span>案件\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>条文说得不够清楚时，有权的人要按规定的方法弄明白它是什么意思。\u003c/p>","count":2,"chars":68,"gap":false},{"id":"civil-1794843503004","n":4,"chapter":"绪论与民事法律关系","title":"民法解释的方法","body":"\u003col>\u003cli>\u003cspan class=\"red\">文义解释：按条文字面含义理解\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">体系解释\u003c/span>：\u003cspan class=\"blue\">结合\u003c/span>条文位置及相关规定\u003c/li>\u003cli>\u003cspan class=\"blue\">历史解释\u003c/span>：\u003cspan class=\"blue\">考察\u003c/span>形成背景和立法原意\u003c/li>\u003cli>\u003cspan class=\"blue\">目的解释\u003c/span>：从规范目的\u003cspan class=\"blue\">判断\u003c/span>含义\u003c/li>\u003cli>\u003cspan class=\"blue\">扩张与限缩解释\u003c/span>：字面过窄则适当\u003cspan class=\"blue\">扩大\u003c/span>，过宽则适当缩小\u003c/li>\u003cli>\u003cspan class=\"blue\">当然解释\u003c/span>：未明定的\u003cspan class=\"blue\">情形\u003c/span>更有理由适用同一规则时，按其规范目的适用\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>读条文先看文字，再看它放在哪、为什么这样写，才知道该解释得宽一点还是窄一点。\u003c/p>","count":6,"chars":116,"gap":false},{"id":"civil-1794843503005","n":5,"chapter":"绪论与民事法律关系","title":"民法的适用（民法的效力）","body":"\u003col>\u003cli>\u003cspan class=\"red\">时间效力：依规定开始、终止\u003c/span>；原则上不\u003cspan class=\"blue\">溯及\u003c/span>既往，法律为\u003cspan class=\"blue\">更好保护\u003c/span>权利和利益作特别规定的除外\u003c/li>\u003cli>\u003cspan class=\"blue\">空间效力\u003c/span>：\u003cspan class=\"blue\">全国性\u003c/span>规范通常\u003cspan class=\"blue\">全国适用\u003c/span>，地方性规范通常在本行政区域适用\u003c/li>\u003cli>\u003cspan class=\"blue\">对人效力\u003c/span>：原则上适用于我国领域内的\u003cspan class=\"blue\">自然人\u003c/span>、法人和\u003cspan class=\"blue\">非法人组织\u003c/span>；法律另有规定的除外\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一条民法规则能不能用，先问事情何时发生、发生在哪、涉及谁。\u003c/p>","count":3,"chars":114,"gap":false},{"id":"civil-1794843503006","n":6,"chapter":"绪论与民事法律关系","title":"人身关系的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">人身关系：平等主体间基于人格、身份产生，与人身不可分离、不具直接财产内容的权利义务关系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">特征\u003c/span>：\u003cspan class=\"blue\">主体地位平等\u003c/span>，不能强加意志\u003c/li>\u003cli>\u003cspan class=\"blue\">与人身相连，不能随意转移\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">无直接财产内容，但可成为财产关系前提\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一个人的名誉和亲子身份跟着本人走，不能像东西一样卖给别人。\u003c/p>","count":4,"chars":89,"gap":false},{"id":"civil-1794843503007","n":7,"chapter":"绪论与民事法律关系","title":"财产关系的概念及其内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">财产关系：平等主体间以财产归属、流转为内容的权利义务关系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">归属关系说明财产归谁支配\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">流转关系说明财产怎样交换、转移\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>财产关系既管东西归谁，也管它怎样通过买卖、赠与等方式从一人转给另一人。\u003c/p>","count":3,"chars":55,"gap":false},{"id":"civil-1794843503008","n":8,"chapter":"绪论与民事法律关系","title":"财产关系的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：平等主体之间以财产归属和财产流转为内容的权利义务关系\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">特征\u003c/span>：主体法律地位平等；意思表示\u003cspan class=\"blue\">自由\u003c/span>；内容是财产归属和流转；财产交易\u003cspan class=\"blue\">大多\u003c/span>有偿\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>卖方可以开价、买方可以拒绝，双方地位平等，多数交易还要给付对价。\u003c/p>","count":2,"chars":67,"gap":false},{"id":"civil-1794843503009","n":9,"chapter":"绪论与民事法律关系","title":"民法基本原则的概念及其功能","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">基本原则的概念：效力贯穿（纵）于民法始终的基本准则，是对民事立法、民事行为和民事司法(横)有普遍指导意义的基本准则\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">基本原则的功能（3）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">指导\u003c/span>：立法执法司法均有\u003c/li>\u003cli>\u003cspan class=\"blue\">约束\u003c/span>：立法执法司法均有\u003c/li>\u003cli>\u003cspan class=\"blue\">基本原则的补充\u003c/span>：有具体规定须适用具体规定\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有具体规则就用规则，规则不清或没说到时，还能用基本原则解释和补缺。\u003c/p>","count":5,"chars":109,"gap":false},{"id":"civil-1794843503010","n":10,"chapter":"绪论与民事法律关系","title":"平等原则的具体表现（内容）","body":"\u003col>\u003cli>\u003cspan class=\"red\">能力平等：自然人的民事权利能力一律平等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">适用平等\u003c/span>：不同民事主体参与民事法律关系适用同一法律，\u003cspan class=\"blue\">处于\u003c/span>平等的\u003cspan class=\"blue\">地位\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">平等协商\u003c/span>：民事主体在民事法律关系中须\u003cspan class=\"blue\">平等协商\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">平等保护\u003c/span>：对权利平等的保护\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>不管一方有多少钱或是什么身份，发生民事纠纷时也不能天然高对方一等。\u003c/p>","count":4,"chars":87,"gap":false},{"id":"civil-1794843503011","n":11,"chapter":"绪论与民事法律关系","title":"自愿原则的具体表现（内容）","body":"\u003col>\u003cli>\u003cspan class=\"red\">是否参加、如何参加：民事主体有权自主决定是否参加民事活动及如何参加民事活动\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">平等协商\u003c/span>：民事主体应以\u003cspan class=\"blue\">平等协商\u003c/span>的方式民事活动，就民事法律关系的设立、变更、终止\u003cspan class=\"blue\">达成合意\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">自主做出决定\u003c/span>：民事主体有权依其\u003cspan class=\"blue\">意愿\u003c/span>自主作出决定，并对其\u003cspan class=\"blue\">自由\u003c/span>表达的真实\u003cspan class=\"blue\">意愿\u003c/span>负责\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>你可以决定买不买、和谁买、怎么约，但约定仍得在法律允许的范围内。\u003c/p>","count":3,"chars":118,"gap":false},{"id":"civil-1794843503012","n":12,"chapter":"绪论与民事法律关系","title":"诚实信用原则的具体表现（内容）","body":"\u003col>\u003cli>\u003cspan class=\"red\">诚实：如实告知有关事实，不隐瞒、不欺骗\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">信用\u003c/span>：守约守信，正当行使权利、\u003cspan class=\"blue\">履行义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">善意补救\u003c/span>：发生损害时及时合理补救，防止损失扩大\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>谈合同不骗人，签好按约做，办完该保密的还要保密。\u003c/p>","count":3,"chars":61,"gap":false},{"id":"civil-1794843503013","n":13,"chapter":"绪论与民事法律关系","title":"违反公序良俗原则的行为","body":"\u003col>\u003cli>\u003cspan class=\"red\">大到小4：国家-家庭-两性-人权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">危害国家公序行为类型（类推）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">危害家庭关系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">违反两性道德准则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">违反人权和人格尊严\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">卖彩票\u003c/span>：营业-竞争-劳动-消费-射幸-暴利\u003c/li>\u003cli>\u003cspan class=\"blue\">限制营业自由\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">违反公共竞争\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">违反劳动者保护\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">违反消费者保护\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">射幸\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">暴利\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有些约定两边都同意，却伤害公共秩序或基本道德，法律就不会让它有效。\u003c/p>","count":12,"chars":104,"gap":false},{"id":"civil-1794843503014","n":14,"chapter":"绪论与民事法律关系","title":"绿色原则的意义","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">绿色原则的概念：民事主体的民事活动应符合资源的有效利用和环境保护的要求\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">绿色原则的内容：代际正义、可持续发展\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">绿色原则是代际正义的要求\u003c/span>，\u003cspan class=\"blue\">当代\u003c/span>社会经济的发展不能牺牲\u003cspan class=\"blue\">未来\u003c/span>的社会资源和环境\u003c/li>\u003cli>\u003cspan class=\"blue\">绿色原则也是社会可持续发展的要求\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">绿色原则也是倡导性的原则规定\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>人们做买卖、用财产时也要尽量少浪费、少污染，不能只顾自己方便。\u003c/p>","count":5,"chars":119,"gap":false},{"id":"civil-1794843503015","n":15,"chapter":"绪论与民事法律关系","title":"权利滥用的构成要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">当事人有权存在\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">权利人有行使权利行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">当事人行为有滥用权利的违法性\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>房子是你的，也不能专门为难邻居而用它做明显超出正当范围的事。\u003c/p>","count":3,"chars":31,"gap":false},{"id":"civil-1794843503016","n":16,"chapter":"绪论与民事法律关系","title":"人身关系与财产关系的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">性质：财产关系围绕财产利益，权利通常可转让\u003c/span>；人身关系围绕人格身份，不能与人分离\u003c/li>\u003cli>\u003cspan class=\"blue\">保护\u003c/span>：财产关系主要赔偿等财产责任；人身关系常用停止侵害、\u003cspan class=\"blue\">恢复\u003c/span>名誉等非财产方式\u003c/li>\u003cli>\u003cspan class=\"blue\">人身受侵同时造成经济损失，也可请求赔偿\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>名字和身份跟着人走，买卖的东西和钱通常能转手，两类关系管的是不同的事。\u003c/p>","count":3,"chars":96,"gap":false},{"id":"civil-1794843503017","n":17,"chapter":"绪论与民事法律关系","title":"民事权利的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">民事权利：主体为实现一定利益，依法作出或不作出行为的自由\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">可直接享有利益、实施行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">可请求义务人作为或不作为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">受侵害时可请求国家机关保护，是有法律保障的自由\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>法律允许你自己做某件事，或要求别人做某件事，这份可以依法主张的利益就是权利。\u003c/p>","count":4,"chars":75,"gap":false},{"id":"civil-1794843503018","n":18,"chapter":"绪论与民事法律关系","title":"民事权利的分类","body":"\u003col>\u003cli>\u003cspan class=\"red\">成立要件是否全部实现：既得权，期待权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">相互关系\u003c/span>：主权利、从权利\u003c/li>\u003cli>\u003cspan class=\"blue\">民事权利的客体\u003c/span>：\u003cspan class=\"blue\">人身权\u003c/span>、财产权、其他\u003c/li>\u003cli>\u003cspan class=\"blue\">义务人\u003c/span>：\u003cspan class=\"blue\">绝对权\u003c/span>、相对权\u003c/li>\u003cli>\u003cspan class=\"blue\">民事权利的作用\u003c/span>：\u003cspan class=\"blue\">支配\u003c/span>、请求、抗辩、形成\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>同一项权利可以从管人还是管财产、能向谁主张、能不能单独存在等不同角度分类。\u003c/p>","count":5,"chars":78,"gap":false},{"id":"civil-1794843503019","n":19,"chapter":"绪论与民事法律关系","title":"以权利的作用为标准对民事权利的分类","body":"\u003col>\u003cli>\u003cspan class=\"red\">以权利作用分类：民事权利可分为支配权、请求权、抗辩权和形成权\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有的权利让你管东西，有的能请别人履行，有的一句话就能改变关系，有的可以挡住对方请求。\u003c/p>","count":1,"chars":30,"gap":false},{"id":"civil-1794843503020","n":20,"chapter":"绪论与民事法律关系","title":"民事权利行使的概念及其原则","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">含义：民事主体经行为实现权利\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">原则\u003c/span>：权利人可依法自主行使权利，同时须遵守法律、\u003cspan class=\"blue\">公序良俗\u003c/span>，不得滥用权利损害国家利益、\u003cspan class=\"blue\">社会公共利益\u003c/span>或他人合法权益\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有权也要按合适的方法使用，不能反过来拿自己的权利伤害别人。\u003c/p>","count":2,"chars":69,"gap":false},{"id":"civil-1794843503021","n":21,"chapter":"绪论与民事法律关系","title":"民事义务的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">民事义务：为满足权利人利益，依法或依约应作为、不作为的约束\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须在法律规定、约定范围履行\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不履行须依法担责，权利人可请求履行或救济\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有了义务就不能想做才做，法律可以要求你交货，也可以要求你别妨碍别人。\u003c/p>","count":3,"chars":62,"gap":false},{"id":"civil-1794843503022","n":22,"chapter":"绪论与民事法律关系","title":"民事责任的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">民事责任：违反民事义务而承担的不利民事法律后果\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">原则是一方向另一方承担\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">归责有过错、无过错等形式\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">允许在法定范围协商\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主要填补、恢复损害，通常不具惩罚性，法定惩罚赔偿除外\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>本来该做的事没做而损害了别人，就可能要修好、赔钱或承担别的法律后果。\u003c/p>","count":5,"chars":81,"gap":false},{"id":"civil-1794843503023","n":23,"chapter":"绪论与民事法律关系","title":"民事责任的分类","body":"\u003col>\u003cli>\u003cspan class=\"red\">民事责任的分类5（无限单独侵权补充财产）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">无限有限\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">单独共同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">违约侵权其他\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按份连带补充\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">财产非财产\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>同样是承担责任，要先分清是因违约还是因侵权，再看由一个人承担还是多人分担。\u003c/p>","count":6,"chars":45,"gap":false},{"id":"civil-1794843503024","n":24,"chapter":"绪论与民事法律关系","title":"民事责任的担责规则","body":"\u003col>\u003cli>\u003cspan class=\"red\">按清偿范围：无限责任与有限责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按人数\u003c/span>：\u003cspan class=\"blue\">单独\u003c/span>责任与共同责任\u003c/li>\u003cli>\u003cspan class=\"blue\">按发生原因\u003c/span>：\u003cspan class=\"blue\">违约责任\u003c/span>、侵权责任及其他民事责任\u003c/li>\u003cli>\u003cspan class=\"blue\">多人负担方式\u003c/span>：按份责任、\u003cspan class=\"blue\">连带责任\u003c/span>和补充责任\u003c/li>\u003cli>\u003cspan class=\"blue\">按内容\u003c/span>：财产责任与非财产责任\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>几个人都要担责时，有的各担各的，有的受害人能向任一人要求全部，得看适用哪种规则。\u003c/p>","count":5,"chars":85,"gap":false},{"id":"civil-1794843503025","n":25,"chapter":"绪论与民事法律关系","title":"民事责任的免责事由","body":"\u003col>\u003cli>\u003cspan class=\"red\">正当理由抗辩-紧急自卫：紧急避险、正当防卫、自甘风险，自助\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">外来原因抗辩-不可抗力、受害人过错\u003c/span>（包括故意）、第三人原因\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>没有做好约定的事一般要担责，但如果确实符合法定免责情形，责任能相应减轻或免除。\u003c/p>","count":2,"chars":58,"gap":false},{"id":"civil-1794843503026","n":26,"chapter":"绪论与民事法律关系","title":"物的分类。生孳特主动","body":"\u003col>\u003cli>\u003cspan class=\"red\">派生：原物、孳息：依据两物间的派生关系，可以将物分为原物与孳息\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">特定物、种类物\u003c/span>：依据物是否有\u003cspan class=\"blue\">独特\u003c/span>特征或特定与否，可以将物分为种类物与特定物\u003c/li>\u003cli>\u003cspan class=\"blue\">主物、从物\u003c/span>：依据两物间的\u003cspan class=\"blue\">主从关系\u003c/span>，可以将物分为主物与从物\u003c/li>\u003cli>\u003cspan class=\"blue\">动产、不动产\u003c/span>：依据物是否有可\u003cspan class=\"blue\">移动性\u003c/span>，可以将物分为动产与不动产\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>能挪动的桌子和不能搬走的房子不同，同样一个物件还可以按用途或能不能分开再分类。\u003c/p>","count":4,"chars":126,"gap":false},{"id":"civil-1794843503027","n":27,"chapter":"绪论与民事法律关系","title":"民事法律事实的概念及其法律效果（包括民事法律关系的变动条件）","body":"\u003col>\u003cli>\u003cspan class=\"red\">民事法律事实：依法引起民事法律关系产生、变更、消灭的客观现象\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">产生\u003c/span>：取得权利、承担义务\u003c/li>\u003cli>\u003cspan class=\"blue\">变更\u003c/span>：既有关系的主体、客体、内容等变化\u003c/li>\u003cli>\u003cspan class=\"blue\">消灭\u003c/span>：原有权利义务关系终止\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>结婚、签约或一个人死亡等法律认可的事实发生后，原来的权利义务才可能改变。\u003c/p>","count":4,"chars":74,"gap":false},{"id":"civil-1794843503028","n":28,"chapter":"绪论与民事法律关系","title":"民事法律事实的类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">行为受人的意志支配，包括民事法律行为、准民事法律行为、事实行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">民事法律行为按意思表示产生效果\u003c/span>；准民事行为按法律规定产生效果，含意思通知、\u003cspan class=\"blue\">观念\u003c/span>通知、\u003cspan class=\"blue\">感情\u003c/span>表达\u003c/li>\u003cli>\u003cspan class=\"blue\">事实行为不以设立权利义务为目的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">自然事实不受意志支配，分事件、状态\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>签合同由人主动做，死亡等事件可以不由人决定，但两类事实都可能带来法律后果。\u003c/p>","count":4,"chars":109,"gap":false},{"id":"civil-1794843503029","n":29,"chapter":"第一编 民法总则","title":"民事权利能力的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">民事权利能力：法律赋予自然人享有民事权利、承担民事义务的资格\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">内容、范围法定，不能随意放弃\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">与主体人身不可分离\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">兼含享权、担义务的资格\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">只是资格，不等于已实际取得某项权利\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>婴儿可以依法继承财产，说明能拥有权利和能自己决定怎么行使权利是两回事。\u003c/p>","count":5,"chars":81,"gap":false},{"id":"civil-1794843503030","n":30,"chapter":"第一编 民法总则","title":"死亡推定的顺序","body":"\u003col>\u003cli>\u003cspan class=\"red\">前提：相互有继承关系+同一事件中死亡+死亡时间难以确定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">逻辑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">没有其他继承人\u003c/span>：先死\u003c/li>\u003cli>\u003cspan class=\"blue\">都有其他继承人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">辈分不同\u003c/span>：\u003cspan class=\"blue\">长辈\u003c/span>先死\u003c/li>\u003cli>\u003cspan class=\"blue\">辈分相同\u003c/span>：\u003cspan class=\"blue\">同时\u003c/span>死，相互不发生继承关系\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>同一事故里几人死亡、先后查不清时，先看各自是否还有别的继承人，再按亲属辈分推定。\u003c/p>","count":6,"chars":73,"gap":false},{"id":"civil-1794843503031","n":31,"chapter":"第一编 民法总则","title":"民事行为能力的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">民事行为能力：自然人以自己行为参加民事活动、取得权利和承担义务的能力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有无法定，不随个人意愿决定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">范围与年龄、精神状况有关\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">非依法定条件、程序，不得限制或取消\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>能有一项权利是一回事，能否凭自己的行为有效买卖或签约是另一回事。\u003c/p>","count":4,"chars":76,"gap":false},{"id":"civil-1794843503032","n":32,"chapter":"第一编 民法总则","title":"民事行为能力的类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">完全：能辨认行为的成年人\u003c/span>；\u003cspan class=\"blue\">16周岁\u003c/span>以上以\u003cspan class=\"blue\">劳动\u003c/span>收入为主要生活来源者视为完全能力\u003c/li>\u003cli>\u003cspan class=\"blue\">限制\u003c/span>：\u003cspan class=\"blue\">8周岁\u003c/span>以上未成年人、不能\u003cspan class=\"blue\">完全辨认\u003c/span>的成年人；纯获\u003cspan class=\"blue\">利益\u003c/span>或适龄适智行为有效，其他须代理、同意或追认\u003c/li>\u003cli>\u003cspan class=\"blue\">无能力\u003c/span>：不满\u003cspan class=\"blue\">8周岁\u003c/span>或不能辨认者，由法定代理人代理，\u003cspan class=\"blue\">自行\u003c/span>行为\u003cspan class=\"blue\">无效\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>年龄和辨认能力不同，自己做决定的范围也不同，超出范围时要看监护人是否同意或追认。\u003c/p>","count":3,"chars":118,"gap":false},{"id":"civil-1794843503033","n":33,"chapter":"第一编 民法总则","title":"监护关系的分类","body":"\u003col>\u003cli>\u003cspan class=\"red\">意定：完全能力成年人书面预定，失能时启动\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法定\u003c/span>：依法定顺序确定\u003c/li>\u003cli>\u003cspan class=\"blue\">遗嘱\u003c/span>：任监护人的\u003cspan class=\"blue\">父母\u003c/span>遗嘱指定\u003c/li>\u003cli>\u003cspan class=\"blue\">协议\u003c/span>：有资格者\u003cspan class=\"blue\">协商\u003c/span>，尊重本人意愿\u003c/li>\u003cli>\u003cspan class=\"blue\">指定\u003c/span>：\u003cspan class=\"blue\">争议\u003c/span>由有关组织或法院确定，最\u003cspan class=\"blue\">有利于被监护人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">机关\u003c/span>：无适格者时\u003cspan class=\"blue\">民政\u003c/span>或合条件居村委会担任\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有的监护人由法律排定，有的按遗嘱、协议或指定确定，关键是看监护资格怎么来的。\u003c/p>","count":6,"chars":104,"gap":false},{"id":"civil-1794843503034","n":34,"chapter":"第一编 民法总则","title":"法定监护的顺序","body":"\u003col>\u003cli>\u003cspan class=\"red\">未成年人：父母（法定）—&gt;协议/遗嘱—&gt;顺序（法定）—&gt;指定—&gt;机关\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法定\u003c/span>：父母、祖父母\u003cspan class=\"blue\">外祖父母\u003c/span>、兄姐、其他个人或组织愿意且同意\u003c/li>\u003cli>\u003cspan class=\"blue\">无民事行为能力的成年人\u003c/span>：意定（\u003cspan class=\"blue\">委托\u003c/span>）—&gt;协议/遗嘱—&gt;顺序（\u003cspan class=\"blue\">法定\u003c/span>）—&gt;指定—&gt;机关\u003c/li>\u003cli>\u003cspan class=\"blue\">法定\u003c/span>：配偶、父母\u003cspan class=\"blue\">子女\u003c/span>、其他\u003cspan class=\"blue\">近亲属\u003c/span>、其他个人或组织愿意且同意\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>父母通常先做未成年人的监护人，父母不能担任时，再按法律规定往下找。\u003c/p>","count":4,"chars":133,"gap":false},{"id":"civil-1794843503035","n":35,"chapter":"第一编 民法总则","title":"监护关系终止的法定事由","body":"\u003col>\u003cli>\u003cspan class=\"red\">法定事由：被监护人取得或恢复完全民事行为能力\u003c/span>；监护人丧失监护能力；被监护人或监护人死亡；法院认定终止的其他情形\u003c/li>\u003cli>\u003cspan class=\"blue\">后续处理\u003c/span>：原监护关系终止后仍需监护的，依法\u003cspan class=\"blue\">另行\u003c/span>确定监护人\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>被监护人能独立办事，或一方死亡等情形出现，原来的监护关系就不再维持。\u003c/p>","count":2,"chars":83,"gap":false},{"id":"civil-1794843503036","n":36,"chapter":"第一编 民法总则","title":"撤销监护人资格的法定事由","body":"\u003col>\u003cli>\u003cspan class=\"red\">监护人被撤销监护资格的原因\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">严损身心\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">实施严重损害被监护人身心健康行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">怠于无法+拒绝委托-&gt;危困状态\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">怠于履行监护职责\u003c/span>，无法履行\u003cspan class=\"blue\">监护职责\u003c/span>，同时拒绝将\u003cspan class=\"blue\">监护职责\u003c/span>部分或全部委托他人，使被监护人无人照料，处于危困状态\u003c/li>\u003cli>\u003cspan class=\"blue\">严侵其他\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">实施严重侵害被监护人合法权益的其他行为\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>监护人严重伤害被监护人或放着不管，法院可以撤掉资格，再安排别人负责。\u003c/p>","count":7,"chars":124,"gap":false},{"id":"civil-1794843503037","n":37,"chapter":"第一编 民法总则","title":"宣告失踪的概念及其条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">宣告失踪：利害关系人申请，法院依法宣告下落不明满法定期限者失踪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">下落不明持续满2年，从失去音讯起算\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">近亲属、有关权利义务人等有权申请\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法院公告3个月后依法判决，并确定财产代管人\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一个人很久没有消息，法院可以先指定人照看财产，把眼前的事管起来。\u003c/p>","count":4,"chars":85,"gap":false},{"id":"civil-1794843503038","n":38,"chapter":"第一编 民法总则","title":"人民法院宣告失踪的程序","body":"\u003col>\u003cli>\u003cspan class=\"red\">申请：自然人下落不明满二年，利害关系人可向法院申请宣告失踪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">寻人\u003c/span>：法院受理后发出\u003cspan class=\"blue\">寻找下落不明人的公告\u003c/span>，公告期\u003cspan class=\"blue\">三个月\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">裁判\u003c/span>：公告\u003cspan class=\"blue\">期满\u003c/span>，依法作出判决；宣告失踪的，确定\u003cspan class=\"blue\">财产代管人\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>亲友等可先向法院申请，法院公告找人，仍没有消息才判决并安排人代管财产。\u003c/p>","count":3,"chars":84,"gap":false},{"id":"civil-1794843503039","n":39,"chapter":"第一编 民法总则","title":"宣告死亡的概念及其条件","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：利害关系人申请，由法院依条件和程序宣告下落不明的自然人死亡\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">期限\u003c/span>：一般下落不明满\u003cspan class=\"blue\">4年\u003c/span>；因意外事件下落不明满\u003cspan class=\"blue\">2年\u003c/span>；有关机关证明因意外事件不可能生存的，不受满\u003cspan class=\"blue\">2年\u003c/span>限制\u003c/li>\u003cli>\u003cspan class=\"blue\">程序\u003c/span>：利害关系人申请；法院依法\u003cspan class=\"blue\">发出\u003c/span>寻人公告，\u003cspan class=\"blue\">期满\u003c/span>后依法裁判\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一个人下落不明达到法定条件，法院可以依法按死亡处理，及时确定财产和身份关系。\u003c/p>","count":3,"chars":112,"gap":false},{"id":"civil-1794843503040","n":40,"chapter":"第一编 民法总则","title":"申请宣告死亡的利害关系人","body":"\u003col>\u003cli>\u003cspan class=\"red\">尽义务丧偶儿媳女婿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">配偶、父母、子女（3）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">符合条件的其他近亲属、代位继承人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">配偶父母子女均死亡或下落不明\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不申请不能保护其合法权益\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有民事权利义务关系的主体不能\u003c/span>，但不申请不能保护其合法权益除外\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>能申请的不是随便一个知情人，而是和失踪人生死结果有法律利害关系的人。\u003c/p>","count":6,"chars":92,"gap":false},{"id":"civil-1794843503041","n":41,"chapter":"第一编 民法总则","title":"人民法院宣告死亡的程序","body":"\u003col>\u003cli>\u003cspan class=\"red\">利害关系人依法向法院申请，通常下落不明满4年\u003c/span>；意外事件满2年可申请\u003c/li>\u003cli>\u003cspan class=\"blue\">法院通常公告1年\u003c/span>；有关机关证明因意外不可能生存的，公告3个月，不受2年限制\u003c/li>\u003cli>\u003cspan class=\"blue\">公告期满依法判决，死亡日期依法确认\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>申请后先公告找人，公告期满仍无消息时，法院才依法作出死亡宣告。\u003c/p>","count":3,"chars":87,"gap":false},{"id":"civil-1794843503042","n":42,"chapter":"第一编 民法总则","title":"个体工商户的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：自然人工商业经营，经依法登记，为个体工商户\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">特征\u003c/span>：属于个体经济，可以起字号，以户名义\u003cspan class=\"blue\">开展经营\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">债务承担\u003c/span>：个人经营以\u003cspan class=\"blue\">个人财产\u003c/span>承担；家庭经营或无法区分的，以\u003cspan class=\"blue\">家庭财产\u003c/span>承担\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>自然人依法登记开小店可以成为个体工商户，经营债务按个人或家庭经营的情况承担。\u003c/p>","count":3,"chars":83,"gap":false},{"id":"civil-1794843503043","n":43,"chapter":"第一编 民法总则","title":"法人的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：有民事权利能力和民事行为能力，依法独立享有民事权利、承担民事义务的组织\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">特征\u003c/span>：是依法成立的\u003cspan class=\"blue\">社会组织\u003c/span>；有相应民事权利能力和民事行为能力；以全部财产\u003cspan class=\"blue\">独立承担民事责任\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>公司等组织能用自己的名字办事、自己担责，不能把它和创办人当成同一个人。\u003c/p>","count":2,"chars":82,"gap":false},{"id":"civil-1794843503044","n":44,"chapter":"第一编 民法总则","title":"法人设立的概念及其条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">法人设立：创设法人的一系列行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法成立\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有自己的名称、组织机构、住所\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有独立财产或经费，能依法独立承担民事责任\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有意开一家公司还不够，得具备法定条件，并按规定走完设立手续。\u003c/p>","count":4,"chars":53,"gap":false},{"id":"civil-1794843503045","n":45,"chapter":"第一编 民法总则","title":"社团法人与财团法人的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">基础：社团以成员结合，财团以捐助财产结合\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">目的\u003c/span>：社团可\u003cspan class=\"blue\">营利\u003c/span>、非\u003cspan class=\"blue\">营利\u003c/span>，财团通常公益\u003c/li>\u003cli>\u003cspan class=\"blue\">设立\u003c/span>：社团依\u003cspan class=\"blue\">共同\u003c/span>意思，财团依捐助、\u003cspan class=\"blue\">遗嘱\u003c/span>等\u003c/li>\u003cli>\u003cspan class=\"blue\">组织\u003c/span>：社团有成员和意思机关，财团无成员\u003c/li>\u003cli>\u003cspan class=\"blue\">解散原因、剩余财产处理不同；公益财产不得私分\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>社团是人聚在一起办事，财团是把一份财产拿出来专门实现特定目的。\u003c/p>","count":5,"chars":100,"gap":false},{"id":"civil-1794843503046","n":46,"chapter":"第一编 民法总则","title":"非营利法人的概念及其类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">非营利法人：为公益或其他非营利目的成立，不向出资、设立人分配利润的法人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">事业单位法人\u003c/span>：服务经济社会发展\u003c/li>\u003cli>\u003cspan class=\"blue\">社会团体法人\u003c/span>：基于\u003cspan class=\"blue\">会员\u003c/span>共同意愿\u003c/li>\u003cli>\u003cspan class=\"blue\">捐助法人\u003c/span>：以捐助财产设\u003cspan class=\"blue\">基金\u003c/span>会、社会服务机构等\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>公益组织可以有收入，但设立目的不是把所得利润分给出资人。\u003c/p>","count":4,"chars":87,"gap":false},{"id":"civil-1794843503047","n":47,"chapter":"第一编 民法总则","title":"特别法人的概念及其类型","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：营利法人、非营利法人外，有特别法定目的或组织性质的法人\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">类型\u003c/span>：机关法人、\u003cspan class=\"blue\">农村\u003c/span>集体经济组织法人、城镇\u003cspan class=\"blue\">农村\u003c/span>的合作经济组织法人、基层\u003cspan class=\"blue\">群众性\u003c/span>自治组织法人\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有些组织承担特殊公共或集体事务，按专门的法人规则管理。\u003c/p>","count":2,"chars":74,"gap":false},{"id":"civil-1794843503048","n":48,"chapter":"第一编 民法总则","title":"营利法人的概念及其机构","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：以取得利润并分配给股东等出资人为目的成立的法人\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">权力机构\u003c/span>：修改章程，\u003cspan class=\"blue\">选举\u003c/span>或更换执行、\u003cspan class=\"blue\">监督机构\u003c/span>成员，\u003cspan class=\"blue\">行使\u003c/span>章程规定的其他职权\u003c/li>\u003cli>\u003cspan class=\"blue\">执行机构\u003c/span>：召集\u003cspan class=\"blue\">权力机构会议\u003c/span>，决定经营计划、投资方案和内部机构设置等；\u003cspan class=\"blue\">法定代表人\u003c/span>按章程及法律确定\u003c/li>\u003cli>\u003cspan class=\"blue\">监督机构\u003c/span>：检查法人\u003cspan class=\"blue\">财务\u003c/span>，监督\u003cspan class=\"blue\">执行机构\u003c/span>成员及高级\u003cspan class=\"blue\">管理人\u003c/span>员履职\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>公司要赚钱分配收益，也要分清谁作决定、谁执行、谁监督。\u003c/p>","count":4,"chars":138,"gap":false},{"id":"civil-1794843503049","n":49,"chapter":"第一编 民法总则","title":"非营利法人的概念及其机构","body":"\u003col>\u003cli>\u003cspan class=\"red\">非营利法人不向出资、设立人分配利润\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">事业单位依法设决策、执行机构\u003c/span>\u003c/li>\u003cli>社会团体设\u003cspan class=\"blue\">会员\u003c/span>大会或代表大会等权力机构、理事会等执行机构\u003c/li>\u003cli>\u003cspan class=\"blue\">捐助法人设理事会等决策、执行机构\u003c/span>，并依法设监事会等监督机构\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>公益组织的机构要让事务有人决策、有人执行和监督，以保证公益财产用于原定目的。\u003c/p>","count":4,"chars":88,"gap":false},{"id":"civil-1794843503050","n":50,"chapter":"第一编 民法总则","title":"法人的变更","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：法人存续期间，组织或登记事项发生变化\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">分立\u003c/span>：一个法人\u003cspan class=\"blue\">分成\u003c/span>两个以上，有创设式和存续式\u003c/li>\u003cli>\u003cspan class=\"blue\">合并\u003c/span>：两个以上合为一个，有创设式和\u003cspan class=\"blue\">吸收\u003c/span>式\u003c/li>\u003cli>\u003cspan class=\"blue\">其他\u003c/span>：组织形式、\u003cspan class=\"blue\">名称\u003c/span>、住所、\u003cspan class=\"blue\">注册\u003c/span>资本或经营范围等可依法变更\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>法人换名字、合并或分立时，先分清哪一项变了，再看原有债务由谁接着承担。\u003c/p>","count":4,"chars":92,"gap":false},{"id":"civil-1794843503051","n":51,"chapter":"第一编 民法总则","title":"法人终止的原因","body":"\u003col>\u003cli>\u003cspan class=\"red\">解散\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">5事先事后，一好一坏一其他\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">章程规定的存续期间届满或解散事由出现\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法人的权力机构决议解散\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法人合并或分立导致解散\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法人被吊销营业执照、登记证书、被责令关闭或撤销\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律规定的其他情形\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法被宣告破产\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律规定的其他原因\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>法人解散或破产后，要按规定清算并办理终止手续，把未了的债务处理好。\u003c/p>","count":9,"chars":103,"gap":false},{"id":"civil-1794843503052","n":52,"chapter":"第一编 民法总则","title":"非法人组织的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">非法人组织：不具法人资格，但可依法以自己名义从事民事活动的组织\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有相应民事权利、行为能力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有一定组织稳定性，通常具人合性质\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不能独立承担最终民事责任\u003c/span>；财产不足时，出资人、设立人依法承担相应责任\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有些组织能用自己的名字经营或签合同，即使没有法人资格，也能参加民事活动。\u003c/p>","count":4,"chars":93,"gap":false},{"id":"civil-1794843503053","n":53,"chapter":"第一编 民法总则","title":"非法人组织的类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">个人独资企业：一人投资，财产归投资人，投资人以个人财产负无限责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">合伙企业\u003c/span>：依合伙协议共同\u003cspan class=\"blue\">出资\u003c/span>、经营、共享收益、共担风险的营利组织\u003c/li>\u003cli>\u003cspan class=\"blue\">其他非法人专业服务机构\u003c/span>：无独立法人资格，凭专业\u003cspan class=\"blue\">知识\u003c/span>、技能提供有偿服务\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>个人独资企业、合伙企业等都可自己名义办事，但责任规则要按各自的组织形式来判断。\u003c/p>","count":3,"chars":98,"gap":false},{"id":"civil-1794843503054","n":54,"chapter":"第一编 民法总则","title":"普通合伙企业的设立条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">设立条件5（人若守约，名利双收）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有两个以上合伙人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有书面合伙协议\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有合伙企业的名称和生产经营场所\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有合伙人认缴或实缴的出资\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律、行政法规规定的其他条件\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>几个人想做普通合伙，要把合伙协议、出资、名称和经营场所等安排符合法律要求。\u003c/p>","count":6,"chars":72,"gap":false},{"id":"civil-1794843503055","n":55,"chapter":"第一编 民法总则","title":"有限合伙企业的设立条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">2至50名合伙人，至少1名普通合伙人，法律另有规定除外\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国有独资\u003c/span>企业、\u003cspan class=\"blue\">国有\u003c/span>公司、上市公司及公益事业单位、社会团体不得作普通合伙人\u003c/li>\u003cli>\u003cspan class=\"blue\">名称标明“有限合伙”\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有限合伙人可用货币、实物、知识产权等出资\u003c/span>，不得劳务出资\u003c/li>\u003cli>\u003cspan class=\"blue\">还须协议、名称场所等普通设立条件\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有限合伙里至少得有人作为普通合伙人负责，其他人可按有限合伙规则只在规定范围内担责。\u003c/p>","count":5,"chars":116,"gap":false},{"id":"civil-1794843503056","n":56,"chapter":"第一编 民法总则","title":"民事法律行为的分类","body":"\u003col>\u003cli>\u003cspan class=\"red\">按意思表示：单方、双方、多方、决议行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按效果\u003c/span>：\u003cspan class=\"blue\">身份\u003c/span>、财产行为\u003c/li>\u003cli>\u003cspan class=\"blue\">按依从\u003c/span>：主、从行为\u003c/li>\u003cli>\u003cspan class=\"blue\">按形式\u003c/span>：要式、不要式\u003c/li>\u003cli>\u003cspan class=\"blue\">按对价\u003c/span>：有偿、\u003cspan class=\"blue\">无偿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按作用\u003c/span>：\u003cspan class=\"blue\">负担\u003c/span>、处分\u003c/li>\u003cli>\u003cspan class=\"blue\">按与原因关系\u003c/span>：有因、无因\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>同一个买卖可以从几方同意、要不要交付、有无对价等不同角度定性。\u003c/p>","count":7,"chars":79,"gap":false},{"id":"civil-1794843503057","n":57,"chapter":"第一编 民法总则","title":"民事法律行为按照取决于几方的意思表示而成立进行的分类","body":"\u003col>\u003cli>\u003cspan class=\"red\">单方行为：一方意思表示即可成立\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">双方行为与多方行为\u003c/span>：双方或多方\u003cspan class=\"blue\">意思表示一致\u003c/span>而成立\u003c/li>\u003cli>\u003cspan class=\"blue\">决议行为\u003c/span>：法人、\u003cspan class=\"blue\">非法人组织\u003c/span>依照议事方式和表决程序作出\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>遗嘱靠一方作出，买卖靠两方合意，多人一起设立组织则可能是多方行为。\u003c/p>","count":3,"chars":65,"gap":false},{"id":"civil-1794843503058","n":58,"chapter":"第一编 民法总则","title":"有因行为与无因行为的概念及其区分意义","body":"\u003col>\u003cli>\u003cspan class=\"red\">有因行为：效力受原因关系影响\u003c/span>，如原因约定\u003cspan class=\"blue\">无效\u003c/span>，可能连带影响行为效力\u003c/li>\u003cli>\u003cspan class=\"blue\">无因行为\u003c/span>：效力原则上\u003cspan class=\"blue\">独立\u003c/span>于原因关系\u003c/li>\u003cli>\u003cspan class=\"blue\">区分意义\u003c/span>：基础原因有问题时，\u003cspan class=\"blue\">判断\u003c/span>本行为是否随之失效\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>关键看基础原因有问题时，会不会连带影响这一行为本身的效力。\u003c/p>","count":3,"chars":75,"gap":false},{"id":"civil-1794843503059","n":59,"chapter":"第一编 民法总则","title":"负担行为与处分行为的概念及其区分意义","body":"\u003col>\u003cli>\u003cspan class=\"red\">负担行为：以发生给付义务为内容\u003c/span>，\u003cspan class=\"blue\">例如\u003c/span>订立买卖合同\u003c/li>\u003cli>\u003cspan class=\"blue\">处分行为\u003c/span>：直接使既有权发生\u003cspan class=\"blue\">转让\u003c/span>、变更或消灭\u003c/li>\u003cli>\u003cspan class=\"blue\">区分意义\u003c/span>：订约产生义务与完成权利\u003cspan class=\"blue\">变动\u003c/span>分别判断，\u003cspan class=\"blue\">处分行为\u003c/span>通常要求处分权\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>签买卖合同先欠下交货义务，按规定交付或过户才直接改变东西的权属。\u003c/p>","count":3,"chars":79,"gap":false},{"id":"civil-1794843503060","n":60,"chapter":"第一编 民法总则","title":"独立行为与辅助行为的概念及其区分意义","body":"\u003col>\u003cli>\u003cspan class=\"red\">独立行为：有自己独立的法律目的和内容，能独立发挥作用的民事法律行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">辅助行为\u003c/span>：本身不独立实现法律目的，而是帮助另一法律行为生效行为，如对\u003cspan class=\"blue\">效力待定\u003c/span>法律行为的追认\u003c/li>\u003cli>\u003cspan class=\"blue\">区分意义\u003c/span>：\u003cspan class=\"blue\">独立行为\u003c/span>可以独立发生法律效果；\u003cspan class=\"blue\">辅助行为依附于\u003c/span>其他行为，作用是补足其生效条件\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>买卖可以自己发生效果，追认则是为了补足另一个行为生效所需要的条件。\u003c/p>","count":3,"chars":120,"gap":false},{"id":"civil-1794843503061","n":61,"chapter":"第一编 民法总则","title":"民事法律行为的成立要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">一般成立要件：任何民事法律行为成立均需具备的共同要件：有行为人、意思表示、标的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">特别成立要件\u003c/span>：成立\u003cspan class=\"blue\">某一\u003c/span>具体的民事法律行为，除\u003cspan class=\"blue\">需要\u003c/span>具备\u003cspan class=\"blue\">一般成立要件\u003c/span>外，还须具备的其他特殊事实要素\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先看有没有人把意思表示出来、内容是否达到成立要求，再问这个行为是否有效。\u003c/p>","count":2,"chars":86,"gap":false},{"id":"civil-1794843503062","n":62,"chapter":"第一编 民法总则","title":"意思表示的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">意思表示：向外部表达意欲发生私法效果的内心意思，是民事法律行为的核心要素\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">由内在意思到外在表达\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">以设立、变更、终止法律关系为目的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依有效要件是否齐备，产生有效、无效、可撤销等不同效果\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>心里想买东西不够，要把这个想法用话或行动表达出来，才可能发生法律效果。\u003c/p>","count":4,"chars":88,"gap":false},{"id":"civil-1794843503063","n":63,"chapter":"第一编 民法总则","title":"意思表示的形式","body":"\u003col>\u003cli>\u003cspan class=\"red\">口头：直接用语言表示\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">书面\u003c/span>：\u003cspan class=\"blue\">文字\u003c/span>、符号及可调取的数据电文等\u003c/li>\u003cli>\u003cspan class=\"blue\">默示\u003c/span>：通过行为推知意思；沉默仅在法律规定、约定或交易习惯下才构成意思表示\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>可以开口、写下来或用行动表态，单纯沉默只有在法定或约定等情况下才算表态。\u003c/p>","count":3,"chars":64,"gap":false},{"id":"civil-1794843503064","n":64,"chapter":"第一编 民法总则","title":"意思表示的生效时间","body":"\u003col>\u003cli>\u003cspan class=\"red\">有相对人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">对话，知道其内容时生效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">非对话，到达相对人时生效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">釆用数据电文形式的意思表示\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有约定按约定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">相对人指定特定系统接收的，进入时生效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">未指定的，相对人知道或应知道进入其系统时生效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">无相对人\u003c/span>：表示完成时生效\u003c/li>\u003cli>\u003cspan class=\"blue\">公告方式\u003c/span>：公告\u003cspan class=\"blue\">发布\u003c/span>时生效\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>面对面说通常当场生效，发消息通常要看什么时候到达对方。\u003c/p>","count":9,"chars":110,"gap":false},{"id":"civil-1794843503065","n":65,"chapter":"第一编 民法总则","title":"民事法律行为的有效要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">行为人合格\u003c/span>\u003cspan class=\"blue\">。有相应民事行为能力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">意思表示真实。外部表示与其内心意思相一致\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不违反法律、行政法规的强制性规定，不违背公序良俗\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>能不能签、是否真心、是否违反强制性规定或公共道德，要逐项检查。\u003c/p>","count":3,"chars":59,"gap":false},{"id":"civil-1794843503066","n":66,"chapter":"第一编 民法总则","title":"附条件的民事法律行为所附条件的特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">或然性：（可能发生）：条件应是将来可能发生也可能不发生的事实\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">未来性\u003c/span>：（将来发生）：条件应是将来发生的事实\u003c/li>\u003cli>\u003cspan class=\"blue\">合法性\u003c/span>：（合法事实）：条件应是合法的事实\u003c/li>\u003cli>\u003cspan class=\"blue\">意定性\u003c/span>：（双方约定）：条件应是当事人\u003cspan class=\"blue\">商定\u003c/span>的事实，有\u003cspan class=\"blue\">非法\u003c/span>定性\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>所附条件是未来可能发生也可能不发生的事，不能把已经确定的事当条件。\u003c/p>","count":4,"chars":101,"gap":false},{"id":"civil-1794843503067","n":67,"chapter":"第一编 民法总则","title":"无效的法律行为的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">无效行为：已成立但欠缺有效要件，不发生预期法律效果\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">绝对、确定无效，不因普通追认而转为有效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">自始、当然无效，无须先由当事人行使撤销权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">部分无效不影响其他部分的，其他部分仍有效\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>无效的行为从一开始就没有预期的法律效力，不用等人来撤销。\u003c/p>","count":4,"chars":84,"gap":false},{"id":"civil-1794843503068","n":68,"chapter":"第一编 民法总则","title":"无效的法律行为的类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">能力欠缺：无民事行为能力人实施的民事法律行为无效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">意思虚假\u003c/span>：双方以虚假意思表示实施行为无效，\u003cspan class=\"blue\">隐藏\u003c/span>行为另依法\u003cspan class=\"blue\">判断\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">恶意串通\u003c/span>：双方\u003cspan class=\"blue\">恶意串通\u003c/span>损害他人合法\u003cspan class=\"blue\">权益\u003c/span>行为无效\u003c/li>\u003cli>\u003cspan class=\"blue\">内容违法\u003c/span>：\u003cspan class=\"blue\">违反\u003c/span>法律、\u003cspan class=\"blue\">行政法规\u003c/span>的强制性规定行为无效，但该规定不导致无效的除外\u003c/li>\u003cli>\u003cspan class=\"blue\">违背公序良俗\u003c/span>：\u003cspan class=\"blue\">违背公序良俗\u003c/span>行为无效\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>不能只看有无签字，碰到虚假表示、恶意串通等法定问题，也可能从一开始无效。\u003c/p>","count":5,"chars":131,"gap":false},{"id":"civil-1794843503069","n":69,"chapter":"第一编 民法总则","title":"无效的法律行为的法律后果","body":"\u003col>\u003cli>\u003cspan class=\"red\">返还：因无效行为取得的财产，应返还\u003c/span>；不能\u003cspan class=\"blue\">返还\u003c/span>或无须\u003cspan class=\"blue\">返还\u003c/span>的，\u003cspan class=\"blue\">折价补偿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">损失\u003c/span>：有过错一方\u003cspan class=\"blue\">赔偿\u003c/span>对方所受\u003cspan class=\"blue\">损失\u003c/span>；各方均有过错的，分别承担相应\u003cspan class=\"blue\">责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">例外\u003c/span>：法律另有规定的，从其规定\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>拿了别人的东西通常要还，还不了就按值补偿；导致别人受损的过错方还可能要赔。\u003c/p>","count":3,"chars":81,"gap":false},{"id":"civil-1794843503070","n":70,"chapter":"第一编 民法总则","title":"可撤销的法律行为的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">可撤销行为：因意思表示瑕疵等，撤销权人可请求法院或仲裁机构撤销的民事法律行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主要因意思不真实\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须权利人主动依法行使撤销权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">撤销前有效，撤销后自始无效\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>合同有法定瑕疵时，受保护的一方能选择撤销，撤销后才按自始无效处理。\u003c/p>","count":4,"chars":72,"gap":false},{"id":"civil-1794843503071","n":71,"chapter":"第一编 民法总则","title":"可撤销的法律行为的类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">重大误解：对行为性质、当事人或标的等有重大认识错误，并基于错误作出意思表示\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">欺诈\u003c/span>：一方\u003cspan class=\"blue\">欺诈\u003c/span>使对方违背真实意思而为行为；第三人\u003cspan class=\"blue\">欺诈\u003c/span>还要求相对人知道或应知道\u003c/li>\u003cli>\u003cspan class=\"blue\">胁迫\u003c/span>：一方或第三人\u003cspan class=\"blue\">胁迫\u003c/span>，使一方违背真实意思\u003cspan class=\"blue\">实施\u003c/span>行为\u003c/li>\u003cli>\u003cspan class=\"blue\">显失公平\u003c/span>：一方\u003cspan class=\"blue\">利用\u003c/span>对方危困、\u003cspan class=\"blue\">缺乏\u003c/span>判断能力等，致行为成立时\u003cspan class=\"blue\">显失公平\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>受骗、被逼或产生重大误解时，不必硬认原来的约定，可按法定条件请求撤销。\u003c/p>","count":4,"chars":132,"gap":false},{"id":"civil-1794843503072","n":72,"chapter":"第一编 民法总则","title":"重大误解的类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">行为性质\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">当事人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">标的物\u003c/span>：\u003cspan class=\"blue\">标的物\u003c/span>的\u003cspan class=\"blue\">种类\u003c/span>、规格、质量、数量\u003c/li>\u003cli>\u003cspan class=\"blue\">价金\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>本来要买甲却错当成乙，如果错误足以影响是否交易，就可能属于重大误解。\u003c/p>","count":4,"chars":28,"gap":false},{"id":"civil-1794843503073","n":73,"chapter":"第一编 民法总则","title":"显失公平的特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">构成：一方利用对方处于危困状态、缺乏判断能力等情形，致使民事法律行为成立时显失公平\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律后果\u003c/span>：受损害方\u003cspan class=\"blue\">有权\u003c/span>请求法院或仲裁机构撤销\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一方利用对方危困或缺乏判断，使合同成立时明显失衡，受损方才可能请求撤销。\u003c/p>","count":2,"chars":63,"gap":false},{"id":"civil-1794843503074","n":74,"chapter":"第一编 民法总则","title":"可撤销的法律行为与无效的法律行为的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">效力：无效自始当然不生效，可撤销在撤销前有效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">程序\u003c/span>：无效不以行使\u003cspan class=\"blue\">撤销权\u003c/span>为前提，撤销须请求法院或仲裁\u003c/li>\u003cli>\u003cspan class=\"blue\">主体\u003c/span>：撤销只由\u003cspan class=\"blue\">撤销权\u003c/span>人行使，无效可由适格当事人、\u003cspan class=\"blue\">利害关系人\u003c/span>主张\u003c/li>\u003cli>\u003cspan class=\"blue\">部分撤销不影响其余可独立有效部分\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>无效是法律从一开始就不认，可撤销则是先给受保护的一方一个选择。\u003c/p>","count":4,"chars":95,"gap":false},{"id":"civil-1794843503075","n":75,"chapter":"第一编 民法总则","title":"效力未定的法律行为的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">效力待定：行为已成立，但欠缺法定生效条件，须有权人追认或拒绝才能确定效力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">既非当然有效，也非确定无效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">典型有超出限制能力范围的行为、无权代理\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">无权处分不当然使买卖合同待定，应区分合同与物权效果\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有些合同订了还不能确定能不能生效，要等有权的人补上是否同意的答复。\u003c/p>","count":4,"chars":93,"gap":false},{"id":"civil-1794843503076","n":76,"chapter":"第一编 民法总则","title":"效力未定的法律行为的法律后果","body":"\u003col>\u003cli>\u003cspan class=\"red\">补正：法定事由出现或有权人追认，待定行为可以生效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">拒绝追认\u003c/span>：相对人\u003cspan class=\"blue\">催告\u003c/span>后，有权人自收到通知起\u003cspan class=\"blue\">三十日\u003c/span>不表态，视为拒绝\u003c/li>\u003cli>\u003cspan class=\"blue\">撤销\u003c/span>：追认前\u003cspan class=\"blue\">善意相对人\u003c/span>可通知\u003cspan class=\"blue\">撤销\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有权人一旦依法追认，原行为可以生效；若不追认，就按未获授权的规则处理。\u003c/p>","count":3,"chars":72,"gap":false},{"id":"civil-1794843503077","n":77,"chapter":"第一编 民法总则","title":"代理的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：代理人在代理权限内以被代理人或自己名义与第三人实施法律行为，法律后果直接或间接由被代理人承受\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">特征\u003c/span>：有代理权且\u003cspan class=\"blue\">事项\u003c/span>可以代理；代理人\u003cspan class=\"blue\">独立\u003c/span>作出意思表示；\u003cspan class=\"blue\">直接代理\u003c/span>以被代理人名义，通常直接对被代理人生效；间接代理以代理人自己名义，后果依具体规则归属\u003c/li>\u003cli>\u003cspan class=\"blue\">限制\u003c/span>：依法律、约定或性质须本人亲自实施的，\u003cspan class=\"blue\">不得\u003c/span>代理\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>代理人在权限内用被代理人的名字办事，产生的后果直接由被代理人承受。\u003c/p>","count":3,"chars":147,"gap":false},{"id":"civil-1794843503078","n":78,"chapter":"第一编 民法总则","title":"代理人在代理权限范围内实施代理行为的含义","body":"\u003col>\u003cli>\u003cspan class=\"red\">（法律规定或当事人约定只能本人实施的事项）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律规定不能代理的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">事实行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">人身属性\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">特定技能\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">无相对人的单方法律行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">当事人约定不能代理的\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>别人只让你替他买桌子，你不能拿这份授权替他去买一辆车。\u003c/p>","count":7,"chars":63,"gap":false},{"id":"civil-1794843503079","n":79,"chapter":"第一编 民法总则","title":"代理权行使的原则","body":"\u003col>\u003cli>\u003cspan class=\"red\">权限：代理人须在代理权限范围内办理事务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">利益\u003c/span>：应为被\u003cspan class=\"blue\">代理人利益\u003c/span>处理事务，履行忠实、勤勉义务\u003c/li>\u003cli>\u003cspan class=\"blue\">禁止滥用\u003c/span>：不得擅自自己代理或双方代理；被代理人同意或追认的除外\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>代理是替别人办事，得按授权尽责，不能把代理权用来给自己占便宜。\u003c/p>","count":3,"chars":75,"gap":false},{"id":"civil-1794843503080","n":80,"chapter":"第一编 民法总则","title":"滥用代理权的情形","body":"\u003col>\u003cli>\u003cspan class=\"red\">自己代理：代理人代本人同自己交易\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">双方代理\u003c/span>：同时代理交易双方；上述原则禁止，但本人同意、追认有例外\u003c/li>\u003cli>\u003cspan class=\"blue\">恶意串通损害本人利益\u003c/span>，行为无效，代理人与相对人负\u003cspan class=\"blue\">连带责任\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>明明是替别人交易，却和自己做买卖、同时替双方办事或与对方串通，就可能滥用代理权。\u003c/p>","count":3,"chars":76,"gap":false},{"id":"civil-1794843503081","n":81,"chapter":"第一编 民法总则","title":"法定代理权的终止事由","body":"\u003col>\u003cli>\u003cspan class=\"red\">法定代理终止（4，（行不行走一个，加兜底））\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">被代理人取得恢复完全民事行为能力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">代理人丧失民事行为能力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">代理人或被代理人死亡\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">其他情形，监护关系消灭或收养关系解除\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>法定代理跟着被保护人的身份和能力走，相关身份或能力发生法定变化时就会终止。\u003c/p>","count":5,"chars":77,"gap":false},{"id":"civil-1794843503082","n":82,"chapter":"第一编 民法总则","title":"委托代理权的终止事由","body":"\u003col>\u003cli>\u003cspan class=\"red\">客观事由：代理期限届满或事务完成\u003c/span>；代理人丧失\u003cspan class=\"blue\">民事行为能力\u003c/span>；代理人或被代理人死亡；作为一方的法人或\u003cspan class=\"blue\">非法人组织\u003c/span>终止\u003c/li>\u003cli>\u003cspan class=\"blue\">意思事由\u003c/span>：被代理人取消委托，或代理人\u003cspan class=\"blue\">辞去\u003c/span>委托\u003c/li>\u003cli>\u003cspan class=\"blue\">例外\u003c/span>：被代理人死亡后的委托代理，在法律规定的\u003cspan class=\"blue\">特定\u003c/span>情形下仍\u003cspan class=\"blue\">有效\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>约定时间到了、事情办完了或有人依法取消，原先给的委托代理权通常就结束。\u003c/p>","count":3,"chars":107,"gap":false},{"id":"civil-1794843503083","n":83,"chapter":"第一编 民法总则","title":"被代理人死亡后委托代理仍有效的情形","body":"\u003col>\u003cli>\u003cspan class=\"red\">被代理人死亡，委托代理仍然有效的情形（找主体）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">代理人不知道且不应知道死亡或终止（代）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">授权中明确代理权在代理事务完成时终止（被代）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">被代理人的继承人均予承认（继）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">被代理人死亡或终止之前已经实施\u003c/span>，\u003cspan class=\"blue\">为了\u003c/
