磨勘制定期查政绩定升迁，实为按资历升\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":54,"gap":false},{"id":"history-1794804286125","n":153,"chapter":"增补50题 / 宋代","title":"宋朝的监察制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">御史台由御史中丞领导，分台院、殿院、察院\u003c/span>；察院御史最重要，御史须皇帝批准任命\u003c/li>\u003cli>\u003cspan class=\"blue\">御史每月奏一次\u003c/span>（“月课”），可\u003cspan class=\"blue\">风闻弹人\u003c/span>，百日未弹劾则贬外官\u003c/li>\u003cli>\u003cspan class=\"blue\">谏院加御史台称台谏，牵制宰相\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">旧时谏官劝皇帝\u003c/span>，宋改为替皇帝监察百官，也可能被皇帝或权臣用来排除异己\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":115,"gap":false},{"id":"history-1794804286126","n":154,"chapter":"增补50题 / 宋代","title":"辽、西夏、金的重要法律制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">辽《重熙条例》又称《新定条例》，是首部较完整法典\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">西夏兼唐宋、党项与佛教特色\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">金熙宗皇统三年颁首部成文法典《皇统制》\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":56,"gap":false},{"id":"history-1794804286127","n":155,"chapter":"增补50题 / 辽夏金元","title":"元朝立法思想及主要法律形式","body":"\u003col>\u003cli>\u003cspan class=\"red\">“祖述变通”“附会汉法”\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">“因俗而治”，蒙汉异制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不编统一律典\u003c/span>，多用令、条格、制、敕、\u003cspan class=\"blue\">断例\u003c/span>；唐宋条文多被改作条格、\u003cspan class=\"blue\">断例\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":57,"gap":false},{"id":"history-1794804286128","n":156,"chapter":"增补50题 / 辽夏金元","title":"元朝的主要法律文件","body":"\u003col>\u003cli>\u003cspan class=\"red\">《大札撒》（《札撒大全》）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">《至元新格》\u003c/span>。重行政、财务、民事；统一后\u003cspan class=\"blue\">首部较系统成文法典\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">《大元通制》与《至正条格》\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">《元典章》（《大元圣政国朝典章》）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">《经世大典》。仿《唐六典》汇编典章\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>NYC补充：就内容而言，《至元新格》属行政规范汇编，类似于唐宋时期的“令”\u003c/p>\u003cp>NYC补充：《至正条格》是元朝最后一部法典\u003c/p>","understanding":"","count":5,"chars":89,"gap":false},{"id":"history-1794804286129","n":157,"chapter":"增补50题 / 辽夏金元","title":"元朝罪名体系及量刑原则的变化","body":"\u003col>\u003cli>\u003cspan class=\"red\">新设强奸幼女罪，幼女为10岁以下\u003c/span>；比一般强奸罪重，通常不能赎\u003c/li>\u003cli>\u003cspan class=\"blue\">唐宋十恶改称诸恶，重点打击谋反\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">总体减刑，但吏治坏，法外酷刑多\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">蒙汉异法、同罪异罚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">贼盗刑加重，广泛恢复肉刑\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":81,"gap":false},{"id":"history-1794804286130","n":158,"chapter":"增补50题 / 辽夏金元","title":"元朝刑罚制度的变化","body":"\u003col>\u003cli>\u003cspan class=\"red\">成吉思汗时用斩、流、柳条责打\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">元允许私刑\u003c/span>。强盗、窃盗刑满回原籍，\u003cspan class=\"blue\">充警迹人，红泥粉壁\u003c/span>公开旧罪，以警本人和他人\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":52,"gap":false},{"id":"history-1794804286131","n":159,"chapter":"增补50题 / 辽夏金元","title":"元朝的财产法律制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">阑遗物\u003c/span>。走失牲口或奴婢公告\u003cspan class=\"blue\">十天\u003c/span>无人领，由官府收管；找到主人则归还\u003c/li>\u003cli>\u003cspan class=\"blue\">契约关系。买卖、典当、借贷、租佃\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">损害赔偿。伤人除刑责还要赔养济、养赡及医药费\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">烧埋银赔杀人或伤人致死；蒙古人常借它逃刑责\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>无糖三明治十元（5唐30明10元）\u003c/p>","understanding":"","count":4,"chars":91,"gap":false},{"id":"history-1794804286132","n":160,"chapter":"增补50题 / 辽夏金元","title":"元朝的婚姻与继承制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">婚姻随民族旧俗\u003c/span>。蒙古人可\u003cspan class=\"blue\">一夫多妻\u003c/span>、收继婚；婚书和成礼俱备才有效\u003c/li>\u003cli>\u003cspan class=\"blue\">媒人趋于职业化，受管理\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">蒙古人、色目人各用本俗法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">离婚妇女或寡妇再婚\u003c/span>，不能带走原有妆奁、继承的财产或夫家财产\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":83,"gap":false},{"id":"history-1794804286133","n":161,"chapter":"增补50题 / 辽夏金元","title":"元朝的诉讼审判制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">诉讼独立，细定步骤和诉状格式，程序法开始与实体法分开\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">出现诉讼代理\u003c/span>：年老、患病或残疾行动不便者可由知情亲属代诉\u003c/li>\u003cli>\u003cspan class=\"blue\">不同户籍、民族或僧侣间有刑事争讼\u003c/span>，官府请其直属上司同审，叫\u003cspan class=\"blue\">约会\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":85,"gap":false},{"id":"history-1794804286134","n":162,"chapter":"增补50题 / 明代","title":"明朝的立法指导思想","body":"\u003col>\u003cli>\u003cspan class=\"red\">刑乱国用重典，重典治吏、治民以加强威慑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">明刑弼教，提高刑在礼刑关系中的地位\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">明礼导民、定律绳顽\u003c/span>，把伦理预防与法律惩治结合，维护王朝统治\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":65,"gap":false},{"id":"history-1794804286135","n":163,"chapter":"增补50题 / 明代","title":"明朝的主要法律文件","body":"\u003col>\u003cli>\u003cspan class=\"red\">大明律：名例加六部分律，共7篇\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">大明令\u003c/span>：最后的帝制令典\u003c/li>\u003cli>\u003cspan class=\"blue\">大诰\u003c/span>：重刑案例、训导和敕令，主要惩贪，效力曾高于律\u003c/li>\u003cli>\u003cspan class=\"blue\">问刑条例\u003c/span>：典型案规则经皇帝准；万历\u003cspan class=\"blue\">律例合编\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">大明会典\u003c/span>：六部行政制度汇编\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":85,"gap":false},{"id":"history-1794804286136","n":164,"chapter":"增补50题 / 明代","title":"明朝“充军刑”","body":"\u003col>\u003cli>\u003cspan class=\"red\">充军：强迫罪犯赴边远地区充军户，明广用，比普通流刑重\u003c/span>\u003c/li>\u003cli>逐步形成\u003cspan class=\"blue\">极边\u003c/span>、烟瘴、边远、沿海、口外、近卫、附近等等级\u003c/li>\u003cli>\u003cspan class=\"blue\">从犯罪军人扩至百姓\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">终身止于本人死亡；永远须子孙亲属接替直至勾补尽绝\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":86,"gap":false},{"id":"history-1794804286137","n":165,"chapter":"增补50题 / 明代","title":"明朝“廷杖”","body":"\u003col>\u003cli>\u003cspan class=\"red\">廷杖是皇帝处罚大臣的非常之刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">洪武十四年朱元璋将工部尚书薛祥杖杀于朝堂之上\u003c/span>，后廷杖遂成定制，\u003cspan class=\"blue\">成为常刑\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":49,"gap":false},{"id":"history-1794804286138","n":166,"chapter":"增补50题 / 明代","title":"明朝关于财产所有权的规定","body":"\u003col>\u003cli>\u003cspan class=\"red\">为鼓励开荒，无主荒田归先占开垦者，旧主回来也不得要回田，仅可请求房屋坟墓\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">遗失物、埋藏物也有先占规则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">埋藏物通常归发现人；古器、钟鼎、符印等异常物须送官\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>无糖三明治十元（5唐30明10元，注意元明是公告期）\u003c/p>","understanding":"","count":3,"chars":74,"gap":false},{"id":"history-1794804286139","n":167,"chapter":"增补50题 / 明代","title":"明朝的海外贸易制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">制定“海禁”法规\u003c/span>。朱元璋时期推行“\u003cspan class=\"blue\">片板不许下海\u003c/span>”的海禁政策，严禁一般商民私自与外国通商往来，《大明律》专设“私出外境及违禁下海”条，严禁私自出境及下海贩卖\u003c/li>\u003cli>\u003cspan class=\"blue\">朝贡贸易立法\u003c/span>。海外诸国与明贸易须以朝贡为先决条件，并设“\u003cspan class=\"blue\">市舶提举司\u003c/span>”主管朝贡贸易事务\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":119,"gap":false},{"id":"history-1794804286140","n":168,"chapter":"增补50题 / 明代","title":"明朝中枢与地方行政机构","body":"\u003col>\u003cli>\u003cspan class=\"red\">洪武十三年废丞相，皇帝直管六部\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">六部尚书与通政使、左都御史、大理寺卿合称九卿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">成祖命侍从入文渊阁\u003c/span>，正式设内阁参与机要；受宦官专权、腐败影响，始终为辅臣\u003c/li>\u003cli>\u003cspan class=\"blue\">地方省、府、县三级\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">知府、知县掌本地行政和司法\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":95,"gap":false},{"id":"history-1794804286141","n":169,"chapter":"增补50题 / 明代","title":"明朝的官员选任制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">科举只许官学生考\u003c/span>。中央\u003cspan class=\"blue\">国子监\u003c/span>学生叫监生，由地方官学选送；府州县官学生叫生员（秀才）\u003c/li>\u003cli>\u003cspan class=\"blue\">生员免役，免笞杖刑和刑讯\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">朱元璋采刘基建议\u003c/span>，用四书五经命题，按\u003cspan class=\"blue\">程朱理学\u003c/span>答，不谈时政\u003c/li>\u003cli>\u003cspan class=\"blue\">约三年一轮换\u003c/span>。地方官\u003cspan class=\"blue\">北人官南、南人官北\u003c/span>；明中期起吏部抽签分官地\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":112,"gap":false},{"id":"history-1794804286142","n":170,"chapter":"增补50题 / 清代","title":"清朝立法指导思想","body":"\u003col>\u003cli>\u003cspan class=\"red\">清入关以前，处于由习惯法向成文法过渡的过程中\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">入关后采取“以汉治汉”的策略\u003c/span>，提出了“\u003cspan class=\"blue\">详译明律，参以国制\u003c/span>”的立法指导思想\u003c/li>\u003cli>以《大明律》为模范制定的《大清律例》和仿照《\u003cspan class=\"blue\">大明会典\u003c/span>》制定的《大清会典》、各部院则例，都体现了“\u003cspan class=\"blue\">详译明律，参以国制\u003c/span>”的思想\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":119,"gap":false},{"id":"history-1794804286143","n":171,"chapter":"增补50题 / 清代","title":"清朝主要法律文件及规则","body":"\u003col>\u003cli>\u003cspan class=\"red\">大清律例沿大明律结构，乾隆定型为基本法典\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">康雍乾嘉光五朝会典汇记职权制度，光绪增总理衙门\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">则例规定部院职责、程序，有一般、特别之分\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">另有适用于少数民族聚居区的专门法规\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>NYC补充：注意《蒙古律例》不在元代，在清朝\u003c/p>","understanding":"","count":4,"chars":80,"gap":false},{"id":"history-1794804286144","n":172,"chapter":"增补50题 / 清代","title":"清朝“文字狱”","body":"\u003col>\u003cli>\u003cspan class=\"red\">为压制反清、反专制思想而大兴文字狱\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">无专门文字犯罪条文，多比附谋大逆，常株连全家\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">以言入罪、君主专制恶性扩张\u003c/span>，严重遏制思想文化和学术发展\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":66,"gap":false},{"id":"history-1794804286145","n":173,"chapter":"增补50题 / 清代","title":"清朝的经济立法","body":"\u003col>\u003cli>\u003cspan class=\"red\">海禁初为镇压沿海抗清力量\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">重农抑商，严刑推禁榷制度\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":24,"gap":false},{"id":"history-1794804286146","n":174,"chapter":"增补50题 / 清代","title":"清朝诉讼程序与审判制度","body":"\u003col>\u003cli>\u003cspan class=\"red\">禁止越诉、诬告、匿名告，逐级上诉\u003c/span>\u003cspan class=\"blue\">；狱犯不得告别事\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">笞杖州县结，徒刑督抚判；死刑层层复核、报皇帝\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">民事通常州县审结，农忙禁告轻微案件，放告日受理\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">亲嫌回避，依所告事项审，不另寻他事定罪\u003c/span>\u003c/li>\u003c/ol>","memory":"\u003cp>宋二九、清四七\u003c/p>","understanding":"","count":4,"chars":88,"gap":false}]}]}</script>
<script>
'use strict';
const embedded=document.getElementById('books');
const DATA=JSON.parse(embedded.textContent);
const KEY='law-grand-vision:v1';
const el=id=>document.getElementById(id);
let state={book:DATA.books[0].id,chapters:{},chapterNames:{},edits:{},scroll:{},updated:0};
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.updated>=(DATA.snapshot||0))state={...state,...saved};else if(DATA.ui)state={...state,...DATA.ui};}catch{}
state.edits=state.edits||{};state.chapters=state.chapters||{};state.chapterNames=state.chapterNames||{};state.scroll=state.scroll||{};
if(!DATA.books.some(b=>b.id===state.book))state.book=DATA.books[0].id;
let dirty=false,saveTimer=0,searchTimer=0,lastEditable=null,lastRange=null;
const allowed=new Set(['P','DIV','BR','OL','UL','LI','SPAN','B','STRONG','I','EM','U','FONT']);
function safeHTML(input){
 const doc=new DOMParser().parseFromString(String(input),'text/html');
 const clean=n=>{
  if(n.nodeType===3)return document.createTextNode(n.textContent);
  if(n.nodeType!==1||['SCRIPT','STYLE','IFRAME','OBJECT','SVG','MATH'].includes(n.tagName))return document.createDocumentFragment();
  const out=allowed.has(n.tagName)?document.createElement(n.tagName==='FONT'?'span':n.tagName.toLowerCase()):document.createDocumentFragment();
  if(out.nodeType===1){
   const cls=(n.className||'').split(/\s+/).filter(c=>['red','blue','green','definition','gap'].includes(c));if(cls.length)out.className=cls.join(' ');
   const color=n.getAttribute('color')||n.style.color;if(color&&/^(#[\da-f]{3,8}|rgba?\([\d\s.,%]+\)|red|blue|green|black)$/i.test(color))out.style.color=color;
   if(['bold','600','700','800'].includes(n.style.fontWeight))out.style.fontWeight=n.style.fontWeight;
  }
  for(const c of n.childNodes)out.append(clean(c));return out;
 };
 const box=document.createElement('div');for(const n of doc.body.childNodes)box.append(clean(n));return box.innerHTML;
}
function book(){return DATA.books.find(b=>b.id===state.book);}
function chapters(b=book()){return [...new Set(b.items.map(q=>q.chapter))];}
function currentChapter(){const cs=chapters();return cs.includes(state.chapters[state.book])?state.chapters[state.book]:cs[0];}
function view(q){return {...q,...state.edits[q.id]};}
function plain(html){const d=document.createElement('div');d.innerHTML=safeHTML(html);return d.textContent;}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function chapterName(ch){return state.chapterNames[state.book+'|'+ch]||ch;}
function field(html,cls,name,label,placeholder=''){return '<div class="'+cls+' editable" contenteditable="true" spellcheck="false" data-field="'+name+'" role="textbox" aria-label="'+label+'" data-placeholder="'+placeholder+'">'+safeHTML(html)+'</div>';}
function scoreFrom(html){const d=document.createElement('div');d.innerHTML=safeHTML(html);if(d.querySelector('.gap'))return 0;const ls=d.querySelectorAll('li');if(ls.length)return ls.length+d.querySelectorAll(':scope > p:not(:empty)').length;return d.innerText.trim()?d.innerText.split(/\n+/).filter(t=>t.trim()).length:0;}
function card(item,searching){const q=view(item);const count=state.edits[q.id]?.body!==undefined?scoreFrom(q.body):q.count;
 return '<article data-id="'+q.id+'">'+(searching?'<div class="search-chapter">'+esc(chapterName(q.chapter))+'</div>':'')+'<div class="question-head"><span class="num">'+q.n+'</span><h3 contenteditable="true" spellcheck="false" data-field="title" aria-label="考点标题">'+safeHTML(q.title)+'</h3><span class="score">'+(count?count+'个采分点':'待补正文')+'</span></div><div class="note memory"><label>速记：</label>'+field(q.memory,'','memory','速记','写速记…')+'</div>'+field(q.body,'answer','body','核心背诵内容')+'<div class="note understanding"><label>理解：</label>'+field(q.understanding,'','understanding','理解','写理解…')+'</div></article>';
}
function render(restorePosition=false){
 const b=book(),ch=currentChapter(),term=el('search').value.trim().toLowerCase();state.chapters[b.id]=ch;
 el('subjects').innerHTML=DATA.books.map(x=>'<button type="button" data-book="'+x.id+'"'+(x.id===b.id?' aria-current="page"':'')+'>'+x.name+'<span class="total">'+x.items.length+'</span></button>').join('');
 el('chapter').innerHTML=chapters().map(c=>'<option value="'+esc(c)+'"'+(c===ch?' selected':'')+'>'+esc(chapterName(c))+'</option>').join('');
 const rows=b.items.filter(q=>term?[view(q).title,view(q).body,view(q).memory,view(q).understanding].some(s=>plain(s).toLowerCase().includes(term)):q.chapter===ch);
 el('main').innerHTML='<div class="section-title">'+(term?'<h2>搜索结果</h2>':'<h2 contenteditable="true" spellcheck="false" data-chapter="'+esc(ch)+'" aria-label="章节标题">'+esc(chapterName(ch))+'</h2>')+'<span class="section-count">'+rows.length+'个考点</span></div><div class="items">'+(rows.length?rows.map(q=>card(q,!!term)).join(''):'<div class="empty">没有找到对应考点</div>')+'</div>';
 lastEditable=null;lastRange=null;
 if(restorePosition)requestAnimationFrame(()=>window.scrollTo(0,state.scroll[b.id+'|'+ch]||0));
}
function save(){
 clearTimeout(saveTimer);state.updated=Date.now();
 const snap={...DATA,snapshot:state.updated,books:DATA.books.map(b=>({...b,items:b.items.map(q=>view(q))})),ui:{book:state.book,chapters:state.chapters,chapterNames:state.chapterNames,scroll:state.scroll}};
 embedded.textContent=JSON.stringify(snap).replace(/</g,'\\u003c');
 try{localStorage.setItem(KEY,JSON.stringify(state));dirty=false;el('status').textContent='本机已保存 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}catch{el('status').textContent='本机保存失败，请点备份';}
}
function markDirty(){dirty=true;el('status').textContent='正在保存…';clearTimeout(saveTimer);saveTimer=setTimeout(save,800);}
function remember(){state.scroll[state.book+'|'+currentChapter()]=window.scrollY;}
el('main').addEventListener('input',e=>{
 const target=e.target.closest('[contenteditable]');if(!target)return;
 if(target.dataset.chapter!==undefined){state.chapterNames[state.book+'|'+target.dataset.chapter]=target.textContent.trim();const op=[...el('chapter').options].find(o=>o.value===target.dataset.chapter);if(op)op.textContent=target.textContent;}
 else{const a=target.closest('article');if(!a)return;const f=target.dataset.field;state.edits[a.dataset.id]={...state.edits[a.dataset.id],[f]:safeHTML(target.innerHTML)};if(f==='body'){const n=scoreFrom(target.innerHTML);a.querySelector('.score').textContent=n?n+'个采分点':'待补正文';}}
 markDirty();
});
el('main').addEventListener('focusin',e=>{if(e.target.isContentEditable)lastEditable=e.target.closest('[contenteditable]');});
el('main').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.matches('h2,h3'))){e.preventDefault();e.target.blur();}});
document.addEventListener('selectionchange',()=>{const s=window.getSelection();if(s.rangeCount&&s.anchorNode&&el('main').contains(s.anchorNode)){lastRange=s.getRangeAt(0).cloneRange();}});
document.querySelectorAll('.format button').forEach(btn=>{
 btn.addEventListener('pointerdown',e=>e.preventDefault());
 btn.addEventListener('click',()=>{if(!lastEditable)return;lastEditable.focus();if(lastRange){const s=window.getSelection();s.removeAllRanges();s.addRange(lastRange);}document.execCommand(btn.dataset.command||'foreColor',false,btn.dataset.color||null);lastEditable.dispatchEvent(new Event('input',{bubbles:true}));});
});
el('main').addEventListener('paste',e=>{if(!e.target.isContentEditable)return;e.preventDefault();const h=e.clipboardData.getData('text/html');if(h)document.execCommand('insertHTML',false,safeHTML(h));else document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));});
el('subjects').addEventListener('click',e=>{const btn=e.target.closest('[data-book]');if(!btn||btn.dataset.book===state.book)return;remember();save();state.book=btn.dataset.book;el('search').value='';render(true);markDirty();});
el('chapter').addEventListener('change',()=>{remember();save();state.chapters[state.book]=el('chapter').value;el('search').value='';render(true);markDirty();});
el('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();window.scrollTo(0,0);},150);});
window.addEventListener('pagehide',()=>{remember();save();});document.addEventListener('visibilitychange',()=>{if(document.hidden){remember();save();}});
setInterval(()=>{remember();save();},30_000);
el('backup').addEventListener('click',()=>{
 remember();save();const clone=document.documentElement.cloneNode(true);clone.querySelector('#main').innerHTML='';clone.querySelector('#search').value='';const url=URL.createObjectURL(new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='LawGrandVision-背诵备份-'+new Date().toISOString().slice(0,10)+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
});
el('restore').addEventListener('click',()=>el('restore-file').click());
el('restore-file').addEventListener('change',async()=>{
 const file=el('restore-file').files[0];if(!file)return;
 try{const text=await file.text();let imported;if(text.trim().startsWith('{'))imported=JSON.parse(text);else{const doc=new DOMParser().parseFromString(text,'text/html');imported=JSON.parse(doc.getElementById('books').textContent);}if(imported.name!=='Law Grand Vision'||!Array.isArray(imported.books)||imported.books.length!==5)throw Error('格式不符');const ids=new Set(DATA.books.map(b=>b.id));if(imported.books.some(b=>!ids.has(b.id)||!Array.isArray(b.items)))throw Error('格式不符');
 for(const b of imported.books){const existing=DATA.books.find(x=>x.id===b.id);for(const q of b.items){if(!existing.items.some(x=>x.id===q.id))continue;const fields={};for(const f of ['title','body','memory','understanding'])if(typeof q[f]==='string')fields[f]=safeHTML(q[f]);state.edits[q.id]={...state.edits[q.id],...fields};}}if(imported.ui){state.chapterNames=imported.ui.chapterNames||state.chapterNames;}save();render();el('notice').textContent='备份已恢复。';}catch{el('notice').textContent='无法读取，请选择本页面下载的备份。';}el('restore-file').value='';
});
render(true);
</script>
</body>
</html>
