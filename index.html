通知到达生效，不得\u003cspan class=\"blue\">附条件\u003c/span>或期限\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>你欠我、我也欠你，满足到期、给付种类等条件时，可依法互相抵掉。\u003c/p>","count":3,"chars":98,"gap":false},{"id":"civil-1794843503210","n":210,"chapter":"第三编 债与合同","title":"提存的概念及其条件","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：债权人方面导致难以交付，债务人依法将标的交提存部门\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">程序和标的\u003c/span>：依法\u003cspan class=\"blue\">办理\u003c/span>；标的\u003cspan class=\"blue\">不宜\u003c/span>提存或费用过高，可依法拍卖、变卖后提存价款\u003c/li>\u003cli>\u003cspan class=\"blue\">事由\u003c/span>：债权人无正当理由拒收、\u003cspan class=\"blue\">下落不明\u003c/span>、死亡未确定继承人或\u003cspan class=\"blue\">遗产管理人\u003c/span>、丧失行为能力未确定\u003cspan class=\"blue\">监护人\u003c/span>，及法律规定的其他情形\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>找不到该收货的人或对方无正当理由不收，可依法把东西交给提存机关完成相应义务。\u003c/p>","count":3,"chars":121,"gap":false},{"id":"civil-1794843503211","n":211,"chapter":"第三编 债与合同","title":"免除的概念及其效力","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：债权人免除债务人部分或全部债务，债权债务相应终止\u003c/span>；\u003cspan class=\"blue\">债务\u003c/span>人在\u003cspan class=\"blue\">合理期限\u003c/span>拒绝的除外\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">免除主债\u003c/span>：从债原则上相应消灭；主债全部免除，从债随之全部消灭\u003c/li>\u003cli>\u003cspan class=\"blue\">免除从债\u003c/span>：主债不故消灭\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>债权人明确不要你还了，依法生效后这笔债可全部或部分消失，但要看是否依法拒绝。\u003c/p>","count":3,"chars":82,"gap":false},{"id":"civil-1794843503212","n":212,"chapter":"第三编 债与合同","title":"缔约过失责任的概念及其构成要件","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：订立合同过程中，一方违反基于诚实信用产生的先合同义务，造成对方信赖利益损失，依法承担赔偿责任\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">要件\u003c/span>：违反先合同义务；相对人受有信赖利益损失；行为与损失有\u003cspan class=\"blue\">因果关系\u003c/span>；违背义务者有\u003cspan class=\"blue\">故意\u003c/span>或过失\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>谈合同虽还没签，也不能用假消息骗对方花钱，造成信赖损失可能要赔。\u003c/p>","count":2,"chars":94,"gap":false},{"id":"civil-1794843503213","n":213,"chapter":"第三编 债与合同","title":"缔约过失责任的适用情形","body":"\u003col>\u003cli>\u003cspan class=\"red\">恶意磋商：假借订立合同，恶意进行磋商\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">虚假隐瞒\u003c/span>：故意隐瞒与订立合同有关重要事实或\u003cspan class=\"blue\">提供\u003c/span>虚假情况\u003c/li>\u003cli>\u003cspan class=\"blue\">泄露秘密\u003c/span>：泄露或\u003cspan class=\"blue\">不正\u003c/span>当地使用在订立合同过程中\u003cspan class=\"blue\">知悉\u003c/span>的对方商业秘密或其他应保密的信息\u003c/li>\u003cli>\u003cspan class=\"blue\">其他违背诚实信用原则行为等\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>假借谈判、故意隐瞒重要事实、泄露对方秘密等伤害信赖的做法，可能要负责任。\u003c/p>","count":4,"chars":98,"gap":false},{"id":"civil-1794843503214","n":214,"chapter":"第三编 债与合同","title":"违约责任的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">违约责任：不履行或履行不符合合同义务时承担的民事责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">因违约产生，原则限合同当事人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主要为财产责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">在法律允许范围可约定\u003c/span>，但不能违反强制规定或不当排除责任\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有效合同说好要做的事没做或没做好，就可能要继续做、补救或赔损失。\u003c/p>","count":4,"chars":74,"gap":false},{"id":"civil-1794843503215","n":215,"chapter":"第三编 债与合同","title":"违约责任的构成要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">有合法有效合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">存在不履行或履行不符合约定的违约行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">无法定或约定免责事由\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">免责分一般法定、特殊法定、约定三类\u003c/span>；损失赔偿等\u003cspan class=\"blue\">具体\u003c/span>方式还须相应损失、因果关系等条件\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先确认有有效合同和违约行为，再看有无法定免责事由；求赔偿还要看损失等。\u003c/p>","count":4,"chars":76,"gap":false},{"id":"civil-1794843503216","n":216,"chapter":"第三编 债与合同","title":"违约责任的承担方式","body":"\u003col>\u003cli>\u003cspan class=\"red\">继续履行，非金钱债务有法定例外\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">修理、重作、更换、退货、减价等补救\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">赔偿损失含可得利益，以可预见范围为限\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">违约金依约，可依法调整\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">定金\u003c/span>：给付方根本违约不得返还，收受方\u003cspan class=\"blue\">双倍返还\u003c/span>；与\u003cspan class=\"blue\">违约金\u003c/span>择一\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>没按约送货，可以要求补送、换修、赔钱或按约主张违约金，要看各方式的适用条件。\u003c/p>","count":5,"chars":90,"gap":false},{"id":"civil-1794843503217","n":217,"chapter":"第三编 债与合同","title":"继续履行的适用规则","body":"\u003col>\u003cli>\u003cspan class=\"red\">金钱债务：可请求支付\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">非金钱债务\u003c/span>：原则上可请求继续履行；法律上或\u003cspan class=\"blue\">事实\u003c/span>上不能履行、标的不适合强制履行、费用过高、债权人未在\u003cspan class=\"blue\">合理期限\u003c/span>内请求的除外\u003c/li>\u003cli>\u003cspan class=\"blue\">替代履行\u003c/span>：依债务性质不能强制履行的，可请求\u003cspan class=\"blue\">违约\u003c/span>方负担第三人\u003cspan class=\"blue\">替代履行\u003c/span>费用\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>不付钱通常能要求付，不交货也有可能要求交，但现实办不到等情形不能硬逼履行。\u003c/p>","count":3,"chars":104,"gap":false},{"id":"civil-1794843503218","n":218,"chapter":"第三编 债与合同","title":"违约金的概念及其适用规则（违约金与赔偿损失的关系）","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">违约金指依据法律规定或当事人的约定，一方不履行或不适当履行合同时应根据违约情况向对方支付的金钱\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">适用\u003c/span>：因为违约金+赔偿损失=违约金，\u003cspan class=\"blue\">低于\u003c/span>损失可适当\u003cspan class=\"blue\">增加\u003c/span>但不超损失，过分高于损失可请求适当减少——\u003cspan class=\"blue\">130%\u003c/span>（恶意违约除外）\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>双方可以先约违约付多少钱，与实际损失显著不相称时可依法请求调整。\u003c/p>","count":2,"chars":107,"gap":false},{"id":"civil-1794843503219","n":219,"chapter":"第三编 债与合同","title":"定金的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：当事人实际交付一定金钱，担保债权实现\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">额度\u003c/span>：定金由当事人约定，不\u003cspan class=\"blue\">超过\u003c/span>主合同标的额\u003cspan class=\"blue\">20%\u003c/span>，超出部分无定金效力\u003c/li>\u003cli>\u003cspan class=\"blue\">担保与从属性\u003c/span>：属金钱担保，以主合同为基础，有担保履行等效力\u003c/li>\u003cli>\u003cspan class=\"blue\">实践性\u003c/span>：定金合同自实际交付时成立，实交\u003cspan class=\"blue\">数额\u003c/span>与约定不同的，视为\u003cspan class=\"blue\">变更\u003c/span>约定\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>定金是实际交付的一笔担保钱，违约时可能不退或双倍返还，不是名字写成订金就自动适用。\u003c/p>","count":4,"chars":118,"gap":false},{"id":"civil-1794843503220","n":220,"chapter":"第三编 债与合同","title":"定金的效力","body":"\u003col>\u003cli>\u003cspan class=\"red\">证明成立：证明合同成立，定金的交付本身可以视为合同成立的证据\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">担保履行\u003c/span>：担保\u003cspan class=\"blue\">债务履行\u003c/span>，定金是经对违约方适用定金罚则而起到合同担保\u003cspan class=\"blue\">作用\u003c/span>的\u003c/li>\u003cli>\u003cspan class=\"blue\">预先给付\u003c/span>：\u003cspan class=\"blue\">预先给付\u003c/span>，债务人履行债务的，定金应抵作\u003cspan class=\"blue\">价款\u003c/span>或收回\u003c/li>\u003cli>\u003cspan class=\"blue\">解除合同\u003c/span>：约定解约定金，可以适用定金罚则为\u003cspan class=\"blue\">代价解除合同\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>付定金的人违约到合同目的不能实现，可能拿不回；收定金的人这样违约，可能要双倍退。\u003c/p>","count":4,"chars":122,"gap":false},{"id":"civil-1794843503221","n":221,"chapter":"第三编 债与合同","title":"赔偿损失的概念及其构成要件","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：违约方以金钱赔偿弥补违约造成的损失\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">要件\u003c/span>：有违约行为、存在损失、违约与损失有\u003cspan class=\"blue\">因果关系\u003c/span>，且无免责\u003cspan class=\"blue\">事由\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">范围\u003c/span>：包括\u003cspan class=\"blue\">直接损失\u003c/span>和履行后可得利益，以订约时\u003cspan class=\"blue\">可预见的损失\u003c/span>为限\u003c/li>\u003cli>\u003cspan class=\"blue\">限制\u003c/span>：未合理减损的扩大部分不得请求；违约带来的利益依法冲抵；受损方对损失也有\u003cspan class=\"blue\">过错\u003c/span>的，依法\u003cspan class=\"blue\">减少赔偿\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>要求赔偿先说清对方哪里违约、自己损失什么，以及损失为何是违约造成的。\u003c/p>","count":4,"chars":129,"gap":false},{"id":"civil-1794843503222","n":222,"chapter":"第三编 债与合同","title":"违约责任与侵权责任的竞合","body":"\u003col>\u003cli>\u003cspan class=\"red\">同一行为既违反合同义务又侵犯民事权益，同时满足违约、侵权责任要件，构成责任竞合\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">原因可为侵权导致违约，或违约同时侵权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">受损方可择一请求承担责任，不能重复赔偿\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>同一行为既违反合同又侵害权益时，可以依法选择请求依据，不能拿同一笔损失赔两遍。\u003c/p>","count":3,"chars":76,"gap":false},{"id":"civil-1794843503223","n":223,"chapter":"第三编 债与合同","title":"出卖人的义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">交付标的物\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">移转标的物所有权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">担保标的物无瑕疵。（质量、权利）\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>卖家不仅要按时交货，还要保证质量、权利和该交的资料都符合要求。\u003c/p>","count":3,"chars":29,"gap":false},{"id":"civil-1794843503224","n":224,"chapter":"第三编 债与合同","title":"买受人的义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">支付价款\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">受领标的物。（多交）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">及时检验标的物。（不符合）\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>买家主要按约付钱、收货和检查，有问题要在适用期限内提出。\u003c/p>","count":3,"chars":27,"gap":false},{"id":"civil-1794843503225","n":225,"chapter":"第三编 债与合同","title":"买卖合同的特殊类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">样品：质量依样品及说明\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">试用\u003c/span>：期满不表态视为买\u003c/li>\u003cli>\u003cspan class=\"blue\">分期\u003c/span>：至少3次付价，欠1/5经催告仍不付，可请求全款或\u003cspan class=\"blue\">解除\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保留所有权\u003c/span>：付清前保留，未登记\u003cspan class=\"blue\">不得\u003c/span>抗善意第三人\u003c/li>\u003cli>\u003cspan class=\"blue\">互易\u003c/span>：非\u003cspan class=\"blue\">金钱\u003c/span>交换，参照买卖\u003c/li>\u003cli>\u003cspan class=\"blue\">一物多卖\u003c/span>：普通动产看交付、付款、订约；特殊动产看交付、登记、订约\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>普通买卖的基础上，还可约分期付款、先试用、按样品定质量或保留所有权。\u003c/p>","count":6,"chars":119,"gap":false},{"id":"civil-1794843503226","n":226,"chapter":"第三编 债与合同","title":"试用买卖的排除情形","body":"\u003col>\u003cli>\u003cspan class=\"red\">购买条件：约定标的物达到质量要求时须购买\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">认可条件\u003c/span>：约定某个\u003cspan class=\"blue\">第三人认可\u003c/span>标的物时须购买\u003c/li>\u003cli>\u003cspan class=\"blue\">售后换货\u003c/span>：仅约定买受人在一定期间内\u003cspan class=\"blue\">有权调换\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">售后退货\u003c/span>：仅约定买受人在一定期间内\u003cspan class=\"blue\">有权退还\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>关键是买家试过以后能不能自由决定买不买；提前答应必须买，或只给售后期限，都不算。\u003c/p>","count":4,"chars":83,"gap":false},{"id":"civil-1794843503227","n":227,"chapter":"第三编 债与合同","title":"出卖人行使取回权的规则","body":"\u003col>\u003cli>\u003cspan class=\"red\">前提：保留所有权，且买受人行为给出卖人造成损害\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">可以取回\u003c/span>：未\u003cspan class=\"blue\">依约\u003c/span>付款，经催告在\u003cspan class=\"blue\">合理期限\u003c/span>仍未付；未\u003cspan class=\"blue\">依约\u003c/span>完成特定条件；擅自出卖、出质或作其他不当处分\u003c/li>\u003cli>\u003cspan class=\"blue\">限制\u003c/span>：买受人已付总价款\u003cspan class=\"blue\">75%\u003c/span>以上，或第三人已\u003cspan class=\"blue\">善意取得所有权\u003c/span>或其他物权，不得取回\u003c/li>\u003cli>\u003cspan class=\"blue\">程序\u003c/span>：可协商取回；不成的，可参照\u003cspan class=\"blue\">担保物权\u003c/span>实现\u003cspan class=\"blue\">程序\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>保留所有权的买卖里，买方严重不付钱或不当处分时，卖方依法可取回，但也受限制。\u003c/p>","count":4,"chars":134,"gap":false},{"id":"civil-1794843503228","n":228,"chapter":"第三编 债与合同","title":"互易合同中当事人的义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">交物：双方依约交付各自标的物，并转移所有权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">瑕疵担保\u003c/span>：双方对各自交付的标的物互负\u003cspan class=\"blue\">瑕疵担保\u003c/span>义务\u003c/li>\u003cli>\u003cspan class=\"blue\">补价\u003c/span>：约定\u003cspan class=\"blue\">补价\u003c/span>的，负担一方按约支付\u003cspan class=\"blue\">补足金\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>两边拿东西互换时，每一边对自己交出的物像卖家，对收到的物又像买家。\u003c/p>","count":3,"chars":65,"gap":false},{"id":"civil-1794843503229","n":229,"chapter":"第三编 债与合同","title":"供用电、水、气、热力合同的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">供用电水气热力合同：供应方向用户持续提供相应资源，用户付费\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">供应主体特定、经营具垄断性，价格受监管\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">供应、付款持续进行\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">满足公众生活，具公益性和依法强制缔约义务\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>水电气热由供给方持续提供，使用人按约付费，不能随意断供或拒绝合理供给。\u003c/p>","count":4,"chars":77,"gap":false},{"id":"civil-1794843503230","n":230,"chapter":"第三编 债与合同","title":"赠与合同的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">赠与：赠与人无偿给财产，受赠人同意接受的合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">单务、无偿\u003c/span>：附义务也不是对价\u003c/li>\u003cli>\u003cspan class=\"blue\">诺成\u003c/span>：原则不以\u003cspan class=\"blue\">交付\u003c/span>成立\u003c/li>\u003cli>\u003cspan class=\"blue\">原则不要式；财产依法需登记、其他手续的仍须办理\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一方愿意无偿给财产，另一方愿意收下，这不同于必须付价的买卖。\u003c/p>","count":4,"chars":70,"gap":false},{"id":"civil-1794843503231","n":231,"chapter":"第三编 债与合同","title":"借款合同的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">指出借人向借款人提供借款，借款人到期返还并支付利息的合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">借款合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">标的物是货币\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">是转移货币所有权的合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">除自然人之间借款当事人另有约定或法律另有规定外\u003c/span>，一般为要式合同、有偿合同、\u003cspan class=\"blue\">诺成合同\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先借出钱，到期要返还并按约定和法律处理利息，具体还看借款双方是谁。\u003c/p>","count":5,"chars":90,"gap":false},{"id":"civil-1794843503232","n":232,"chapter":"第三编 债与合同","title":"借款人的义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">提供真实情况\u003c/span>\u003cspan class=\"blue\">，如实告知借款用途、经营状况等信息\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按期、足额收取借款\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按照约定用途使用借款\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">容忍出借人的监督、检查\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按期、足额返还借款\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按期支付利息\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>借款人要按约使用和偿还款项，该付利息和提供必要情况时也得照办。\u003c/p>","count":6,"chars":68,"gap":false},{"id":"civil-1794843503233","n":233,"chapter":"第三编 债与合同","title":"自然人间的借款合同的特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">双方当事人均为自然人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">是否有偿取决于双方的约定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">是实践性合同，合同自贷款人提供借款时成立\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">是不要式合同\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>两个自然人谈好借款，通常实际把钱交给借款人时合同才成立。\u003c/p>","count":4,"chars":48,"gap":false},{"id":"civil-1794843503234","n":234,"chapter":"第三编 债与合同","title":"出借人提供借款的情形","body":"\u003col>\u003cli>\u003cspan class=\"red\">自然人借款自实际提供时成立\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">现金以收到为准\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">转账、网络汇款以到账为准\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">授权使用特定账户，以取得实际支配权为准\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">票据以依法取得票据权利为准\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">其他约定方式以实际履行完成为准\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>现金通常看收到，转账通常看到账，其他方式则看借款人是否依法取得资金控制。\u003c/p>","count":6,"chars":79,"gap":false},{"id":"civil-1794843503235","n":235,"chapter":"第三编 债与合同","title":"保证合同的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：保证人与债权人约定，债务人不履行到期债务或出现约定情形时，保证人承担责任\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">单务与无偿\u003c/span>：保证人对债权人负\u003cspan class=\"blue\">保证责任\u003c/span>，债权人不故负\u003cspan class=\"blue\">对待\u003c/span>给付义务\u003c/li>\u003cli>\u003cspan class=\"blue\">从属性\u003c/span>：以\u003cspan class=\"blue\">主合同\u003c/span>为基础；\u003cspan class=\"blue\">主合同\u003c/span>无效，原则上保证合同也无效\u003c/li>\u003cli>\u003cspan class=\"blue\">相对独立性\u003c/span>：有\u003cspan class=\"blue\">自身\u003c/span>成立、生效、变更和消灭规则\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>债务人不履行时，由保证人按约依法承担责任，这份合同是为主债务提供担保。\u003c/p>","count":4,"chars":120,"gap":false},{"id":"civil-1794843503236","n":236,"chapter":"第三编 债与合同","title":"不得作为保证人的主体","body":"\u003col>\u003cli>\u003cspan class=\"red\">机关法人原则不得保证，经国务院批准转贷外国政府、国际经济组织贷款等有例外\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">公益非营利法人、非法人组织不得保证\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">基层自治组织原则不得保证\u003c/span>；村委会依法履行相应民主决策\u003cspan class=\"blue\">程序\u003c/span>的例外\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>特定机关、公益机构等原则上不能作保证人，目的在于避免用公共财产冒别人的债务风险。\u003c/p>","count":3,"chars":84,"gap":false},{"id":"civil-1794843503237","n":237,"chapter":"第三编 债与合同","title":"主合同变更对保证合同的影响","body":"\u003col>\u003cli>\u003cspan class=\"red\">增减和期限：未经保证人书面同意，债务减轻按减轻后承担，加重的部分不承担\u003c/span>；改履行期限，\u003cspan class=\"blue\">保证期间\u003c/span>仍按原约定或法律规定\u003c/li>\u003cli>\u003cspan class=\"blue\">债权转让\u003c/span>：未通知保证人，转让对其\u003cspan class=\"blue\">不生效\u003c/span>；约定禁止转让而未经书面同意转让，保证人对\u003cspan class=\"blue\">受让人\u003c/span>免责\u003c/li>\u003cli>\u003cspan class=\"blue\">债务移转\u003c/span>：未获保证人书面同意，原则上相应免责，另有约定除外\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>债权人与债务人改了原合同，未经保证人书面同意增加的负担不能随便加给他。\u003c/p>","count":3,"chars":130,"gap":false},{"id":"civil-1794843503238","n":238,"chapter":"第三编 债与合同","title":"一般保证人不享有先诉抗辩权的情形","body":"\u003col>\u003cli>\u003cspan class=\"red\">不享有先诉抗辩权情形4（人财两空，破产证据，书面放弃）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">债务人下落不明\u003c/span>，且无财产可供执行；（\u003cspan class=\"blue\">人去楼空\u003c/span>）（债务人）\u003c/li>\u003cli>\u003cspan class=\"blue\">人民法院已经受理债务人破产案件；（债务人）\u003c/span>\u003c/li>\u003cli>债权人有证据证明\u003cspan class=\"blue\">债务人的财产\u003c/span>不足以履行全部债务或\u003cspan class=\"blue\">丧失\u003c/span>履行债务能力；（债权人）\u003c/li>\u003cli>\u003cspan class=\"blue\">保证人书面放弃本款规定的权利\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一般保证通常可要求先追债务人，但债务人已无财产可执行等法定情形下不能这样挡。\u003c/p>","count":5,"chars":128,"gap":false},{"id":"civil-1794843503239","n":239,"chapter":"第三编 债与合同","title":"保证期间的效力","body":"\u003col>\u003cli>\u003cspan class=\"red\">一般保证需在期间内诉讼仲裁债务人，诉讼时效期间自保证人拒绝权丧失之日计算\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">连带责任保证需在期间内请求保证人\u003c/span>，诉讼时效期间自请求之日计算）\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>在保证期间内，债权人要按保证类型采取规定动作，期满仍没做就可能失去保证责任。\u003c/p>","count":2,"chars":67,"gap":false},{"id":"civil-1794843503240","n":240,"chapter":"第三编 债与合同","title":"租赁合同的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">指出租人将租赁物交付承租人使用、收益，承租人支付租金的合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">租赁合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">合同主体是出租人与承租人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">（标的物）租赁合同的标的物为非消耗物\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">租赁合同是有期限地转移标的物使用权的合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">租赁合同是双务合同、有偿合同、诺成合同\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>租客按约付租金取得使用收益，房子等租赁物本身的所有权仍不归租客。\u003c/p>","count":6,"chars":102,"gap":false},{"id":"civil-1794843503241","n":241,"chapter":"第三编 债与合同","title":"租赁合同中出租人的义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">交付租赁物：在租期内应确保租赁物符合约定性能\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">瑕疵担保\u003c/span>：确保租赁物上不存在权利瑕疵与\u003cspan class=\"blue\">质量\u003c/span>瑕疵\u003c/li>\u003cli>\u003cspan class=\"blue\">除另有约定外，维修租赁物\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">此外，出租人享有保留租赁物的所有权与收取租金的权利\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>出租人要把能用的东西交给租客，并在租期内按约和法律让它保持可用。\u003c/p>","count":4,"chars":82,"gap":false},{"id":"civil-1794843503242","n":242,"chapter":"第三编 债与合同","title":"租赁合同中承租人的义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">正当使用并且妥善保管租赁物\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">未经同意不得擅自转租\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不得擅自对租赁物进行改善或增设其他设施\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">支付租金\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">租赁合同终止时返还租赁物\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">此外\u003c/span>，承租人享有请求\u003cspan class=\"blue\">出租人\u003c/span>交付租赁物与使用租赁物的权利\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>租客要按约付租、爱护并正确使用东西，租期结束后按约还回去。\u003c/p>","count":6,"chars":85,"gap":false},{"id":"civil-1794843503243","n":243,"chapter":"第三编 债与合同","title":"一房数租的规则","body":"\u003col>\u003cli>\u003cspan class=\"red\">一房数租的规则（占有，登记，成立）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">出租人就同一房屋订立数份租赁合同\u003c/span>，在合同均有效时，\u003cspan class=\"blue\">承租人\u003c/span>均主张履行的，人民法院按照下列顺序确定适格的\u003cspan class=\"blue\">承租人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">已经合法占有租赁房屋的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">已经办理登记备案手续的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">合同成立在先的\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>同一套房租给几个人时，合同都有效也不等于人人都能入住，要按占有、登记等顺序确定谁履行。\u003c/p>","count":5,"chars":99,"gap":false},{"id":"civil-1794843503244","n":244,"chapter":"第三编 债与合同","title":"房屋承租人不能行使优先购买权的情形","body":"\u003col>\u003cli>\u003cspan class=\"red\">房屋按份共有人行使优先购买权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">出租人卖给近亲属\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">承租人获通知后15日内未明确表示购买\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">出租人拍卖前5日通知，承租人未参加，视为放弃\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">上述情形不能再主张承租人优先购买\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>买家是房东近亲属、共有人依法优先购买或租客未按期表示等情况下，租客不能要求优先买。\u003c/p>","count":5,"chars":78,"gap":false},{"id":"civil-1794843503245","n":245,"chapter":"第三编 债与合同","title":"租赁权物权化的概念及其情形","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">租赁权物权化，指法律让原本属于债权的租赁权，在特定情况下也能对抗第三人，保护承租人继续使用租赁物\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">买卖不破租赁\u003c/span>：承租人依合同占有租赁物期间，租赁物所\u003cspan class=\"blue\">有权\u003c/span>发生变动，不影响原\u003cspan class=\"blue\">租赁合同\u003c/span>效力\u003c/li>\u003cli>\u003cspan class=\"blue\">在先租赁不受在后抵押影响\u003c/span>：设立\u003cspan class=\"blue\">抵押权\u003c/span>前，财产已经出租并转移占有的，原租赁关系不受该\u003cspan class=\"blue\">抵押权\u003c/span>影响\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>依法占着租来的房，房主卖房通常不能赶走租客；先租并交付后设的抵押也通常不妨碍原租。\u003c/p>","count":3,"chars":136,"gap":false},{"id":"civil-1794843503246","n":246,"chapter":"第三编 债与合同","title":"融资租赁合同的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：承租人选出卖人与租赁物，出租人买下交其使用，承租人付租金\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">关系\u003c/span>：\u003cspan class=\"blue\">涉及\u003c/span>出卖人、出租人和承租人，通常有\u003cspan class=\"blue\">买卖\u003c/span>、租赁两份合同\u003c/li>\u003cli>\u003cspan class=\"blue\">租金\u003c/span>：通常按租赁物\u003cspan class=\"blue\">大部分\u003c/span>或全部购置成本及合理利润确定\u003c/li>\u003cli>\u003cspan class=\"blue\">性质\u003c/span>：双务、有偿、诺成、要式，应采用\u003cspan class=\"blue\">书面形式\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>租客挑设备，出租人买来让他用并收租，兼有融资和租用两层作用。\u003c/p>","count":4,"chars":108,"gap":false},{"id":"civil-1794843503247","n":247,"chapter":"第三编 债与合同","title":"保理合同的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">指应收账款债权人将现有的或将有的应收账款转让给保理人，保理人提供资金融通、应收账款管理或催收、付款担保等服务的合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保理合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保理人须取得保理业务的资质\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">合同标的为提供保理服务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保理合同是要式合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保理合同是有偿合同、双务合同、诺成合同\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>企业把应收账款转给保理人，保理人可提供资金、催收或管理等服务。\u003c/p>","count":6,"chars":113,"gap":false},{"id":"civil-1794843503248","n":248,"chapter":"第三编 债与合同","title":"多重保理中债权归属的确定顺序","body":"\u003col>\u003cli>\u003cspan class=\"red\">已登记优先：已登记的先于未登记的\u003c/span>；\u003cspan class=\"blue\">均已登记\u003c/span>的，按\u003cspan class=\"blue\">登记时间\u003c/span>先后\u003c/li>\u003cli>\u003cspan class=\"blue\">均未登记\u003c/span>：按\u003cspan class=\"blue\">转让\u003c/span>通知到达应收账款债务人的先后\u003c/li>\u003cli>\u003cspan class=\"blue\">均未登记且未通知\u003c/span>：按保理\u003cspan class=\"blue\">融资款\u003c/span>或服务报酬的比例取得\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一笔应收账款被多次拿去保理，先按登记，再按通知等法定顺序定谁占先。\u003c/p>","count":3,"chars":77,"gap":false},{"id":"civil-1794843503249","n":249,"chapter":"第三编 债与合同","title":"承揽合同的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">指承揽人按照定作人的要求完成工作，交付工作成果，定作人支付报酬的合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">（加工、定制、修理、复制、测试及检验等）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">承揽合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">承揽人的义务有不可让与性\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">以完成一定工作为目的\u003c/span>\u003c/li>\u003cli>（\u003cspan class=\"blue\">标的物\u003c/span>）\u003cspan class=\"blue\">标的物\u003c/span>为承揽人应向定作人交付的工作成果，该成果有\u003cspan class=\"blue\">特定性\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">承揽合同是双务合同、有偿合同、诺成合同、不要式合同\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>按要求做好一件定制品并交成果，客户付报酬；重点是完成约好的工作。\u003c/p>","count":7,"chars":137,"gap":false},{"id":"civil-1794843503250","n":250,"chapter":"第三编 债与合同","title":"承揽人的权利与义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">按照约定提供材料或妥善处理定作人提供的材料\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">接受定作人的监督、检查\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">承揽人应以自己的设备、技术及劳力完成主要工作\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">承揽人应妥善保管工作成果并且负有瑕疵担保责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按照定作人的要求保守秘密\u003c/span>，\u003cspan class=\"blue\">未经\u003c/span>许可，\u003cspan class=\"blue\">不得\u003c/span>留存复制品或技术资料\u003c/li>\u003cli>\u003cspan class=\"blue\">请求支付报酬和留置工作成果的权利\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>承揽人按要求做好、交付成果并保密，符合条件时可要报酬或依法留置。\u003c/p>","count":6,"chars":122,"gap":false},{"id":"civil-1794843503251","n":251,"chapter":"第三编 债与合同","title":"定作人的权利与义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">依约提供材料\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">承揽工作需要定作人协助的，应协助\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按时接收、验收工作成果\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按照约定向承揽人支付报酬\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">此外，定作人享有监督承揽工作与请求交付工作成果的权利\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>定作人要给必要材料和协助，按约验收、付报酬，也可依法监督制作过程。\u003c/p>","count":5,"chars":71,"gap":false},{"id":"civil-1794843503252","n":252,"chapter":"第三编 债与合同","title":"建设工程合同的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">指承包人按照发包人的要求完成工作，交付建设工程，发包人支付价款的合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">建设工程合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主体有限定性。承包人须是经过批准的有相应资质的单位\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">标的有特殊性，为建设工程\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">合同管理有严格性\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">形式有要式性。建设工程合同须采用书面形式\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">建设工程合同是双务合同、有偿合同、诺成合同\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>发包人付工程价款，承包人依法完成设计、施工等工程工作并交成果。\u003c/p>","count":7,"chars":126,"gap":false},{"id":"civil-1794843503253","n":253,"chapter":"第三编 债与合同","title":"运输合同的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">指承运人将旅客或货物从起运地点运输到约定地点，旅客、托运人或收货人支付票款或运费的合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">运输合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">承运人一般负有强制缔约义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">标的是承运人的运输行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">运输合同一般是格式合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">运输合同是双务合同、有偿合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">运输合同是诺成合同\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>承运人把人或货按约安全送到指定地点，旅客、托运人或收货人依法依约付费。\u003c/p>","count":7,"chars":105,"gap":false},{"id":"civil-1794843503254","n":254,"chapter":"第三编 债与合同","title":"客运合同中托运财物损失的免责事由","body":"\u003col>\u003cli>\u003cspan class=\"red\">客运托运物损失，承运人原则担责\u003c/span>\u003c/li>\u003cli>能证明因\u003cspan class=\"blue\">不可抗力\u003c/span>、物品本身自然性质或合理损耗、托运人或收货人过错造成的，可依法免责\u003c/li>\u003cli>\u003cspan class=\"blue\">旅客随身物品损失另按客运相应规则判断\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>自带物损坏看承运人有无过错，交去托运的行李则按货物运输的相关规则处理。\u003c/p>","count":3,"chars":74,"gap":false},{"id":"civil-1794843503255","n":255,"chapter":"第三编 债与合同","title":"货运合同中货物损失的免责事由","body":"\u003col>\u003cli>\u003cspan class=\"red\">运输货物毁损、灭失，承运人原则赔偿\u003c/span>\u003c/li>\u003cli>不可抗力、货物自然性质或合理损耗、\u003cspan class=\"blue\">托运人\u003c/span>或收货人过错造成，可证明免责\u003c/li>\u003cli>\u003cspan class=\"blue\">因不可抗力灭失，未收运费不得再收，已收的可请求返还\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>货运途中东西坏了，承运人要证明是不可抗力、货物自身性质等法定原因，才可能免责。\u003c/p>","count":3,"chars":76,"gap":false},{"id":"civil-1794843503256","n":256,"chapter":"第三编 债与合同","title":"委托开发合同中委托人的义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">根据《民法典》，委托开发合同中，委托人应\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按约定支付研究开发经费和报酬\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按约定提供技术资料\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按约定提出研究开发要求\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按约定完成协作事项\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按约定接受研究开发成果\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>委托开发新技术的人要付钱、讲清要求、给资料和协助，最后按约接受成果。\u003c/p>","count":6,"chars":74,"gap":false},{"id":"civil-1794843503257","n":257,"chapter":"第三编 债与合同","title":"委托开发合同中研究开发人的义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">根据《民法典》，委托开发合同中，研究开发人应\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按约定制定和实施研究开发计划\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">合理使用研究开发经费\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按约定按期完成研究开发工作，交付研究开发成果\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">提供有关技术资料和必要的技术指导\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">帮助委托人掌握研究开发成果\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>接受开发任务的一方要按约用经费、按进度研究并交成果，还要帮助对方掌握它。\u003c/p>","count":6,"chars":97,"gap":false},{"id":"civil-1794843503258","n":258,"chapter":"第三编 债与合同","title":"保管合同的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：寄存人交物，保管人负责保管并返还\u003c/span>；购物、就餐、住宿时存于指定处，原则上视为保管\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">标的\u003c/span>：保管行为，属劳务合同\u003c/li>\u003cli>\u003cspan class=\"blue\">成立\u003c/span>：一般自\u003cspan class=\"blue\">交付\u003c/span>保管物时\u003cspan class=\"blue\">成立\u003c/span>，另有约定除外\u003c/li>\u003cli>\u003cspan class=\"blue\">费用\u003c/span>：依约定；\u003cspan class=\"blue\">未明\u003c/span>且按补充规则仍无法确定的，视为无偿\u003c/li>\u003cli>\u003cspan class=\"blue\">形式\u003c/span>：不要式\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>把东西交给别人保管、到时返还，重点是替你照看，报酬要看约定。\u003c/p>","count":5,"chars":108,"gap":false},{"id":"civil-1794843503259","n":259,"chapter":"第三编 债与合同","title":"保管合同中保管人的义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">交付保管凭证\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">妥善保管，原则亲自保管\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">第三人主张权利，及时通知寄存人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保管终止返还原物及孳息\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">未经同意不得擅用、许可他人使用保管物\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>保管人要妥善照看，不能擅自使用、转交别人，最后按规则返还原物及孳息。\u003c/p>","count":5,"chars":61,"gap":false},{"id":"civil-1794843503260","n":260,"chapter":"第三编 债与合同","title":"保管合同中寄存人的义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">告知义务：需要采取特殊保管措施的，寄存人应告知保管人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">声明义务\u003c/span>：寄存人寄存\u003cspan class=\"blue\">货币\u003c/span>、有价\u003cspan class=\"blue\">证券\u003c/span>或其他贵重物品的，应向保管人声明，由保管人验收或封存\u003c/li>\u003cli>\u003cspan class=\"blue\">付费义务\u003c/span>：寄存人应按照约定支付报酬并且\u003cspan class=\"blue\">负担\u003c/span>保管的\u003cspan class=\"blue\">必要费用\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>交别人保管的东西有危险或特殊保存要求，要提前说清；有报酬约定还要按约支付。\u003c/p>","count":3,"chars":97,"gap":false},{"id":"civil-1794843503261","n":261,"chapter":"第三编 债与合同","title":"仓储合同的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">指保管人为存货人储存货物，存货人支付仓储费的合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">仓储合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保管人须为专门仓储保管业务的民事主体\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">标的是保管行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">仓储合同是双务合同、有偿合同、诺成合同、不要式合同\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>仓储合同是由保管人专业存货、存货人付费，双方意思一致即可成立。\u003c/p>","count":5,"chars":78,"gap":false},{"id":"civil-1794843503262","n":262,"chapter":"第三编 债与合同","title":"仓储合同中保管人的义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">按照合同约定接收存货人交付的货物\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">出具仓单、入库单的义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">妥善保管仓储物的义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">接受检查的义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">危险通知义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">返还仓储物的义务\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>仓库要按约验货、开凭证、妥善存放，出现危险或变质时及时通知并处理。\u003c/p>","count":6,"chars":58,"gap":false},{"id":"civil-1794843503263","n":263,"chapter":"第三编 债与合同","title":"仓储合同中存货人的义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">交付仓储物的义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">提取仓储物的义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">支付仓储费、必要费用的义务\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>存货人要说明货物性质，危险品要提供资料和合适包装，还得按约付费、提货。\u003c/p>","count":3,"chars":29,"gap":false},{"id":"civil-1794843503264","n":264,"chapter":"第三编 债与合同","title":"委托合同的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">指委托人对受托人进行委托，受托人处理委托人事务的合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">委托合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">受托人既可以以委托人的名义\u003c/span>，也可以以自己的\u003cspan class=\"blue\">名义\u003c/span>对外进行活动\u003c/li>\u003cli>\u003cspan class=\"blue\">通常建立在彼此信任的基础上\u003c/span>，故委托人与受托人均享有\u003cspan class=\"blue\">单方解除\u003c/span>权\u003c/li>\u003cli>\u003cspan class=\"blue\">标的为受托人提供的劳务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">委托合同是双务合同、诺成合同、不要式合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">委托合同可以是有偿合同，也可以是无偿合同\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>请别人替自己办事，就是委托，双方可约范围和报酬，信赖是关键。\u003c/p>","count":7,"chars":140,"gap":false},{"id":"civil-1794843503265","n":265,"chapter":"第三编 债与合同","title":"委托人的义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">偿付费用及支付报酬\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">清偿受托人因处理委托事务产生的债务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">赔偿损失\u003c/span>：受托人在处理委托事务时，因\u003cspan class=\"blue\">不可\u003c/span>归责于自己的\u003cspan class=\"blue\">事由\u003c/span>受到损失的，委托人应向受托人\u003cspan class=\"blue\">赔偿损失\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>请人代办的人通常要预付或偿还必要费用，还应依法承受处理事务的相应后果。\u003c/p>","count":3,"chars":72,"gap":false},{"id":"civil-1794843503266","n":266,"chapter":"第三编 债与合同","title":"受托人的义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">亲自处理委托事务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按照委托人的指示处理委托事务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">报告的义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">交付财产、转移权利给委托人\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>受托人按指示亲自办、及时汇报，并把办事取得的财物交回；出错是否赔要看情况。\u003c/p>","count":4,"chars":40,"gap":false},{"id":"civil-1794843503267","n":267,"chapter":"第三编 债与合同","title":"物业服务合同的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">物业服务：服务人在区域内维修养护、维护卫生秩序等，业主支付物业费\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">双方平等，无隶属关系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">服务人可为企业或其他管理人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">以劳务为标的，属双务、有偿、诺成、要式合同\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>物业按约维护公共部分和秩序，业主支付物业费，服务围绕大家共用的区域和设施。\u003c/p>","count":4,"chars":76,"gap":false},{"id":"civil-1794843503268","n":268,"chapter":"第三编 债与合同","title":"行纪合同的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">指行纪人以自己的名义为委托人贸易活动，委托人支付报酬的合同\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">行纪合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行纪人以自己的名义办理行纪事务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">并且行纪人仅限于经过审查、登记可以贸易活动的主体\u003c/span>\u003c/li>\u003cli>行纪人为委托人办理的事务仅限于\u003cspan class=\"blue\">商品\u003c/span>的寄售、购销等贸易活动\u003c/li>\u003cli>\u003cspan class=\"blue\">行纪合同是双务合同、有偿合同、诺成合同、不要式合同\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>行纪人用自己名义替客户做贸易，赚的是办事的约定报酬。\u003c/p>","count":6,"chars":125,"gap":false},{"id":"civil-1794843503269","n":269,"chapter":"第三编 债与合同","title":"行纪合同的效力","body":"\u003col>\u003cli>\u003cspan class=\"red\">行纪人义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依委托人的指示贸易活动\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">负担交易费用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">直接履行与第三人签订的合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保管并合理处分委托物\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">报告和移交交易所得\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">还有请求支付报酬的权利\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>行纪人以自己名义和第三人订合同，先由他承担对外合同权利义务，再按约与委托人结算。\u003c/p>","count":7,"chars":65,"gap":false},{"id":"civil-1794843503270","n":270,"chapter":"第三编 债与合同","title":"中介合同的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">指中介人向委托人报告订立合同的机会或提供订立合同的媒介服务，委托人支付报酬的合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">中介合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">合同主体是中介人与委托人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">中介合同\u003c/span>的内容的是为委托人报告订约机会或提供订约媒介服务\u003c/li>\u003cli>\u003cspan class=\"blue\">中介合同中委托人的给付义务有不确定性\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">中介合同是诺成合同、不要式合同\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>中介主要帮你找人、提供订约机会或撮合，促成合同后才能按规则主张报酬。\u003c/p>","count":6,"chars":117,"gap":false},{"id":"civil-1794843503271","n":271,"chapter":"第三编 债与合同","title":"合伙合同的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">合伙合同：指两个以上合伙人为了共同的事业目的，订立的共享利益、共担风险的合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">合伙合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">合伙人数至少为两人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">合伙人须有共同的事业目的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">合伙人须共同出资\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">合伙人之间负连带责任\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>几个人商量好一起出力经营、一起享收益承担风险，就形成合伙合同关系。\u003c/p>","count":6,"chars":81,"gap":false},{"id":"civil-1794843503272","n":272,"chapter":"第三编 债与合同","title":"合伙人的义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">履行出资义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不得请求支付报酬\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不得请求分割合伙财产\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>合伙人要按约出资、分担亏损、依法承担合伙债务，不能随便损害共同利益。\u003c/p>","count":3,"chars":24,"gap":false},{"id":"civil-1794843503273","n":273,"chapter":"第三编 债与合同","title":"合伙人的权利","body":"\u003col>\u003cli>\u003cspan class=\"red\">利润、亏损按约定→协商→实缴比例→平均分担\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">超份额清偿者可向其他合伙人追偿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">财产份额对外转让，原则经其他合伙人一致同意\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">事务决议原则全体一致，可另约\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">共同执行事务；可依约委托执行，其他人有监督权\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>合伙人可依法参与或监督事务，按规定取得利润，重大事项按合伙规则决定。\u003c/p>","count":5,"chars":93,"gap":false},{"id":"civil-1794843503274","n":274,"chapter":"第三编 债与合同","title":"合伙人的利润分配（亏损分担）规则","body":"\u003col>\u003cli>\u003cspan class=\"red\">利益分配、亏损分担请求权：约定-协商-实缴比例-平均\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>合伙赚钱或亏损先按约分，没约定再协商，按法律规定的后续顺序处理。\u003c/p>","count":1,"chars":26,"gap":false},{"id":"civil-1794843503275","n":275,"chapter":"第三编 债与合同","title":"无因管理的概念及其要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">无因管理：无法定、约定义务，为避免他人利益受损，自愿管理他人事务的事实行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">无管理义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">具有为他人谋利益的意思\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">实际管理他人事务，事务可为事实行为或法律行为\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>没约也没法定义务，为免别人受损主动管了他的事，符合条件才构成无因管理。\u003c/p>","count":4,"chars":75,"gap":false},{"id":"civil-1794843503276","n":276,"chapter":"第三编 债与合同","title":"不能无因管理的事项","body":"\u003col>\u003cli>\u003cspan class=\"red\">不能无因管理3（本人好不好）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法须由本人亲自实施或须经本人授权才能实施行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">纯粹道义上、宗教上或一般生活事务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">违法或违背社会公德行为\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>本来就要你做、违反本人合法意思或属于不能由别人处理的事，不能随便用无因管理算钱。\u003c/p>","count":4,"chars":64,"gap":false},{"id":"civil-1794843503277","n":277,"chapter":"第三编 债与合同","title":"无因管理的效力","body":"\u003col>\u003cli>\u003cspan class=\"red\">受益人的义务：偿还管理事务支出的必要费用\u003c/span>；管理人故受损的，给予\u003cspan class=\"blue\">适当补偿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">管理人的义务\u003c/span>：采取\u003cspan class=\"blue\">有利\u003c/span>于受益人的方式；能通知的及时通知，非\u003cspan class=\"blue\">紧急\u003c/span>时等其指示；结束后报告并移交取得的财产\u003c/li>\u003cli>\u003cspan class=\"blue\">事后追认\u003c/span>：自管理开始适用\u003cspan class=\"blue\">委托\u003c/span>合同规则，管理人另有意思表示的除外\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>没义务也帮别人办了事，记得通知和交接，垫付的合理花费可以讨回。\u003c/p>","count":3,"chars":116,"gap":false},{"id":"civil-1794843503278","n":278,"chapter":"第三编 债与合同","title":"不当得利的概念及其要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">不当得利：无法律根据获益，使他人受损的事实\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">一方获益，包括财产增加、应减少而未减少\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">另一方受损，包括减少、应增加而未增加\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">得利与损失有因果关系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">得利无法律、合同等正当依据\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>误收别人转的钱却没有正当理由留下时，受损人可以依法要求返还。\u003c/p>","count":5,"chars":81,"gap":false},{"id":"civil-1794843503279","n":279,"chapter":"第三编 债与合同","title":"不当得利的分类","body":"\u003col>\u003cli>\u003cspan class=\"red\">给付型不当得利：因给付行为而发生的不当得利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">非给付型不当得利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">基于受益人行为而发生的不当得利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">基于受害人行为而发生的不当得利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">基于第三人行为而发生的不当得利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">基于自然事件而发生的不当得利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">基于法律规定而发生的不当得利\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>不当得利可因别人主动给付产生，也可因侵害、添附等非给付原因产生。\u003c/p>","count":7,"chars":102,"gap":false},{"id":"civil-1794843503280","n":280,"chapter":"第三编 债与合同","title":"不当得利的返还范围（效力）","body":"\u003col>\u003cli>\u003cspan class=\"red\">善意得利人：不知道且不应知道无合法根据，所得利益已不存在的，不返还\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">恶意得利人\u003c/span>：知道或应知道无合法根据，返还所得利益并依法\u003cspan class=\"blue\">赔偿损失\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">无偿受让人\u003c/span>：得利人将利益无偿转给第三人的，\u003cspan class=\"blue\">受损人\u003c/span>可请求第三人在相应范围内返还\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>不知收错且已经没剩的利益，和明知收错还留下的利益，法律要求退还的范围不同。\u003c/p>","count":3,"chars":102,"gap":false},{"id":"civil-1794843503281","n":281,"chapter":"第四编 知识产权","title":"知识产权的类型（范围）","body":"\u003col>\u003cli>\u003cspan class=\"red\">狭义：著作权、专利权、商标权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">广义\u003c/span>：还包括\u003cspan class=\"blue\">地理\u003c/span>标志、商业秘密、\u003cspan class=\"blue\">集成\u003c/span>电路布图设计、植物新品种及法律规定的其他客体\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>作品、发明、商标、商业秘密等成果能受到保护，但不同客体受不同制度管。\u003c/p>","count":2,"chars":54,"gap":false},{"id":"civil-1794843503282","n":282,"chapter":"第四编 知识产权","title":"知识产权的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：民事主体依法就作品、发明创造、商标等法定客体享有的权利\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">专有性\u003c/span>：原则上只有权人可依法\u003cspan class=\"blue\">使用\u003c/span>或授权\u003cspan class=\"blue\">使用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">无形性\u003c/span>：权利所\u003cspan class=\"blue\">指向\u003c/span>的是无形客体\u003c/li>\u003cli>\u003cspan class=\"blue\">时间性\u003c/span>：依法在规定\u003cspan class=\"blue\">期限\u003c/span>内受保护\u003c/li>\u003cli>\u003cspan class=\"blue\">地域性\u003c/span>：原则上仅在确认该权利的\u003cspan class=\"blue\">国家\u003c/span>或地区有效\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>知识不是普通有形物，法律给它专门保护，通常还限定地区和保护时间。\u003c/p>","count":5,"chars":103,"gap":false},{"id":"civil-1794843503283","n":283,"chapter":"第四编 知识产权","title":"商业秘密的概念及其构成要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">商业秘密：非公知、有商业价值且已采取合理保密措施的技术、经营等商业信息\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">非公知性\u003c/span>：不为公众知悉\u003c/li>\u003cli>\u003cspan class=\"blue\">价值性\u003c/span>：\u003cspan class=\"blue\">现实\u003c/span>或潜在竞争利益\u003c/li>\u003cli>\u003cspan class=\"blue\">保密性\u003c/span>：已采取与价值、情况相适应的合理措施\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一份资料得是外界不容易知道、有商业价值，而且持有人采取了保密措施，才可能是商业秘密。\u003c/p>","count":4,"chars":80,"gap":false},{"id":"civil-1794843503284","n":284,"chapter":"第四编 知识产权","title":"商业秘密的侵权行为","body":"\u003col>\u003cli>\u003cspan class=\"red\">以盗窃、贿赂、欺诈、胁迫、电子侵入等非法获取\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">披露、使用或许可使用非法取得的秘密\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">违反保密义务、要求披露使用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">明知应知上述侵权仍获取使用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">教唆引诱帮助违反保密获取使用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">非经营者也可构成侵权\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>偷拿秘密、违反保密义务透露或使用，或者明知来路不正仍使用，都可能侵权。\u003c/p>","count":6,"chars":89,"gap":false},{"id":"civil-1794843503285","n":285,"chapter":"第四编 知识产权","title":"经营者实施的混淆行为的情形","body":"\u003col>\u003cli>\u003cspan class=\"red\">混淆标准：足以让人误以为是他人商品或与他人存在特定联系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">商品标识\u003c/span>：擅用他人有一定影响的商品名称、\u003cspan class=\"blue\">包装\u003c/span>、装潢等标识\u003c/li>\u003cli>\u003cspan class=\"blue\">名称与网络标识\u003c/span>：擅用有一定影响的名称、\u003cspan class=\"blue\">姓名\u003c/span>、域名、网页名、账号名、\u003cspan class=\"blue\">应用\u003c/span>名或图标等\u003c/li>\u003cli>\u003cspan class=\"blue\">其他\u003c/span>：包括用他人相关\u003cspan class=\"blue\">知名\u003c/span>标识作\u003cspan class=\"blue\">企业\u003c/span>字号或搜索关键词，足以引人误认的情形\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>模仿别人有影响的标识，让顾客误以为是同一家或两家有联系，就可能构成混淆。\u003c/p>","count":4,"chars":130,"gap":false},{"id":"civil-1794843503286","n":286,"chapter":"第四编 知识产权","title":"职务作品的类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">一般职务作品：作者享有著作权，单位在业务范围内可优先使用\u003c/span>；完成后两年内，未经单位同意不得让第三人以相同方式使用\u003c/li>\u003cli>\u003cspan class=\"blue\">特殊职务作品\u003c/span>：作者享有\u003cspan class=\"blue\">署名权\u003c/span>，其余权利归单位；包括主要\u003cspan class=\"blue\">利用\u003c/span>单位物质\u003cspan class=\"blue\">技术\u003c/span>条件且由单位担责的工程设计图、产品设计图、地图、软件等，媒体工作人员的职务作品，及依法或依约归单位的其他职务作品\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>同是上班完成的作品，普通与特殊情形下，作者和单位分别享有哪些权利可能不同。\u003c/p>","count":2,"chars":146,"gap":false},{"id":"civil-1794843503287","n":287,"chapter":"第四编 知识产权","title":"著作权不予保护的对象","body":"\u003col>\u003cli>\u003cspan class=\"red\">除外情形3（事实为依据，法律为准绳）（官方通用消息）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律、法规\u003c/span>，\u003cspan class=\"blue\">国家\u003c/span>机关的\u003cspan class=\"blue\">决议\u003c/span>、决定、命令和其他有立法、行政、司法性质的文件及其官方正式译文\u003c/li>\u003cli>\u003cspan class=\"blue\">单纯事实消息\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">历法、通用数表、通用表格和公式\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>法律法规、单纯事实消息等，不因有人整理发布就当然享有著作权保护。\u003c/p>","count":4,"chars":91,"gap":false},{"id":"civil-1794843503288","n":288,"chapter":"第四编 知识产权","title":"著作人身权的内容（类型）","body":"\u003col>\u003cli>\u003cspan class=\"red\">署名权：在作品上署名以表明作者身份的权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">发表权\u003c/span>：决定作品是否公\u003cspan class=\"blue\">之于\u003c/span>众的权利\u003c/li>\u003cli>\u003cspan class=\"blue\">保护作品完整权\u003c/span>：保护作品\u003cspan class=\"blue\">不受\u003c/span>歪曲、篡改的权利\u003c/li>\u003cli>\u003cspan class=\"blue\">修改权\u003c/span>：修改或\u003cspan class=\"blue\">授权\u003c/span>他人修改作品的权利\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>作者可决定何时发表、用谁的名义，也可依法修改或防止别人歪曲作品。\u003c/p>","count":4,"chars":77,"gap":false},{"id":"civil-1794843503289","n":289,"chapter":"第四编 知识产权","title":"著作人身权的侵权行为","body":"\u003col>\u003cli>\u003cspan class=\"red\">署名权：在作品上署名以表明作者身份的权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">发表权\u003c/span>：决定作品是否公\u003cspan class=\"blue\">之于\u003c/span>众的权利\u003c/li>\u003cli>\u003cspan class=\"blue\">保护作品完整权\u003c/span>：保护作品\u003cspan class=\"blue\">不受\u003c/span>歪曲、篡改的权利\u003c/li>\u003cli>\u003cspan class=\"blue\">修改权\u003c/span>：修改或\u003cspan class=\"blue\">授权\u003c/span>他人修改作品的权利\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>没经作者同意擅自发表、冒名、歪曲作品，即使没收钱，也可能侵害作者人身权。\u003c/p>","count":4,"chars":77,"gap":false},{"id":"civil-1794843503290","n":290,"chapter":"第四编 知识产权","title":"专利权的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">专利权：发明人、设计人及合法继受人依法对发明创造享有的专有权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">具知识产权的专有、地域、时间等特征\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">公开性\u003c/span>：公开\u003cspan class=\"blue\">技术\u003c/span>以换取保护\u003c/li>\u003cli>\u003cspan class=\"blue\">行政授予性\u003c/span>：须申请并经依法审查授权，不\u003cspan class=\"blue\">自动\u003c/span>产生\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>依法取得专利后，权利人在一定期限、范围内可阻止他人擅自实施。\u003c/p>","count":4,"chars":83,"gap":false},{"id":"civil-1794843503291","n":291,"chapter":"第四编 知识产权","title":"职务发明创造的概念及其类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">职务发明：执行单位任务或主要利用单位物质技术条件完成的发明创造\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">任务包括本职工作、单位交付的其他任务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">退休、调离或劳动人事关系终止后1年内\u003c/span>，作出与原工作、任务有关的发明，也属相应职务发明\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>做单位交给的工作，或主要用单位条件完成发明时，先按职务发明规则确定权利。\u003c/p>","count":3,"chars":91,"gap":false},{"id":"civil-1794843503292","n":292,"chapter":"第四编 知识产权","title":"专利权客体的概念及其种类","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">专利权的客体的概念：专利权的客体，指符合专利条件的发明创造，具体包括发明、实用新型和外观设计\u003c/span>\u003c/p>","memory":"","understanding":"\u003cp>专利保护的客体可分发明、实用新型和外观设计，分别保护不同的创新。\u003c/p>","count":1,"chars":46,"gap":false},{"id":"civil-1794843503293","n":293,"chapter":"第四编 知识产权","title":"实用新型与发明的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">保护对象：实用新型针对产品形状、构造或其结合，不保护方法\u003c/span>；发明可针对产品或方法\u003c/li>\u003cli>\u003cspan class=\"blue\">创造性\u003c/span>：发明要求突出的\u003cspan class=\"blue\">实质性\u003c/span>特点和显著进步；实用新型要求\u003cspan class=\"blue\">实质性\u003c/span>特点和进步\u003c/li>\u003cli>\u003cspan class=\"blue\">审查\u003c/span>：发明进行实质\u003cspan class=\"blue\">审查\u003c/span>，实用新型一般只\u003cspan class=\"blue\">初步审查\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">期限\u003c/span>：均自申请日起算，发明\u003cspan class=\"blue\">二十年\u003c/span>，实用新型十年\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>发明可涉及产品或方法，实用新型主要保护产品形状、构造等实用改进。\u003c/p>","count":4,"chars":121,"gap":false},{"id":"civil-1794843503294","n":294,"chapter":"第四编 知识产权","title":"专利权不予保护的对象","body":"\u003col>\u003cli>\u003cspan class=\"red\">违反法律、公德或公共利益的发明\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">科学发现、智力活动规则方法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">疾病诊断治疗方法，药品器械可另依法申请\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">动植物品种，生产方法可申请\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">原子核变换方法及所得物\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主要作标识的平面印刷品设计\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">违法取得利用遗传资源并依赖其完成的发明\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一项东西再新，也可能因属于科学发现、治疗方法等法定类别而不能授予专利。\u003c/p>","count":7,"chars":103,"gap":false},{"id":"civil-1794843503295","n":295,"chapter":"第四编 知识产权","title":"专利权的内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">实施权：自行实施专利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">许可权\u003c/span>：准许\u003cspan class=\"blue\">别人\u003c/span>实施\u003c/li>\u003cli>\u003cspan class=\"blue\">转让权\u003c/span>：依法让与专利\u003cspan class=\"blue\">申请权\u003c/span>或专利权\u003c/li>\u003cli>\u003cspan class=\"blue\">署名权、标记权\u003c/span>：发明人或设计人可署名；专利权人可标专利\u003cspan class=\"blue\">标识\u003c/span>与专利号\u003c/li>\u003cli>\u003cspan class=\"blue\">获奖权、报酬权\u003c/span>：\u003cspan class=\"blue\">职务发明\u003c/span>创造的发明人或设计人依法获得\u003cspan class=\"blue\">奖励\u003c/span>与合理报酬\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>专利权人能依法自己实施、许可或转让，也能阻止他人未经许可实施。\u003c/p>","count":5,"chars":103,"gap":false},{"id":"civil-1794843503296","n":296,"chapter":"第四编 知识产权","title":"专利权的侵权行为","body":"\u003col>\u003cli>\u003cspan class=\"red\">发明与实用新型\u003c/span>\u003c/li>\u003cli>为生产经营目的制造、使用、许诺销售、销售、进口其专利产品\u003c/li>\u003cli>\u003cspan class=\"blue\">或（减去制造）使用、许诺销售、销售、进口其专利方法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">外观设计\u003c/span>\u003c/li>\u003cli>（减去使用）制造、许诺销售、销售、进口其\u003cspan class=\"blue\">外观设计\u003c/span>专利产品\u003c/li>\u003cli>\u003cspan class=\"blue\">使用、销售、许诺销售者\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">赔偿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不知道+能证明合法来源——不承担\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">停止\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">证明已支付合理对价——不承担\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>没有许可就为生产经营目的制造、使用或销售专利产品等，可能侵犯专利权。\u003c/p>","count":10,"chars":137,"gap":false},{"id":"civil-1794843503297","n":297,"chapter":"第四编 知识产权","title":"不侵犯专利权的情形","body":"\u003col>\u003cli>\u003cspan class=\"red\">权利用尽：合法售出后再使用、销售、进口等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">先用权\u003c/span>：申请前已实施或必要准备，在原范围\u003cspan class=\"blue\">继续\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">临时过境\u003c/span>：外国\u003cspan class=\"blue\">交通工具\u003c/span>依法为自身需要使用\u003c/li>\u003cli>\u003cspan class=\"blue\">专为科学研究实验使用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">为药品医疗器械审批提供资料而依法制造、使用、进口等\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>专利产品合法卖出后再转卖，或满足先用、科研等法定例外时，不按一般侵权处理。\u003c/p>","count":5,"chars":97,"gap":false},{"id":"civil-1794843503298","n":298,"chapter":"第四编 知识产权","title":"商标权客体的概念及其种类","body":"\u003col>\u003cli>\u003cspan class=\"red\">客体：注册商标\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">商品商标\u003c/span>：用于商品\u003c/li>\u003cli>\u003cspan class=\"blue\">服务商标\u003c/span>：用于服务\u003c/li>\u003cli>\u003cspan class=\"blue\">集体商标\u003c/span>：团体等以组织\u003cspan class=\"blue\">名义\u003c/span>注册，由成员用来表明成员资格\u003c/li>\u003cli>\u003cspan class=\"blue\">证明商标\u003c/span>：有\u003cspan class=\"blue\">监督\u003c/span>能力的组织\u003cspan class=\"blue\">控制\u003c/span>，供组织外单位、个人证明产地、原料、制造方法、质量等特定品质\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>商标保护的是能让买家识别商品或服务来源的标志，标志可以有不同形式。\u003c/p>","count":5,"chars":97,"gap":false},{"id":"civil-1794843503299","n":299,"chapter":"第四编 知识产权","title":"商标权的内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">独占使用权：商标一经注册，商标权人即对注册商标在法定范围内享有专有使用的权利，他人未经许可不得使用，否则构成侵权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">（补\u003c/span>：作为赠品\u003cspan class=\"blue\">销售\u003c/span>也侵权；\u003cspan class=\"blue\">不知情\u003c/span>也侵权（只是不担责））\u003c/li>\u003cli>\u003cspan class=\"blue\">许可权\u003c/span>：商标注册人有权经签订许可使用合同，许可他人使用自己的注册商标\u003c/li>\u003cli>\u003cspan class=\"blue\">转让权\u003c/span>：商标注册人有权依法将注册商标转让给他人\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>注册商标可按批准的范围使用和许可，也可阻止他人违法冒用。\u003c/p>","count":4,"chars":140,"gap":false},{"id":"civil-1794843503300","n":300,"chapter":"第五编 人格权","title":"人格权的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">人格权：民事主体为维护独立人格依法享有的基本民事权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法产生，主体地位平等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">以人格利益为客体，为主体存在所必备\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">专属于本人，不得放弃、转让、继承\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>人格权保护与自己作为一个人紧密相连的利益，例如姓名、身体和隐私。\u003c/p>","count":4,"chars":70,"gap":false},{"id":"civil-1794843503301","n":301,"chapter":"第五编 人格权","title":"一般人格权的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：自然人基于人身自由、人格尊严等根本人格利益享有的权利\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">主体\u003c/span>：限自然人，\u003cspan class=\"blue\">人人\u003c/span>平等享有\u003c/li>\u003cli>\u003cspan class=\"blue\">客体\u003c/span>：以\u003cspan class=\"blue\">概括性\u003c/span>的一般人格利益为\u003cspan class=\"blue\">客体\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">内容\u003c/span>：不能\u003cspan class=\"blue\">事先\u003c/span>穷尽，可保护未被列举的具体人格利益\u003c/li>\u003cli>\u003cspan class=\"blue\">根本性\u003c/span>：保护人格\u003cspan class=\"blue\">独立\u003c/span>、平等、自由与尊严等基础利益\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有些人格利益没被专门列名，也能基于人身自由和人格尊严得到保护。\u003c/p>","count":5,"chars":108,"gap":false},{"id":"civil-1794843503302","n":302,"chapter":"第五编 人格权","title":"肖像制作权的内容（体现）","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">肖像权指自然人享有的制作、使用或许可他人使用、公开其肖像，故享受一定利益，并排除他人非法侵害的权利\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">肖像制作权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">肖像使用权与许可使用权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">肖像利益维护权\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>自己的形象要不要被拍摄、绘制或录制，原则上由自己决定，法律另有例外。\u003c/p>","count":4,"chars":72,"gap":false},{"id":"civil-1794843503303","n":303,"chapter":"第五编 人格权","title":"隐私支配权的内容（体现）","body":"\u003col>\u003cli>\u003cspan class=\"red\">私密空间：决定是否允许他人进入、拍摄或窥视\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">私密活动\u003c/span>：决定是否允许他人\u003cspan class=\"blue\">观察\u003c/span>、窃听或公开\u003c/li>\u003cli>\u003cspan class=\"blue\">私密信息\u003c/span>：依法决定是否向他人\u003cspan class=\"blue\">披露\u003c/span>、是否同意他人\u003cspan class=\"blue\">处理\u003c/span>；法律另有规定的除外\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>私事要不要对别人公开、允许别人知道到什么程度，原则上由自己作主。\u003c/p>","count":3,"chars":77,"gap":false},{"id":"civil-1794843503304","n":304,"chapter":"第五编 人格权","title":"健康权的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">健康权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">健康权指自然人享有的维护健康\u003c/span>，\u003cspan class=\"blue\">保持\u003c/span>与利用劳动能力，故享受一定利益，并排除他人非法侵害的权利\u003c/li>\u003cli>\u003cspan class=\"blue\">健康权的内容\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">健康维护权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">劳动能力维护权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">健康利益支配权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">健康权是专属于自然人的人格权\u003c/span>，始于出生，终于死亡，不能\u003cspan class=\"blue\">随意转让\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">健康权以维护自然人的身体功能的正常发挥为根本利益\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">健康权是绝对权、对世权\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>健康权保护身体和心理的正常功能，受伤得病可能侵害它。\u003c/p>","count":9,"chars":139,"gap":false},{"id":"civil-1794843503305","n":305,"chapter":"第五编 人格权","title":"身体权的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：自然人保持身体完整、支配自己肢体、器官和其他人体组织，排除非法侵害的权利\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">主体\u003c/span>：仅自然人享有，\u003cspan class=\"blue\">不得\u003c/span>转让\u003c/li>\u003cli>\u003cspan class=\"blue\">客体\u003c/span>：权利人\u003cspan class=\"blue\">自身\u003c/span>的身体组成部分\u003c/li>\u003cli>\u003cspan class=\"blue\">内容\u003c/span>：维护身体完整与身体组织，依法支配身体，属\u003cspan class=\"blue\">支配权\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>身体权重在保护身体完整和行动自由，例如不能擅自触碰、拘束或损伤他人身体。\u003c/p>","count":4,"chars":94,"gap":false},{"id":"civil-1794843503306","n":306,"chapter":"第五编 人格权","title":"姓名权的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">姓名权：自然人决定、使用、许可使用、变更姓名并排除侵害的权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">内容为决定、使用许可、变更\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">专属自然人，与人身不可分，不得转让、抛弃\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客体为姓名；决定、变更原则须依法登记\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>人有权决定、使用和依法变更姓名，也能阻止别人盗用或冒用。\u003c/p>","count":4,"chars":81,"gap":false},{"id":"civil-1794843503307","n":307,"chapter":"第五编 人格权","title":"名称权的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：法人、非法人组织依法决定、使用、变更、转让名称，或许可他人使用，并排除非法侵害\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">主体\u003c/span>：法人和非法人组织\u003c/li>\u003cli>\u003cspan class=\"blue\">财产利益\u003c/span>：名称可以有\u003cspan class=\"blue\">商业\u003c/span>价值，\u003cspan class=\"blue\">商业\u003c/span>名称可依法转让\u003c/li>\u003cli>\u003cspan class=\"blue\">登记\u003c/span>：决定、变更、转让名称\u003cspan class=\"blue\">依法登记\u003c/span>，法律另有规定的除外\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>组织能依法决定、使用和变更自己的名称，也能阻止别人擅自使用造成误认。\u003c/p>","count":4,"chars":104,"gap":false},{"id":"civil-1794843503308","n":308,"chapter":"第五编 人格权","title":"肖像权的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">肖像权：自然人制作、使用、公开、许可他人使用肖像并维护相关利益的权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">专属于自然人，与人格尊严不可分\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客体是可识别的外部形象，不是照片等载体\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">包括制作、使用许可、维护利益等权能\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>画像、照片或影像能让人认出你时，你就可依法决定别人能不能制作、使用和公开它。\u003c/p>","count":4,"chars":85,"gap":false},{"id":"civil-1794843503309","n":309,"chapter":"第五编 人格权","title":"肖像权具有专有性的原因与体现","body":"\u003col>\u003cli>\u003cspan class=\"red\">原因：可识别的外部形象与本人紧密相连，体现人格利益\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">体现\u003c/span>：本人\u003cspan class=\"blue\">有权\u003c/span>制作、使用、公开或许可他人使用肖像；\u003cspan class=\"blue\">未经\u003c/span>同意不得制作、使用或公开，法律另有规定的除外\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>肖像首先指向本人，所以原则上能不能把它拿去用，由本人决定。\u003c/p>","count":2,"chars":74,"gap":false},{"id":"civil-1794843503310","n":310,"chapter":"第五编 人格权","title":"名誉权的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">名誉权：主体保持、维护名誉、依法享有相关利益并排除侵害的人格权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主体包括自然人、法人、非法人组织\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客体为社会对其品德、声望、才能、信用等评价\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">包括名誉保有、维护、利益支配\u003c/span>；无\u003cspan class=\"blue\">直接\u003c/span>财产内容，但可关联财产利益\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>名誉是社会对一个人的评价，造谣、侮辱让别人看低他，就可能侵害名誉权。\u003c/p>","count":4,"chars":99,"gap":false},{"id":"civil-1794843503311","n":311,"chapter":"第五编 人格权","title":"隐私权的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">隐私权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">隐私权指自然人享有的保密、维护、支配隐私\u003c/span>，故享受一定利益，并排除他人非法侵害的权利\u003c/li>\u003cli>\u003cspan class=\"blue\">隐私权的内容\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">隐私保密权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">隐私保护权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">隐私支配权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">隐私权的主体限于自然人，是专属于自然人的人格权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">隐私权的客体是隐私\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">隐私权是支配权，权利人既可以利用隐私，也可以放弃隐私\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>私人生活的安宁和不愿公开的空间、活动、信息，都属于隐私保护的范围。\u003c/p>","count":9,"chars":124,"gap":false},{"id":"civil-1794843503312","n":312,"chapter":"第五编 人格权","title":"健康权与生命权、身体权的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">生命权：保护自然人的生命安全和生命尊严\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">身体权\u003c/span>：保护身体完整和\u003cspan class=\"blue\">行动\u003c/span>自由，并保障依法支配身体组织\u003c/li>\u003cli>\u003cspan class=\"blue\">健康权\u003c/span>：保护\u003cspan class=\"blue\">身心健康\u003c/span>，维持身体机能与正常的心理状态\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>生命权护生存，身体权护完整和活动自由，健康权护身心正常功能。\u003c/p>","count":3,"chars":71,"gap":false},{"id":"civil-1794843503313","n":313,"chapter":"第五编 人格权","title":"合理使用他人肖像的行为","body":"\u003col>\u003cli>\u003cspan class=\"red\">个人使用：学习、艺术欣赏、课堂教学或科研，可在必要范围内使用其已公开的肖像\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">新闻报道\u003c/span>：报道所不可避免的制作、使用或公开\u003c/li>\u003cli>\u003cspan class=\"blue\">依法履职\u003c/span>：国家\u003cspan class=\"blue\">机关\u003c/span>在必要范围内不可避免地制作、使用或公开\u003c/li>\u003cli>\u003cspan class=\"blue\">公共环境\u003c/span>：\u003cspan class=\"blue\">展示特定公共环境\u003c/span>时不可避免地制作、使用或公开\u003c/li>\u003cli>\u003cspan class=\"blue\">其他公益\u003c/span>：维护\u003cspan class=\"blue\">公共利益\u003c/span>或肖像权人合法\u003cspan class=\"blue\">权益\u003c/span>而合理使用、制作或公开\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>某些新闻报道、公共活动或履行法定职责确须用肖像，可以在合理范围依法使用。\u003c/p>","count":5,"chars":144,"gap":false},{"id":"civil-1794843503314","n":314,"chapter":"第五编 人格权","title":"舆论监督与名誉权的关系","body":"\u003col>\u003cli>\u003cspan class=\"red\">原则：为公共利益进行新闻报道、舆论监督，影响他人名誉的，一般不担民事责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">例外\u003c/span>：捏造或歪曲\u003cspan class=\"blue\">事实\u003c/span>；对他人提供的严重失实内容未尽合理核实义务；使用\u003cspan class=\"blue\">侮辱性\u003c/span>言辞等\u003c/li>\u003cli>\u003cspan class=\"blue\">核实判断\u003c/span>：看来源\u003cspan class=\"blue\">可信度\u003c/span>、有争议内容是否调查、核实能力与成本、贬损可能、时效性及与\u003cspan class=\"blue\">公序良俗\u003c/span>的关联\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>公共利益可支持舆论监督，但不能捏造、歪曲或对严重失实内容不尽合理核实义务。\u003c/p>","count":3,"chars":123,"gap":false},{"id":"civil-1794843503315","n":315,"chapter":"第五编 人格权","title":"荣誉与名誉的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">评价来源：荣誉来自特定组织授予，名誉来自社会公众评价\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">能否撤销\u003c/span>：荣誉可依法\u003cspan class=\"blue\">剥夺\u003c/span>或撤销，社会评价不能由特定组织\u003cspan class=\"blue\">宣告\u003c/span>撤销\u003c/li>\u003cli>\u003cspan class=\"blue\">评价内容\u003c/span>：荣誉为\u003cspan class=\"blue\">积极\u003c/span>褒扬，名誉可褒可贬\u003c/li>\u003cli>\u003cspan class=\"blue\">评价范围\u003c/span>：荣誉\u003cspan class=\"blue\">侧重\u003c/span>特定表现，名誉较综合\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>名誉是大家怎样评价你，荣誉是有关组织依法依规授给你的称号或奖励。\u003c/p>","count":4,"chars":95,"gap":false},{"id":"civil-1794843503316","n":316,"chapter":"第五编 人格权","title":"隐私权的侵权行为","body":"\u003col>\u003cli>\u003cspan class=\"red\">以电话、短信、即时通讯工具、电子邮件、传单等方式侵扰他人的私人生活安宁\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">进入、拍摄、窥视他人的住宅、宾馆房间等私密空间\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">拍摄、窥视、窃听、公开他人的私密活动\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">拍摄、窥视他人身体的私密部位\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">处理他人的私密信息\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">以其他方式侵害他人的隐私权\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>偷听私事、偷拍私密场所或反复骚扰私人生活，都可能侵害隐私。\u003c/p>","count":6,"chars":112,"gap":false},{"id":"civil-1794843503317","n":317,"chapter":"第五编 人格权","title":"处理个人信息的条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">处理条件4（同意、公开、透明、合法）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">处理个人信息的\u003c/span>，应\u003cspan class=\"blue\">遵循\u003c/span>合法、正当、必要原则，\u003cspan class=\"blue\">不得\u003c/span>过度处理，并符合下列条件\u003c/li>\u003cli>\u003cspan class=\"blue\">征得该自然人或其监护人同意\u003c/span>，但法律、行政法规另有规定的除外\u003c/li>\u003cli>\u003cspan class=\"blue\">公开处理信息的规则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">明示处理信息的目的、方式和范围\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不违反法律、行政法规的规定和双方的约定\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>收集使用个人信息要有合法依据、说明目的和范围，并且不能收超出需要的信息。\u003c/p>","count":6,"chars":126,"gap":false},{"id":"civil-1794843503318","n":318,"chapter":"第五编 人格权","title":"合理使用个人信息的情形","body":"\u003col>\u003cli>\u003cspan class=\"red\">合理使用3（同意、公开、合法）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">在该自然人或其监护人同意的范围内合理实施行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">合理处理该自然人自行公开的或其他已经合法公开的信息\u003c/span>，但该自然人明确拒绝或\u003cspan class=\"blue\">处理\u003c/span>该信息侵害其\u003cspan class=\"blue\">重大利益\u003c/span>的除外\u003c/li>\u003cli>\u003cspan class=\"blue\">为维护公共利益或该自然人合法权益，合理实施的其他行为\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>为公共利益等符合法律规定而使用个人信息，仍要守合理范围，不能想怎么用就怎么用。\u003c/p>","count":4,"chars":114,"gap":false},{"id":"civil-1794843503319","n":319,"chapter":"第五编 人格权","title":"自然人对其个人信息享有的权利","body":"\u003col>\u003cli>\u003cspan class=\"red\">知情、决定并依法限制拒绝信息处理\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">查阅复制，合条件可请求转移\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">更正补充不准、不全信息\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法定情形请求删除\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">要求处理者解释规则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">可撤回基于同意的处理，不影响撤回前合法处理\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>自然人可以依法查自己有哪些信息被存着，发现错了可要求改，符合法定情形可要求删。\u003c/p>","count":6,"chars":78,"gap":false},{"id":"civil-1794843503320","n":320,"chapter":"第五编 人格权","title":"信息处理者对个人信息负担的义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">处理原则：合法、正当、必要，不得过度处理\u003c/span>；原则上取得本人或\u003cspan class=\"blue\">监护人\u003c/span>同意，公开规则，明示目的、方式、范围，遵守法律及约定\u003c/li>\u003cli>\u003cspan class=\"blue\">保密与安全\u003c/span>：不得泄露、\u003cspan class=\"blue\">篡改\u003c/span>或非法提供；\u003cspan class=\"blue\">采取\u003c/span>安全措施，发生或可能发生泄露等情形应及时补救、告知并依法报告\u003c/li>\u003cli>\u003cspan class=\"blue\">响应请求\u003c/span>：依法提供\u003cspan class=\"blue\">查阅\u003c/span>、复制，\u003cspan class=\"blue\">纠正\u003c/span>错误，删除违法或违约处理的信息\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>处理别人信息的人要说明用途、妥善保护和依法处理泄露，不能未授权乱传乱卖。\u003c/p>","count":3,"chars":141,"gap":false},{"id":"civil-1794843503321","n":321,"chapter":"第六编 婚姻家庭","title":"亲属的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">亲属：因婚姻、血缘、法律拟制产生的人际关系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">产生原因特定，如结婚、出生、收养\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">权利义务法定，不得任意约定改变、放弃\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有固定身份称谓，身份原则不得任意变更解除\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>亲属可能因结婚、血缘或收养形成，但具体权利义务看关系类型和法律规定。\u003c/p>","count":4,"chars":75,"gap":false},{"id":"civil-1794843503322","n":322,"chapter":"第六编 婚姻家庭","title":"结婚的条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">男女双方完全自愿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">男女双方达到法定婚龄\u003c/span>，男不得早于22周岁，女不得早于20周岁\u003c/li>\u003cli>\u003cspan class=\"blue\">男女双方均无配偶\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">直系血亲与三代以内旁系血亲不得结婚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">形式条件\u003c/span>：办理\u003cspan class=\"blue\">结婚登记\u003c/span>：结婚的\u003cspan class=\"blue\">形式条件\u003c/span>指法律规定的结婚须履行的法定程序，婚姻关系自办理\u003cspan class=\"blue\">结婚登记\u003c/span>时确立\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>结婚要双方自愿、达到法定年龄，没有禁止结婚的亲属关系等障碍，并依法登记。\u003c/p>","count":5,"chars":113,"gap":false},{"id":"civil-1794843503323","n":323,"chapter":"第六编 婚姻家庭","title":"无效婚姻的概念及其情形","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：婚姻因欠缺法定实质要件，自始不具有法律约束力\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">无效情形\u003c/span>：重婚；有禁止结婚的亲属关系；未到法定婚龄\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>重婚、禁止结婚的亲属关系或未到法定婚龄，属于能够依法认定婚姻无效的情形。\u003c/p>","count":2,"chars":50,"gap":false},{"id":"civil-1794843503324","n":324,"chapter":"第六编 婚姻家庭","title":"申请宣告无效婚姻的主体","body":"\u003col>\u003cli>\u003cspan class=\"red\">婚姻当事人及利害关系人，利害关系人包括\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">以未达到法定婚龄为由申请宣告婚姻无效的\u003c/span>，为未\u003cspan class=\"blue\">达到\u003c/span>法定婚龄者的近亲属\u003c/li>\u003cli>\u003cspan class=\"blue\">以重婚为由申请宣告婚姻无效的\u003c/span>，为当事人的近亲属及\u003cspan class=\"blue\">基层\u003c/span>组织\u003c/li>\u003cli>\u003cspan class=\"blue\">以有禁止结婚的亲属关系为由申请宣告婚姻无效的\u003c/span>，为当事人的近亲属\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>本人或特定利害关系人可以依法请求确认婚姻无效，也要按具体无效事由区分主体。\u003c/p>","count":4,"chars":111,"gap":false},{"id":"civil-1794843503325","n":325,"chapter":"第六编 婚姻家庭","title":"夫妻人身关系的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">夫妻人身关系：合法夫妻因配偶身份产生、不具直接财产内容的权利义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">基于合法婚姻\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主要内容法定，不得任意约定取消\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">对双方既是权利也是义务\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>结婚带来夫妻身份，但婚后夫妻仍平等，各自人格和自由不因此被剥夺。\u003c/p>","count":4,"chars":64,"gap":false},{"id":"civil-1794843503326","n":326,"chapter":"第六编 婚姻家庭","title":"夫妻人身关系的内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">夫妻相互忠实义务：夫妻应互相忠实，互相尊重\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">夫妻的人身自由权\u003c/span>：夫妻双方都有参加\u003cspan class=\"blue\">生产\u003c/span>、工作、学习和社会活动的自由，一方\u003cspan class=\"blue\">不得\u003c/span>对另一方加以限制或干涉\u003c/li>\u003cli>\u003cspan class=\"blue\">夫妻的姓名权\u003c/span>：夫妻双方都有各自\u003cspan class=\"blue\">使用\u003c/span>自己姓名的权利\u003c/li>\u003cli>\u003cspan class=\"blue\">夫妻对抚育未成年子女有平等的权利和义务\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>结婚后各自还能用自己的姓名、参加工作，反过来对家庭和子女也有共同义务。\u003c/p>","count":4,"chars":113,"gap":false},{"id":"civil-1794843503327","n":327,"chapter":"第六编 婚姻家庭","title":"夫妻财产关系的概念及其内容","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：夫妻间因婚姻产生的财产权利义务\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">相互扶养\u003c/span>：需要扶养的一方可向不\u003cspan class=\"blue\">履行义务\u003c/span>的一方请求给付\u003cspan class=\"blue\">扶养费\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">相互继承\u003c/span>：夫妻互为第一顺序\u003cspan class=\"blue\">法定继承人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">财产归属\u003c/span>：包括\u003cspan class=\"blue\">约定财产制\u003c/span>与法定财产制\u003c/li>\u003cli>\u003cspan class=\"blue\">日常家事代理\u003c/span>：一方为家庭\u003cspan class=\"blue\">日常生活\u003c/span>所作行为原则上对双方有效\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>婚后要分清哪些钱和财产共同归属、哪些各自保留，以及债务等由谁承担。\u003c/p>","count":5,"chars":111,"gap":false},{"id":"civil-1794843503328","n":328,"chapter":"第六编 婚姻家庭","title":"夫妻共同财产的类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">工资、奖金、劳务报酬等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">生产、经营、投资收益\u003c/span>\u003c/li>\u003cli>婚姻关系存续\u003cspan class=\"blue\">期间\u003c/span>实际取得或已经明确可以取得的\u003cspan class=\"blue\">知识产权\u003c/span>收益\u003c/li>\u003cli>\u003cspan class=\"blue\">继承或赠与所得\u003c/span>，但遗嘱或\u003cspan class=\"blue\">赠与合同\u003c/span>中确定只归夫或妻一方的除外\u003c/li>\u003cli>\u003cspan class=\"blue\">其他\u003c/span>，\u003cspan class=\"blue\">例如\u003c/span>，婚后一方\u003cspan class=\"blue\">父母\u003c/span>出资购买的房屋，但\u003cspan class=\"blue\">父母\u003c/span>明确表示赠与一方的除外\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>婚后工资产生的收入等通常归夫妻共同所有，但法律规定或合法约定另有安排的除外。\u003c/p>","count":5,"chars":112,"gap":false},{"id":"civil-1794843503329","n":329,"chapter":"第六编 婚姻家庭","title":"夫妻个人财产的类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">一方婚前财产\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">一方人身损害赔偿或补偿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">一方专用生活用品\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">遗嘱或赠与合同中确定只归夫或妻一方的财产\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">其他\u003c/span>，\u003cspan class=\"blue\">例如\u003c/span>，婚前一方\u003cspan class=\"blue\">父母\u003c/span>出资购买的房屋，但\u003cspan class=\"blue\">父母\u003c/span>明确表示赠与双方的除外\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>婚前财产、专属一方的损害赔偿等，通常由个人拿着，不因结婚自动变共同财产。\u003c/p>","count":5,"chars":79,"gap":false},{"id":"civil-1794843503330","n":330,"chapter":"第六编 婚姻家庭","title":"夫妻财产约定的概念及其有效条件","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">约定财产制的概念：约定财产制指夫妻以契约确定夫妻财产关系的制度，在适用上有优先于法定财产制的效力\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">约定的主体须为具备完全民事行为能力的夫妻双方\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">约定的意思表示须自愿、真实\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">约定的内容须合法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">约定的形式须合法\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>夫妻可书面说清婚前婚后的财产归谁，但约定要有真实合意并合法。\u003c/p>","count":5,"chars":99,"gap":false},{"id":"civil-1794843503331","n":331,"chapter":"第六编 婚姻家庭","title":"父母子女关系的内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">父母抚养未成年、不能独立生活的成年子女，教育保护未成年子女\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">成年子女赡养无劳动能力或生活困难父母\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">子女不干涉父母婚姻自由\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">父母子女互有继承权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">父母可依法请求确认或否认亲子关系，成年子女可请求确认\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>父母要养育孩子，成年子女要照顾父母，双方还可以依法继承对方的财产。\u003c/p>","count":5,"chars":93,"gap":false},{"id":"civil-1794843503332","n":332,"chapter":"第六编 婚姻家庭","title":"祖父母、外祖父母对孙子女、外孙子女承担抚养义务的条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">祖父母、外祖父母对孙子女、外孙子女承担抚养义务的条件3\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">祖父母、外祖父母有负担能力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">孙子女、外孙子女须为未成年人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">孙子女、外孙子女的父母已经死亡或父母无力抚养\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>父母已死亡或无力抚养未成年孩子时，有负担能力的祖辈依法接过抚养责任。\u003c/p>","count":4,"chars":76,"gap":false},{"id":"civil-1794843503333","n":333,"chapter":"第六编 婚姻家庭","title":"孙子女、外孙子女对祖父母、外祖父母承担赡养义务的条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">孙子女、外孙子女对祖父母、外祖父母承担赡养义务的条件3\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">孙子女、外孙子女为有负担能力的成年人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">祖父母、外祖父母须是需要赡养的人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">祖父母、外祖父母的子女已经死亡或子女无力赡养\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>老人子女已死亡或无力赡养时，有负担能力的孙辈依法接过赡养责任。\u003c/p>","count":4,"chars":83,"gap":false},{"id":"civil-1794843503334","n":334,"chapter":"第六编 婚姻家庭","title":"兄、姐对弟、妹负担扶养义务的条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">兄、姐有负担能力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">弟、妹须是未成年人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">父母已经死亡或父母无力抚养\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>父母已死亡或无力抚养未成年弟妹时，有负担能力的兄姐依法负扶养义务。\u003c/p>","count":3,"chars":30,"gap":false},{"id":"civil-1794843503335","n":335,"chapter":"第六编 婚姻家庭","title":"弟、妹对兄、姐负担扶养义务的条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">弟、妹有负担能力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">兄、姐须是缺乏劳动能力又缺乏生活来源的人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">弟、妹是由兄、姐扶养长大\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>由兄姐养大的弟妹有负担能力，若兄姐缺劳动能力又无生活来源，依法要扶养。\u003c/p>","count":3,"chars":40,"gap":false},{"id":"civil-1794843503336","n":336,"chapter":"第六编 婚姻家庭","title":"离婚的特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">主体：只能由夫妻本人离婚，双方均生存\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">前提\u003c/span>：\u003cspan class=\"blue\">原来\u003c/span>存在有效婚姻关系\u003c/li>\u003cli>\u003cspan class=\"blue
