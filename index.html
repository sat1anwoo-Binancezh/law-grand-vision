\">程序\u003c/span>：须符合法定条件，\u003cspan class=\"blue\">经过登记\u003c/span>或诉讼\u003cspan class=\"blue\">程序\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">后果\u003c/span>：解除夫妻关系，并依法\u003cspan class=\"blue\">处理\u003c/span>财产、\u003cspan class=\"blue\">债务\u003c/span>和子女抚养等事项\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>离婚是夫妻在双方生存期间依法解除婚姻，要走登记或诉讼程序。\u003c/p>","count":4,"chars":79,"gap":false},{"id":"civil-1794843503337","n":337,"chapter":"第六编 婚姻家庭","title":"登记离婚的概念及其条件","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：夫妻自愿离婚，达成协议并办理离婚登记，解除婚姻关系\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">主体\u003c/span>：双方是合法夫妻，且有\u003cspan class=\"blue\">完全民事行为能力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">合意\u003c/span>：双方自愿，\u003cspan class=\"blue\">签订\u003c/span>书面离婚协议\u003c/li>\u003cli>\u003cspan class=\"blue\">后果安排\u003c/span>：对子女\u003cspan class=\"blue\">抚养\u003c/span>、财产及债务处理协商一致\u003c/li>\u003cli>\u003cspan class=\"blue\">登记\u003c/span>：双方亲自申请；冷静期\u003cspan class=\"blue\">三十日\u003c/span>届满后，\u003cspan class=\"blue\">三十日\u003c/span>内共同申请发证\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>两人都愿离婚，且子女、财产和债务已经谈妥，才能依法走登记离婚。\u003c/p>","count":5,"chars":117,"gap":false},{"id":"civil-1794843503338","n":338,"chapter":"第六编 婚姻家庭","title":"登记离婚的程序","body":"\u003col>\u003cli>\u003cspan class=\"red\">双方亲自申请，并就子女、财产、债务协商一致\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">申请后30日冷静期，任一方可撤回\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">期满再30日内须共同亲领离婚证，逾期视为撤回\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">机关审查自愿及协议后登记、发证\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>双方先共同申请，经过冷静期后再在法定期限共同申领离婚证。\u003c/p>","count":4,"chars":74,"gap":false},{"id":"civil-1794843503339","n":339,"chapter":"第六编 婚姻家庭","title":"诉讼离婚中感情确已破裂的情形","body":"\u003col>\u003cli>\u003cspan class=\"red\">夫妻感情确已破裂的情形包括：（同居分居害人害己）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">重婚或与他人同居的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">由于感情不和分居满二年的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">实施家庭暴力或虐待、遗弃家庭成员的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有赌博、吸毒等恶习屡教不改的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">其他情形致使感情确已破裂\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>法院判断还能不能继续一起生活，要看重婚、暴力、因感情不和分居等法定情况。\u003c/p>","count":6,"chars":88,"gap":false},{"id":"civil-1794843503340","n":340,"chapter":"第六编 婚姻家庭","title":"诉讼离婚中的特殊保护","body":"\u003col>\u003cli>\u003cspan class=\"red\">军婚保护：现役军人的配偶要求离婚，原则上须征得军人同意\u003c/span>；军人一方有\u003cspan class=\"blue\">重大过错\u003c/span>的除外\u003c/li>\u003cli>\u003cspan class=\"blue\">女方特殊期间\u003c/span>：怀孕期间、分娩后\u003cspan class=\"blue\">一年\u003c/span>内或终止妊娠后\u003cspan class=\"blue\">六个月\u003c/span>内，男方原则上不得提出离婚；女方提出或法院认为确有必要受理的除外\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>军人配偶起诉通常要征得同意，男方在女方孕产等保护期间通常不能起诉，这两条都有例外。\u003c/p>","count":2,"chars":99,"gap":false},{"id":"civil-1794843503341","n":341,"chapter":"第六编 婚姻家庭","title":"离婚在当事人财产上的效力","body":"\u003col>\u003cli>\u003cspan class=\"red\">离婚后夫妻扶养义务终止，相互继承权丧失\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">共同财产先协议\u003c/span>，不成由法院按照顾子女、女方、无\u003cspan class=\"blue\">过错\u003c/span>方权益原则判决\u003c/li>\u003cli>\u003cspan class=\"blue\">共同债务共同偿还\u003c/span>；共同财产\u003cspan class=\"blue\">不足\u003c/span>或\u003cspan class=\"blue\">各自\u003c/span>所有，协议清偿，不成由法院判决\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>离婚时共同财产和债务要依法处理，符合法定条件还可能涉及补偿、帮助或赔偿。\u003c/p>","count":3,"chars":84,"gap":false},{"id":"civil-1794843503342","n":342,"chapter":"第六编 婚姻家庭","title":"夫妻共同债务的认定规则","body":"\u003col>\u003cli>\u003cspan class=\"red\">夫妻共同债务的清偿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">离婚时，夫妻共同债务应共同偿还\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">共同财产不足清偿或财产归各自所有的，由双方协议清偿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">协议不成的，由人民法院判决\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>判断一笔债是不是两个人都要还，要看共同意思、日常家用或能否证明用于共同生活经营。\u003c/p>","count":4,"chars":62,"gap":false},{"id":"civil-1794843503343","n":343,"chapter":"第六编 婚姻家庭","title":"离婚在父母子女关系上的效力","body":"\u003col>\u003cli>\u003cspan class=\"red\">身份关系：不因离婚消除，双方仍负抚养、教育、保护义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">直接抚养\u003c/span>：不满\u003cspan class=\"blue\">两周岁\u003c/span>原则随母；满\u003cspan class=\"blue\">两周岁\u003c/span>谈不拢，法院按最有利于未成年子女判决；满八周岁尊重其真实意愿\u003c/li>\u003cli>\u003cspan class=\"blue\">抚养费\u003c/span>：原则上不\u003cspan class=\"blue\">直接抚养\u003c/span>的一方承担部分或全部费用\u003c/li>\u003cli>\u003cspan class=\"blue\">探望\u003c/span>：不\u003cspan class=\"blue\">直接抚养\u003c/span>方有\u003cspan class=\"blue\">探望权\u003c/span>，另一方应协助；不利于子女\u003cspan class=\"blue\">身心健康\u003c/span>的，依法中止\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>父母离婚仍是孩子父母，法院要安排直接抚养、抚养费和探望，尽量照顾孩子利益。\u003c/p>","count":4,"chars":135,"gap":false},{"id":"civil-1794843503344","n":344,"chapter":"第六编 婚姻家庭","title":"认定抚养人的不利因素","body":"\u003col>\u003cli>\u003cspan class=\"red\">忠实与家庭安全：重婚、与他人同居等严重违反忠实义务，或有家暴、虐待、遗弃\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">生活习惯\u003c/span>：有\u003cspan class=\"blue\">赌博\u003c/span>、吸毒等恶习\u003c/li>\u003cli>\u003cspan class=\"blue\">抢夺藏匿\u003c/span>：抢夺、藏匿未成年子女，且对方没有严重\u003cspan class=\"blue\">侵害\u003c/span>子女权益的情形\u003c/li>\u003cli>\u003cspan class=\"blue\">其他\u003c/span>：\u003cspan class=\"blue\">其他\u003c/span>不利于未成年子女\u003cspan class=\"blue\">身心健康\u003c/span>的情形\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>看谁带孩子不能只问谁收入高，也要看长期照顾、健康、生活环境和是否伤害孩子。\u003c/p>","count":4,"chars":102,"gap":false},{"id":"civil-1794843503345","n":345,"chapter":"第六编 婚姻家庭","title":"离婚经济帮助的概念及其条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">经济帮助：离婚时一方生活困难、有权请求有能力另一方适当帮助\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">困难指本人财产、分得财产仍不足维持当地基本生活\u003c/span>，无住房也属困难\u003c/li>\u003cli>\u003cspan class=\"blue\">对方须有负担能力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">困难须在离婚时存在，事后新困难不属此项\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>离婚时一方生活困难而另一方有负担能力，可以依法给予适当帮助。\u003c/p>","count":4,"chars":87,"gap":false},{"id":"civil-1794843503346","n":346,"chapter":"第六编 婚姻家庭","title":"离婚损害赔偿的概念及其条件（包括法定过错情形）","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：一方的法定过错导致离婚，无过错方可以请求损害赔偿\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">法定过错\u003c/span>：重婚、与他人\u003cspan class=\"blue\">同居\u003c/span>、家庭\u003cspan class=\"blue\">暴力\u003c/span>、虐待或遗弃家庭成员及其他重大过错\u003c/li>\u003cli>\u003cspan class=\"blue\">其他条件\u003c/span>：过错导致离婚，无过错方故受有\u003cspan class=\"blue\">物质\u003c/span>或精神损害\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>因重婚、家暴等重大过错导致离婚，无过错方可依法请求损害赔偿。\u003c/p>","count":3,"chars":88,"gap":false},{"id":"civil-1794843503347","n":347,"chapter":"第六编 婚姻家庭","title":"收养的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">收养：依法领养他人子女，建立父母子女权利义务的身份法律行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">要式\u003c/span>：须\u003cspan class=\"blue\">收养登记\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">双方行为\u003c/span>：收养、送养等依法同意\u003c/li>\u003cli>\u003cspan class=\"blue\">形成拟制血亲\u003c/span>；与生父母及其近亲属权利义务原则消除，法律另有规定除外\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>依法登记收养后，原本没有父母子女身份的人之间建立相应权利义务。\u003c/p>","count":4,"chars":85,"gap":false},{"id":"civil-1794843503348","n":348,"chapter":"第六编 婚姻家庭","title":"被收养人的类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">下列未成年人可以被收养\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">丧失父母的孤儿。（无父母）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">查找不到父母的未成年人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">父母有特殊困难无力抚养的子女\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>并不是所有未成年人都能被送养，法律规定的孤儿、找不到生父母等类型才可适用。\u003c/p>","count":4,"chars":49,"gap":false},{"id":"civil-1794843503349","n":349,"chapter":"第六编 婚姻家庭","title":"送养人的类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">下列个人、组织可以作为送养人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">孤儿的监护人。（丧失）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">社会福利机构。（查找不到）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有特殊困难无力抚养子女的父母\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">未成年\u003c/span>人的父母均不具备\u003cspan class=\"blue\">完全民事行为能力\u003c/span>并且可能\u003cspan class=\"blue\">严重\u003c/span>危害该\u003cspan class=\"blue\">未成年\u003c/span>人的，该\u003cspan class=\"blue\">未成年\u003c/span>人的监护人可以将其送养\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>能把孩子送养的必须属于法定主体，知道孩子情况的人不当然有权作决定。\u003c/p>","count":5,"chars":101,"gap":false},{"id":"civil-1794843503350","n":350,"chapter":"第六编 婚姻家庭","title":"收养人应当满足的条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">收养人应同时具备下列条件：6（30无病有能力）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">年满三十周岁\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">没有在医学上认为不应收养的疾病\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有抚养、教育与保护被收养人的能力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">无配偶者收养异性的\u003c/span>，收养人与被收养人的年龄应相差\u003cspan class=\"blue\">四十周岁\u003c/span>以上\u003c/li>\u003cli>\u003cspan class=\"blue\">没有子女或只有一名子女\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">无不利于被收养人健康成长的违法犯罪记录\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>收养孩子要看年龄、身体、抚养能力、有无不利犯罪记录等条件，还要照顾孩子利益。\u003c/p>","count":7,"chars":120,"gap":false},{"id":"civil-1794843503351","n":351,"chapter":"第六编 婚姻家庭","title":"收养的合意","body":"\u003col>\u003cli>\u003cspan class=\"red\">收养的合意4（相互合意，孩子同意，内部合意）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">收养人收养与送养人送养\u003c/span>，应双方自愿，并且\u003cspan class=\"blue\">达成\u003c/span>收养协议合意\u003c/li>\u003cli>\u003cspan class=\"blue\">收养八周岁以上未成年人的，应征得被收养人的同意\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">生父母送养子女，应双方共同送养\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有配偶者收养子女，应夫妻共同收养\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>收养要有收养人、送养人同意，达到法定年龄的孩子自己也要同意。\u003c/p>","count":5,"chars":104,"gap":false},{"id":"civil-1794843503352","n":352,"chapter":"第六编 婚姻家庭","title":"收养三代以内旁系同辈血亲的子女不必满足的条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">收养三代以内旁系同辈血亲子女，可不要求生父母有特殊困难、无力抚养\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">无配偶收养异性，不受相差40岁限制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">华侨收养上述子女，还可不受无子女或只有一名子女限制\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>依法收养规定范围内亲属的孩子时，有些普通收养门槛可免，但仍须走合法手续。\u003c/p>","count":3,"chars":74,"gap":false},{"id":"civil-1794843503353","n":353,"chapter":"第六编 婚姻家庭","title":"解除收养关系的法定情形及其程序","body":"\u003col>\u003cli>\u003cspan class=\"red\">情形\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">养父母侵害未成年养子女合法权益\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">养父母与成年养子女关系恶化\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">收养的程序\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依行政程序解除\u003c/span>：达成协议，收养登记\u003cspan class=\"blue\">机关\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依诉讼程序解除\u003c/span>：不能达成合意，人民法院\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>收养后不能想解除就解除，要看有关人的年龄、合意或法定事由，再办登记或诉讼。\u003c/p>","count":6,"chars":73,"gap":false},{"id":"civil-1794843503354","n":354,"chapter":"第六编 婚姻家庭","title":"解除收养关系的效力","body":"\u003col>\u003cli>\u003cspan class=\"red\">解除后与养父母近亲属的权利义务消除\u003c/span>；未成年与生亲关系恢复，成年可协商\u003c/li>\u003cli>\u003cspan class=\"blue\">受抚养成年养子女\u003c/span>，应供养无劳动能力且无生活来源的养父母\u003c/li>\u003cli>\u003cspan class=\"blue\">成年养子女虐待遗弃致解除\u003c/span>，须依请求补偿抚养费；生父母请求解除也可\u003cspan class=\"blue\">适当补偿\u003c/span>，养父母过错致解除除外\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>收养依法解除后，原来的养亲权利义务终止，和生亲的关系是否恢复要看年龄等情况。\u003c/p>","count":3,"chars":108,"gap":false},{"id":"civil-1794843503355","n":355,"chapter":"第七编 继承","title":"继承的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：自然人死亡后，其遗留的个人合法财产依法由他人承受的制度\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">主体\u003c/span>：继承人通常为法定范围内的\u003cspan class=\"blue\">近亲属\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客体\u003c/span>：\u003cspan class=\"blue\">被继承人\u003c/span>的个人合法财产\u003c/li>\u003cli>\u003cspan class=\"blue\">发生原因\u003c/span>：自然人死亡\u003c/li>\u003cli>\u003cspan class=\"blue\">后果\u003c/span>：\u003cspan class=\"blue\">遗产\u003c/span>权利依法发生移转\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一个人死亡后，他原有的可继承财产依法由别人接过，继承才开始。\u003c/p>","count":5,"chars":85,"gap":false},{"id":"civil-1794843503356","n":356,"chapter":"第七编 继承","title":"继承权的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：自然人依据法律或有效遗嘱取得被继承人遗产的权利\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">主体与客体\u003c/span>：归自然人\u003cspan class=\"blue\">享有\u003c/span>，指向被继承人的遗产\u003c/li>\u003cli>\u003cspan class=\"blue\">发生依据\u003c/span>：可依法定\u003cspan class=\"blue\">事由\u003c/span>或遗嘱产生\u003c/li>\u003cli>\u003cspan class=\"blue\">实现时间\u003c/span>：于被继承人死亡、\u003cspan class=\"blue\">继承开始\u003c/span>后实际行使\u003c/li>\u003cli>\u003cspan class=\"blue\">专属性\u003c/span>：不能\u003cspan class=\"blue\">转让\u003c/span>给他人\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>继承权是依法取得遗产的资格与权利，能真正分到遗产还取决于继承是否开始等条件。\u003c/p>","count":5,"chars":97,"gap":false},{"id":"civil-1794843503357","n":357,"chapter":"第七编 继承","title":"丧失继承权的情形","body":"\u003col>\u003cli>\u003cspan class=\"red\">法定情形5（杀人，打人，直接改，间接改）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">故意杀害被继承人的\u003c/span>，并且\u003cspan class=\"blue\">不论是\u003c/span>既遂还是\u003cspan class=\"blue\">未遂\u003c/span>，均应确认其丧失继承权\u003c/li>\u003cli>\u003cspan class=\"blue\">为争夺遗产而杀害其他继承人的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">遗弃被继承人的，或虐待被继承人情节严重的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">伪造、篡改或销毁遗嘱，情节严重的\u003c/span>\u003c/li>\u003cli>以\u003cspan class=\"blue\">欺诈\u003c/span>、胁迫\u003cspan class=\"blue\">手段\u003c/span>迫使或妨碍被继承人设立、变更或撤回遗嘱，情节严重的\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>故意杀害等严重伤害被继承人或其他继承人的行为，可能使人丧失继承权。\u003c/p>","count":6,"chars":135,"gap":false},{"id":"civil-1794843503358","n":358,"chapter":"第七编 继承","title":"继承权的放弃","body":"\u003col>\u003cli>\u003cspan class=\"red\">时间和方式：继承开始后、遗产处理前，以书面向遗产管理人或其他继承人表示\u003c/span>；诉讼中口头放弃应记入笔录并签名\u003c/li>\u003cli>\u003cspan class=\"blue\">限制\u003c/span>：因放弃导致不能履行\u003cspan class=\"blue\">法定\u003c/span>义务的，放弃无效\u003c/li>\u003cli>\u003cspan class=\"blue\">反悔\u003c/span>：遗产处理前或诉讼中由\u003cspan class=\"blue\">法院\u003c/span>依具体\u003cspan class=\"blue\">理由\u003c/span>决定；遗产处理后不予承认\u003c/li>\u003cli>\u003cspan class=\"blue\">效力\u003c/span>：\u003cspan class=\"blue\">追溯\u003c/span>至继承开始\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>继承开始后不想要遗产，要在处理遗产前依法明确表示，默不作声通常不算放弃。\u003c/p>","count":4,"chars":115,"gap":false},{"id":"civil-1794843503359","n":359,"chapter":"第七编 继承","title":"遗产的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：自然人死亡时遗留的个人合法财产\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">时间\u003c/span>：按死亡时的财产\u003cspan class=\"blue\">状况\u003c/span>确定\u003c/li>\u003cli>\u003cspan class=\"blue\">范围\u003c/span>：仅限其个人财产\u003c/li>\u003cli>\u003cspan class=\"blue\">合法性\u003c/span>：财产须合法\u003c/li>\u003cli>\u003cspan class=\"blue\">财产性\u003c/span>：内容须属财产\u003c/li>\u003cli>\u003cspan class=\"blue\">可转让性\u003c/span>：依法或依其性质不能继承的，不属遗产\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>遗产只包括死者留下的个人合法财产，有些专属本人的利益不能继承。\u003c/p>","count":6,"chars":83,"gap":false},{"id":"civil-1794843503360","n":360,"chapter":"第七编 继承","title":"遗赠扶养协议的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：自然人与法定继承人外的个人或组织订协议，由后者承担生养死葬义务，前者以遗赠给财产\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">履行时间\u003c/span>：扶养一般自协议\u003cspan class=\"blue\">生效\u003c/span>开始，受遗赠于\u003cspan class=\"blue\">遗赠人\u003c/span>死亡后实现\u003c/li>\u003cli>\u003cspan class=\"blue\">性质\u003c/span>：双方、双务、有偿的\u003cspan class=\"blue\">民事法律行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">形式\u003c/span>：通常采用\u003cspan class=\"blue\">书面\u003c/span>协议\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一方承诺生养死葬，另一方约定死后给财产，双方都要承担约定的事。\u003c/p>","count":4,"chars":101,"gap":false},{"id":"civil-1794843503361","n":361,"chapter":"第七编 继承","title":"遗赠扶养协议与遗赠的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">主体资格：协议双方一般均须有完全民事行为能力\u003c/span>；遗赠不要求受遗赠人\u003cspan class=\"blue\">有此\u003c/span>能力\u003c/li>\u003cli>\u003cspan class=\"blue\">效力\u003c/span>：扶养协议优先于\u003cspan class=\"blue\">遗嘱继承\u003c/span>和遗赠\u003c/li>\u003cli>\u003cspan class=\"blue\">性质\u003c/span>：协议为双方、双务、有偿行为；遗赠为单方、\u003cspan class=\"blue\">无偿\u003c/span>行为\u003c/li>\u003cli>\u003cspan class=\"blue\">形式\u003c/span>：协议用合同，遗赠用遗嘱\u003c/li>\u003cli>\u003cspan class=\"blue\">主体范围\u003c/span>：扶养人为\u003cspan class=\"blue\">法定继承人\u003c/span>以外的组织或个人；受遗赠人还可以是\u003cspan class=\"blue\">国家\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>遗赠扶养协议有双方约定和生前扶养，普通遗赠主要是一个人通过遗嘱作安排。\u003c/p>","count":5,"chars":127,"gap":false},{"id":"civil-1794843503362","n":362,"chapter":"第七编 继承","title":"遗嘱继承的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：法定继承人按被继承人生前所立的有效遗嘱继承遗产\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">前提\u003c/span>：存在\u003cspan class=\"blue\">合法\u003c/span>有效的遗嘱\u003c/li>\u003cli>\u003cspan class=\"blue\">意定性\u003c/span>：\u003cspan class=\"blue\">遗嘱人\u003c/span>指定继承人和份额\u003c/li>\u003cli>\u003cspan class=\"blue\">排斥性\u003c/span>：不受\u003cspan class=\"blue\">法定继承顺位\u003c/span>、份额限制，但应为\u003cspan class=\"blue\">缺乏劳动能力\u003c/span>又无生活来源的继承人留必要份额\u003c/li>\u003cli>\u003cspan class=\"blue\">优先性\u003c/span>：优先于法定继承；遗嘱未处分或\u003cspan class=\"blue\">无效\u003c/span>部分等依法定继承\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有效遗嘱可在法律允许范围内把遗产安排给法定继承人，是否照办还要看遗嘱和财产范围。\u003c/p>","count":5,"chars":123,"gap":false},{"id":"civil-1794843503363","n":363,"chapter":"第七编 继承","title":"遗嘱继承的适用条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">遗嘱继承人未丧失或放弃继承权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">被继承人生前所立遗嘱合法有效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">没有遗赠扶养协议\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>要按遗嘱继承，先得有有效遗嘱，再看遗嘱指定的人和财产能不能依法承接。\u003c/p>","count":3,"chars":36,"gap":false},{"id":"civil-1794843503364","n":364,"chapter":"第七编 继承","title":"遗嘱的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：自然人依法处分死后遗产或安排其他事务的单方民事法律行为\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">单方性\u003c/span>：依遗嘱人自己的意思成立，\u003cspan class=\"blue\">生前\u003c/span>可依法撤回或变更\u003c/li>\u003cli>\u003cspan class=\"blue\">亲自性\u003c/span>：须本人实施，\u003cspan class=\"blue\">不得\u003c/span>代理\u003c/li>\u003cli>\u003cspan class=\"blue\">要式性\u003c/span>：须符合\u003cspan class=\"blue\">法定\u003c/span>形式\u003c/li>\u003cli>\u003cspan class=\"blue\">死因性\u003c/span>：遗嘱人死亡后生效\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>遗嘱是本人独自安排死后财产的意思，可以依法撤回，等本人死亡后才发生效力。\u003c/p>","count":5,"chars":93,"gap":false},{"id":"civil-1794843503365","n":365,"chapter":"第七编 继承","title":"遗嘱的形式","body":"\u003col>\u003cli>\u003cspan class=\"red\">自书：亲笔、签名、年月日\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">代书\u003c/span>：2名以上见证，\u003cspan class=\"blue\">代书\u003c/span>人及各方签名日期\u003c/li>\u003cli>\u003cspan class=\"blue\">打印\u003c/span>：2名以上见证，各方逐页签名日期\u003c/li>\u003cli>\u003cspan class=\"blue\">录音录像\u003c/span>：2名以上见证，录\u003cspan class=\"blue\">姓名\u003c/span>或肖像及日期\u003c/li>\u003cli>\u003cspan class=\"blue\">口头\u003c/span>：\u003cspan class=\"blue\">危急\u003c/span>时2名以上见证；\u003cspan class=\"blue\">危急\u003c/span>解除能另立则失效\u003c/li>\u003cli>\u003cspan class=\"blue\">公证\u003c/span>：本人经\u003cspan class=\"blue\">公证\u003c/span>机构\u003cspan class=\"blue\">办理\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>遗嘱能亲手写、由人代写、打印或依法采用录音录像等形式，各有相应要求。\u003c/p>","count":6,"chars":106,"gap":false},{"id":"civil-1794843503366","n":366,"chapter":"第七编 继承","title":"遗嘱的有效条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">立遗嘱人须有遗嘱能力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">遗嘱是立遗嘱人的真实意思表示，否则遗嘱无效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">遗嘱内容须合法\u003c/span>，遗嘱内容\u003cspan class=\"blue\">不得\u003c/span>违反法律、\u003cspan class=\"blue\">不得\u003c/span>违反\u003cspan class=\"blue\">公序良俗\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">遗嘱的形式须符合法律规定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">人有想法并且合法\u003c/span>：\u003cspan class=\"blue\">民事法律行为\u003c/span>，合同，\u003cspan class=\"blue\">抵押合同\u003c/span>，夫妻财产约定，遗嘱——的有效条件\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>遗嘱有效要看本人有相应能力、意思真实、处分自己的财产，形式也要符合法律要求。\u003c/p>","count":5,"chars":110,"gap":false},{"id":"civil-1794843503367","n":367,"chapter":"第七编 继承","title":"遗嘱的无效情形","body":"\u003col>\u003cli>\u003cspan class=\"red\">无能力、限制能力人所立遗嘱无效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">受胁迫、欺诈，意思不真实的无效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">伪造遗嘱无效；篡改仅篡改部分无效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">处分国家、集体、他人财产，该部分无效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">部分无效不影响其他可独立有效部分\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>伪造、受欺骗胁迫或由不具备相应能力的人立下的遗嘱，可能依法无效。\u003c/p>","count":5,"chars":80,"gap":false},{"id":"civil-1794843503368","n":368,"chapter":"第七编 继承","title":"遗嘱撤回或者变更的概念及其形式","body":"\u003col>\u003cli>\u003cspan class=\"red\">变更：生前依法部分修改原遗嘱\u003c/span>；撤回：\u003cspan class=\"blue\">废除\u003c/span>或全部改动\u003c/li>\u003cli>\u003cspan class=\"blue\">明示\u003c/span>：另立遗嘱明确变更、撤回\u003c/li>\u003cli>\u003cspan class=\"blue\">行为\u003c/span>：处分财产等与旧遗嘱相反，视为相应撤回\u003c/li>\u003cli>\u003cspan class=\"blue\">数份遗嘱冲突，以最后遗嘱为准，公证遗嘱不当然优先\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>立遗嘱后还可以依法改主意，前后内容冲突时按有效遗嘱规则确定哪份算数。\u003c/p>","count":4,"chars":84,"gap":false},{"id":"civil-1794843503369","n":369,"chapter":"第七编 继承","title":"遗赠的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：自然人以遗嘱把个人财产赠给国家、集体或法定继承人以外的组织、个人，死亡后生效\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">特征\u003c/span>：属于单方\u003cspan class=\"blue\">民事法律行为\u003c/span>，由本人亲自\u003cspan class=\"blue\">作出\u003c/span>，须遵照法定遗嘱形式，遗赠人死亡后生效\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>用遗嘱把财产给法定继承人以外的人或组织，就是遗赠，受遗赠人还要依法表示接受。\u003c/p>","count":2,"chars":81,"gap":false},{"id":"civil-1794843503370","n":370,"chapter":"第七编 继承","title":"遗赠与遗嘱继承的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">主体：遗嘱继承人限于法定继承人\u003c/span>；受遗赠人是其范围外的组织、\u003cspan class=\"blue\">个人\u003c/span>或国家\u003c/li>\u003cli>\u003cspan class=\"blue\">法律地位\u003c/span>：遗嘱继承人依法承受遗产权利及相应\u003cspan class=\"blue\">债务\u003c/span>；受遗赠人取得指定财产，且遗赠执行不得妨碍清偿税款、\u003cspan class=\"blue\">债务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">接受方式\u003c/span>：继承人未\u003cspan class=\"blue\">放弃\u003c/span>视为接受；受遗赠人须在知道受遗赠后\u003cspan class=\"blue\">六十日\u003c/span>内表示，届满未表示视为\u003cspan class=\"blue\">放弃\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>遗嘱里把财产给法定继承人是遗嘱继承，给范围之外的人或组织是遗赠，接受规则也不同。\u003c/p>","count":3,"chars":129,"gap":false},{"id":"civil-1794843503371","n":371,"chapter":"第七编 继承","title":"法定继承的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：依法律规定的继承人范围、顺序和财产分配原则承继遗产\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">身份基础\u003c/span>：通常基于\u003cspan class=\"blue\">婚姻\u003c/span>、血亲等身份关系\u003c/li>\u003cli>\u003cspan class=\"blue\">法定性\u003c/span>：范围、顺序和分配\u003cspan class=\"blue\">基准\u003c/span>由法律规定\u003c/li>\u003cli>\u003cspan class=\"blue\">限制性\u003c/span>：遗嘱处分须\u003cspan class=\"blue\">遵守\u003c/span>法定限制\u003c/li>\u003cli>\u003cspan class=\"blue\">补充性\u003c/span>：无有效遗嘱安排的遗产依法定继承\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>没有可以执行的有效遗嘱安排等时，按法律定的人、顺序和份额分遗产。\u003c/p>","count":5,"chars":100,"gap":false},{"id":"civil-1794843503372","n":372,"chapter":"第七编 继承","title":"法定继承人的范围（类型）","body":"\u003col>\u003cli>\u003cspan class=\"red\">第一顺序：配偶、子女、父母\u003c/span>；尽了\u003cspan class=\"blue\">主要赡养义务\u003c/span>的丧偶\u003cspan class=\"blue\">儿媳\u003c/span>、丧偶女婿依法作为\u003cspan class=\"blue\">第一顺序\u003c/span>继承人\u003c/li>\u003cli>\u003cspan class=\"blue\">第二顺序\u003c/span>：兄弟姐妹、祖父母、\u003cspan class=\"blue\">外祖父母\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">身份范围\u003c/span>：子女含婚生、非婚生、养子女和有\u003cspan class=\"blue\">扶养\u003c/span>关系的继子女；父母含生父母、养父母和有\u003cspan class=\"blue\">扶养\u003c/span>关系的继父母；兄弟姐妹包含同父异母、同母异父、养兄弟姐妹及有\u003cspan class=\"blue\">扶养\u003c/span>关系的继兄弟姐妹\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先找配偶、子女、父母等第一顺序的人，没有时再按第二顺序等规则处理。\u003c/p>","count":3,"chars":144,"gap":false},{"id":"civil-1794843503373","n":373,"chapter":"第七编 继承","title":"法定继承的适用情形","body":"\u003col>\u003cli>\u003cspan class=\"red\">遗嘱继承人放弃继承或受遗赠人放弃受遗赠\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">遗嘱继承人丧失继承权或受遗赠人丧失受遗赠权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">遗嘱继承人、受遗赠人先于遗嘱人死亡或终止\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">遗嘱无效部分所涉及的遗产\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">遗嘱未处分的遗产\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>遗嘱未写到的财产、无效部分或指定人不能承接等，可能转由法定规则分配。\u003c/p>","count":5,"chars":80,"gap":false},{"id":"civil-1794843503374","n":374,"chapter":"第七编 继承","title":"法定继承的遗产分配原则","body":"\u003col>\u003cli>\u003cspan class=\"red\">一般原则：同一顺序继承人份额一般均等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">照顾和奖惩\u003c/span>：生活特殊困难且\u003cspan class=\"blue\">缺乏劳动能力\u003c/span>应照顾；尽主要扶养义务或\u003cspan class=\"blue\">共同生活\u003c/span>可多分；有能力和条件而不尽扶养义务，应少分或不分\u003c/li>\u003cli>\u003cspan class=\"blue\">协商\u003c/span>：继承人\u003cspan class=\"blue\">一致\u003c/span>同意，可以不均分\u003c/li>\u003cli>\u003cspan class=\"blue\">继承人以外\u003c/span>：依靠\u003cspan class=\"blue\">被继承人\u003c/span>扶养或对其扶养较多的人，可适当分得遗产\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>同一顺序一般均分，但有人特别困难或主要承担扶养等，法律允许依法调整。\u003c/p>","count":4,"chars":124,"gap":false},{"id":"civil-1794843503375","n":375,"chapter":"第七编 继承","title":"遗产管理人的确定规则","body":"\u003col>\u003cli>\u003cspan class=\"red\">确定：遗嘱执行人-&gt;继承人推选-&gt;继承人共同担任-&gt;民政部门或村委-&gt;争议法院指定\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有遗嘱执行人的通常由其管理遗产，没有的再由继承人推选等依法确定。\u003c/p>","count":1,"chars":41,"gap":false},{"id":"civil-1794843503376","n":376,"chapter":"第七编 继承","title":"遗产管理人的职责","body":"\u003col>\u003cli>\u003cspan class=\"red\">清理遗产并且制作遗产清单\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">向继承人报告遗产情况\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">采取必要措施防止遗产毁损、灭失\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">处理被继承人的债权、债务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按照遗嘱或依法分割遗产\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">实施与管理遗产有关其他必要行为\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>遗产管理人要查清有哪些财产、保管好、处置债务并按规则协助分割。\u003c/p>","count":6,"chars":75,"gap":false},{"id":"civil-1794843503377","n":377,"chapter":"第七编 继承","title":"遗产分割的原则","body":"\u003col>\u003cli>\u003cspan class=\"red\">先遗嘱继承，后法定继承\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保留胎儿份额，未保留的从继承所得扣回\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">互谅互让、协商分割\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法适用同顺序均等、特殊照顾等分配原则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">物尽其用，有利生产生活，不损害遗产效用\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>分遗产既要处理必要份额等法定保护，也要尽量不把有用的一件东西硬拆坏。\u003c/p>","count":5,"chars":76,"gap":false},{"id":"civil-1794843503378","n":378,"chapter":"第七编 继承","title":"被继承人债务清偿的原则","body":"\u003col>\u003cli>\u003cspan class=\"red\">.保留必留份原则：即便继承所得不足以清偿债务，缺乏劳动能力与生活来源的继承人也可以保留适当遗产\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">限定继承原则\u003c/span>：对继承所负债务，继承人\u003cspan class=\"blue\">只需\u003c/span>以继承所得之财产为限清偿\u003c/li>\u003cli>\u003cspan class=\"blue\">债务清偿优先原则\u003c/span>：执行遗嘱\u003cspan class=\"blue\">不得\u003c/span>妨碍清偿债务与缴纳税款\u003c/li>\u003cli>\u003cspan class=\"blue\">连带责任原则\u003c/span>：在遗产分割前，继承人对遗产是\u003cspan class=\"blue\">共同共有\u003c/span>，对债务是连带责任\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>继承人通常在实际得到的遗产价值内还死者依法应还的债，不因此自动拿自己的钱无限赔。\u003c/p>","count":4,"chars":139,"gap":false},{"id":"civil-1794843503379","n":379,"chapter":"第七编 继承","title":"代位继承的概念及其适用条件","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：法定继承中，被继承人的子女或兄弟姐妹先于其死亡，由法定范围内的晚辈代替继承\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">前提\u003c/span>：被\u003cspan class=\"blue\">代位人\u003c/span>先死亡且具备相应继承\u003cspan class=\"blue\">资格\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">代位人\u003c/span>：子女的\u003cspan class=\"blue\">直系\u003c/span>晚辈血亲，或兄弟姐妹的子女\u003c/li>\u003cli>\u003cspan class=\"blue\">份额\u003c/span>：一般只继承被\u003cspan class=\"blue\">代位人有权\u003c/span>继承的\u003cspan class=\"blue\">份额\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>法定继承中，符合条件的人先去世，他的法定范围内的晚辈或子女可依法代他取得份额。\u003c/p>","count":4,"chars":100,"gap":false},{"id":"civil-1794843503380","n":380,"chapter":"第八编 侵权责任","title":"侵权责任的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">侵权责任：侵权、准侵权损害民事权益，依法承担的民事责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">以违反法定义务为前提\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主要方式为损害赔偿，核心功能是填补损害\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">同一行为兼负行政、刑事责任\u003c/span>，财产不足时优先承担侵权责任\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>违法侵害别人的民事权益，符合法定条件时就要承担赔偿、停止侵害等责任。\u003c/p>","count":4,"chars":83,"gap":false},{"id":"civil-1794843503381","n":381,"chapter":"第八编 侵权责任","title":"过错责任原则的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：以行为人的过错作为归责依据\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">范围\u003c/span>：一般侵权适用\u003c/li>\u003cli>\u003cspan class=\"blue\">成立\u003c/span>：过错是责任构成要件，原则上由\u003cspan class=\"blue\">受害人\u003c/span>举证\u003c/li>\u003cli>\u003cspan class=\"blue\">责任范围\u003c/span>：过错\u003cspan class=\"blue\">程度\u003c/span>可影响责任大小\u003c/li>\u003cli>\u003cspan class=\"blue\">归责特点\u003c/span>：\u003cspan class=\"blue\">考察\u003c/span>行为人的故意或过失\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一般先看伤害人有没有故意或过失，法律规定推定过错时举证方向不同。\u003c/p>","count":5,"chars":79,"gap":false},{"id":"civil-1794843503382","n":382,"chapter":"第八编 侵权责任","title":"无过错责任原则的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：依法律特别规定\u003c/span>，即使没有过错，也可能承担侵权责任\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">适用\u003c/span>：\u003cspan class=\"blue\">限于\u003c/span>法律明文规定的情形\u003c/li>\u003cli>\u003cspan class=\"blue\">归责\u003c/span>：以\u003cspan class=\"blue\">法定\u003c/span>侵权事实和风险归属为依据，不以过错为要件\u003c/li>\u003cli>\u003cspan class=\"blue\">抗辩\u003c/span>：可依法\u003cspan class=\"blue\">主张\u003c/span>减免责任，仅证明自己无过错通常不够\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有些高风险活动造成损害，法律规定即使行为人没过失也可能要担责。\u003c/p>","count":4,"chars":92,"gap":false},{"id":"civil-1794843503383","n":383,"chapter":"第八编 侵权责任","title":"无过错责任原则的适用范围（适用情形）","body":"\u003col>\u003cli>\u003cspan class=\"red\">替代责任：监护人、用人单位及接受劳务一方等在法定情形下担责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">物及活动致害\u003c/span>：缺陷\u003cspan class=\"blue\">产品\u003c/span>、饲养动物、高度危险\u003cspan class=\"blue\">作业\u003c/span>、法定建筑物倒塌或塌陷等\u003c/li>\u003cli>\u003cspan class=\"blue\">环境侵权\u003c/span>：污染环境、\u003cspan class=\"blue\">破坏\u003c/span>生态致害\u003c/li>\u003cli>\u003cspan class=\"blue\">道路事故\u003c/span>：机动车对非机动车\u003cspan class=\"blue\">驾驶人\u003c/span>、行人的责任适用特别规则\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>高度危险、动物、环境污染等有特殊条款时，按法定无过错规则处理。\u003c/p>","count":4,"chars":108,"gap":false},{"id":"civil-1794843503384","n":384,"chapter":"第八编 侵权责任","title":"侵权责任的构成要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">行为：有侵害民事权益的作为或依法应作为而未作为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">损害\u003c/span>：发生法律认可的财产、\u003cspan class=\"blue\">人身\u003c/span>或精神\u003cspan class=\"blue\">损害\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">因果关系\u003c/span>：侵害\u003cspan class=\"blue\">行为\u003c/span>导致相关\u003cspan class=\"blue\">损害\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">过错\u003c/span>：一般侵权须有故意或过失；依法适用\u003cspan class=\"blue\">过错推定\u003c/span>时由\u003cspan class=\"blue\">行为\u003c/span>人反证，\u003cspan class=\"blue\">无过错责任\u003c/span>不以\u003cspan class=\"blue\">过错\u003c/span>为要件\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一般判断是否侵权，要把行为、损害、原因以及过错要求按适用规则逐项对上。\u003c/p>","count":4,"chars":101,"gap":false},{"id":"civil-1794843503385","n":385,"chapter":"第八编 侵权责任","title":"损害事实的类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">财产损失：现有财产减少、应得利益损失等，具体赔偿依法律及因果关系判断\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">人身损害\u003c/span>：人格、身份等权益受损及相应\u003cspan class=\"blue\">不利\u003c/span>后果\u003c/li>\u003cli>\u003cspan class=\"blue\">精神损害\u003c/span>：精神痛苦、\u003cspan class=\"blue\">严重\u003c/span>精神异常等，依法达到条件才赔偿\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>受伤可以同时损害身体和收入，精神痛苦也可能是损害，但不同损害的赔偿要求不同。\u003c/p>","count":3,"chars":83,"gap":false},{"id":"civil-1794843503386","n":386,"chapter":"第八编 侵权责任","title":"因果关系的认定规则","body":"\u003col>\u003cli>\u003cspan class=\"red\">直接原因：行为直接造成损害\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">相当因果关系\u003c/span>：依\u003cspan class=\"blue\">经验\u003c/span>，该行为通常足以引起此类损害\u003c/li>\u003cli>\u003cspan class=\"blue\">近因\u003c/span>：找最有\u003cspan class=\"blue\">支配力\u003c/span>、最能解释损害的原因\u003c/li>\u003cli>\u003cspan class=\"blue\">因果推定\u003c/span>：法律有规定的，由\u003cspan class=\"blue\">被告\u003c/span>举证行为与损害间\u003cspan class=\"blue\">不存在\u003c/span>因果关系，例如环境侵权\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有坏结果还要查是哪项行为导致的，并判断能否按法律把这个结果归给行为人。\u003c/p>","count":4,"chars":93,"gap":false},{"id":"civil-1794843503387","n":387,"chapter":"第八编 侵权责任","title":"相当因果关系规则","body":"\u003col>\u003cli>\u003cspan class=\"red\">相当因果关系规则：依行为时的一般社会经验作为判断标准，认为该加害行为有引起该损害结果发生的可能性，并且在实际上该加害行为确实引起了该损害结果，则该加害行为与该损害结果之间有因果关系\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一般经验下这种行为容易带来同类结果，并且实际也造成了它，才适合把损害算给行为人。\u003c/p>","count":1,"chars":90,"gap":false},{"id":"civil-1794843503388","n":388,"chapter":"第八编 侵权责任","title":"人身损害赔偿的概念及其范围","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：因侵害人身权益造成损害，依法赔偿相应损失\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">一般损害\u003c/span>：医疗、\u003cspan class=\"blue\">护理\u003c/span>、交通、\u003cspan class=\"blue\">营养\u003c/span>、住院伙食补助等合理费用及误工减少的收入\u003c/li>\u003cli>\u003cspan class=\"blue\">残疾\u003c/span>：还赔辅助器具费和\u003cspan class=\"blue\">残疾赔偿\u003c/span>金\u003c/li>\u003cli>\u003cspan class=\"blue\">死亡\u003c/span>：还赔丧葬费和\u003cspan class=\"blue\">死亡赔偿\u003c/span>金\u003c/li>\u003cli>\u003cspan class=\"blue\">精神损害\u003c/span>：达到\u003cspan class=\"blue\">法定\u003c/span>条件时可另行请求\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>伤了人要赔治疗康复和误工等合理损失，造成残疾或死亡还要看相应赔偿。\u003c/p>","count":5,"chars":106,"gap":false},{"id":"civil-1794843503389","n":389,"chapter":"第八编 侵权责任","title":"精神损害赔偿的概念及其适用情形","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：以金钱赔偿救济严重精神损害\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">人身权益\u003c/span>：侵害\u003cspan class=\"blue\">自然人人身权益\u003c/span>，造成严重精神损害\u003c/li>\u003cli>\u003cspan class=\"blue\">特定物\u003c/span>：故意或\u003cspan class=\"blue\">重大过失\u003c/span>侵害有人身\u003cspan class=\"blue\">意义\u003c/span>的\u003cspan class=\"blue\">特定物\u003c/span>，造成严重精神损害\u003c/li>\u003cli>\u003cspan class=\"blue\">违约\u003c/span>：\u003cspan class=\"blue\">违约\u003c/span>侵害对方\u003cspan class=\"blue\">人格权\u003c/span>并造成严重精神损害，选\u003cspan class=\"blue\">违约责任\u003c/span>也可请求\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>侵害人身权益造成严重精神损害等法定情形，可以依法另外请求精神损害赔偿。\u003c/p>","count":4,"chars":101,"gap":false},{"id":"civil-1794843503390","n":390,"chapter":"第八编 侵权责任","title":"法定分担损失的概念及其适用条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">双方对损害均无过错，且法律明确规定时，依规定分担损失\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不同于一般过错责任，也不等于无过错责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须有具体法律依据，不可只因一方穷、另一方富就分担\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">公平分担不等于平均分担\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>双方都没过错也不能想平均分就分，必须由法律规定在该情形下怎样分担。\u003c/p>","count":4,"chars":80,"gap":false},{"id":"civil-1794843503391","n":391,"chapter":"第八编 侵权责任","title":"共同侵权行为的概念及其要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">共同侵权：二人以上以共同故意、共同过失等共同侵害他人民事权益\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主体须复数\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行为、意思存在共同联系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">造成不可分割的同一损害\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法承担连带责任\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>几个人共同做了侵权事并造成损害，符合法律条件时受害人可向他们主张共同责任。\u003c/p>","count":5,"chars":65,"gap":false},{"id":"civil-1794843503392","n":392,"chapter":"第八编 侵权责任","title":"共同危险行为的概念及其要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">共同危险：二人以上实施危及他人的行为造成损害，不能确定实际加害人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主体复数、各自独立、危险行为相同，时间同时或相继\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">损害结果为一体，实际加害人不明\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">能确定实际侵权人的由其担责；不能确定的负连带责任\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>几个人都做了危险行为，确有一人或数人伤了人却分不清是谁时，适用特别责任规则。\u003c/p>","count":4,"chars":95,"gap":false},{"id":"civil-1794843503393","n":393,"chapter":"第八编 侵权责任","title":"无意思联络数人侵权的概念及其要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">无意思联络数人侵权：各人无共同故意、共同过失，独立行为结合造成同一损害\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">每人行为均足致全部损害，承担连带责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行为结合才致同一损害\u003c/span>，按原因力等分担；难确定则平均承担\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>几个人没有商量却分别造成同一损害，要看各行为能否独立造成全损，再定责任怎么分。\u003c/p>","count":3,"chars":80,"gap":false},{"id":"civil-1794843503394","n":394,"chapter":"第八编 侵权责任","title":"侵权责任的正当理由抗辩事由","body":"\u003col>\u003cli>\u003cspan class=\"red\">正当防卫：制止正在发生的侵害，过限致不当损害负适当责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">紧急避险\u003c/span>：为避急险牺牲较小利益，\u003cspan class=\"blue\">不当\u003c/span>或过限负适当责任\u003c/li>\u003cli>\u003cspan class=\"blue\">自甘风险\u003c/span>：自愿参加风险文体活动，其他参加者非故意、\u003cspan class=\"blue\">重大过失\u003c/span>通常免责\u003c/li>\u003cli>\u003cspan class=\"blue\">自助\u003c/span>：\u003cspan class=\"blue\">急迫\u003c/span>且来不及求助，可必要合理自救，随后立即请求公权处理\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>合法防卫或避险等情况，能作为不担责或少担责的理由，但仍要看有没有超出限度。\u003c/p>","count":4,"chars":116,"gap":false},{"id":"civil-1794843503395","n":395,"chapter":"第八编 侵权责任","title":"侵权责任的外来原因抗辩事由","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">不可抗力：指不能预见、不能避免且不能克服的客观情况\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">受害人故意\u003c/span>：指损害是因受害人的故意造成的，行为人一般不承担责任\u003c/li>\u003cli>\u003cspan class=\"blue\">被侵权人过错\u003c/span>：指如果被侵权人对损害结果的发生或\u003cspan class=\"blue\">扩大\u003c/span>有过错的，\u003cspan class=\"blue\">那么\u003c/span>可以减轻侵权人的侵权责任\u003c/li>\u003cli>\u003cspan class=\"blue\">第三人原因\u003c/span>：指如果损害是第三人造成的，第三人应承担侵权责任\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>损害也可能来自受害人、第三人或不可抗力，是否免责或减责要看各类侵权的规定。\u003c/p>","count":4,"chars":129,"gap":false},{"id":"civil-1794843503396","n":396,"chapter":"第八编 侵权责任","title":"监护人责任的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：无民事行为能力人、限制民事行为能力人致害，由监护人承担侵权责任\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">归责与性质\u003c/span>：属于无过错的\u003cspan class=\"blue\">替代责任\u003c/span>；监护人尽到\u003cspan class=\"blue\">监护职责\u003c/span>，可以减轻\u003c/li>\u003cli>\u003cspan class=\"blue\">赔偿顺序\u003c/span>：被监护人有财产的，\u003cspan class=\"blue\">先从\u003c/span>本人财产支付；\u003cspan class=\"blue\">不足\u003c/span>由监护人赔偿\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>被监护人造成损害时，依法先按其财产及监护人责任处理，监护尽责的可能减轻。\u003c/p>","count":3,"chars":96,"gap":false},{"id":"civil-1794843503397","n":397,"chapter":"第八编 侵权责任","title":"监护人赔偿请求权的具体情形","body":"\u003col>\u003cli>\u003cspan class=\"red\">受到侵害：非法使被监护人脱离监护\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">赔偿范围\u003c/span>：造成\u003cspan class=\"blue\">财产损害\u003c/span>可依法索赔；造成严重精神损害，依法可请求\u003cspan class=\"blue\">精神损害赔偿\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有人教唆或帮助被监护人侵权，或监护职责另有委托时，要分清谁依法承担赔偿以及能否追偿。\u003c/p>","count":2,"chars":53,"gap":false},{"id":"civil-1794843503398","n":398,"chapter":"第八编 侵权责任","title":"用人单位责任的特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">无过错责任：单位不能仅以自己没有过错免责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">替代责任\u003c/span>：工作\u003cspan class=\"blue\">人员\u003c/span>执行工作任务致害，由用人单位对外担责；承担后可向故意或\u003cspan class=\"blue\">重大过失\u003c/span>工作\u003cspan class=\"blue\">人员\u003c/span>追偿\u003c/li>\u003cli>\u003cspan class=\"blue\">适用前提\u003c/span>：存在用工或管理等关系，且致害行为发生于执行工作任务时\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>员工执行工作任务造成损害，原则上由用人单位先担责，特定情形可向员工追偿。\u003c/p>","count":3,"chars":97,"gap":false},{"id":"civil-1794843503399","n":399,"chapter":"第八编 侵权责任","title":"个人劳务使用人责任","body":"\u003col>\u003cli>\u003cspan class=\"red\">导致他人损害雇主承担\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">造成雇员损害过错分担\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">第三人侵权雇员可请求第三人承担\u003c/span>，或请求雇主\u003cspan class=\"blue\">适当补偿\u003c/span>，雇主可追偿）\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>个人请别人来做活，做活时伤了第三人，通常接收劳务的人先担责，再看能否依法追偿。\u003c/p>","count":3,"chars":52,"gap":false},{"id":"civil-1794843503400","n":400,"chapter":"第八编 侵权责任","title":"产品责任的概念及其要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">产品责任：产品缺陷致他人人身、财产损害，生产者、销售者依法担责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须产品有缺陷\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须发生人身、财产损害\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">缺陷与损害有因果关系\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有缺陷的产品伤了人或毁坏别的财产，先看缺陷、损害和二者是不是有因果关系。\u003c/p>","count":4,"chars":57,"gap":false},{"id":"civil-1794843503401","n":401,"chapter":"第八编 侵权责任","title":"产品责任的归责原则","body":"\u003col>\u003cli>\u003cspan class=\"red\">产品缺陷致害，对受害人生产者、销售者承担无过错直接责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">最终责任\u003c/span>：生产者原则无过错；销售者因自身过错造成缺陷时承担\u003c/li>\u003cli>\u003cspan class=\"blue\">运输、仓储等第三人有过错，赔付后可向其追偿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">区分对外赔偿与内部最终分担\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>产品有缺陷致损，对生产者通常不必另证明其过错，销售环节责任另按法律规则处理。\u003c/p>","count":4,"chars":90,"gap":false},{"id":"civil-1794843503402","n":402,"chapter":"第八编 侵权责任","title":"产品责任的责任主体","body":"\u003col>\u003cli>\u003cspan class=\"red\">由于产品存在缺陷导致受害人损害的，生产者与销售者承担连带责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">2\u003c/span>，3.产品缺陷由生产者\u003cspan class=\"blue\">造成\u003c/span>的，销售者赔偿后，有权向生产者追偿，产品缺陷因销售者的过错\u003cspan class=\"blue\">造成\u003c/span>的，生产者赔偿后，有权向销售者追偿\u003c/li>\u003cli>\u003cspan class=\"blue\">有过错的仓储者、运输者不对外承担侵权责任\u003c/span>，生产者、销售者承担侵权责任之后，有权向有过错的仓储者、\u003cspan class=\"blue\">运输\u003c/span>者追偿\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>缺陷产品伤人，受害人通常可向生产者或销售者请求赔偿，赔偿后再依法向责任方追偿。\u003c/p>","count":3,"chars":145,"gap":false},{"id":"civil-1794843503403","n":403,"chapter":"第八编 侵权责任","title":"医疗损害责任的概念及其要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">医疗损害责任：诊疗活动中医疗机构、医务人员有过错致患者受损，由机构担责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有不当诊疗行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">患者遭受非正常损害\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行为与损害有因果关系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">存在过错，法定情形可推定\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>医疗过程中患者受损，要查诊疗是否有过错，以及过错是不是导致损害的原因。\u003c/p>","count":5,"chars":73,"gap":false},{"id":"civil-1794843503404","n":404,"chapter":"第八编 侵权责任","title":"医疗损害责任的归责原则","body":"\u003col>\u003cli>\u003cspan class=\"red\">医疗损害责任适用过错责任原则，其中医疗机构存在以下情形时适用过错推定原则：（违法，病历（有，没了，假的））\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">违反法律、行政法规、规章及其他有关诊疗规范的规定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">隐匿或拒绝提供与纠纷有关病历资料\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">伪造、篡改、遗失、或违法销毁病历资料\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>医疗一般按过错担责，在违反诊疗规定、隐匿或伪造病历等法定情况下可以推定过错。\u003c/p>","count":4,"chars":111,"gap":false},{"id":"civil-1794843503405","n":405,"chapter":"第八编 侵权责任","title":"医疗损害责任的责任承担（免责事由）","body":"\u003col>\u003cli>\u003cspan class=\"red\">医疗诊疗损害通常由医疗机构担责，外聘人员由聘请医院担责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">药品器械、血液缺陷\u003c/span>，患者可依法向\u003cspan class=\"blue\">机构\u003c/span>、生产经营者等请求赔偿，内部追偿\u003c/li>\u003cli>\u003cspan class=\"blue\">免责\u003c/span>：患方不配合合规范诊疗；抢救已尽合理义务；受\u003cspan class=\"blue\">当时\u003c/span>医疗水平限制难诊治\u003c/li>\u003cli>\u003cspan class=\"blue\">机构也有过错仍负相应责任\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>患者不配合符合规范的诊疗、紧急情形已尽合理义务等情况，医院可能依法免责或减责。\u003c/p>","count":4,"chars":108,"gap":false},{"id":"civil-1794843503406","n":406,"chapter":"第八编 侵权责任","title":"环境污染责任的概念及其要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">环境污染、生态破坏责任：相关行为致他人损害，依法承担的侵权责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">存在污染环境、破坏生态行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">发生人身、财产等损害\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行为与损害有因果关系，实行无过错归责及法定举证规则\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>排污等行为让人或财产受损时，按环境侵权特别规则判断因果关系和责任。\u003c/p>","count":4,"chars":79,"gap":false},{"id":"civil-1794843503407","n":407,"chapter":"第八编 侵权责任","title":"环境污染责任的责任承担","body":"\u003col>\u003cli>\u003cspan class=\"red\">污染者：污染环境或破坏生态致害，依法担责\u003c/span>；多人致害，依共同侵权规则及污染种类、\u003cspan class=\"blue\">排放量\u003c/span>、对损害作用等确定\u003c/li>\u003cli>\u003cspan class=\"blue\">第三人\u003c/span>：\u003cspan class=\"blue\">第三人\u003c/span>过错致害，被侵权人可向侵权人或\u003cspan class=\"blue\">第三人\u003c/span>请求\u003cspan class=\"blue\">赔偿\u003c/span>；侵权人\u003cspan class=\"blue\">赔偿\u003c/span>后可追偿\u003c/li>\u003cli>\u003cspan class=\"blue\">生态修复\u003c/span>：有权\u003cspan class=\"blue\">机关\u003c/span>、组织可请求侵权人修复；未\u003cspan class=\"blue\">按期\u003c/span>修复，可委托修复并由侵权人承担费用\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>污染者通常不能只说自己没过错就免责，多个污染者或第三人介入时再按法定规则分责。\u003c/p>","count":3,"chars":131,"gap":false},{"id":"civil-1794843503408","n":408,"chapter":"第八编 侵权责任","title":"环境污染责任的赔偿范围","body":"\u003col>\u003cli>\u003cspan class=\"red\">防止损害的发生与扩大所支出的合理费用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">清除污染、修复生态环境费用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">生态环境损害调査、鉴定评估等费用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">生态环境功能永久性损害造成的损失\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">生态环境受到损害至修复完成期间服务功能丧失导致的损失\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>污染可以造成直接人身财产损失，也可能产生依法可主张的修复等费用。\u003c/p>","count":5,"chars":89,"gap":false},{"id":"civil-1794843503409","n":409,"chapter":"第八编 侵权责任","title":"高度危险责任的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">高度危险责任：高度危险作业或危险物品致害而承担的侵权责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">通常为自己行为、保有危险的责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行为即使合法、无过错也可能担责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">基础是危险而非主观过失，法定免责另论\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>从事高度危险活动致损，就算已尽一般注意也可能担责，只有符合法定条件才可免责减责。\u003c/p>","count":4,"chars":76,"gap":false},{"id":"civil-1794843503410","n":410,"chapter":"第八编 侵权责任","title":"动物损害责任的概念及其责任承担","body":"\u003col>\u003cli>\u003cspan class=\"red\">动物致害通常由饲养人、管理人担责\u003c/span>；受害人故意、\u003cspan class=\"blue\">重大过失\u003c/span>可减免\u003c/li>\u003cli>\u003cspan class=\"blue\">未采取安全措施时，受害人故意仅可减轻\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">禁养危险动物原则不得据此免责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">动物园尽管理职责可免责；逃逸遗弃由原饲养管理人担责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">第三人过错，可择向其或饲养管理人求偿，后者可追偿\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>饲养动物伤人通常由饲养人或管理人担责，动物种类、受害人过错和第三人是否介入会影响结果。\u003c/p>","count":5,"chars":111,"gap":false},{"id":"civil-1794843503411","n":411,"chapter":"第八编 侵权责任","title":"物件损害责任的责任承担","body":"\u003col>\u003cli>\u003cspan class=\"red\">物件损害责任（高到低：林木-堆放物-妨碍通行-地下设施）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">林木折断的致害责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">堆放物倒塌的致害责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">妨碍通行物的致害责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">地下设施的致害责任\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>墙体倒塌、楼上坠物等要先分类，再看业主、管理人、使用人或具体侵权人各该承担什么责任。\u003c/p>","count":5,"chars":66,"gap":false}]},{"id":"jurisprudence","name":"法理学","limit":130,"items":[{"id":"jurisprudence-1794829194882","n":1,"chapter":"绪论","title":"法学的含义及其研究对象 ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">法学：是一门以法该社会现象及其规律为研究对象的人文社会科学\u003c/span>\u003c/p>","memory":"","understanding":"\u003cp>法学研究的重点是法律这种社会现象，以及法律为何产生、怎样运行。\u003c/p>","count":1,"chars":29,"gap":false},{"id":"jurisprudence-1794829194883","n":2,"chapter":"绪论","title":"法学体系 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">按法律从制定到实施的环节，可分为立法学、执法学、司法学、法律监督学等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按研究目的，可分为理论法学和应用法学\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按与其他学科的关系，可分为法学内部学科和法学交叉学科\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>这三种分类问的分别是研究哪个环节、解决什么问题、是否借用了其他学科的方法。\u003c/p>","count":3,"chars":78,"gap":false},{"id":"jurisprudence-1794829194884","n":3,"chapter":"绪论","title":"法学产生的条件 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法学产生要有研究对象：法律现象不断积累，形成可供研究的法律材料\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法学产生还要有研究者\u003c/span>：有人专门研究法律并把经验整理为系统知识\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有了法律实践，还要有人把实践总结成理论，法学才会形成；古希腊出现法学思想，古罗马法学逐渐独立，马克思主义法学进一步用科学方法研究法律。\u003c/p>","count":2,"chars":61,"gap":false},{"id":"jurisprudence-1794829194885","n":4,"chapter":"绪论","title":"中国法学的历史发展 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">夏商已有法律实践\u003c/span>\u003cspan class=\"blue\">；春秋战国儒、法等学派争论法律问题\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">秦汉至清末以律学为主，解释律文、指导适用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">近代西方法律思想传入，传统律学转向现代法学\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>中国法学大体经历了从讨论治国规则，到解释律文，再到建立现代法学的过程。\u003c/p>","count":3,"chars":66,"gap":false},{"id":"jurisprudence-1794829194886","n":5,"chapter":"绪论","title":"西方法学的历史发展 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">古希腊、罗马奠基\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">中世纪神学影响，后有注释、评论、人文主义法学\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">近代形成自然法、分析实证、历史、哲理等流派\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">现代发展社会法学、新自然法等\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>西方法学先问什么是正义，后来也问现行法是什么、从哪里来、在社会里怎样发挥作用。\u003c/p>","count":4,"chars":65,"gap":false},{"id":"jurisprudence-1794829194887","n":6,"chapter":"绪论","title":"西方主要法学流派及其本质学说 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">自然法学：理性、人权、社会契约，自然法高于人定法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">分析实证法学\u003c/span>：分析实在法，区分法与道德\u003c/li>\u003cli>\u003cspan class=\"blue\">社会法学\u003c/span>：重法律实际运行和社会效果\u003c/li>\u003cli>\u003cspan class=\"blue\">历史法学\u003c/span>：法源于民族精神；哲理法学：法体现自由意志\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>自然法学问法应当怎样，实证法学问现行法是什么，社会法学问规则在现实中怎样运转。\u003c/p>","count":4,"chars":85,"gap":false},{"id":"jurisprudence-1794829194888","n":7,"chapter":"绪论","title":"马克思主义法学的产生与发展 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">思想萌芽\u003c/span>。马克思在《黑格尔法哲学批判》中批判把国家和法律归结为观念的做法\u003c/li>\u003cli>\u003cspan class=\"blue\">理论形成\u003c/span>。《\u003cspan class=\"blue\">德意志意识形态\u003c/span>》系统阐述\u003cspan class=\"blue\">历史唯物主义\u003c/span>；《\u003cspan class=\"blue\">共产党宣言\u003c/span>》是马克思主义诞生的纲领性标志\u003c/li>\u003cli>\u003cspan class=\"blue\">进一步发展\u003c/span>。《资本论》深入揭示社会经济关系及其与法律的联系；列宁继续发展马克思主义法学\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>研究法律为什么这样规定，要回到现实的生产和社会关系中找答案。\u003c/p>","count":3,"chars":125,"gap":false},{"id":"jurisprudence-1794829194889","n":8,"chapter":"绪论","title":"马克思主义法学的特征 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">实践性：从社会实践理解法，用于改造世界\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">人文性\u003c/span>：关注人的自由、全面发展和解放\u003c/li>\u003cli>\u003cspan class=\"blue\">批判性\u003c/span>：在\u003cspan class=\"blue\">批判资本主义法律制度\u003c/span>中\u003cspan class=\"blue\">产生\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">历史性\u003c/span>：\u003cspan class=\"blue\">法律\u003c/span>、权利随具体时空条件变化\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":73,"gap":false},{"id":"jurisprudence-1794829194890","n":9,"chapter":"绪论","title":"坚持用马克思主义的立场观点方法研究法学 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">坚持马克思主义指导，是当代中国法学的根本标志\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">立足实践，不只解释世界，更要改变世界\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">以人民利益、人的全面发展和解放为立场\u003c/span>\u003c/li>\u003cli>用\u003cspan class=\"blue\">辩证唯物主义\u003c/span>、\u003cspan class=\"blue\">历史唯物主义\u003c/span>认识\u003cspan class=\"blue\">事物联系\u003c/span>和社会\u003cspan class=\"blue\">发展规律\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":85,"gap":false},{"id":"jurisprudence-1794829194891","n":10,"chapter":"绪论","title":"马克思主义法学法的本质 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法是上升为国家意志的统治阶级意志，体现整体、根本利益而非个人意愿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">意志内容由物质生活条件尤其经济关系决定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">也受经济外因素影响\u003c/span>，这些因素在经济起决定作用的基础上相互作用\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>统治阶级的意志要经国家制定或认可，才成为法律；能写进法律的内容也受社会物质生活条件限制。\u003c/p>","count":3,"chars":81,"gap":false},{"id":"jurisprudence-1794829194892","n":11,"chapter":"绪论","title":"马克思主义法学中国化的历史进程 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">毛泽东思想法治理论：人民民主专政、人民代表大会制度及民主法制建设\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">中国特色社会主义法治理论\u003c/span>：\u003cspan class=\"blue\">依法治国\u003c/span>，\u003cspan class=\"blue\">党的领导\u003c/span>、人民当家作主、\u003cspan class=\"blue\">依法治国\u003c/span>统一\u003c/li>\u003cli>\u003cspan class=\"blue\">习近平法治思想\u003c/span>：回答新时代为何、怎样全面\u003cspan class=\"blue\">依法治国\u003c/span>，明确方向、布局、任务和保障\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>这条主线是先建立人民当家作主的国家制度，再加强法制，进一步用法治统筹国家治理。\u003c/p>","count":3,"chars":106,"gap":false},{"id":"jurisprudence-1794829194893","n":12,"chapter":"绪论","title":"习近平法治思想核心要义 ★  ★  ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">坚持党的领导、人民中心、中国特色法治道路\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依宪治国执政，法治轨道推进治理现代化，建设法治体系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法治国执政行政共同推进，国家政府社会一体建设\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">科学立法、严格执法、公正司法、全民守法，统筹内外法治\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">德才兼备队伍，抓关键少数\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法治国与依规治党有机统一\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":6,"chars":119,"gap":false},{"id":"jurisprudence-1794829194894","n":13,"chapter":"绪论","title":"法理学的含义、研究对象和地位 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法理学是研究法的一般原理、基本概念和共同规律的学科\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">研究对象是古今中外的法及法律现象\u003c/span>，重点是各类法律共同有的问题\u003c/li>\u003cli>\u003cspan class=\"blue\">法理学在法学中属于基础理论学科\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":70,"gap":false},{"id":"jurisprudence-1794829194895","n":14,"chapter":"绪论","title":"法理学的研究方法和意义 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">根本方法：辩证唯物主义、历史唯物主义\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">具体方法\u003c/span>：社会调查、历史考察、\u003cspan class=\"blue\">价值分析\u003c/span>、语义分析等\u003c/li>\u003cli>\u003cspan class=\"blue\">意义\u003c/span>：掌握法律基本原理，为学习部门法、理解立法司法打基础\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>用调查了解法实际怎样运行，再用理论解释为什么这样运行。\u003c/p>","count":3,"chars":71,"gap":false},{"id":"jurisprudence-1794829194896","n":15,"chapter":"法的特征与本质","title":"“法”的词义 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">中国古代“灋”含公平如水、明断曲直之意，法与刑曾通用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">西方法有法、法律的不同词源，表达正义原则与制定规则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客观法指法律规范整体\u003c/span>，主观法指主体享有的权利；国法主要指实在法\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":82,"gap":false},{"id":"jurisprudence-1794829194897","n":16,"chapter":"法的特征与本质","title":"法的规范性和普遍性 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律有规范性\u003c/span>，即它为人行为设定可以、须或不得怎么做的\u003cspan class=\"blue\">一般规则\u003c/span>，并能作为\u003cspan class=\"blue\">评价\u003c/span>行为是否合法的标准\u003c/li>\u003cli>\u003cspan class=\"blue\">法律有普遍性\u003c/span>，即在其效力范围内，对条件相同的主体和行为可以反复适用，有\u003cspan class=\"blue\">普遍约束力\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>规范性说法律能给行为定规则；普遍性说在它的适用范围内，符合条件的人都受同一规则约束。\u003c/p>","count":2,"chars":86,"gap":false},{"id":"jurisprudence-1794829194898","n":17,"chapter":"法的特征与本质","title":"法的国家意志性和权威性 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国家意志性\u003c/span>。法律由国家制定或认可，以国家名义体现国家意志；具体规则应由有权机关依职权和程序创制\u003c/li>\u003cli>\u003cspan class=\"blue\">权威性\u003c/span>。法律是有普遍约束力的社会规范，应遵守，也可以由\u003cspan class=\"blue\">国家强制力\u003c/span>保证实施\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":83,"gap":false},{"id":"jurisprudence-1794829194899","n":18,"chapter":"法的特征与本质","title":"法的权利和义务的一致性 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律主要经设定和运行权利、义务来调整人行为，法律的内容表现为法律上的权利和义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律上的权利\u003c/span>，是法律给予主体选择作出一定行为的资格；法律上的义务，是法律要求主体\u003cspan class=\"blue\">作出或不作出\u003c/span>一定行为的约束\u003c/li>\u003cli>\u003cspan class=\"blue\">法律规定的权利与义务相联系、相对应\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一方能要求交货，另一方就有交货义务；但在整个法律制度里，权利和义务不要求在每一条规定里一一对应。\u003c/p>","count":3,"chars":109,"gap":false},{"id":"jurisprudence-1794829194900","n":19,"chapter":"法的特征与本质","title":"法的国家强制性和程序性 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">国家强制性：由国家强制力保证实施，不等于每次适用都实际强制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">程序性\u003c/span>：近现代立法、执法、司法等须遵循相应步骤、方式、顺序和时限\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":61,"gap":false},{"id":"jurisprudence-1794829194901","n":20,"chapter":"法的起源与演进","title":"法起源的主要原因 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">经济：分工、交换、私有制发展是根本原因\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">政治\u003c/span>：阶级分化和阶级斗争推动国家与法产生\u003c/li>\u003cli>\u003cspan class=\"blue\">社会\u003c/span>：公共事务管理需要统一规则\u003c/li>\u003cli>\u003cspan class=\"blue\">人文\u003c/span>：人的独立意识发展；自然地理等也有影响\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":75,"gap":false},{"id":"jurisprudence-1794829194902","n":21,"chapter":"法的起源与演进","title":"法起源的一般规律 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">个别-规范：个别调整逐步发展为规范性调整（范围）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">由习惯到习惯法再到制定法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">道德宗教混为一体到相互独立（内容）\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":53,"gap":false},{"id":"jurisprudence-1794829194903","n":22,"chapter":"法的起源与演进","title":"奴隶制法的特征 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">上层建筑：公开反映和维护奴隶主贵族的等级特权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">外在\u003c/span>：刑罚手段极其\u003cspan class=\"blue\">残酷\u003c/span>，长期保留原始社会的某些行为规范\u003cspan class=\"blue\">残余\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">例子\u003c/span>：\u003cspan class=\"blue\">汉谟拉比法典，十二铜表法\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":66,"gap":false},{"id":"jurisprudence-1794829194904","n":23,"chapter":"法的起源与演进","title":"封建制法的特征 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">经济基础：地主、领主占有土地并不同程度控制农民、农奴\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">体现地主阶级意志，维护封建等级和特权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">唐律是典型代表\u003c/span>；与奴隶制法相比，依附关系、权利地位有所变化\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":73,"gap":false},{"id":"jurisprudence-1794829194905","n":24,"chapter":"法的起源与演进","title":"资本主义法的本质特征 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">经济上维护以雇佣剥削为基础的资本主义私有制，这是核心\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">政治上维护资产阶级专政、代议制及政党制度\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">思想上标榜自由、平等、人权，但受资本主义经济关系制约\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":72,"gap":false},{"id":"jurisprudence-1794829194906","n":25,"chapter":"法的起源与演进","title":"社会主义法的本质特征 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">人民性与阶级性统一：工人阶级领导下全国人民共同意志\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">正义性与政治性统一\u003c/span>：代表进步方向，坚持\u003cspan class=\"blue\">党的领导\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">科学性与先进性统一\u003c/span>：立足\u003cspan class=\"blue\">实际\u003c/span>，借鉴文明成果，适应社会发展\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":76,"gap":false},{"id":"jurisprudence-1794829194907","n":26,"chapter":"法的起源与演进","title":"法系的概念 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法系是按法律的历史传统和源流关系等，将不同国家和地区的法律制度归为一类\u003c/span>\u003c/li>\u003cli>通常所说的五大法系包括\u003cspan class=\"blue\">中华法系\u003c/span>、伊斯兰法系、印度法系、\u003cspan class=\"blue\">英美法系\u003c/span>和大陆法系\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":71,"gap":false},{"id":"jurisprudence-1794829194908","n":27,"chapter":"法的起源与演进","title":"中华法系的特征 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">主体：以君主意志为法律权威\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">形式\u003c/span>：刑法发达、民法较薄弱，\u003cspan class=\"blue\">行政司法合一\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">内容\u003c/span>：\u003cspan class=\"blue\">礼法结合\u003c/span>，以法律维护伦理等级秩序\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":52,"gap":false},{"id":"jurisprudence-1794829194909","n":28,"chapter":"法的起源与演进","title":"中国传统法制的主要特征（《法制史》绪论） ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">注重和谐，维护一统\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法自君出，重权隆法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">诸法并存，民刑有分\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">家族本位，伦理法制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">调处息争，无讼是求\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":45,"gap":false},{"id":"jurisprudence-1794829194910","n":29,"chapter":"法的起源与演进","title":"英美法系的内容 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">英美法系又称普通法法系，源于英国，重判例传统\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主要分布于英、美、加、澳、新等地\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">英国法与美国法为主要分支\u003c/span>；英国以不成文\u003cspan class=\"blue\">宪法\u003c/span>、单一制为典型，美国实行成文\u003cspan class=\"blue\">宪法\u003c/span>、联邦制并有司法审查\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":85,"gap":false},{"id":"jurisprudence-1794829194911","n":30,"chapter":"法的起源与演进","title":"大陆法系的内容 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">大陆法系以罗马法为传统，吸收日耳曼法，又称罗马—日耳曼法系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">以制定法、法典编纂为主要特色，区分公法、私法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主要有法国法、德国法两支，影响欧洲大陆、日本等地\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":75,"gap":false},{"id":"jurisprudence-1794829194912","n":31,"chapter":"法的起源与演进","title":"英美法系和大陆法系的联系和区别 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">共同经济基础、基本原则，且相互借鉴\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">英美重判例\u003c/span>，区分普通法、衡平法；大陆重制定法，区分公法、\u003cspan class=\"blue\">私法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">英美传统上当事人主导、重类比\u003c/span>；大陆传统上法官主导、重演绎\u003c/li>\u003cli>\u003cspan class=\"blue\">大陆更重系统法典编纂，英美传统上较弱\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>遇到同类纠纷，英美法系通常重视既往判例；大陆法系通常先从成文法律规定找依据。\u003c/p>","count":4,"chars":93,"gap":false},{"id":"jurisprudence-1794829194913","n":32,"chapter":"法的起源与演进","title":"法律继承的含义、理由 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律继承：不同时代、历史类型之间法律制度的延续、继受\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">原因\u003c/span>：社会生活条件有历史连续性；法有\u003cspan class=\"blue\">相对独立性\u003c/span>；法是\u003cspan class=\"blue\">人类文明成果\u003c/span>；法律演进历史证明可继承\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>同一个社会在新旧制度交替时沿用仍有用的旧规则，就是法律继承。\u003c/p>","count":2,"chars":70,"gap":false},{"id":"jurisprudence-1794829194914","n":33,"chapter":"法的起源与演进","title":"法律移植的含义、必要性 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律移植：鉴别、认同、调整外国法律，吸收为本国法律体系组成部分\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">必要性\u003c/span>：\u003cspan class=\"blue\">社会\u003c/span>、\u003cspan class=\"blue\">法律\u003c/span>发展不平衡；\u003cspan class=\"blue\">市场经济\u003c/span>共同规律；\u003cspan class=\"blue\">对外开放\u003c/span>需要；法制现代化需要\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>把别的国家或地区行之有效的规则引进来，再按自己的情况调整，就是法律移植。\u003c/p>","count":2,"chars":69,"gap":false},{"id":"jurisprudence-1794829194915","n":34,"chapter":"法的起源与演进","title":"法律全球化的概念与趋势 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律全球化：法律跨国界，在世界范围传播、协调\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">途径\u003c/span>：国际法国内化、地方法全球化\u003c/li>\u003cli>\u003cspan class=\"blue\">趋势\u003c/span>：主体多元、形式趋同、规则协调、国际国内法界限变化\u003c/li>\u003cli>\u003cspan class=\"blue\">仍是过程而非全部法全球统一\u003c/span>；不消灭主权和法律\u003cspan class=\"blue\">多样性\u003c/span>，须反对法律霸权\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":98,"gap":false},{"id":"jurisprudence-1794829194916","n":35,"chapter":"法的起源与演进","title":"法律全球化的主要途径 ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">国际法的国内化、地方化：国际法的国内化、地方化的概念：联合国、国际组织和国际社会层面的法律被各国全部或部分承认或接受\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">地方法或国内法的全球化\u003c/span>：地方法或国内法的全球化的概念：原本是地方性的法律，经由某种途径被全球化\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":105,"gap":false},{"id":"jurisprudence-1794829194917","n":36,"chapter":"法的起源与演进","title":"法律全球化的重大进展 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">《联合国宪章》《世界人权宣言》等构成国际法治基本框架\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国际规则从任意性向强制性增强\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国际司法作用加强\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">个人在国际法上的地位提升\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":60,"gap":false},{"id":"jurisprudence-1794829194918","n":37,"chapter":"法的作用与法的价值","title":"法的作用的含义及实质 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法的作用：法对个人行为和社会关系产生的影响\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">意志方面\u003c/span>：体现\u003cspan class=\"blue\">国家权力\u003c/span>运行和\u003cspan class=\"blue\">国家意志\u003c/span>实现\u003c/li>\u003cli>\u003cspan class=\"blue\">社会方面\u003c/span>：取决于经济条件及生产方式，不由立法者愿望随意决定\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":70,"gap":false},{"id":"jurisprudence-1794829194919","n":38,"chapter":"法的作用与法的价值","title":"法的作用的主要分类 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">规范作用\u003c/span>。法律作为行为规范，直接影响人行为，表现为指引、评价、预测、\u003cspan class=\"blue\">教育\u003c/span>和\u003cspan class=\"blue\">强制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">社会作用\u003c/span>。法律调整社会关系，表现为维护\u003cspan class=\"blue\">阶级统治\u003c/span>和执行\u003cspan class=\"blue\">社会公共事务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">两者以行为和社会关系为不同观察对象\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先让人知道能做什么、应当做什么，再通过个人守规则实现整个社会的秩序。\u003c/p>","count":3,"chars":88,"gap":false},{"id":"jurisprudence-1794829194920","n":39,"chapter":"法的作用与法的价值","title":"法的规范作用 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">指引：告诉本人能做、该做、禁做什么\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">评价\u003c/span>：用是否合法判断他人已做行为\u003c/li>\u003cli>\u003cspan class=\"blue\">预测\u003c/span>：估计他人将怎样行为\u003c/li>\u003cli>\u003cspan class=\"blue\">教育\u003c/span>：以保护、制裁示范警示一般人\u003c/li>\u003cli>\u003cspan class=\"blue\">强制\u003c/span>：国家依法制裁违法，保障其他作用\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":79,"gap":false},{"id":"jurisprudence-1794829194921","n":40,"chapter":"法的作用与法的价值","title":"法的社会作用 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">维护阶级统治\u003c/span>。法律维护\u003cspan class=\"blue\">统治阶级\u003c/span>的整体和长远利益，个别成员损害整体利益，也会依法受到制裁\u003c/li>\u003cli>\u003cspan class=\"blue\">执行社会公共事务\u003c/span>。法律维护社会治安、人身安全和生产交换条件，保障社会基本生活，促进\u003cspan class=\"blue\">教育\u003c/span>、科学和文化发展\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>社会要先能正常生活和生产，统治秩序才有基础，所以两方面相互联系。\u003c/p>","count":2,"chars":94,"gap":false},{"id":"jurisprudence-1794829194922","n":41,"chapter":"法的作用与法的价值","title":"法的作用的其他分类 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">按作用范围，分为整体作用和局部作用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按作用结果的状态，分为预期作用和实际作用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按发挥作用的途径，分为直接作用和间接作用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按作用效果，分为积极作用和消极作用\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":74,"gap":false},{"id":"jurisprudence-1794829194923","n":42,"chapter":"法的作用与法的价值","title":"法的作用的局限性 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法并非唯一社会调整手段，不能包办所有问题\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">抽象、稳定的规则难尽合具体变化，可能滞后\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">实施依赖立法、执法人员素质及公众支持\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">也受政治、经济、文化条件制约\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">反对法律万能论、无用论、工具主义\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>法律能规定怎么做，却管不了所有问题；有人执行、有人遵守，还要有资源和配套条件，规则才会真的管用。\u003c/p>","count":5,"chars":88,"gap":false},{"id":"jurisprudence-1794829194924","n":43,"chapter":"法的作用与法的价值","title":"法的价值的概念和特征 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法的价值：人在需要、运用法律时，法体现的积极意义和有用性\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">特征\u003c/span>：主观与客观、阶级与社会、统一与多样相统一\u003c/li>\u003cli>\u003cspan class=\"blue\">法的作用是手段，法的价值是目的\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>同一条法律能满足哪些需求，要看法律本身的作用，也要看使用它的人和社会需要什么。\u003c/p>","count":3,"chars":66,"gap":false},{"id":"jurisprudence-1794829194925","n":44,"chapter":"法的作用与法的价值","title":"社会主义法律价值体系的含义与特征 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">社会主义法律价值体系：与社会主义法律制定、实施相关的价值组成的系统\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">既统一人民利益与个人权利，也强调不同法律价值之间协调\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":59,"gap":false},{"id":"jurisprudence-1794829194926","n":45,"chapter":"法的作用与法的价值","title":"自由价值 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">自由意味着人能自主选择和行动\u003c/span>；法律上的自由须在法律划定的范围内行使\u003c/li>\u003cli>\u003cspan class=\"blue\">法律确认自由\u003c/span>。法律经权利、义务规定自由的范围，也用程序规定自由怎样实现\u003c/li>\u003cli>\u003cspan class=\"blue\">法律保障自由\u003c/span>。限制公权力，防止主体彼此侵害自由，并为受到侵害的人规定\u003cspan class=\"blue\">救济\u003c/span>途径；必要时依法限制随意放弃基本自由\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>法律既保护你做选择的空间，也划出边界，让别人的自由不会被你的选择挤掉。\u003c/p>","count":3,"chars":122,"gap":false},{"id":"jurisprudence-1794829194927","n":46,"chapter":"法的作用与法的价值","title":"人权价值 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">人权：人作为人享有或应享有的基本权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">特征\u003c/span>：普遍性、本源性、综合性、历史发展性\u003c/li>\u003cli>\u003cspan class=\"blue\">含个人人权、集体人权，覆盖公民政治及经济社会文化权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">意义\u003c/span>：\u003cspan class=\"blue\">肯定\u003c/span>人格尊严，以人为法律出发点和\u003cspan class=\"blue\">目的\u003c/span>，检验、\u003cspan class=\"blue\">引导\u003c/span>并\u003cspan class=\"blue\">批判\u003c/span>完善法律\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":98,"gap":false},{"id":"jurisprudence-1794829194928","n":47,"chapter":"法的作用与法的价值","title":"正义价值 ★  ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">正义是法律核心价值，重在利益正当分配\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">普遍与特殊、超时代与时代、客观与主观统一\u003c/span>；分实体与程序、形式与实质、抽象与具体\u003cspan class=\"blue\">正义\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">正义是法的根据、评价标准及进步动力，指导实践\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律以权利义务、公正程序和奖惩落实正义\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":100,"gap":false},{"id":"jurisprudence-1794829194929","n":48,"chapter":"法的作用与法的价值","title":"平等价值 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">平等：主体获得同等对待，分形式平等、实质平等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">随历史发展\u003c/span>，不等于平均；排除\u003cspan class=\"blue\">特权\u003c/span>歧视，可与合理差别待遇并存\u003c/li>\u003cli>\u003cspan class=\"blue\">法律将平等确立为原则\u003c/span>，保障主体\u003cspan class=\"blue\">地位平等\u003c/span>，公平分配\u003cspan class=\"blue\">权利\u003c/span>义务与\u003cspan class=\"blue\">法律责任\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":84,"gap":false},{"id":"jurisprudence-1794829194930","n":49,"chapter":"法的作用与法的价值","title":"秩序价值 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律秩序：法律调整形成的相对稳定、和谐有序的社会状态\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">消极方面\u003c/span>：解决纠纷、减少冲突混乱\u003c/li>\u003cli>\u003cspan class=\"blue\">积极方面\u003c/span>：促进合作、\u003cspan class=\"blue\">社会\u003c/span>和谐\u003c/li>\u003cli>\u003cspan class=\"blue\">法律建立和维护秩序，秩序也保障法律运行\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>秩序让人知道该怎么行事，但稳定本身不保证公平，还得看规则维护的是怎样的秩序。\u003c/p>","count":4,"chars":75,"gap":false},{"id":"jurisprudence-1794829194931","n":50,"chapter":"法的作用与法的价值","title":"效率价值 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">效率价值：法律促进财富增长、办事便利，满足物质与便利需要\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">实现\u003c/span>：保护\u003cspan class=\"blue\">物质\u003c/span>利益；确认产权；保障高效经济模式；保护知识产权；以责任、赔偿和惩罚减少违法损失\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":74,"gap":false},{"id":"jurisprudence-1794829194932","n":51,"chapter":"法的作用与法的价值","title":"安全价值 ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">安全的概念：法的安全价值指法律在维护安全方面所发挥的核心作用\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">此外，法的安全价值可以体现在其对社会信任的促进上\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法的安全价值还可以体现在其对未来不确定性的管理\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":77,"gap":false},{"id":"jurisprudence-1794829194933","n":52,"chapter":"法的作用与法的价值","title":"法的价值冲突的表现 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">个体之间法律所承认的价值冲突\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">共同体之间发生的价值冲突\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">个体与共同体之间的价值冲突\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":39,"gap":false},{"id":"jurisprudence-1794829194934","n":53,"chapter":"法的作用与法的价值","title":"法的价值冲突的解决原则 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">价值位阶：不同位阶冲突，优先较高价值\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">个案平衡\u003c/span>：同位阶冲突，结合案情兼顾利益\u003c/li>\u003cli>\u003cspan class=\"blue\">比例\u003c/span>：保护优势价值造成的损害不得超过必要程度\u003c/li>\u003cli>\u003cspan class=\"blue\">人民根本利益\u003c/span>：\u003cspan class=\"blue\">重大疑难\u003c/span>冲突以最广大人民利益为标准\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先看哪种价值应优先，再看个案中能否兼顾其他价值，避免为了一个目标给别人造成过重损失。\u003c/p>","count":4,"chars":83,"gap":false},{"id":"jurisprudence-1794829194935","n":54,"chapter":"法的渊源、效力与分类","title":"法的渊源的含义 ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">实质渊源，是法产生的社会根源，主要是一定社会的物质生活条件\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">形式渊源\u003c/span>，是法经什么方式创制、以什么形式表现出来，包括制定法、习惯法等\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>实质渊源问规则为什么会产生，形式渊源问规则可以到哪里找。\u003c/p>","count":2,"chars":64,"gap":false},{"id":"jurisprudence-1794829194936","n":55,"chapter":"法的渊源、效力与分类","title":"法的渊源的分类 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">正式渊源：可直接作为法律依据\u003c/span>，如\u003cspan class=\"blue\">制定法\u003c/span>、习惯法、判例法、国际条约，具体依本国制度\u003c/li>\u003cli>\u003cspan class=\"blue\">非正式渊源\u003c/span>：提供解释、说理参考，如政策、学说、习惯、道德、正义、理性原则\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":76,"gap":false},{"id":"jurisprudence-1794829194937","n":56,"chapter":"法的渊源、效力与分类","title":"当代中国法的非正式渊源 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">习惯：社会长期形成、反复遵循的行为规则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">政策\u003c/span>：政党、政治组织为实现一定目标提出的方针措施\u003c/li>\u003cli>\u003cspan class=\"blue\">指导性案例\u003c/span>：供办案参照，统一尺度、约束裁量，不等于判例法\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":71,"gap":false},{"id":"jurisprudence-1794829194938","n":57,"chapter":"法的渊源、效力与分类","title":"法的效力的概念和等级 ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">法的效力是法律约束力，包括对人、空间、时间效力\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">位阶\u003c/span>：上位法优于下位法；同位阶通常特别法优于一般法、新法优于旧法\u003c/li>\u003cli>\u003cspan class=\"blue\">发生法定冲突按有权机关裁决程序处理\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>同一事项出现冲突时，先看谁有权规定，再看上位法与下位法的关系。\u003c/p>","count":3,"chars":72,"gap":false},{"id":"jurisprudence-1794829194939","n":58,"chapter":"法的渊源、效力与分类","title":"法对人的效力 ★","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">对人的概念：法对人的效力指法对谁有效力，适用于哪些人\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">对人的内容\u003c/span>：\u003cspan class=\"blue\">属人\u003c/span>、属地、保护、\u003cspan class=\"blue\">折中\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>属人原则看国籍，属地原则看行为地，保护原则看本国重要利益是否受侵害，折中原则综合使用这些标准。\u003c/p>","count":2,"chars":43,"gap":false},{"id":"jurisprudence-1794829194940","n":59,"chapter":"法的渊源、效力与分类","title":"法的空间效力 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">空间效力：法律在哪些地域有效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">域内效力通常及于本国主权管辖领域\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">域外效力依法律规定及国际法\u003c/span>，可能延伸到境外特定人、行为；不是一律只管境内\u003c/li>\u003c/ol>","memory":"","understanding":"","count":3,"chars":66,"gap":false},{"id":"jurisprudence-1794829194941","n":60,"chapter":"法的渊源、效力与分类","title":"法的时间效力 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">时间效力：何时生效、失效，是否溯及既往\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">生效可自公布起、另定日期或满足条件起\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">失效可明示废止或被新法替代\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">通常不溯及既往，有利保护权利等法定例外除外\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"","count":4,"chars":71,"gap":false},{"id":"jurisprudence-1794829194942","n":61,"chapter":"法的渊源、效力与分类","title":"法的一般分类 ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">创制和表达方式：成文法不成文法（形式）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律规定内容\u003c/span>：实体法程序法（\u003cspan class=\"blue\">内容\u003c/span>）\u003c/li>\u003cli>\u003cspan class=\"blue\">地位、效力、内容、制定主体和程序\u003c/span>：\u003cspan class=\"blue\">根本法普通法\u003c/span>（小主体）\u003c/li>\u003cli>\u003cspan class=\"blue\">法律适用的范围\u003c/span>：特别法一般法（范围）\u003c/li>\u003cli>\u003cspan class=\"blue\">创制和适用主体\u003c/span>：国内法国际法（大主体）\u003c/li>\u003c/ol>","memory":"","understanding":"","count":5,"chars":101,"gap":false},{"id":"jurisprudence-1794829194943","n":62,"chapter":"法的渊源、效力与分类","title":"西方两大法系的法律分类 ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">英美传统上分普通法、衡平法：前者源于普通法院判例，后者补充其僵硬不足\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">大陆传统上分公法、私法\u003c/span>：前者重国家公共利益，后者重私人利益；并有社会法等发展\u003c/li>\u003c/ol>","memory":"","understanding":"","count":2,"chars":72,"gap":false},{"id":"jurisprudence-1794829194944","n":63,"chapter":"法律要素与法律体系","title":"法律规则的含义和特点 ★  ★  ★","body":"\u003col>\u003cli>\u003cspan class=\"red\">法律规则：国家制定、认可，按一定结构具体规定权利义务和法律后果的行为规范\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">特征\u003c/span>：国家性、结构性、具体性、规范性，通常能明确指导和评价行为\u003c/li
