span>被代理人的继承人继续代理（继）\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>人去世后委托代理通常终止，但代理人不知情、继承人认可等法定情形下，仍可能有效。\u003c/p>","count":5,"chars":112,"gap":false},{"id":"civil-1794843503084","n":84,"chapter":"第一编 民法总则","title":"无权代理的概念及其情形","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">无权代理的概念：没有代理权而以他人名义进行代理活动的民事行为\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">无权代理的分类\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">没有代理权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">超越代理权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">代理权终止\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">数人共同代\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>从没得到授权、越过授权范围或授权已失效，都不能当然让别人为代理行为负责。\u003c/p>","count":6,"chars":57,"gap":false},{"id":"civil-1794843503085","n":85,"chapter":"第一编 民法总则","title":"表见代理的概念及其构成要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">表见代理：虽无代理权，但相对人有理由相信其有权，代理效果由本人承担\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须存在无权代理及足以信赖的权利外观\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">相对人不知无权且无过失\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">基于合理信赖与其实施法律行为\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>代理人其实没权，但有足以让善意相对人合理相信有权的外观时，法律才会保护交易信赖。\u003c/p>","count":4,"chars":75,"gap":false},{"id":"civil-1794843503086","n":86,"chapter":"第一编 民法总则","title":"表见代理的常见情形（发生原因）","body":"\u003col>\u003cli>\u003cspan class=\"red\">表见授权表示\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">代理授权不明\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">终止未采取必要措施\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>授权书、职务身份或原代理权结束后仍留在外面的授权材料，都可能造成有代理权的外观。\u003c/p>","count":3,"chars":21,"gap":false},{"id":"civil-1794843503087","n":87,"chapter":"第一编 民法总则","title":"间接代理中委托人行使介入权的条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">间接：受托人以自己的名义与第三人订立合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">隐名\u003c/span>：第三人在订立合同时，\u003cspan class=\"blue\">不知道\u003c/span>受托人与委托人之间存在代理关系\u003c/li>\u003cli>\u003cspan class=\"blue\">因第三人\u003c/span>：受托人\u003cspan class=\"blue\">因第三人\u003c/span>的原因对委托人不\u003cspan class=\"blue\">履行义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">披露\u003c/span>：向委托人\u003cspan class=\"blue\">披露\u003c/span>了第三人\u003c/li>\u003cli>\u003cspan class=\"blue\">不存在\u003c/span>：\u003cspan class=\"blue\">不存在\u003c/span>“第三人与受托人订立合同时如果知道该委托人就\u003cspan class=\"blue\">不会\u003c/span>订立合同”的\u003cspan class=\"blue\">情形\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>受托人因第三人的原因不能向委托人交差时，符合法定条件的委托人可以直接向第三人主张。\u003c/p>","count":5,"chars":127,"gap":false},{"id":"civil-1794843503088","n":88,"chapter":"第一编 民法总则","title":"间接代理中第三人行使选择权的条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">间接：受托人以自己的名义与第三人订立合同\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">隐名\u003c/span>：第三人在订立合同时，\u003cspan class=\"blue\">不知道\u003c/span>受托人与委托人之间存在代理关系\u003c/li>\u003cli>\u003cspan class=\"blue\">因委托人\u003c/span>：受托人\u003cspan class=\"blue\">因委托人\u003c/span>的原因对第三人不\u003cspan class=\"blue\">履行义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">披露\u003c/span>：向第三人\u003cspan class=\"blue\">披露\u003c/span>了委托人\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>受托人因委托人的原因不能向第三人交差，披露委托人后，第三人在法定范围内选择向谁主张。\u003c/p>","count":4,"chars":88,"gap":false},{"id":"civil-1794843503089","n":89,"chapter":"第一编 民法总则","title":"诉讼时效与除斥期间的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">与诉讼时效区别5（权，起算，期间，后果，过了能否主动）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">除斥期间的适用范围\u003c/span>：形成权；\u003cspan class=\"blue\">请求权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">与诉讼时效区别法律后果\u003c/span>：实体权利消灭；\u003cspan class=\"blue\">抗辩权\u003c/span>发生\u003c/li>\u003cli>\u003cspan class=\"blue\">起算时间\u003c/span>：法律规定或权利发生；知道或应知道\u003c/li>\u003cli>\u003cspan class=\"blue\">使用条件\u003c/span>：\u003cspan class=\"blue\">法院\u003c/span>可主动适用，不能主动适用\u003c/li>\u003cli>\u003cspan class=\"blue\">期间可变性\u003c/span>：不变期间；\u003cspan class=\"blue\">可变期间\u003c/span>，中止中断延长\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>诉讼时效过了主要产生抗辩，除斥期间过了则可能直接失去那项权利。\u003c/p>","count":6,"chars":130,"gap":false},{"id":"civil-1794843503090","n":90,"chapter":"第一编 民法总则","title":"诉讼时效的起算","body":"\u003col>\u003cli>\u003cspan class=\"red\">一般起算：知道或应知道权利受损及义务人时起算\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">最长保护期\u003c/span>：从权利受损日起算\u003c/li>\u003cli>\u003cspan class=\"blue\">法定代理\u003c/span>：与\u003cspan class=\"blue\">法定代理人\u003c/span>之间的\u003cspan class=\"blue\">请求权\u003c/span>从\u003cspan class=\"blue\">法定代理\u003c/span>终止起算；对其他人通常从\u003cspan class=\"blue\">法定代理人\u003c/span>知道或应知时起算\u003c/li>\u003cli>\u003cspan class=\"blue\">未成年人遭性侵\u003c/span>：从受害人年满\u003cspan class=\"blue\">十八周岁\u003c/span>起算\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>通常从知道或应当知道权利受损和谁应负责时起算，还要看有没有特别规定。\u003c/p>","count":4,"chars":103,"gap":false},{"id":"civil-1794843503091","n":91,"chapter":"第一编 民法总则","title":"期间的概念及其类型","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：期间是从起点到终点的一段时间，可作为民事法律关系发生、变更、终止的时间依据\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">类型\u003c/span>：从来源分为\u003cspan class=\"blue\">法定期间\u003c/span>、约定期间和指定期间\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>从发出通知到到期是一段时间，具体多长可以由法律、双方约定或有关机关确定。\u003c/p>","count":2,"chars":62,"gap":false},{"id":"civil-1794843503092","n":92,"chapter":"第一编 民法总则","title":"期间的计算","body":"\u003col>\u003cli>\u003cspan class=\"red\">年月日小时;按公历年、月、日、小时计算\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">年月日；开始的当日不计入，下一日开始计算\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">年月\u003c/span>；\u003cspan class=\"blue\">到期\u003c/span>月的\u003cspan class=\"blue\">对应\u003c/span>日是最后一日，没有\u003cspan class=\"blue\">对应\u003c/span>日，月末日为最后一日\u003c/li>\u003cli>\u003cspan class=\"blue\">日，最后一日是法定休假日，次日为最后一日)\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>算截止日先定从哪天开始，再问最后一天碰到休假要不要顺延。\u003c/p>","count":4,"chars":90,"gap":false},{"id":"civil-1794843503093","n":93,"chapter":"第一编 民法总则","title":"诉讼时效中止的概念及其事由","body":"\u003col>\u003cli>\u003cspan class=\"red\">时效中止：因法定障碍不能行使请求权，时效暂不继续计算\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">障碍须发生于最后6个月\u003c/span>：不可抗力；被控制；无限制能力者无法定代理；继承人或遗产管理人未定；其他障碍\u003c/li>\u003cli>\u003cspan class=\"blue\">原因消除后满6个月，时效届满\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>倒计时最后阶段遇到法定障碍，障碍消失后再按法律留出应有的时间。\u003c/p>","count":3,"chars":89,"gap":false},{"id":"civil-1794843503094","n":94,"chapter":"第一编 民法总则","title":"诉讼时效中断的概念及其事由","body":"\u003col>\u003cli>\u003cspan class=\"red\">时效中断：法定事由使已过期间失效，从中断或有关程序终结时重新计算\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">债权人请求履行\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">债务人同意履行\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">提起诉讼、申请仲裁\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">其他与起诉、仲裁有同等效力的法定事由\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>在时效期间依法主张权利、起诉或对方答应履行等，原来经过的时间不再照算。\u003c/p>","count":5,"chars":73,"gap":false},{"id":"civil-1794843503095","n":95,"chapter":"第一编 民法总则","title":"不适用诉讼时效的请求权","body":"\u003col>\u003cli>\u003cspan class=\"red\">不适用时效：停止侵害、排除妨碍、消除危险请求\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不动产及已登记动产的物权人请求返还财产\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">支付抚养费、赡养费、扶养费请求\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法不适用的其他请求\u003c/span>，如存款本息、兑付债券、缴付出资等\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有些请求是在持续维护权利状态，例如要求停止侵害，法律不让它们因为拖久就受时效限制。\u003c/p>","count":4,"chars":83,"gap":false},{"id":"civil-1794843503096","n":96,"chapter":"第二编 物权","title":"物权的概念及其说明（理解）","body":"\u003col>\u003cli>\u003cspan class=\"red\">物权：依法直接支配特定财产、享有其利益的排他性权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">直接支配，不必依赖义务人给付\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客体特定；属于财产权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">具有排除他人干涉的效力\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>物权让你可以直接管某件东西，并要求其他人不要妨碍这种支配。\u003c/p>","count":4,"chars":60,"gap":false},{"id":"civil-1794843503097","n":97,"chapter":"第二编 物权","title":"物权的特征（物权与债权的区别）","body":"\u003col>\u003cli>\u003cspan class=\"red\">效力范围：物权是绝对权，债权是相对权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">权利性质\u003c/span>：物权是支配权，债权通常是\u003cspan class=\"blue\">请求权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客体\u003c/span>：物权通常\u003cspan class=\"blue\">指向\u003c/span>物，债权\u003cspan class=\"blue\">指向\u003c/span>给付\u003c/li>\u003cli>\u003cspan class=\"blue\">效力\u003c/span>：物权一般有\u003cspan class=\"blue\">排他力\u003c/span>、优先力和追及力\u003c/li>\u003cli>\u003cspan class=\"blue\">设立\u003c/span>：物权\u003cspan class=\"blue\">种类\u003c/span>和内容法定，债权可依法约定\u003c/li>\u003cli>\u003cspan class=\"blue\">保护\u003c/span>：物权受\u003cspan class=\"blue\">侵害\u003c/span>可依法请求\u003cspan class=\"blue\">返还原物\u003c/span>、排除妨害等，债权主要依债的关系请求履行或担责\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>物权可以直接对物主张并排除他人妨碍，债权通常只能要求特定的人做事。\u003c/p>","count":6,"chars":134,"gap":false},{"id":"civil-1794843503098","n":98,"chapter":"第二编 物权","title":"物权的效力","body":"\u003col>\u003cli>\u003cspan class=\"red\">优先效力：物权原则优于债权，冲突物权依顺位规则处理\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">追及效力\u003c/span>：物移转后仍可依法追及\u003c/li>\u003cli>\u003cspan class=\"blue\">排他效力\u003c/span>：同一物上不容互相矛盾的物权并存\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>物权受妨碍可以排除，东西被别人占有时能否追回还要看善意取得等规则。\u003c/p>","count":3,"chars":60,"gap":false},{"id":"civil-1794843503099","n":99,"chapter":"第二编 物权","title":"物权的分类","body":"\u003col>\u003cli>\u003cspan class=\"red\">按客体：动产、不动产、权利物权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按支配内容\u003c/span>：用益物权、担保物权\u003c/li>\u003cli>\u003cspan class=\"blue\">按支配范围\u003c/span>：\u003cspan class=\"blue\">完全\u003c/span>物权、定限物权\u003c/li>\u003cli>\u003cspan class=\"blue\">按从属性\u003c/span>：主物权、从物权\u003c/li>\u003cli>\u003cspan class=\"blue\">按发生原因\u003c/span>：意定物权、法定物权\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>可以先分自己的物和别人的物，再看是在用东西获益，还是拿东西担保还债。\u003c/p>","count":5,"chars":72,"gap":false},{"id":"civil-1794843503100","n":100,"chapter":"第二编 物权","title":"平等保护原则的概念及其具体内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">平等保护原则（=民法平等原则剔除平等协商）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律地位平等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">适用规则平等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保护平等\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>不管东西属于国家、集体还是个人，受到非法侵害时都依法保护。\u003c/p>","count":4,"chars":37,"gap":false},{"id":"civil-1794843503101","n":101,"chapter":"第二编 物权","title":"物权法定原则的概念及其违反后果","body":"\u003col>\u003cli>\u003cspan class=\"red\">物权类型、内容依法定，不得自行创设\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">创设法无规定的类型，不生物权设定效果\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">约定内容违法，违法部分不生效，不影响其他有效部分\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不当然影响债权合同等其他法律行为效力\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>物权的种类和内容得由法律定，双方不能私下造一种新物权让陌生人也受约束。\u003c/p>","count":4,"chars":77,"gap":false},{"id":"civil-1794843503102","n":102,"chapter":"第二编 物权","title":"物权变动的概念及其模式","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：物权的设立、变更、转让和消灭\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">意思主义\u003c/span>：有相应合意\u003cspan class=\"blue\">即可\u003c/span>发生物权变动\u003c/li>\u003cli>\u003cspan class=\"blue\">债权形式主义\u003c/span>：除债权行为外，还需登记或交付\u003c/li>\u003cli>\u003cspan class=\"blue\">物权形式主义\u003c/span>：在债权行为外，还需物权变动合意及登记或交付\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>东西的权属可以产生、改变或消灭，究竟在签约、登记还是交付时变，要看适用的规则。\u003c/p>","count":4,"chars":84,"gap":false},{"id":"civil-1794843503103","n":103,"chapter":"第二编 物权","title":"物权设立的类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">原始取得：非依他人既存的权利而取得物权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">继受取得：基于他人既存的权利而取得物权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">移转的继受取得\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">创设的继受取得\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>第一次取得一栋新房与在别人房子上设抵押，都是设权，但建立的是不同种类的物权。\u003c/p>","count":4,"chars":52,"gap":false},{"id":"civil-1794843503104","n":104,"chapter":"第二编 物权","title":"不动产登记的类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">变动登记：首次、变更、转移、注销\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">更正登记\u003c/span>：纠正登记错误\u003c/li>\u003cli>\u003cspan class=\"blue\">异议登记\u003c/span>：\u003cspan class=\"blue\">记载\u003c/span>争议，登记后\u003cspan class=\"blue\">15日\u003c/span>内不起诉则失效\u003c/li>\u003cli>\u003cspan class=\"blue\">预告登记\u003c/span>：保障将来物权实现；债权消灭或能本登记起\u003cspan class=\"blue\">90日\u003c/span>不\u003cspan class=\"blue\">申请\u003c/span>，预告失效\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>登记不只用来办过户，还可以改错、提出异议或保住未来办理正式登记的机会。\u003c/p>","count":4,"chars":85,"gap":false},{"id":"civil-1794843503105","n":105,"chapter":"第二编 物权","title":"变动登记的类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">变动登记：就不动产的产生、变更、转让、消灭所进行的登记，（包括首次、变更、转移、注销）\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>第一次记上权利、后来改记权利归谁和最后注销权利，各用对应的登记。\u003c/p>","count":1,"chars":43,"gap":false},{"id":"civil-1794843503106","n":106,"chapter":"第二编 物权","title":"不动产登记的效力","body":"\u003col>\u003cli>\u003cspan class=\"red\">登记生效：依法应登记的物权变动，通常自登记簿记载时生效\u003c/span>，如一般不动产所有权转让、\u003cspan class=\"blue\">建设用地使用权\u003c/span>和居住权设立、不动产\u003cspan class=\"blue\">抵押权\u003c/span>设立\u003c/li>\u003cli>\u003cspan class=\"blue\">登记对抗\u003c/span>：有些物权自\u003cspan class=\"blue\">合同生效\u003c/span>时设立，未经登记不得对抗善意第三人，如地役权、\u003cspan class=\"blue\">五年\u003c/span>以上土地经营权\u003c/li>\u003cli>\u003cspan class=\"blue\">区分\u003c/span>：登记是否完成，通常不\u003cspan class=\"blue\">影响\u003c/span>设立、转让不动\u003cspan class=\"blue\">产物权\u003c/span>的合同本身效力\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>查登记能知道房子表面归谁，能否因此取得或对抗他人，还得看具体规则。\u003c/p>","count":3,"chars":140,"gap":false},{"id":"civil-1794843503107","n":107,"chapter":"第二编 物权","title":"动产交付的方式","body":"\u003col>\u003cli>\u003cspan class=\"red\">现实交付：把动产实际移交给受让人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">简易交付\u003c/span>：受让人先已\u003cspan class=\"blue\">占有动产\u003c/span>，转让物权的\u003cspan class=\"blue\">民事法律行为\u003c/span>生效时完成交付\u003c/li>\u003cli>\u003cspan class=\"blue\">指示交付\u003c/span>：动产由第三人占有，转让\u003cspan class=\"blue\">返还原物请求权\u003c/span>以代交付\u003c/li>\u003cli>\u003cspan class=\"blue\">占有改定\u003c/span>：双方约定由出让人\u003cspan class=\"blue\">继续占有\u003c/span>，物权自约定生效时变动\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有时当面把东西交过去，有时接收人早已拿着，或依法改变谁替谁保管，也能完成交付。\u003c/p>","count":4,"chars":104,"gap":false},{"id":"civil-1794843503108","n":108,"chapter":"第二编 物权","title":"非基于法律行为的物权变动的类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">征收决定：决定生效时变动\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">继承\u003c/span>：\u003cspan class=\"blue\">继承开始\u003c/span>时取得\u003c/li>\u003cli>\u003cspan class=\"blue\">法院、仲裁形成性法律文书\u003c/span>：生效时变动\u003c/li>\u003cli>\u003cspan class=\"blue\">合法建造、拆除等事实行为\u003c/span>：成就时变动\u003c/li>\u003cli>\u003cspan class=\"blue\">依法应登记的，未登记不得再处分而发生物权效果\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>继承、法院生效文书或合法建成房屋等事实，可以依法直接带来物权变化。\u003c/p>","count":5,"chars":80,"gap":false},{"id":"civil-1794843503109","n":109,"chapter":"第二编 物权","title":"物权保护的方式","body":"\u003col>\u003cli>\u003cspan class=\"red\">物权保护的方式5（从11个里挑+确认之诉的确认物权）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">确认物权\u003c/span>：物权\u003cspan class=\"blue\">归属\u003c/span>不明或发生争议\u003c/li>\u003cli>\u003cspan class=\"blue\">排除妨害、消除危险\u003c/span>：妨害或\u003cspan class=\"blue\">可能\u003c/span>妨害\u003c/li>\u003cli>\u003cspan class=\"blue\">返还原物\u003c/span>：物权人可以请求\u003cspan class=\"blue\">无权占有\u003c/span>人\u003cspan class=\"blue\">返还原物\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">恢复原状\u003c/span>：修理\u003cspan class=\"blue\">重做\u003c/span>更换或\u003cspan class=\"blue\">恢复原状\u003c/span>，能修复，难以修复\u003c/li>\u003cli>\u003cspan class=\"blue\">损害赔偿\u003c/span>：造成经济\u003cspan class=\"blue\">损失\u003c/span>的\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>东西被占可要求返还，放东西妨碍使用可要求搬走，有危险可要求消除。\u003c/p>","count":6,"chars":117,"gap":false},{"id":"civil-1794843503110","n":110,"chapter":"第二编 物权","title":"所有权的概念及其权能（内容）","body":"\u003col>\u003cli>\u003cspan class=\"red\">所有权：权利人在法律允许范围内，对物全面支配、排除他人干涉的物权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">权能包括占有、使用、收益、处分\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">全面支配仍受法律、公共利益及他人合法权益限制\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>主人能依法拿着、使用、收取收益，还能卖掉或依法处分自己的东西。\u003c/p>","count":3,"chars":69,"gap":false},{"id":"civil-1794843503111","n":111,"chapter":"第二编 物权","title":"行使所有权的限制","body":"\u003col>\u003cli>\u003cspan class=\"red\">行使所有权不得违法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不得妨害他人合法权益、滥用权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">为公共利益可依法征收、征用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保护生态环境、自然资源，兼顾公共利益\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>房归你，也不能用它违法、妨碍别人或破坏生态，法律还可因公共利益依法限制。\u003c/p>","count":4,"chars":55,"gap":false},{"id":"civil-1794843503112","n":112,"chapter":"第二编 物权","title":"所有权的特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">全面性：可依法对物作全面支配\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">整体性\u003c/span>：占有、\u003cspan class=\"blue\">使用\u003c/span>、收益、处分\u003cspan class=\"blue\">不是\u003c/span>简单拼合，所有权是统一的权利\u003c/li>\u003cli>\u003cspan class=\"blue\">弹力性\u003c/span>：设他物权后所有权仍在，\u003cspan class=\"blue\">负担\u003c/span>消除后恢复完整\u003c/li>\u003cli>\u003cspan class=\"blue\">排他性\u003c/span>：同一物上不能\u003cspan class=\"blue\">同时\u003c/span>存在彼此独立的两个所有权\u003c/li>\u003cli>\u003cspan class=\"blue\">恒久性\u003c/span>：法律不\u003cspan class=\"blue\">预定\u003c/span>存续期，有法定事由才消灭\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>自己的房可以占、用、租、卖，某项权能暂交别人，所有权通常仍在。\u003c/p>","count":5,"chars":114,"gap":false},{"id":"civil-1794843503113","n":113,"chapter":"第二编 物权","title":"动产所有权与不动产所有权的主要区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">所有权的主要区别3（动与不动，动产，不动产）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">基于法律行为的不动产所有权变动原则上以登记为生效要件\u003c/span>，基于法律行为的动产所有权\u003cspan class=\"blue\">变动\u003c/span>原则上以交付为\u003cspan class=\"blue\">生效\u003c/span>要件\u003c/li>\u003cli>\u003cspan class=\"blue\">先占、拾得遗失物等原始取得方式仅适用于动产所有权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">只有不动产所有权才涉及相邻关系和建筑物区分所有权问题\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>桌子归谁通常看交付，房子归谁通常看登记，生活中使用和交易的限制也不一样。\u003c/p>","count":4,"chars":124,"gap":false},{"id":"civil-1794843503114","n":114,"chapter":"第二编 物权","title":"集体所有权的客体","body":"\u003col>\u003cli>\u003cspan class=\"red\">集体所有的土地、森林、山岭、草原、荒地及滩涂\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">集体所有的建筑物、生产设施、农田水利设施\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">集体所有的教育、科学、文化、卫生、体育等设施\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">集体所有的其他不动产和动产\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>依法归集体的土地、建筑或设施等，属于该集体的财产范围。\u003c/p>","count":4,"chars":77,"gap":false},{"id":"civil-1794843503115","n":115,"chapter":"第二编 物权","title":"原始取得的概念及其方式","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：不依赖他人既存所有权而取得所有权\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">典型方式\u003c/span>：依法\u003cspan class=\"blue\">先占\u003c/span>无主物；生产、制造、建造新物；依法因加工、附合、混合等添附取得；符合法定条件时\u003cspan class=\"blue\">善意取得\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">特别规则\u003c/span>：拾得\u003cspan class=\"blue\">遗失\u003c/span>物应依法返还、\u003cspan class=\"blue\">通知\u003c/span>或交送；漂流物、埋藏物和隐藏物参照有关规定，不能一捡就归己\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>买别人已有的东西是接过他的权利，自己依法造出的新物则不靠前一任主人转给你。\u003c/p>","count":3,"chars":118,"gap":false},{"id":"civil-1794843503116","n":116,"chapter":"第二编 物权","title":"先占的概念及其构成要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">先占：以所有之意思占有无主动产而取得所有权的法律事实\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须以所有的意思占有无主物\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须为无主物\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须为动产\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>只有物确实无主，且依法允许占取，你以归自己为目的先控制它，才可能取得所有权。\u003c/p>","count":4,"chars":47,"gap":false},{"id":"civil-1794843503117","n":117,"chapter":"第二编 物权","title":"动产善意取得的适用要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">无权处分：让与人无处分权，原则上系占有委托物，标的可以流通\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">受让人善意\u003c/span>：受让时不知且无\u003cspan class=\"blue\">重大过失\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">合理价格\u003c/span>：所\u003cspan class=\"blue\">有权\u003c/span>善意取得通常须以\u003cspan class=\"blue\">合理价格\u003c/span>转让\u003c/li>\u003cli>\u003cspan class=\"blue\">交付\u003c/span>：动产已经\u003cspan class=\"blue\">交付\u003c/span>；\u003cspan class=\"blue\">占有改定\u003c/span>不适用\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>你从没权卖的人手里买动产，也要满足当时善意、合理价格和交付等条件，才能例外取得。\u003c/p>","count":4,"chars":85,"gap":false},{"id":"civil-1794843503118","n":118,"chapter":"第二编 物权","title":"不动产善意取得的适用要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">无权处分：处分人无处分权，但有足以信赖的权利外观\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">善意\u003c/span>：受让时不知且无\u003cspan class=\"blue\">重大过失\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">合理价格\u003c/span>：以\u003cspan class=\"blue\">合理价格转让\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">登记\u003c/span>：依法完成不动\u003cspan class=\"blue\">产物权登记\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>不知卖房人没处分权还不够，还要合理价格并办好登记等，才可能取得房屋。\u003c/p>","count":4,"chars":64,"gap":false},{"id":"civil-1794843503119","n":119,"chapter":"第二编 物权","title":"善意取得的法律后果","body":"\u003col>\u003cli>\u003cspan class=\"red\">受让人取得所有权，原所有权人丧失所有权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">善意受让人取得动产后，该动产上的原有权消灭\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">原所有权人有权向无处分权人请求损害赔偿\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>买受人成功善意取得后，原主人通常不能向他追回，只能依法向无权处分人求偿。\u003c/p>","count":3,"chars":59,"gap":false},{"id":"civil-1794843503120","n":120,"chapter":"第二编 物权","title":"所有权的消灭","body":"\u003col>\u003cli>\u003cspan class=\"red\">所有权的消灭的分类\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">所有权的绝对消灭\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">指因一定法律事实的发生使所有权的客体不复存在\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">所有权的相对消灭\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">指因一定法律事实的发生导致原所有人丧失所有权\u003c/span>，但客体\u003cspan class=\"blue\">依然\u003c/span>存在，只是更换了权利人\u003c/li>\u003cli>\u003cspan class=\"blue\">引起所有权的相对消灭的原因主要有\u003c/span>：（机主抛售）\u003c/li>\u003cli>\u003cspan class=\"blue\">国家机关依法采取强制措施\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">所有权人消灭\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">抛弃所有权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">转让所有权\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>卖给别人、自愿放弃或物彻底毁损，都可能让你原来享有的所有权结束。\u003c/p>","count":10,"chars":137,"gap":false},{"id":"civil-1794843503121","n":121,"chapter":"第二编 物权","title":"相邻关系的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">相邻关系：相邻或毗近不动产权利人因使用财产产生的权利义务关系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主体有两方以上\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客体限于毗邻、相近的不动产\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">内容是相邻人间必要便利与合理限制，不是独立创设新物权\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>两家挨得近，过路、排水时有时要互相给方便，也得尽量不伤对方。\u003c/p>","count":4,"chars":76,"gap":false},{"id":"civil-1794843503122","n":122,"chapter":"第二编 物权","title":"相邻关系的概念及其类型（内容）","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：相邻不动产权利人在依法行使权利时产生的权利义务关系\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">内容\u003c/span>：用水、排水和通行等必要便利；修建或铺设管线时依法利用邻地；\u003cspan class=\"blue\">不得\u003c/span>妨碍通风、采光和日照，\u003cspan class=\"blue\">不得\u003c/span>违法排放有害物；挖掘、安装等\u003cspan class=\"blue\">不得\u003c/span>危及相邻不动产安全\u003c/li>\u003cli>\u003cspan class=\"blue\">原则\u003c/span>：有利\u003cspan class=\"blue\">生产\u003c/span>，方便生活，团结互助，公平合理\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>邻居的通行、用水、采光或施工影响到你时，按相邻规则平衡方便和损害。\u003c/p>","count":3,"chars":122,"gap":false},{"id":"civil-1794843503123","n":123,"chapter":"第二编 物权","title":"建筑物区分所有权的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">建筑物区分所有权：专有部分专有权、共有部分共有权、共同事务管理权的结合\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">复合性\u003c/span>：三项权利组合\u003c/li>\u003cli>\u003cspan class=\"blue\">整体性\u003c/span>：不可分离\u003c/li>\u003cli>\u003cspan class=\"blue\">专有权主导其他权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客体多元，兼有专有、共有部分\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一栋楼里，自己的房间能独自使用，楼梯等大家共用，小区事务也要一起管。\u003c/p>","count":5,"chars":76,"gap":false},{"id":"civil-1794843503124","n":124,"chapter":"第二编 物权","title":"专有部分需要满足的条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">专有权的客体——专有部分的条件3（构造-登记-利用）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">构造上的独立性\u003c/span>：即“\u003cspan class=\"blue\">物理\u003c/span>上的独立性”，故能明确区分\u003c/li>\u003cli>\u003cspan class=\"blue\">能登记成为特定业主所有权的客体\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">利用上的独立性\u003c/span>：即“\u003cspan class=\"blue\">功能\u003c/span>上的独立性”，可以排他使用\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一块空间要能分清边界、单独使用，并能依法登记，才适合归某个业主专有。\u003c/p>","count":4,"chars":91,"gap":false},{"id":"civil-1794843503125","n":125,"chapter":"第二编 物权","title":"业主共同决定的事项","body":"\u003col>\u003cli>\u003cspan class=\"red\">共同事项：制定或修改议事规则和管理规约\u003c/span>；选换业委会\u003cspan class=\"blue\">成员\u003c/span>、选聘解聘物业；使用或筹集维修资金；改建、重建；改变共有用途或经营；其他共有和管理重大事项\u003c/li>\u003cli>\u003cspan class=\"blue\">参与门槛\u003c/span>：\u003cspan class=\"blue\">专有\u003c/span>面积和人数均须达到2/3\u003c/li>\u003cli>\u003cspan class=\"blue\">经门槛\u003c/span>：筹资、改建重建、改变用途或经营，须参与者中面积与人数均达到3/4；其他事项须两项均过半\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>换物业、用维修资金或改建公用部分，不是一户说了算，要依法由业主共同决定。\u003c/p>","count":3,"chars":138,"gap":false},{"id":"civil-1794843503126","n":126,"chapter":"第二编 物权","title":"共有的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：两个以上主体对同一项财产享有所有权\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">特征\u003c/span>：主体为多人，\u003cspan class=\"blue\">客体\u003c/span>是同一财产；\u003cspan class=\"blue\">对外\u003c/span>共同享有物权，对内\u003cspan class=\"blue\">也有\u003c/span>共有物管理和利益分配的权利义务；常基于共同经营或生活需要形成\u003c/li>\u003cli>\u003cspan class=\"blue\">类型\u003c/span>：按份共有和共同共有\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一样东西同时属于几个人，经营处置前要分清大家按份享有，还是基于共同关系享有。\u003c/p>","count":3,"chars":92,"gap":false},{"id":"civil-1794843503127","n":127,"chapter":"第二编 物权","title":"按份共有人的权利","body":"\u003col>\u003cli>\u003cspan class=\"red\">份额：按份享有权和利益，可处分本人份额\u003c/span>；\u003cspan class=\"blue\">对外转让\u003c/span>时，其他共有人在同等条件下可依法\u003cspan class=\"blue\">优先购买\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">分割\u003c/span>：无不\u003cspan class=\"blue\">分割\u003c/span>约定可\u003cspan class=\"blue\">随时\u003c/span>请求；有约定但有重大理由的仍可请求，造成损害应\u003cspan class=\"blue\">赔偿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">处分共有物\u003c/span>：另有约定依约定；\u003cspan class=\"blue\">否则\u003c/span>原则上须占\u003cspan class=\"blue\">份额\u003c/span>2/3以上共有人同意\u003c/li>\u003cli>\u003cspan class=\"blue\">保护\u003c/span>：共有物受\u003cspan class=\"blue\">侵害\u003c/span>时，可依法请求返还、排除妨碍等\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>你可以依法转自己的份额；要整个共有物变动或分开，还得看共有规则。\u003c/p>","count":4,"chars":138,"gap":false},{"id":"civil-1794843503128","n":128,"chapter":"第二编 物权","title":"共同共有的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：两人以上基于共同关系对同一财产不分份额地享有所有权\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">特征\u003c/span>：共同、\u003cspan class=\"blue\">平等\u003c/span>享有权并承担义务；随共同关系存在而产生，随共同关系\u003cspan class=\"blue\">结束\u003c/span>而消灭\u003c/li>\u003cli>\u003cspan class=\"blue\">例子\u003c/span>：\u003cspan class=\"blue\">夫妻共同财产\u003c/span>、家庭共有财产、遗产分割前的\u003cspan class=\"blue\">共同财产\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>夫妻共有一套房时，先共同享有，不能在共有关系存续时擅自说哪几成一定归自己。\u003c/p>","count":3,"chars":93,"gap":false},{"id":"civil-1794843503129","n":129,"chapter":"第二编 物权","title":"用益物权的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">用益物权：对他人动产、不动产依法占有、使用、收益的权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">属他物权、定限物权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客体可为动产、不动产，以不动产为主\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">以占有为通常前提，以使用、收益为主要内容\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>房地不是你的，但依法拿到用益物权后，可以占用、使用并从中获益。\u003c/p>","count":4,"chars":73,"gap":false},{"id":"civil-1794843503130","n":130,"chapter":"第二编 物权","title":"土地承包经营权的特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">性质：以农业利用为目的的用益物权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主体与客体\u003c/span>：承包人依法就\u003cspan class=\"blue\">集体\u003c/span>所有或\u003cspan class=\"blue\">国家\u003c/span>所有依法由\u003cspan class=\"blue\">集体\u003c/span>使用的农业用地取得权利\u003c/li>\u003cli>\u003cspan class=\"blue\">内容\u003c/span>：\u003cspan class=\"blue\">占有\u003c/span>、使用、收益\u003c/li>\u003cli>\u003cspan class=\"blue\">取得与期限\u003c/span>：由发包人和承包人\u003cspan class=\"blue\">订立\u003c/span>承包合同设立，属于有期限物权\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>承包人按规定用土地搞农业生产，土地所有权仍归原本的所有人。\u003c/p>","count":4,"chars":94,"gap":false},{"id":"civil-1794843503131","n":131,"chapter":"第二编 物权","title":"土地承包经营权的内容（土地承包人的权利）","body":"\u003col>\u003cli>\u003cspan class=\"red\">基本权利：占有、使用承包地并取得收益，自主组织生产和处置产品\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">流转\u003c/span>：家庭承包取得的土地承包经营权，可依法\u003cspan class=\"blue\">互换\u003c/span>、转让，也可依法\u003cspan class=\"blue\">流转\u003c/span>土地经营权；其他方式承包的，依法律和\u003cspan class=\"blue\">登记\u003c/span>情况处分\u003c/li>\u003cli>\u003cspan class=\"blue\">补偿\u003c/span>：依法\u003cspan class=\"blue\">征收\u003c/span>、征用、占用承包地时，可请求相应\u003cspan class=\"blue\">补偿\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>承包人依法种地拿收益，还可依规则安排土地经营权流转。\u003c/p>","count":3,"chars":112,"gap":false},{"id":"civil-1794843503132","n":132,"chapter":"第二编 物权","title":"建设用地使用权的特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">建设用地使用权是用益物权，具有排他性\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主体为符合法定条件的自然人、组织\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客体为依法可供建设的国有或集体土地\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">可建造、保有建筑物及附属设施，并依法处分使用权\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>依法取得建设用地使用权，就能在他人的土地上建房等并按规则使用。\u003c/p>","count":4,"chars":74,"gap":false},{"id":"civil-1794843503133","n":133,"chapter":"第二编 物权","title":"行政划拨所取得的建设用地使用权的适用情形","body":"\u003col>\u003cli>\u003cspan class=\"red\">只能由权利人自己使用，而不能随意处分\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行政划拨仅限于法律有明文规定的情形\u003c/span>，（国军能公城+其他）\u003c/li>\u003cli>\u003cspan class=\"blue\">国家机关用地和军事用地\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">城市基础设施用地和公益事业用地\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国家重点扶持的能源、交通、水利等基础设施用地\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律、行政法规规定的其他用地等\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>公益设施等符合法定用途的项目，才可以依法用行政划拨取得建设用地。\u003c/p>","count":6,"chars":109,"gap":false},{"id":"civil-1794843503134","n":134,"chapter":"第二编 物权","title":"建设用地使用权的内容（建设用地使用权人的权利）","body":"\u003col>\u003cli>\u003cspan class=\"red\">占有：直接控制依法取得的建设用地\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">使用\u003c/span>：开发、经营、利用土地\u003c/li>\u003cli>\u003cspan class=\"blue\">收益\u003c/span>：依法获得收益\u003c/li>\u003cli>\u003cspan class=\"blue\">处分\u003c/span>：可依法转让、互换、出资、赠与等\u003c/li>\u003cli>\u003cspan class=\"blue\">房地一体处分\u003c/span>：房\u003cspan class=\"blue\">随地\u003c/span>走、地随房走\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>土地使用权人能依法建房、用地，也可以在符合条件时转让或抵押该权利。\u003c/p>","count":5,"chars":72,"gap":false},{"id":"civil-1794843503135","n":135,"chapter":"第二编 物权","title":"宅基地使用权的内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">占有：占有宅基地\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">使用\u003c/span>：\u003cspan class=\"blue\">使用\u003c/span>宅基地建造\u003cspan class=\"blue\">房屋\u003c/span>及其附属设施且故取得\u003cspan class=\"blue\">房屋\u003c/span>及其附属设施的所\u003cspan class=\"blue\">有权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">收益\u003c/span>：取得因\u003cspan class=\"blue\">行使\u003c/span>宅基地\u003cspan class=\"blue\">使用\u003c/span>权而获得的\u003cspan class=\"blue\">收益\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">处分\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宅基地使用权不得抵押\u003c/span>，\u003cspan class=\"blue\">不得单独转让\u003c/span>，应与合法建造的住宅一并转让\u003c/li>\u003cli>\u003cspan class=\"blue\">农村村民一户只能申请一处宅基地\u003c/span>，\u003cspan class=\"blue\">农村\u003c/span>村民出租、出卖住宅后再申请宅基地的，不予批准\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>村民可依法使用宅基地建住宅和附属设施，但土地仍属集体，使用不能想怎么转就怎么转。\u003c/p>","count":6,"chars":135,"gap":false},{"id":"civil-1794843503136","n":136,"chapter":"第二编 物权","title":"居住权的特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">居住权：自然人为生活居住，占有、使用他人住宅的用益物权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主体仅自然人，客体为住宅\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">原则无偿，另有约定除外\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有期限且专属于本人\u003c/span>，\u003cspan class=\"blue\">不得转让\u003c/span>、继承，期满或权利人死亡消灭\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>居住权保障人按约住进他人的房屋，主要用来满足本人生活，不能随意转给别人。\u003c/p>","count":4,"chars":78,"gap":false},{"id":"civil-1794843503137","n":137,"chapter":"第二编 物权","title":"居住权合同的一般条款","body":"\u003col>\u003cli>\u003cspan class=\"red\">当事人的姓名或名称和住所\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">住宅的位置\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">居住的条件和要求\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">居住权期限\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">解决争议的方法\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>商量给谁住、哪套房、按什么要求住、住多久，以及出问题怎么处理，再订合同。\u003c/p>","count":5,"chars":37,"gap":false},{"id":"civil-1794843503138","n":138,"chapter":"第二编 物权","title":"居住权的内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">权利：依约占有、使用他人住宅\u003c/span>；受侵可请求物权保护或侵权救济\u003c/li>\u003cli>\u003cspan class=\"blue\">义务\u003c/span>：\u003cspan class=\"blue\">妥善\u003c/span>使用、避免损坏\u003c/li>\u003cli>\u003cspan class=\"blue\">约定有偿设立的，依约支付使用费\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">原则不得出租，合同另有约定除外\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有居住权的人能依约占用房屋满足居住需要，但不能因此把房卖掉。\u003c/p>","count":4,"chars":71,"gap":false},{"id":"civil-1794843503139","n":139,"chapter":"第二编 物权","title":"地役权的内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">依合同目的、方法利用供役地，并作必要附属行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">受侵害可请求物权保护、侵权救济\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行使时尽量减少对供役地的限制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">维护自建必要设施，并依约允许供役地权利人使用\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>为了让自己的地更好用，可以依合同约定经过邻地或使用邻地的设施。\u003c/p>","count":4,"chars":73,"gap":false},{"id":"civil-1794843503140","n":140,"chapter":"第二编 物权","title":"担保物权的概念及其特征（包含从属性的体现）","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：为担保债务清偿，在债务人或第三人特定财产上设立的物权\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">优先受偿\u003c/span>：债权人得依法从担保财产价值\u003cspan class=\"blue\">优先受偿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">物上代位\u003c/span>：担保财产毁损、灭失或被征收等，\u003cspan class=\"blue\">效力\u003c/span>可及保险金、\u003cspan class=\"blue\">赔偿金\u003c/span>或补偿金\u003c/li>\u003cli>\u003cspan class=\"blue\">不可分\u003c/span>：债权未全部清偿前，一般\u003cspan class=\"blue\">可就\u003c/span>担保物全部行权\u003c/li>\u003cli>\u003cspan class=\"blue\">从属\u003c/span>：依附所担保债权，随债权依法\u003cspan class=\"blue\">转移\u003c/span>或消灭\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>欠款到期没还时，担保物权让债权人依法先从担保财产的价值里受偿。\u003c/p>","count":5,"chars":131,"gap":false},{"id":"civil-1794843503141","n":141,"chapter":"第二编 物权","title":"担保物权从属性的概念及其体现","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">从属性\u003c/span>。担保物权是为担保债权受偿而\u003cspan class=\"blue\">设定\u003c/span>的，从属于所担保的债权\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">一（成立）是担保物权的成立以债权的存在为前提\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">二（存在）是担保物权不得与所担保的债权分离而单独存在\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">三（消灭）是所担保的债权如果消灭，担保物权随之消灭\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>担保是为某笔债服务的，债权转移或消灭时，担保通常也跟着变或消灭。\u003c/p>","count":4,"chars":103,"gap":false},{"id":"civil-1794843503142","n":142,"chapter":"第二编 物权","title":"抵押权的特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">性质：通常由约定设立的担保物权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客体\u003c/span>：债务人或第三人提供的\u003cspan class=\"blue\">特定动产\u003c/span>、不动产或财产权利\u003c/li>\u003cli>\u003cspan class=\"blue\">占有\u003c/span>：不\u003cspan class=\"blue\">转移\u003c/span>抵押财产的\u003cspan class=\"blue\">占有\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">效力\u003c/span>：有\u003cspan class=\"blue\">优先受偿\u003c/span>、从属性、不可分性、物上代位及追及\u003cspan class=\"blue\">效力\u003c/span>；动产抵押不得对抗正常经营中付合理价款并取得抵押物的\u003cspan class=\"blue\">买受人\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>抵押一般不用把东西交给债权人，没还钱时他可以依法从东西变价的钱里优先拿。\u003c/p>","count":4,"chars":110,"gap":false},{"id":"civil-1794843503143","n":143,"chapter":"第二编 物权","title":"抵押合同的有效条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">主体：当事人有相应民事行为能力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">意思\u003c/span>：\u003cspan class=\"blue\">意思\u003c/span>表示\u003cspan class=\"blue\">真实\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">内容及标的\u003c/span>：不违反\u003cspan class=\"blue\">强制性\u003c/span>规定和\u003cspan class=\"blue\">公序良俗\u003c/span>，财产不属法定禁止抵押范围\u003c/li>\u003cli>\u003cspan class=\"blue\">形式和效力\u003c/span>：依法\u003cspan class=\"blue\">书面订立\u003c/span>；抵押合同的效力和抵押权是否设立\u003cspan class=\"blue\">分别\u003c/span>判断\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>抵押合同有效和抵押权设立是两步，先看合同本身，再按财产种类判断登记要求。\u003c/p>","count":4,"chars":88,"gap":false},{"id":"civil-1794843503144","n":144,"chapter":"第二编 物权","title":"不得抵押的财产类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">土地所有权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">宅基地、自留地、自留山等集体土地使用权，法定例外除外\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">公益非营利学校、医院等的公益设施\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">权属不明或争议财产\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">查封、扣押、监管财产\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律、行政法规禁止抵押的其他财产\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有些财产关系公益、依法不得流转或权属有争议，不能拿来设抵押。\u003c/p>","count":6,"chars":82,"gap":false},{"id":"civil-1794843503145","n":145,"chapter":"第二编 物权","title":"抵押人的权利与义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">抵押人仍保有所有权，可占有、使用、收益\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">原则可转让抵押物，并须及时通知抵押权人；另有约定依约\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">可依法设用益物权、多个抵押权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不得降低抵押物价值\u003c/span>；危及担保时须恢复价值或提供相应担保\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>抵押以后通常还能用或依法转让财产，但不能故意把价值弄低，让担保落空。\u003c/p>","count":4,"chars":86,"gap":false},{"id":"civil-1794843503146","n":146,"chapter":"第二编 物权","title":"抵押权人的权利与义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">保全：可能削减价值时，有权请求停止、恢复或补充担保\u003c/span>；依法可请求提前清偿\u003c/li>\u003cli>\u003cspan class=\"blue\">受偿与处分\u003c/span>：有权依法\u003cspan class=\"blue\">优先受偿\u003c/span>，可依法随\u003cspan class=\"blue\">债权转让\u003c/span>抵押权，或放弃抵押权、顺位\u003c/li>\u003cli>\u003cspan class=\"blue\">转让价款\u003c/span>：能\u003cspan class=\"blue\">证明转让\u003c/span>损害抵押权的，可请求将价款提前清偿或\u003cspan class=\"blue\">提存\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">义务\u003c/span>：不得妨碍\u003cspan class=\"blue\">抵押人\u003c/span>正常行使所有权\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>债权人可要求维护抵押物价值，债务到期没还时可依法从它的价值受偿。\u003c/p>","count":4,"chars":118,"gap":false},{"id":"civil-1794843503147","n":147,"chapter":"第二编 物权","title":"保全抵押权的措施","body":"\u003col>\u003cli>\u003cspan class=\"red\">包括防止抵押财产价值减少的请求权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">2恢复抵押财产价值的请求权或增加担保的请求权\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>抵押人的行为让抵押物缩水，债权人可要求停下、恢复价值或补一份担保。\u003c/p>","count":2,"chars":38,"gap":false},{"id":"civil-1794843503148","n":148,"chapter":"第二编 物权","title":"抵押权的顺位","body":"\u003col>\u003cli>\u003cspan class=\"red\">已登记抵押按登记先后清偿\u003c/span>\u003cspan class=\"blue\">；登记优先未登记\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">均未登记，按债权比例清偿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">同一动产抵押、质押按公示先后；留置通常优先\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">动产价款抵押在交付后10日内登记\u003c/span>，依法可优先于其他\u003cspan class=\"blue\">担保物权\u003c/span>，但不得对抗留置\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>同一物抵给多人时，谁先受偿主要看依法登记的先后，再看未登记等特殊情况。\u003c/p>","count":4,"chars":90,"gap":false},{"id":"civil-1794843503149","n":149,"chapter":"第二编 物权","title":"实现抵押权的条件与方式","body":"\u003col>\u003cli>\u003cspan class=\"red\">抵押权有效存在\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">发生可以实现抵押权的法定情形或约定情形\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">实现方式\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">协议折价，取得抵押物所有权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">拍卖、变卖\u003c/span>，如果\u003cspan class=\"blue\">无法\u003c/span>达成折价协议，抵押权人可以请求\u003cspan class=\"blue\">人民法院\u003c/span>拍卖、变卖抵押财产\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>真到还款期限没还，或出现约定事由，才按规定折价、拍卖或变卖抵押物受偿。\u003c/p>","count":5,"chars":81,"gap":false},{"id":"civil-1794843503150","n":150,"chapter":"第二编 物权","title":"最高额抵押的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：在预定最高债权额内，担保一定期间内连续发生的债权\u003c/span>；经同意可纳入设立前债权\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">特征\u003c/span>：债权确定前数额不固定；只在最高额内\u003cspan class=\"blue\">优先受偿\u003c/span>；不以某一笔具体债权为前提，个别债权消灭不当然导致\u003cspan class=\"blue\">抵押权\u003c/span>消灭；确定前部分\u003cspan class=\"blue\">债权转让\u003c/span>，通常不随之转让，当事人另有约定除外\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>银行可先约好一段时间和最高限额，以一份抵押担保这期间连续发生的若干笔债。\u003c/p>","count":2,"chars":121,"gap":false},{"id":"civil-1794843503151","n":151,"chapter":"第二编 物权","title":"最高额抵押中确定担保债权的情形","body":"\u003col>\u003cli>\u003cspan class=\"red\">债务人、抵押人被宣告破产或解散的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">抵押权人知道或应知道抵押财产被查封、扣押的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">约定的债权确定期间届满的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">没有约定债权确定期间或约定不明确时\u003c/span>，抵押权人或抵押人自最高额抵押权设立起满\u003cspan class=\"blue\">两年\u003c/span>后请求确定债权的\u003c/li>\u003cli>\u003cspan class=\"blue\">新的债权不可能发生的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律规定债权确定的其他情形\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>债权确定后，原来能继续进担保范围的口子就关上，按已确定的债权清算。\u003c/p>","count":6,"chars":119,"gap":false},{"id":"civil-1794843503152","n":152,"chapter":"第二编 物权","title":"质权的特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">质权是约定的担保物权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">质权的客体是债务人或第三人提供的动产或权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">质权是转移占有的担保物权\u003c/span>，质押\u003cspan class=\"blue\">期间\u003c/span>，质押财产转由质权人占有\u003c/li>\u003cli>质权有担保物权的优先受偿性、从属性、\u003cspan class=\"blue\">不可分性\u003c/span>、物上\u003cspan class=\"blue\">代位性\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>质权靠依法控制担保物或按规定登记权利，欠债不还时可以优先受偿。\u003c/p>","count":4,"chars":88,"gap":false},{"id":"civil-1794843503153","n":153,"chapter":"第二编 物权","title":"动产质权人的权利与义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">权利：占有质物\u003c/span>；另有约定除外\u003cspan class=\"blue\">可收\u003c/span>孳息；依法\u003cspan class=\"blue\">优先受偿\u003c/span>；质物因\u003cspan class=\"blue\">不可\u003c/span>归责于己的原因面临明显减值时，可要求补担保，不补可依法变价并提前清偿或提存\u003c/li>\u003cli>\u003cspan class=\"blue\">义务\u003c/span>：妥善保管；\u003cspan class=\"blue\">不得\u003c/span>擅自使用、处分或转质；依请求及时行权；债务清偿后返还质物；违反\u003cspan class=\"blue\">义务\u003c/span>造成\u003cspan class=\"blue\">损失\u003c/span>应赔偿\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>拿着别人质押的物要好好保管，不能乱用或乱卖，债务没还时才能依法处理。\u003c/p>","count":2,"chars":118,"gap":false},{"id":"civil-1794843503154","n":154,"chapter":"第二编 物权","title":"动产出质人的权利与义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">权利：保有所有权\u003c/span>；质物\u003cspan class=\"blue\">面临\u003c/span>因质权人行为\u003cspan class=\"blue\">毁损\u003c/span>、灭失时，可依法要求提存或提前还债取回；可请求及时行使质权，依法请求法院变价；清偿后可请求返还\u003c/li>\u003cli>\u003cspan class=\"blue\">义务\u003c/span>：按约交付质物，不妨碍质权人行权；质物瑕疵造成质权人其他财产\u003cspan class=\"blue\">损失\u003c/span>时依法\u003cspan class=\"blue\">赔偿\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>把东西交作质押后仍可能是主人，还清债务可要回，也能要求质权人妥善保管。\u003c/p>","count":2,"chars":107,"gap":false},{"id":"civil-1794843503155","n":155,"chapter":"第二编 物权","title":"权利质权的设立条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">有权利凭证的证券质权，依法交付凭证设立\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">无凭证有价证券及法律规定的其他权利质权\u003c/span>，依法办理相应登记设立\u003c/li>\u003cli>\u003cspan class=\"blue\">须区分交付型、登记型，不能只签质押合同就认定质权成立\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>某项权利能否质押，先看法律允许不允许，再按它属于哪类办交付或登记。\u003c/p>","count":3,"chars":75,"gap":false},{"id":"civil-1794843503156","n":156,"chapter":"第二编 物权","title":"留置权的特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">担保性质：依法发生，属于法定担保物权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客体\u003c/span>：债权人合法占有的动产\u003c/li>\u003cli>\u003cspan class=\"blue\">与占有的关系\u003c/span>：留置权不具有\u003cspan class=\"blue\">追及力\u003c/span>，丧失占有即消灭\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>修车人依法拿着车，车主欠修理费时可依法暂不交车，留置权不靠合同事先约定产生。\u003c/p>","count":3,"chars":55,"gap":false},{"id":"civil-1794843503157","n":157,"chapter":"第二编 物权","title":"留置权成立的条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">债权人已经合法占有属于债务人所有的动产\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">债权人留置的动产，应与债权属于同一法律关系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">债务已届清偿期而债务人未履行债务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">符合法律规定和当事人的约定并且不违背公序良俗\u003c/span>，同时与\u003cspan class=\"blue\">留置人\u003c/span>承担的义务不相抵触\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>得是债权已到期、债权人已合法占有债务人的动产，并满足同一关系等法定条件。\u003c/p>","count":4,"chars":94,"gap":false},{"id":"civil-1794843503158","n":158,"chapter":"第二编 物权","title":"留置权人的权利与义务","body":"\u003col>\u003cli>\u003cspan class=\"red\">权利：占有留置物、收孳息、请求必要保管费，债务到期且经过适用宽限期仍未履行时依法优先受偿\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">义务\u003c/span>：妥善保管，\u003cspan class=\"blue\">不得\u003c/span>擅自使用、\u003cspan class=\"blue\">出租\u003c/span>或处分；依法及时行使留置权，担保消灭后返还\u003c/li>\u003cli>\u003cspan class=\"blue\">期限\u003c/span>：宽限期有约定按约定，未约定通常至少\u003cspan class=\"blue\">60日\u003c/span>，不易保管的鲜活易腐物除外\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>留置人可以依法留物受偿，但拿着物期间要保管好，也不能绕开法定处理程序。\u003c/p>","count":3,"chars":118,"gap":false},{"id":"civil-1794843503159","n":159,"chapter":"第二编 物权","title":"留置权消灭的事由","body":"\u003col>\u003cli>\u003cspan class=\"red\">一般事由4（两消灭两态度）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主债消灭\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">担保物权实现\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">放弃担保物权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">担保财产消灭并且无代位物\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">留置权人接受债务人另行提供的担保\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">留置权人丧失对留置财产的占有\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>债权没了、原留置物不再占有，或接受替代担保时，原来的留置权可能结束。\u003c/p>","count":7,"chars":71,"gap":false},{"id":"civil-1794843503160","n":160,"chapter":"第二编 物权","title":"占有的分类","body":"\u003col>\u003cli>\u003cspan class=\"red\">按有无本权：有权占有、无权占有\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按无权占有人的主观状态\u003c/span>：善意占有、恶意占有\u003c/li>\u003cli>\u003cspan class=\"blue\">按控制方式\u003c/span>：\u003cspan class=\"blue\">直接\u003c/span>占有、间接占有\u003c/li>\u003cli>\u003cspan class=\"blue\">按是否有所有的意思\u003c/span>：\u003cspan class=\"blue\">自主\u003c/span>占有、他主占有\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>同样东西在手，要分是自己拿还是通过别人控制、是否有权、是否知道自己无权。\u003c/p>","count":4,"chars":70,"gap":false},{"id":"civil-1794843503161","n":161,"chapter":"第二编 物权","title":"善意占有与恶意占有的概念及其区分意义","body":"\u003col>\u003cli>\u003cspan class=\"red\">简述区分善意占有与恶意占有的意义（两善两恶，1234）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">只有善意占有人方可受到善意取得制度的保护\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">善意占有人的必要费用，可以要求权利人返还\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">恶意占有人应承担使用损害赔偿责任\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">毁损灭失\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">无论善意恶意均应返还保险金、赔偿金或补偿金\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">恶意占有人还应赔偿损失\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>不知道也不应当知道自己无权占有，和明知无权仍拿着，返还收益及赔偿的规则不同。\u003c/p>","count":7,"chars":119,"gap":false},{"id":"civil-1794843503162","n":162,"chapter":"第二编 物权","title":"占有的效力","body":"\u003col>\u003cli>\u003cspan class=\"red\">权利推定效力：如果占有人在占有物上行使权利，则推定其享有此项权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">权利取得效力\u003c/span>：占有人在符合\u003cspan class=\"blue\">法定\u003c/span>要件时可以取得本权\u003c/li>\u003cli>\u003cspan class=\"blue\">保护效力\u003c/span>：占有人的占有\u003cspan class=\"blue\">无论\u003c/span>是否为\u003cspan class=\"blue\">有权占有\u003c/span>，均可以对抗他人的侵犯\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>法律会保护实际占有的秩序，但占着东西不等于一定拥有所有权。\u003c/p>","count":3,"chars":87,"gap":false},{"id":"civil-1794843503163","n":163,"chapter":"第二编 物权","title":"占有的保护","body":"\u003col>\u003cli>\u003cspan class=\"red\">占有的保护（物权保护中剔除确认物权和恢复原状5-2）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">占有物返还请求权\u003c/span>：占有人有权请求\u003cspan class=\"blue\">返还原物\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">排除妨害和消除危险请求权\u003c/span>：在妨害已经发生或有妨害之虞时，占有人有权请求排除妨害或消除危险\u003c/li>\u003cli>\u003cspan class=\"blue\">损害赔偿请求权\u003c/span>：因侵占或妨害\u003cspan class=\"blue\">造成\u003c/span>损害的，占有人有权依法请求损害赔偿\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>东西被抢走可以依法要回，被人妨碍控制也可要求排除，超时还要看占有保护规则。\u003c/p>","count":4,"chars":123,"gap":false},{"id":"civil-1794843503164","n":164,"chapter":"第三编 债与合同","title":"债的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">债：特定当事人间，一方可请求另一方为特定给付的民事法律关系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依法或依法律行为产生\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">体现特定财产利益\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主体、给付对象特定，债权原则具有相对性\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一人可以依法要求另一人交钱、交货或不做某事，这两边形成债的关系。\u003c/p>","count":4,"chars":66,"gap":false},{"id":"civil-1794843503165","n":165,"chapter":"第三编 债与合同","title":"债权的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：债权人请求特定债务人为一定给付的权利\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">特征\u003c/span>：相对性，只能向特定债务人主张；请求性，不能\u003cspan class=\"blue\">直接支配\u003c/span>给付物；\u003cspan class=\"blue\">任意性\u003c/span>，可在法律允许范围依约设定；非排他性，同一标的可存在数个债权；\u003cspan class=\"blue\">平等性\u003c/span>，普通债权原则上不因先后改变效力\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>债权让你能向特定的人要履行，不能拿着合同去要求不相干的人交货。\u003c/p>","count":2,"chars":106,"gap":false},{"id":"civil-1794843503166","n":166,"chapter":"第三编 债与合同","title":"债权的权能","body":"\u003col>\u003cli>\u003cspan class=\"red\">请求权能：请债务人履行，必要时依法请求强制执行\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">受领及保持\u003c/span>：有权\u003cspan class=\"blue\">接受\u003c/span>给付并依法保有由此取得的利益\u003c/li>\u003cli>\u003cspan class=\"blue\">保全\u003c/span>：依法行使\u003cspan class=\"blue\">代位权\u003c/span>或撤销权等，避免债权落空\u003c/li>\u003cli>\u003cspan class=\"blue\">处分\u003c/span>：可依法让与、\u003cspan class=\"blue\">免除\u003c/span>、抵销或设立债权质权\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>债权人可以依法请求履行、收下给付，并在合适条件下处分或保全债权。\u003c/p>","count":4,"chars":90,"gap":false},{"id":"civil-1794843503167","n":167,"chapter":"第三编 债与合同","title":"债务的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">债务：债务人依法律或约定，向债权人履行给付的义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">期限确定或可确定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">债务人和给付内容特定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">履行具有法律强制保障，不履行可依法追责\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>欠别人钱、货或约定的行为，就负有向特定人履行的义务。\u003c/p>","count":4,"chars":61,"gap":false},{"id":"civil-1794843503168","n":168,"chapter":"第三编 债与合同","title":"债务的类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">主给付义务：决定债的类型的基本义务\u003c/span>，如卖方交货\u003c/li>\u003cli>\u003cspan class=\"blue\">从给付义务\u003c/span>：\u003cspan class=\"blue\">辅助\u003c/span>主给付实现，如交证明文件\u003c/li>\u003cli>\u003cspan class=\"blue\">附随义务\u003c/span>：诚信产生的协助、保护、保密等\u003c/li>\u003cli>\u003cspan class=\"blue\">不真正义务\u003c/span>：无对方履行请求权，但\u003cspan class=\"blue\">不履行\u003c/span>会使自己处于不利地位\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有的债让你给钱交物，有的让你做或不得做某事，还要看能否依法强制履行。\u003c/p>","count":4,"chars":91,"gap":false},{"id":"civil-1794843503169","n":169,"chapter":"第三编 债与合同","title":"债的发生原因","body":"\u003col>\u003cli>\u003cspan class=\"red\">合同：依约在当事人之间产生债\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">侵权\u003c/span>：致害人与\u003cspan class=\"blue\">受害人\u003c/span>之间产生债\u003c/li>\u003cli>\u003cspan class=\"blue\">无因管理\u003c/span>：\u003cspan class=\"blue\">管理人\u003c/span>与受益人之间产生债\u003c/li>\u003cli>\u003cspan class=\"blue\">不当得利\u003c/span>：得利人与\u003cspan class=\"blue\">受损人\u003c/span>之间产生债\u003c/li>\u003cli>\u003cspan class=\"blue\">其他事实\u003c/span>：依法可由缔约过失、单方\u003cspan class=\"blue\">允诺\u003c/span>等产生债\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>欠钱不一定是借来的，签合同、伤了人、误收别人款或替人办必要事务都可能产生债。\u003c/p>","count":5,"chars":85,"gap":false},{"id":"civil-1794843503170","n":170,"chapter":"第三编 债与合同","title":"合同的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">合同：民事主体设立、变更、终止民事权利义务关系的协议\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">属于民事法律行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">两方以上当事人意思表示一致\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">目的在于发生民事法律效果，而非单纯情谊承诺\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>合同是几方商量一致，用来建立、变更或结束民事权利义务关系的协议。\u003c/p>","count":4,"chars":68,"gap":false},{"id":"civil-1794843503171","n":171,"chapter":"第三编 债与合同","title":"合同的分类","body":"\u003col>\u003cli>\u003cspan class=\"red\">按双方是否互负给付义务：单务、双务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按受益对象\u003c/span>：为自己\u003cspan class=\"blue\">利益\u003c/span>、为第三人\u003cspan class=\"blue\">利益\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按有无法定或约定形式要求\u003c/span>：要式、不要式\u003c/li>\u003cli>\u003cspan class=\"blue\">按法律是否规定专门类型\u003c/span>：\u003cspan class=\"blue\">有名\u003c/span>、无名\u003c/li>\u003cli>\u003cspan class=\"blue\">按成立是否须实际交付\u003c/span>：诺成、\u003cspan class=\"blue\">实践\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">其他常见标准\u003c/span>：有无对价分有偿、\u003cspan class=\"blue\">无偿\u003c/span>；能否独立存在分主、从合同\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>可以按有没有法律名称、要不要付出对价、是不是双方都有义务等标准给合同分类。\u003c/p>","count":6,"chars":117,"gap":false},{"id":"civil-1794843503172","n":172,"chapter":"第三编 债与合同","title":"为第三人利益的合同的概念及其特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：当事人约定由第三人取得合同利益的合同\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">特征\u003c/span>：第三人\u003cspan class=\"blue\">不是\u003c/span>合同当事人，\u003cspan class=\"blue\">依约\u003c/span>受益而不负合同义务，可以拒绝受益\u003c/li>\u003cli>\u003cspan class=\"blue\">分类与效力\u003c/span>：一般约定向第三人履行时，债务人原则上向债权人承担\u003cspan class=\"blue\">违约责任\u003c/span>；法律或当事人约定第三人可直接请求，且其未在\u003cspan class=\"blue\">合理期限\u003c/span>拒绝的，第三人可依法请求履行和相应\u003cspan class=\"blue\">违约责任\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>两方签约让第三人受益，第三人能不能直接求履行，要看法律规定或约定。\u003c/p>","count":3,"chars":134,"gap":false},{"id":"civil-1794843503173","n":173,"chapter":"第三编 债与合同","title":"合同成立的要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">一般要件：有双方或多方当事人，就合同主要条款达成合意，内容明确或可确定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">特别要件\u003c/span>：部分合同依法或依约需要特定形式、\u003cspan class=\"blue\">实际交付\u003c/span>等\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>双方对主要内容有相合的意思，必要时方式或交付符合要求，合同才成立。\u003c/p>","count":2,"chars":61,"gap":false},{"id":"civil-1794843503174","n":174,"chapter":"第三编 债与合同","title":"要约的概念及其条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">要约：希望与他人订立合同的意思表示\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">由特定人向相对人发出\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">内容具体确定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">以订立合同为目的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">表明一经承诺，要约人即受其约束\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>你说清卖什么、多少钱，并表示对方一同意就成交，通常就具备要约的重要条件。\u003c/p>","count":5,"chars":56,"gap":false},{"id":"civil-1794843503175","n":175,"chapter":"第三编 债与合同","title":"要约与要约邀请的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">目的不同：要约的目的是获得对方的承诺以成立合同\u003c/span>；要约邀请的目的是引出对方的要约\u003c/li>\u003cli>\u003cspan class=\"blue\">条件不同\u003c/span>：要约的条件（4）；要约邀请\u003cspan class=\"blue\">无须\u003c/span>具备前述条件，只要\u003cspan class=\"blue\">邀请人\u003c/span>足以确定即可\u003c/li>\u003cli>\u003cspan class=\"blue\">效力不同\u003c/span>：要约人须受要约约束；要约邀请没有法律效力\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>菜单或广告通常是请别人来出价；只要对方答应你就愿被约束的明确报价才是要约。\u003c/p>","count":3,"chars":102,"gap":false},{"id":"civil-1794843503176","n":176,"chapter":"第三编 债与合同","title":"承诺的概念及其条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">承诺：受要约人同意要约的意思表示\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">由受要约人或代理人向要约人作出\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">内容与要约一致，实质变更是新要约\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须在承诺期内依法到达，迟到按法定规则处理\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">原则用通知；依交易习惯、要约可用行为\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>承诺是受要约人在期限内接受原条件，若把关键条款改了，通常是新要约。\u003c/p>","count":5,"chars":85,"gap":false},{"id":"civil-1794843503177","n":177,"chapter":"第三编 债与合同","title":"承诺的生效时间","body":"\u003col>\u003cli>\u003cspan class=\"red\">默认规则：需要通知的承诺，适用意思表示生效规则：对话时相对人知道内容生效\u003c/span>；非\u003cspan class=\"blue\">对话到达相对人\u003c/span>生效\u003c/li>\u003cli>\u003cspan class=\"blue\">数据电文\u003c/span>：指定\u003cspan class=\"blue\">系统\u003c/span>的，进入\u003cspan class=\"blue\">系统\u003c/span>时生效；未指定的，相对人知道或应知进入其\u003cspan class=\"blue\">系统\u003c/span>时生效，另有约定从约定\u003c/li>\u003cli>\u003cspan class=\"blue\">无需通知\u003c/span>：依\u003cspan class=\"blue\">交易习惯\u003c/span>或要约要求作出承诺行为时生效\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>答应不是心里决定就算，通常要让对方收到；以行为作承诺时看规则认定。\u003c/p>","count":3,"chars":119,"gap":false},{"id":"civil-1794843503178","n":178,"chapter":"第三编 债与合同","title":"合同的形式","body":"\u003col>\u003cli>\u003cspan class=\"red\">口头形式：经谈话、电话等口头达成\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">书面形式\u003c/span>：合同书、\u003cspan class=\"blue\">信件\u003c/span>和能有形\u003cspan class=\"blue\">表现\u003c/span>且可随时查用的数据电文等\u003c/li>\u003cli>\u003cspan class=\"blue\">其他形式\u003c/span>：可以依行为等表示\u003cspan class=\"blue\">合意\u003c/span>；法律、\u003cspan class=\"blue\">行政法规\u003c/span>规定或当事人约定\u003cspan class=\"blue\">书面形式\u003c/span>的，按相应规则判断\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>合同可以口头、书面或用其他形式订立，但法律或双方要求特殊形式时要照办。\u003c/p>","count":3,"chars":89,"gap":false},{"id":"civil-1794843503179","n":179,"chapter":"第三编 债与合同","title":"格式条款的概念及其无效情形","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">格式条款的概念：格式条款指当事人为了重复使用而预先拟订，并在订立合同时未与对方协商的条款\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">无效情形\u003c/span>\u003c/li>\u003cli>造成对方\u003cspan class=\"blue\">人身损害\u003c/span>的、因故意或\u003cspan class=\"blue\">重大过失\u003c/span>造成对方财产损失的免责条款\u003c/li>\u003cli>提供格式条款一方不合理地免除或\u003cspan class=\"blue\">减轻\u003c/span>其责任、\u003cspan class=\"blue\">加重\u003c/span>对方责任、限制对方主要权利\u003c/li>\u003cli>\u003cspan class=\"blue\">提供格式条款一方排除对方主要权利\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>商家先印好条款供反复使用，若依法属于不合理免除己方责任等情形，条款可无效。\u003c/p>","count":5,"chars":131,"gap":false},{"id":"civil-1794843503180","n":180,"chapter":"第三编 债与合同","title":"格式条款的解释","body":"\u003col>\u003cli>\u003cspan class=\"red\">格式条款与非格式条款冲突的，应采用非格式条款\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">格式条款的理解有争议的，应按照通常理解解释\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">格式条款的通常解释有两种以上的\u003c/span>，应\u003cspan class=\"blue\">作出\u003c/span>不利于格式条款的提供方的解释\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>印好的条款有歧义时通常作不利于提供者的解释，另行商量的条款优先。\u003c/p>","count":3,"chars":76,"gap":false},{"id":"civil-1794843503181","n":181,"chapter":"第三编 债与合同","title":"合同有效的条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">当事人缔约时有相应缔约能力（行为能力）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">当事人的意思表示真实\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不违反法律、行政法规的强制性规定与公序良俗\u003c/span>\u003c/li>\u003cli>法律、行政法规规定应\u003cspan class=\"blue\">办理\u003c/span>批准、\u003cspan class=\"blue\">登记\u003c/span>等手续才能生效的合同，在\u003cspan class=\"blue\">办理\u003c/span>相关手续后生效\u003c/li>\u003cli>\u003cspan class=\"blue\">附生效条件的合同自条件成就时生效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">附生效期限的合同自期限届至时生效\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>签好合同不等于一定有效，还要看主体能力、真实意思和内容是否合法。\u003c/p>","count":6,"chars":120,"gap":false},{"id":"civil-1794843503182","n":182,"chapter":"第三编 债与合同","title":"合同履行的一般规则","body":"\u003col>\u003cli>\u003cspan class=\"red\">全面履行：依约交付标的，符合数量、质量、期限、地点和方式\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">诚实信用\u003c/span>：依合同性质、目的和\u003cspan class=\"blue\">交易习惯\u003c/span>履行通知、协助、保密等义务\u003c/li>\u003cli>\u003cspan class=\"blue\">保护生态\u003c/span>：履行时避免浪费\u003cspan class=\"blue\">资源\u003c/span>、污染环境和破坏生态\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>履行要按约把正事做完，也要按诚信原则通知、协助、保密并避免浪费。\u003c/p>","count":3,"chars":83,"gap":false},{"id":"civil-1794843503183","n":183,"chapter":"第三编 债与合同","title":"合同漏洞填补规则","body":"\u003col>\u003cli>\u003cspan class=\"red\">先补充协议，再相关条款、交易习惯，仍不明依法补足\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">质量\u003c/span>：强制国标→\u003cspan class=\"blue\">推荐\u003c/span>国标→行业→通常或适合目的标准\u003c/li>\u003cli>\u003cspan class=\"blue\">价款\u003c/span>：订约时履行地\u003cspan class=\"blue\">市价\u003c/span>，依法定价除外\u003c/li>\u003cli>\u003cspan class=\"blue\">地点\u003c/span>：货币收款地、不动产\u003cspan class=\"blue\">所在地\u003c/span>、其他履行方地\u003c/li>\u003cli>\u003cspan class=\"blue\">期限留必要准备时间\u003c/span>，方式利于目的；\u003cspan class=\"blue\">费用\u003c/span>履行方负担，债权人增费由其承担\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>合同没写清，先看能否补约，再从相关条款和交易习惯找答案，最后按法定规则补。\u003c/p>","count":5,"chars":123,"gap":false},{"id":"civil-1794843503184","n":184,"chapter":"第三编 债与合同","title":"选择之债中选择权人的确定顺序","body":"\u003col>\u003cli>\u003cspan class=\"red\">依法、当事人的约定或交易习惯确定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">标的有多项而债务人只需履行其中一项的\u003c/span>，债务人享有选择权\u003c/li>\u003cli>\u003cspan class=\"blue\">享有选择权的当事人在约定期限内或履行期限届满未做选择\u003c/span>，经催告后在\u003cspan class=\"blue\">合理期限\u003c/span>内仍未选择的，选择权转移至对方\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>可在几种给付里选一种时，通常债务人来选，但约定、法律或交易习惯可以另作安排。\u003c/p>","count":3,"chars":94,"gap":false},{"id":"civil-1794843503185","n":185,"chapter":"第三编 债与合同","title":"同时履行抗辩权的概念及其构成要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">同时履行抗辩权：指双务合同的当事人在没有约定履行顺序或约定同时履行时，一方当事人在对方未完成对待给付时，可以拒绝履行自己之债务的权利\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">同时履行抗辩权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">当事人就同一双务合同互负债务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">双方互负的债务均届清偿期\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">对方的对待给付是可能履行的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">对方未履行债务或履行债务不符合约定\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>两边都得同时给，对方没给或给得不对，自己可依法拒绝相应履行。\u003c/p>","count":6,"chars":129,"gap":false},{"id":"civil-1794843503186","n":186,"chapter":"第三编 债与合同","title":"先履行抗辩权的概念及其构成要件","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">先履行抗辩：先履行抗辩权指在当事人互负债务且有先后履行顺序时，应先履行的一方未履行或履行不符合约定，应后履行的一方可以拒绝自己之债务的权利\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">先履行抗辩\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">当事人基于同一双务合同互负债务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">双方债务均已届清偿期\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">一方当事人应先履行义务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">应先履行的一方未履行债务或履行债务不符合约定\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>本来对方该先交货却没交或交得不对，后付钱的人可依法拒绝相应给付。\u003c/p>","count":6,"chars":132,"gap":false},{"id":"civil-1794843503187","n":187,"chapter":"第三编 债与合同","title":"不安抗辩权的概念及其构成要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">不安抗辩：先履行方有确证对方已或可能丧失履行能力，可暂时停履\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须同一双务合同互负债务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主张方应先履行，且其债务已到期\u003c/span>\u003c/li>\u003cli>有确切证据证明对方履行能力\u003cspan class=\"blue\">明显\u003c/span>降低、\u003cspan class=\"blue\">对待\u003c/span>给付有现实危险\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>本应自己先给，但有确切证据表明对方可能还不上，可以先暂停以免吃亏。\u003c/p>","count":4,"chars":83,"gap":false},{"id":"civil-1794843503188","n":188,"chapter":"第三编 债与合同","title":"不安抗辩权的效力","body":"\u003col>\u003cli>\u003cspan class=\"red\">先履行一方有权中止履行，但应及时通知对方\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">对方提供适当担保的，应恢复履行\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">中止履行后\u003c/span>，对方在\u003cspan class=\"blue\">合理期限\u003c/span>内未恢复履行能力且未提供适当担保的，视为以自己行为表明不履行\u003cspan class=\"blue\">主要债务\u003c/span>，中止履行的一方可以解除合同并可以请求对方承担\u003cspan class=\"blue\">违约责任\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先履行方暂停后要及时通知，有了合适担保就恢复，对方长期不能恢复才可依法进一步处理。\u003c/p>","count":3,"chars":109,"gap":false},{"id":"civil-1794843503189","n":189,"chapter":"第三编 债与合同","title":"债权人代位权的概念及其要件","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：债务人怠于行使债权或相关从权利，影响到期债权实现时，债权人可用自己名义向法院请求代位行使\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">债权基础\u003c/span>：债权人对债务人、债务人对相对人的债权都应合法存在\u003c/li>\u003cli>\u003cspan class=\"blue\">怠于行使\u003c/span>：债务人不行使该权利，影响债权人到期债权的实现\u003c/li>\u003cli>\u003cspan class=\"blue\">权利范围\u003c/span>：权利应能强制执行且非专属；如扶养费、\u003cspan class=\"blue\">人身损害\u003c/span>赔偿、基本生活保障等\u003cspan class=\"blue\">不得\u003c/span>代位\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>债务人不去向别人要钱，影响你拿回到期债款时，符合法定条件可以替他去主张。\u003c/p>","count":4,"chars":144,"gap":false},{"id":"civil-1794843503190","n":190,"chapter":"第三编 债与合同","title":"专属于债务人自身债权的情形","body":"\u003col>\u003cli>\u003cspan class=\"red\">身份给付：抚养费、赡养费或扶养费请求权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">人身救济\u003c/span>：人身损害赔偿请求权\u003c/li>\u003cli>\u003cspan class=\"blue\">劳动收入\u003c/span>：劳动报酬请求权\u003c/li>\u003cli>\u003cspan class=\"blue\">社会保障\u003c/span>：基本养老\u003cspan class=\"blue\">保险金\u003c/span>、失业\u003cspan class=\"blue\">保险金\u003c/span>、最低生活保障金等\u003c/li>\u003cli>\u003cspan class=\"blue\">其他\u003c/span>：依法专属于债务人自身的\u003cspan class=\"blue\">其他\u003c/span>权利\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有些给付直接养活本人或补偿他的人身损害，普通债权人不能代他主张。\u003c/p>","count":5,"chars":90,"gap":false},{"id":"civil-1794843503191","n":191,"chapter":"第三编 债与合同","title":"债权人撤销权的概念及其要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">债权人撤销权：债务人处分财产影响债权实现，债权人可诉请法院撤销\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">处分须已生效，且妨害债权实现\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">无偿处分通常不要求受益人恶意\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">明显不合理有偿处分等，还须相对人知道或应知损害债权\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>欠债人把财产不当地送掉或转走，影响你收债时，可以依法请求法院撤销相关行为。\u003c/p>","count":4,"chars":84,"gap":false},{"id":"civil-1794843503192","n":192,"chapter":"第三编 债与合同","title":"债权人撤销权中债务人处分财产的行为","body":"\u003col>\u003cli>\u003cspan class=\"red\">债务人实施了一定处分财产行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">债务人的处分行为已生效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">债务人行为影响债权人的债权实现\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有偿行为还需满足主观要件\u003c/span>：在债务人实施影响债权人之债权行为时，其相对人知道或应知道该情形\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>白送、放弃债权和明显不合理低卖等都可能损害债权，但无偿与有偿行为的要求不同。\u003c/p>","count":4,"chars":84,"gap":false},{"id":"civil-1794843503193","n":193,"chapter":"第三编 债与合同","title":"合同内容变更的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">合同内容变更：不换合同主体，只改变原合同的条款\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">以前提合同有效为基础\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">变动限于内容，区别于主体移转\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">变更后合同仍有效，未变部分继续履行\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>改交货日期或价格，是换合同内容，没说清具体改了什么，不能就认定已经变更。\u003c/p>","count":4,"chars":64,"gap":false},{"id":"civil-1794843503194","n":194,"chapter":"第三编 债与合同","title":"债权让与的概念及其条件","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：不改债的内容，由债权人与第三人合意转让债权\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">有效债权\u003c/span>：时效已过、尚未撤销、\u003cspan class=\"blue\">附条件\u003c/span>或期限的债权也可转让\u003c/li>\u003cli>\u003cspan class=\"blue\">可让与\u003c/span>：性质、法律或约定\u003cspan class=\"blue\">禁止转让\u003c/span>的除外\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>债权可以把收款资格转给别人，但要先看它可不可让，通知债务人后才方便向其主张。\u003c/p>","count":3,"chars":71,"gap":false},{"id":"civil-1794843503195","n":195,"chapter":"第三编 债与合同","title":"不可让与的债权的类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">按性质不得让与：抚养赡养等身份债权、基于特定信任等债权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律规定不得转让的不得让与\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">依约不得转让\u003c/span>：\u003cspan class=\"blue\">非金钱债权\u003c/span>不得对抗善意第三人；\u003cspan class=\"blue\">金钱债权\u003c/span>不得对抗第三人\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有些债权跟个人紧紧相连，或法律、约定限制转让，要先按各类限制分别判断。\u003c/p>","count":3,"chars":73,"gap":false},{"id":"civil-1794843503196","n":196,"chapter":"第三编 债与合同","title":"债权让与的对外效力","body":"\u003col>\u003cli>\u003cspan class=\"red\">通知：未通知债务人的，债权转让对债务人不生效\u003c/span>；\u003cspan class=\"blue\">通知\u003c/span>到达后应向受让人履行\u003c/li>\u003cli>\u003cspan class=\"blue\">抗辩\u003c/span>：可向受让人\u003cspan class=\"blue\">主张\u003c/span>其对让与人的\u003cspan class=\"blue\">抗辩\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">抵销\u003c/span>：\u003cspan class=\"blue\">通知\u003c/span>到达时有对让与人的债权且\u003cspan class=\"blue\">不晚\u003c/span>于受让债权\u003cspan class=\"blue\">到期\u003c/span>，或两项债权源于同一合同的，可以\u003cspan class=\"blue\">抵销\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">费用\u003c/span>：因转让\u003cspan class=\"blue\">增加的履行费用\u003c/span>由让与人负担\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>债务人收到债权转让通知后该向新债权人履行，仍可依法提出原来就有的抗辩。\u003c/p>","count":4,"chars":116,"gap":false},{"id":"civil-1794843503197","n":197,"chapter":"第三编 债与合同","title":"债权让与的对内效力","body":"\u003col>\u003cli>\u003cspan class=\"red\">让与协议生效，受让人取得债权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">相关从权利随同移转，专属原债权人的除外\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">让与人须交付债权证明，告知行使权利所需情况\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">让与人依法负债权存在等权利瑕疵担保责任\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>债权在转让双方之间移到新债权人手里，相关从权利通常也随它转过去。\u003c/p>","count":4,"chars":73,"gap":false},{"id":"civil-1794843503198","n":198,"chapter":"第三编 债与合同","title":"免责的债务承担的概念及其条件","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：第三人取代原债务人承受债务，原债务人退出债的关系\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">有效债务\u003c/span>：存在\u003cspan class=\"blue\">确定\u003c/span>、有效的债务\u003c/li>\u003cli>\u003cspan class=\"blue\">可转移性\u003c/span>：债务性质、法律或约定不\u003cspan class=\"blue\">禁止\u003c/span>移转\u003c/li>\u003cli>\u003cspan class=\"blue\">同意\u003c/span>：债务全部或部分转移，须经债权人\u003cspan class=\"blue\">同意\u003c/span>；经\u003cspan class=\"blue\">催告\u003c/span>未表示视为不\u003cspan class=\"blue\">同意\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>新人想完全替原债务人还款，必须依法让债权人同意，原债务人才能退出。\u003c/p>","count":4,"chars":94,"gap":false},{"id":"civil-1794843503199","n":199,"chapter":"第三编 债与合同","title":"免责的债务承担的效力","body":"\u003col>\u003cli>\u003cspan class=\"red\">抗辩：新债务人可用原债务人对债权人的抗辩\u003c/span>；不能用自己对原债务人的\u003cspan class=\"blue\">事由\u003c/span>对抗债权人\u003c/li>\u003cli>\u003cspan class=\"blue\">抵销\u003c/span>：\u003cspan class=\"blue\">不得\u003c/span>拿原债务人对债权人的债权\u003cspan class=\"blue\">抵销\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">担保\u003c/span>：第三人未同意\u003cspan class=\"blue\">继续担保\u003c/span>的，相应\u003cspan class=\"blue\">担保\u003c/span>消灭\u003c/li>\u003cli>\u003cspan class=\"blue\">从债务\u003c/span>：随\u003cspan class=\"blue\">主债务\u003c/span>转移，专属于原债务人的除外\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有效接债后向新债务人追债，他可依法用原来的抗辩，但不是原债务人所有的抵销权。\u003c/p>","count":4,"chars":100,"gap":false},{"id":"civil-1794843503200","n":200,"chapter":"第三编 债与合同","title":"债权债务概括承受的发生原因","body":"\u003col>\u003cli>\u003cspan class=\"red\">前提：当事人拟一起转让在合同中的权利与义务\u003c/span>；拟转移的权利与义务应可以转让\u003c/li>\u003cli>\u003cspan class=\"blue\">同意\u003c/span>：须经合同相对人\u003cspan class=\"blue\">同意\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">适用规则\u003c/span>：分别适用\u003cspan class=\"blue\">债权转让\u003c/span>、债务转移的有关规定\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有时一纸协议让别人接手整份合同，有时继承、合并等事实依法让权利义务一起过去。\u003c/p>","count":3,"chars":71,"gap":false},{"id":"civil-1794843503201","n":201,"chapter":"第三编 债与合同","title":"合同承受与法定承受的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">债权债务概括承受的区别：（合同承受与法定承受\u003c/span>；\u003cspan class=\"blue\">联系人\u003c/span>有想法）\u003c/li>\u003cli>\u003cspan class=\"blue\">承受人可任意/法定第三人\u003c/span>：合同承受中的承受人可为任意第三人；法定承受中的承受人\u003cspan class=\"blue\">只能\u003c/span>是法定第三人\u003c/li>\u003cli>\u003cspan class=\"blue\">协议+同意；无须\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">合同承受需与承受人订立转让协议\u003c/span>，并\u003cspan class=\"blue\">取得\u003c/span>对方当事人的同意；法定承受无须\u003cspan class=\"blue\">取得\u003c/span>承受人同意，且向对方当事人通知或公告即可\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>合同承受来自合意且通常要对方同意，法定承受则由法律规定的事实触发。\u003c/p>","count":4,"chars":141,"gap":false},{"id":"civil-1794843503202","n":202,"chapter":"第三编 债与合同","title":"合同终止的原因","body":"\u003col>\u003cli>\u003cspan class=\"red\">清偿：按约或依法履行债务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">抵销\u003c/span>：双方互负的债在相应\u003cspan class=\"blue\">数额\u003c/span>内相互冲抵\u003c/li>\u003cli>\u003cspan class=\"blue\">提存\u003c/span>：因债权人\u003cspan class=\"blue\">方面\u003c/span>原因难以履行，依法将标的交\u003cspan class=\"blue\">提存\u003c/span>部门\u003c/li>\u003cli>\u003cspan class=\"blue\">免除\u003c/span>：债权人\u003cspan class=\"blue\">免除\u003c/span>债务，但债务人可在\u003cspan class=\"blue\">合理期限\u003c/span>内拒绝\u003c/li>\u003cli>\u003cspan class=\"blue\">混同\u003c/span>：债权债务\u003cspan class=\"blue\">归于\u003c/span>同一人，涉及第三人利益的除外\u003c/li>\u003cli>\u003cspan class=\"blue\">解除及其他事由\u003c/span>：合同依法解除，或发生法律规定、当事人约定的其他终止事由\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>还清、相互抵掉、依法提存、免除、混同或解除等，都可能让原来的合同权利义务结束。\u003c/p>","count":6,"chars":139,"gap":false},{"id":"civil-1794843503203","n":203,"chapter":"第三编 债与合同","title":"代物清偿的概念及其要件","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：债权人受领不同于原定内容的给付，以清偿原债\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">原债\u003c/span>：存在有效\u003cspan class=\"blue\">原债务\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">合意\u003c/span>：双方同意以他种给付替代原定给付\u003c/li>\u003cli>\u003cspan class=\"blue\">受领\u003c/span>：债权人或其他有\u003cspan class=\"blue\">受领\u003c/span>权的人\u003cspan class=\"blue\">实际受领\u003c/span>替代给付\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>原说还钱后来同意用电脑抵账，通常得真的按新约给付，才能把原债清掉。\u003c/p>","count":4,"chars":75,"gap":false},{"id":"civil-1794843503204","n":204,"chapter":"第三编 债与合同","title":"清偿抵充的概念及其效力（抵充顺序）","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：同一债务人欠同一债权人数笔同类债务，给付不够还清，需确定先抵哪笔\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">顺序\u003c/span>：有约定从约定；无约定，由债务人在清偿时指定\u003c/li>\u003cli>\u003cspan class=\"blue\">法定顺序\u003c/span>：未指定时先\u003cspan class=\"blue\">到期\u003c/span>；均\u003cspan class=\"blue\">到期\u003c/span>的，先无担保或担保少，再负担重，再\u003cspan class=\"blue\">到期\u003c/span>早；同时\u003cspan class=\"blue\">到期按比例\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">一笔内部\u003c/span>：没有另约，先费用、再利息、后\u003cspan class=\"blue\">主债务\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>钱不够还所有欠款时，要先定在还哪笔，进入该笔后通常先费用、再利息、最后本金。\u003c/p>","count":4,"chars":125,"gap":false},{"id":"civil-1794843503205","n":205,"chapter":"第三编 债与合同","title":"解除的概念及其特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">合同解除：成立后、履行完毕前，依法或依约提前终止合同效力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须具备约定或法定解除条件\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须通过解除行为，可单方行使或双方协议\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">后果为有关债权债务关系终止，并依法清理已履行部分\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>合同已经有效成立，出现约定或法定情形后，有权人可依法让它提前结束。\u003c/p>","count":4,"chars":82,"gap":false},{"id":"civil-1794843503206","n":206,"chapter":"第三编 债与合同","title":"解除的类型","body":"\u003col>\u003cli>\u003cspan class=\"red\">协议解除：双方一致\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">约定解除\u003c/span>：约定事由出现，权利人可解除\u003c/li>\u003cli>\u003cspan class=\"blue\">法定解除\u003c/span>：出现迟延\u003cspan class=\"blue\">主债务\u003c/span>等法定事由\u003c/li>\u003cli>\u003cspan class=\"blue\">情势变更\u003c/span>：不可预见、非\u003cspan class=\"blue\">商业风险\u003c/span>重大变化，明显不公且协商不成，请法院仲裁变更、解除\u003c/li>\u003cli>\u003cspan class=\"blue\">解约定金\u003c/span>：依法承担约定\u003cspan class=\"blue\">代价\u003c/span>退出\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>可以双方谈好解除，也可以按事先约定或法律赋予的权利单方解除。\u003c/p>","count":5,"chars":99,"gap":false},{"id":"civil-1794843503207","n":207,"chapter":"第三编 债与合同","title":"法定解除的事由","body":"\u003col>\u003cli>\u003cspan class=\"red\">不可抗力：造成合同目的不能实现\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">预期违约\u003c/span>：期限\u003cspan class=\"blue\">届满前\u003c/span>，一方明示或以行为表明不履行主要债务\u003c/li>\u003cli>\u003cspan class=\"blue\">催告后仍迟延\u003c/span>：迟延履行主要债务，催告后合理期限仍未履行\u003c/li>\u003cli>\u003cspan class=\"blue\">根本违约\u003c/span>：迟延或其他违约致合同目的不能实现\u003c/li>\u003cli>\u003cspan class=\"blue\">其他事由\u003c/span>：法律另有规定的解除事由；以\u003cspan class=\"blue\">持续\u003c/span>履行为内容的\u003cspan class=\"blue\">不定期合同\u003c/span>可随时解除，但应在合理期限前通知\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>对方严重违约到原目标不能实现，或其他法定情形出现，才可依法解除。\u003c/p>","count":5,"chars":138,"gap":false},{"id":"civil-1794843503208","n":208,"chapter":"第三编 债与合同","title":"解除的效力","body":"\u003col>\u003cli>\u003cspan class=\"red\">未履行的停止履行\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">已履行的，依合同性质、履行情况可恢复原状、补救并赔损\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">因违约解除，仍可追究违约责任，另有约定除外\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主合同解除\u003c/span>，担保原则仍保障债务人相应民事责任，担保合同另有约定除外\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>解除后还没做的不用再做，已经做过的按合同性质等处理，损失仍可依法追偿。\u003c/p>","count":4,"chars":88,"gap":false},{"id":"civil-1794843503209","n":209,"chapter":"第三编 债与合同","title":"法定抵销的概念及其要件","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：一方依法通知对方，以相互所负的债务在相同数额内冲抵\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">要件\u003c/span>：双方互负债务，标的种类、\u003cspan class=\"blue\">品质\u003c/span>相同，\u003cspan class=\"blue\">主动\u003c/span>抵销方对对方享有到期债权；债务性质、约定或法律禁止抵销的除外\u003c/li>\u003cli>\u003cspan class=\"blue\">行使\u003c/span>：
