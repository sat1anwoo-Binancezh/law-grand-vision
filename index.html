<script id="books" type="application/json">{"version":1,"name":"Law Grand Vision","books":[{"id":"criminal","name":"刑法","limit":150,"items":[{"id":"criminal-1794794335339","n":1,"chapter":"第一章 刑法绪论 / 简答题","title":"刑法的概念和形式","body":"\u003col>\u003cli>\u003cspan class=\"red\">刑法是规定犯罪及其法律后果的法律规范的总和\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">刑法典\u003c/span>：即全面、系统规定犯罪及其法律后果的内容的法典\u003c/li>\u003cli>\u003cspan class=\"blue\">单行刑法\u003c/span>：规定某一类犯罪及其后果或刑法某一事项的法律\u003c/li>\u003cli>\u003cspan class=\"blue\">附属刑法\u003c/span>：在经济、行政等非专门刑事法中附带规定的一些关于犯罪与刑罚或追究刑事责任的条款\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>刑法就是把哪些行为算犯罪、会受什么法律处理写清楚，规定散见于刑法典、单行刑法和其他法律里的刑事条款。\u003c/p>","count":4,"chars":116,"gap":false},{"id":"criminal-1794794335340","n":2,"chapter":"第一章 刑法绪论 / 简答题","title":"刑法的任务","body":"\u003col>\u003cli>\u003cspan class=\"red\">惩罚任务：用刑罚惩治犯罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">保护任务\u003c/span>：保卫国家安全、政权和社会主义制度，保护\u003cspan class=\"blue\">公私财产\u003c/span>、公民人身和民主等权利，维护\u003cspan class=\"blue\">社会秩序和经济秩序\u003c/span>，保障社会主义建设\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>刑法用惩罚犯罪来保护国家、社会和个人的合法权益。\u003c/p>","count":2,"chars":72,"gap":false},{"id":"criminal-1794794335341","n":3,"chapter":"第一章 刑法绪论 / 简答题","title":"刑法的机能","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">刑法的机能，指刑法能产生的积极作用\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">规制机能\u003c/span>：对人的行为进行规制或约束的机能\u003c/li>\u003cli>\u003cspan class=\"blue\">保护机能\u003c/span>：即保护国家、社会和个人法益的机能\u003c/li>\u003cli>\u003cspan class=\"blue\">保障机能\u003c/span>：即保障公民不受国家刑罚权的非法侵害并保障犯罪人不受刑法规定之外的刑罚处罚的功能\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>刑法事先告诉大家什么不能做，出了事保护受害的法益，也防止国家乱定罪、乱用刑。\u003c/p>","count":4,"chars":102,"gap":false},{"id":"criminal-1794794335342","n":4,"chapter":"第一章 刑法绪论 / 简答题","title":"刑法的解释","body":"\u003col>\u003cli>\u003cspan class=\"red\">刑法解释：阐明刑法条文含义\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按效力\u003c/span>：\u003cspan class=\"blue\">立法解释\u003c/span>、\u003cspan class=\"blue\">司法解释\u003c/span>、\u003cspan class=\"blue\">学理解释\u003c/span>；前两者依法有约束力，\u003cspan class=\"blue\">学理解释\u003c/span>无此效力\u003c/li>\u003cli>\u003cspan class=\"blue\">按方法\u003c/span>：\u003cspan class=\"blue\">文理解释\u003c/span>看字面；\u003cspan class=\"blue\">论理解释\u003c/span>联系精神目的，含扩大、缩小、当然、历史、比较、\u003cspan class=\"blue\">目的解释\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>看谁来解释，可分立法、司法和学理解释，看怎么解释，则分按字面和按道理解释。\u003c/p>","count":3,"chars":93,"gap":false},{"id":"criminal-1794794335343","n":5,"chapter":"第一章 刑法绪论 / 简答题","title":"罪刑法定原则的基本内容与体现","body":"\u003col>\u003cli>\u003cspan class=\"red\">罪刑法定：法无明文不为罪、不处罚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须预先法定；禁止不利事后法、类推、绝对不确定刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">规则明确，犯罪范围、刑罚适当，不得残酷过重\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">总则、分则依法规定构成刑罚\u003c/span>，\u003cspan class=\"blue\">司法\u003c/span>严格依法解释定罪；新法有利可追溯\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>罪和刑都得由法律事先写清，立法不能含糊或过重，司法不能拿相似条文凑罪名。\u003c/p>","count":4,"chars":92,"gap":false},{"id":"criminal-1794794335344","n":6,"chapter":"第一章 刑法绪论 / 简答题","title":"罪责刑相适应原则的基本内容与体现","body":"\u003col>\u003cli>\u003cspan class=\"red\">罪责刑相适应：刑罚轻重应与所犯罪行和承担的刑事责任相适应\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">看客观危害\u003c/span>：根据行为及结果对社会的实际危害定轻重\u003c/li>\u003cli>\u003cspan class=\"blue\">看人身危险性\u003c/span>：也考虑主观恶性和再犯危险\u003c/li>\u003cli>\u003cspan class=\"blue\">总则要求按犯罪事实、性质、情节和社会危害程度依法量刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">累犯从重且不得缓刑、假释\u003c/span>，未成年人、自首、立功等依法从宽\u003c/li>\u003cli>\u003cspan class=\"blue\">分则按各罪性质、情节和危害规定不同的法定刑\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>判多重既看事情害了多少，也看人有多大过错和再犯风险，总则定量刑规则、分则给各罪定刑档。\u003c/p>","count":6,"chars":146,"gap":false},{"id":"criminal-1794794335345","n":7,"chapter":"第一章 刑法绪论 / 简答题","title":"我国刑法关于空间效力的规定","body":"\u003col>\u003cli>\u003cspan class=\"red\">以属地为主，属人、保护、普遍管辖为补充\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">属地\u003c/span>：行为或结果一部分在我国领域内，原则上适用我国刑法\u003c/li>\u003cli>\u003cspan class=\"blue\">属人\u003c/span>：中国公民境外犯罪原则上适用；法定\u003cspan class=\"blue\">最高刑3年以下\u003c/span>可不追究，\u003cspan class=\"blue\">国家工作人员\u003c/span>、军人不例外\u003c/li>\u003cli>\u003cspan class=\"blue\">保护\u003c/span>：境外外国人侵害我国或公民，\u003cspan class=\"blue\">最低刑3年以上\u003c/span>且当地也处罚\u003c/li>\u003cli>\u003cspan class=\"blue\">普遍\u003c/span>：按条约义务管辖，依我国刑法定罪\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先看行为或结果是否在我国，若都不在，再看人是不是我国公民、是否侵害我国利益或是否有条约管辖。\u003c/p>","count":5,"chars":136,"gap":false},{"id":"criminal-1794794335346","n":8,"chapter":"第一章 刑法绪论 / 简答题","title":"刑法溯及力的概念和学说","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">刑法的溯及力问题，指刑法对生效以前的行为是否适用的问题\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">从旧原则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">从旧兼从轻原则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">从新原则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">从新兼从轻原则\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>新旧法交替时，关键是看过去做的事用哪部法，四种说法分别偏向旧法、新法或其中较轻的一部。\u003c/p>","count":5,"chars":49,"gap":false},{"id":"criminal-1794794335347","n":9,"chapter":"第一章 刑法绪论 / 简答题","title":"简述我国《刑法》第12 条关于刑法溯及力的规定","body":"\u003col>\u003cli>\u003cspan class=\"red\">我国刑法溯及力采从旧兼从轻原则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">“处刑较轻”\u003c/span>，指刑法对某种犯罪规定的刑罚即法定刑比修订前刑法规定的刑罚要轻，不指法院判处的宣告刑较轻\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>新法生效前的事原则上用旧法，新法不定罪或处罚更轻就用新法，已经生效的旧判决继续有效。\u003c/p>","count":2,"chars":65,"gap":false},{"id":"criminal-1794794335348","n":10,"chapter":"第一章 刑法绪论 / 法条分析题","title":"罪刑法定","body":"\u003col>\u003cli>\u003cspan class=\"red\">罪刑法定：法无明文规定不为罪、不处罚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">内容\u003c/span>：法定化，\u003cspan class=\"blue\">禁止事后法\u003c/span>和类推，禁止绝对不确定刑，明确性、适当性\u003c/li>\u003cli>\u003cspan class=\"blue\">此处“法”仅指全国人大及其常委会制定的法律\u003c/span>，不含行政法规、地方性法规\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>刑法第3条给定罪划了线，只有法律事先明文规定才能按罪处罚，行政法规和地方性法规不能自己设罪。\u003c/p>","count":3,"chars":84,"gap":false},{"id":"criminal-1794794335349","n":11,"chapter":"第一章 刑法绪论 / 法条分析题","title":"刑法面前人人平等","body":"\u003col>\u003cli>\u003cspan class=\"red\">刑法适用人人平等，不因身份、民族、性别、职业、信仰、财产等区别对待\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">平等认定犯罪、裁量刑罚、执行刑罚，禁止歧视和特权\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>刑法适用人人平等，身份不会带来特权，也不妨碍法院按各自案情判轻重。\u003c/p>","count":2,"chars":57,"gap":false},{"id":"criminal-1794794335350","n":12,"chapter":"第一章 刑法绪论 / 法条分析题","title":"罪重责重罚也重","body":"\u003col>\u003cli>\u003cspan class=\"red\">罪责刑相适应：刑罚轻重须与罪行及刑事责任相适应\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">既看行为和后果的社会危害，也看主观恶性与再犯危险\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">刑事责任\u003c/span>：因犯罪而承受国家\u003cspan class=\"blue\">否定评价\u003c/span>和谴责的责任\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>罚多重既要对得起所犯罪行，也要对得起行为人应承担的责任。\u003c/p>","count":3,"chars":70,"gap":false},{"id":"criminal-1794794335351","n":13,"chapter":"第一章 刑法绪论 / 法条分析题","title":"犯罪地在我国","body":"\u003col>\u003cli>\u003cspan class=\"red\">领域包括领陆、领水、领空、领水底土\u003c/span>；我国船舶、航空器内犯罪也适用我国刑法\u003c/li>\u003cli>\u003cspan class=\"blue\">行为或结果一部分在我国领域内，即属领域内犯罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">外交豁免走外交途径\u003c/span>；港澳依当地法，民族自治地方可依法变通、补充\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>行为或结果只要有一部分落在我国就能管，我国船舶、航空器也纳入规则，法律有特别规定的另算。\u003c/p>","count":3,"chars":89,"gap":false},{"id":"criminal-1794794335352","n":14,"chapter":"第一章 刑法绪论 / 法条分析题","title":"我国公民在国外犯罪","body":"\u003col>\u003cli>\u003cspan class=\"red\">中国公民境外犯我国刑法规定的罪，原则上适用\u003c/span>；法定最高刑\u003cspan class=\"blue\">3年以下\u003c/span>可不追究\u003c/li>\u003cli>\u003cspan class=\"blue\">国家工作人员、军人境外犯罪，不受上述轻罪例外限制\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国家工作人员含国有及有关单位依法从事公务者\u003c/span>；\u003cspan class=\"blue\">属人管辖\u003c/span>不要求当地也认定犯罪\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>我国公民在国外犯我国刑法规定的罪也能管，普通公民的轻罪可不追究，国家工作人员和军人不享受这一例外。\u003c/p>","count":3,"chars":95,"gap":false},{"id":"criminal-1794794335353","n":15,"chapter":"第一章 刑法绪论 / 法条分析题","title":"外国人在境外侵害我国","body":"\u003col>\u003cli>\u003cspan class=\"red\">保护管辖针对境外外国人侵害我国国家或公民，外国人含无国籍人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按具体情节确定的法定刑档，最低刑须达3年有期徒刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">犯罪地法律不处罚的除外\u003c/span>；不能要求外国人在任何地方都守所有国家的法律\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>外国人在境外侵害我国国家或公民，得先看我国对应刑档够不够重，再看当地是否也处罚。\u003c/p>","count":3,"chars":86,"gap":false},{"id":"criminal-1794794335354","n":16,"chapter":"第一章 刑法绪论 / 法条分析题","title":"国际条约犯罪管辖","body":"\u003col>\u003cli>\u003cspan class=\"red\">普遍管辖：履行我国缔结或参加的国际条约义务，管辖约定的国际犯罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主要针对境外实施条约犯罪后进入我国的外国人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">条约提供管辖依据，定罪量刑适用我国刑法\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>国际条约规定的罪在我国承担的条约义务范围内可以管，抓到人后按我国刑法定罪判刑。\u003c/p>","count":3,"chars":71,"gap":false},{"id":"criminal-1794794335355","n":17,"chapter":"第一章 刑法绪论 / 法条分析题","title":"国外判过还能追责吗","body":"\u003col>\u003cli>\u003cspan class=\"red\">境外犯罪虽经外国审判，我国仍可依法追诉\u003c/span>；已在外国受刑罚的，可免除或减轻处罚\u003c/li>\u003cli>\u003cspan class=\"blue\">减轻\u003c/span>：在对应法定刑幅度以下判刑，通常进入下一量刑幅度\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>在国外判过也不妨碍我国依法追究，已在国外受过刑罚的，可以考虑免罚或减轻。\u003c/p>","count":2,"chars":63,"gap":false},{"id":"criminal-1794794335356","n":18,"chapter":"第一章 刑法绪论 / 法条分析题","title":"新旧刑法怎么选","body":"\u003col>\u003cli>\u003cspan class=\"red\">从旧兼从轻：原则用行为时旧法，新法不认为犯罪或处罚更轻的用新法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">旧法认定犯罪还须未过追诉时效；既有生效判决继续有效\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">比较具体适用刑档，先比最高刑，相同再比最低刑\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先按旧法看追诉条件，再比新旧法谁更轻，已生效的旧判决继续有效。\u003c/p>\u003cp>就是比新旧刑法谁判得轻：先比最高刑，最高刑一样就比最低刑；有好几档刑期的，就拿你这案子该落的那一档来比，不拿整罪的所有档乱比。\u003c/p>","count":3,"chars":78,"gap":false},{"id":"criminal-1794794335357","n":19,"chapter":"第二章 犯罪概念 / 简答题","title":"我国刑法中的犯罪定义及但书的意义","body":"\u003col>\u003cli>\u003cspan class=\"red\">犯罪是危害社会、依照刑法应受刑罚处罚的行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">定罪既看行为性质\u003c/span>，也看危害程度，不能只因形式上符合条文就定罪\u003c/li>\u003cli>\u003cspan class=\"blue\">把轻微违法排除在犯罪之外\u003c/span>，利于改过，让司法资源集中处理严重犯罪\u003c/li>\u003cli>\u003cspan class=\"blue\">分则也设有最低危害门槛\u003c/span>，例如看数额是否较大、情节是否严重或恶劣\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>光在字面上符合罪名还不够，情节显著轻微、危害不大的，过不了犯罪门槛。\u003c/p>","count":4,"chars":113,"gap":false},{"id":"criminal-1794794335358","n":20,"chapter":"第二章 犯罪概念 / 法条分析题","title":"情节太轻不算犯罪","body":"\u003col>\u003cli>\u003cspan class=\"red\">情节显著轻微、危害不大的，不认为犯罪，本来就不构成犯罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不同于已构成犯罪但免刑\u003c/span>；但书同时考察行为性质和危害程度\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>但书给犯罪设了最低危害门槛，显著轻微且危害不大的行为直接判为不构成犯罪。\u003c/p>","count":2,"chars":54,"gap":false},{"id":"criminal-1794794335359","n":21,"chapter":"第三章 犯罪构成 / 简答题","title":"犯罪构成的概念及其内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">犯罪构成是刑法规定的、成立犯罪须具备的主观要件和客观要件的总和\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">这些要件须有刑法依据\u003c/span>，全部满足才具备定罪并依法适用刑罚的前提\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>犯罪构成是法律给罪名设的一整套条件，要把外在行为和内在心理都核对上才能定罪。\u003c/p>","count":2,"chars":61,"gap":false},{"id":"criminal-1794794335360","n":22,"chapter":"第三章 犯罪构成 / 简答题","title":"犯罪构成与犯罪概念的联系和区别","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">犯罪构成指刑法规定的成立犯罪须具备的主观要件和客观要件的总和\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">犯罪构成与犯罪的联系和区别\u003c/span>：犯罪是犯罪构成的基础，犯罪构成是犯罪的具体化\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>犯罪概念解释什么算犯罪，犯罪构成给出判断某件事能否定罪的具体清单。\u003c/p>","count":2,"chars":66,"gap":false},{"id":"criminal-1794794335361","n":23,"chapter":"第三章 犯罪构成 / 简答题","title":"犯罪构成的意义","body":"\u003col>\u003cli>\u003cspan class=\"red\">犯罪构成理论对我国刑事立法、刑事司法及刑法理论发展有重要的意义\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">犯罪构成作为法律规定的确立犯罪的要件\u003c/span>，它是定罪量刑的法律准绳\u003c/li>\u003cli>\u003cspan class=\"blue\">强调依据犯罪构成定罪量刑\u003c/span>，有利于贯彻法治原则，保护公民的\u003cspan class=\"blue\">合法权益\u003c/span>，准确地惩罚犯罪\u003c/li>\u003cli>\u003cspan class=\"blue\">犯罪构成是刑法理论的核心和刑法理论体系的基础\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>办案按犯罪构成这把尺子定罪量刑，既能惩罚真犯罪，也能防止把无罪的人判成有罪。\u003c/p>","count":4,"chars":123,"gap":false},{"id":"criminal-1794794335362","n":24,"chapter":"第三章 犯罪构成 / 简答题","title":"犯罪构成的共同要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">犯罪客体：犯罪侵害、刑法保护的社会利益\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客观方面\u003c/span>：危害行为及依法要求的结果、因果关系等客观事实\u003c/li>\u003cli>\u003cspan class=\"blue\">犯罪主体\u003c/span>：达到责任年龄、具责任能力并依法担责的人，法定情形含单位\u003c/li>\u003cli>\u003cspan class=\"blue\">主观方面\u003c/span>：对行为及结果的故意、过失等心理态度\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>依次问伤了什么、做了什么、谁做的、心里怎么想，四个问题分别对应犯罪构成的四方面。\u003c/p>","count":4,"chars":100,"gap":false},{"id":"criminal-1794794335363","n":25,"chapter":"第三章 犯罪构成 / 简答题","title":"犯罪构成的分类","body":"\u003col>\u003cli>\u003cspan class=\"red\">基本构成：分则以单独既遂为原型规定的构成\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">修正构成\u003c/span>：结合总则，处理预备、未遂、中止和\u003cspan class=\"blue\">共同犯罪\u003c/span>等形态\u003c/li>\u003cli>\u003cspan class=\"blue\">标准构成\u003c/span>：对应通常程度的社会危害，是基准刑档\u003c/li>\u003cli>\u003cspan class=\"blue\">派生构成\u003c/span>：特定情节使危害升降，从\u003cspan class=\"blue\">标准构成\u003c/span>派生为\u003cspan class=\"blue\">加重构成\u003c/span>或减轻构成\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>以常见情况为基准，再按行为是否走完、有无共犯及情节轻重，区分犯罪构成的不同样子。\u003c/p>","count":4,"chars":102,"gap":false},{"id":"criminal-1794794335364","n":26,"chapter":"第三章 犯罪构成 / 法条分析题","title":"故意杀人怎么认定","body":"\u003col>\u003cli>\u003cspan class=\"red\">故意杀人通常处死刑、无期或10年以上有期\u003c/span>；情节较轻处3至10年有期\u003c/li>\u003cli>\u003cspan class=\"blue\">客体是他人生命权，客观为非法剥夺生命，主观故意\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">通常14岁起负刑责\u003c/span>；12至14岁达到法定严重结果、情节恶劣且经\u003cspan class=\"blue\">最高检核准追诉\u003c/span>的，也负刑责\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>故意杀人先看是否出于故意非法剥夺生命，再查年龄等主体条件，具备较轻情节才用较轻刑档。\u003c/p>","count":3,"chars":100,"gap":false},{"id":"criminal-1794794335365","n":27,"chapter":"第四章 犯罪客体 / 简答题","title":"犯罪客体的概念、内容/特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">犯罪客体指犯罪行为侵害的、为刑法所保护的社会利益（社会关系）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">犯罪客体是某种社会生活利益\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">犯罪客体是刑法所保护的社会生活利益\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">犯罪客体是犯罪行为所侵害的社会生活利益\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>犯罪客体是刑法保护却被犯罪侵害的利益，不能把它和行为直接碰到的人或物混为一谈。\u003c/p>","count":4,"chars":79,"gap":false},{"id":"criminal-1794794335366","n":28,"chapter":"第四章 犯罪客体 / 简答题","title":"犯罪客体的意义","body":"\u003col>\u003cli>\u003cspan class=\"red\">研究犯罪客体有助于正确理解、适用法律，有助于认识犯罪的本质特征、准确定罪和量刑\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>弄清行为伤害了哪种受保护的利益，才能分清有罪无罪、具体罪名和危害轻重。\u003c/p>","count":1,"chars":39,"gap":false},{"id":"criminal-1794794335367","n":29,"chapter":"第四章 犯罪客体 / 简答题","title":"犯罪客体与犯罪对象的联系与区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">犯罪客体是受刑法保护而被侵害的利益，犯罪对象是行为直接作用的具体人或物\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行为通常通过作用于对象侵害客体，对象有助于识别客体\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客体决定犯罪性质，对象通常不能单独决定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">任何犯罪都有客体，有些没有具体对象\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客体必受侵害或威胁，对象不一定受损\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客体是犯罪分类依据，对象通常不是\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>行为瞄准的是犯罪对象，背后被侵害的受保护利益才是犯罪客体，有些罪甚至找不到具体对象。\u003c/p>","count":6,"chars":129,"gap":false},{"id":"criminal-1794794335368","n":30,"chapter":"第五章 犯罪客观方面 / 简答题","title":"危害行为的概念和特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">危害行为：意识支配下，危害社会且被刑法禁止的身体活动\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客观性\u003c/span>：须有作为或不作为，不罚单纯思想\u003c/li>\u003cli>\u003cspan class=\"blue\">有意性\u003c/span>：排除无意识、\u003cspan class=\"blue\">不可抗力\u003c/span>或外力完全强制的动作\u003c/li>\u003cli>\u003cspan class=\"blue\">有害性\u003c/span>：侵犯刑法保护的\u003cspan class=\"blue\">社会利益\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>危害行为要是能由人的意志控制的外在活动，还得危害社会并有刑法上的意义。\u003c/p>","count":4,"chars":84,"gap":false},{"id":"criminal-1794794335369","n":31,"chapter":"第五章 犯罪客观方面 / 简答题","title":"危害行为的分类：作为与不作为","body":"\u003col>\u003cli>\u003cspan class=\"red\">作为，指积极行为\u003c/span>，即行为人以积极的身体活动实施某种被刑法禁止行为\u003c/li>\u003cli>\u003cspan class=\"blue\">不作为\u003c/span>，指消极行为，即行为人消极地不履行\u003cspan class=\"blue\">法律义务\u003c/span>而危害社会行为\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>动手做法律不许做的事叫作为，该做、能做却没做叫不作为。\u003c/p>","count":2,"chars":63,"gap":false},{"id":"criminal-1794794335370","n":32,"chapter":"第五章 犯罪客观方面 / 简答题","title":"不作为犯罪的构成条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">有特定作为义务\u003c/span>\u003cspan class=\"blue\">。义务来源\u003c/span>：\u003cspan class=\"blue\">法律明文\u003c/span>、职务或业务、法律地位或法律行为、自己此前行为造成危险\u003c/li>\u003cli>\u003cspan class=\"blue\">有履行能力，客观上根本无法履行的，不成立不作为犯罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">能做却不做\u003c/span>，造成或可能造成\u003cspan class=\"blue\">危害结果\u003c/span>，并符合所涉罪名的其他要件\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先问有没有救助等特定义务，再问做不做得到，做得到却没做并造成或可能造成危害才往下定罪。\u003c/p>","count":3,"chars":99,"gap":false},{"id":"criminal-1794794335371","n":33,"chapter":"第五章 犯罪客观方面 / 简答题","title":"不作为犯的分类","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">纯正不作为犯指行为人行为构成法定的犯罪行为本身就是不作为的犯罪\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">如遗弃罪\u003c/span>，逃税罪，拒不支付劳动报酬罪，拒不执行判决、裁定罪，拒不履行信息网络安全管理义务罪，不解救被拐卖、绑架妇女、儿童罪等\u003c/li>\u003cli>\u003cspan class=\"blue\">不纯正不作为犯\u003c/span>指行为人因不作为而构成法定\u003cspan class=\"blue\">犯罪行为本身\u003c/span>应是作为的犯罪，如因不作为而构成\u003cspan class=\"blue\">故意杀人\u003c/span>罪等\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>法条本来就专门罚不做的是纯正不作为犯，平时能动手犯的罪也可因该做却不做而成立不纯正不作为犯。\u003c/p>","count":3,"chars":141,"gap":false},{"id":"criminal-1794794335372","n":34,"chapter":"第五章 犯罪客观方面 / 简答题","title":"因果关系概念和特点","body":"\u003col>\u003cli>\u003cspan class=\"red\">刑法因果关系：危害行为与危害结果之间客观的引起、被引起联系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客观性\u003c/span>：不随人的意志转移\u003c/li>\u003cli>\u003cspan class=\"blue\">相对性\u003c/span>：同一现象对前是果、对后可为因\u003c/li>\u003cli>\u003cspan class=\"blue\">必然性\u003c/span>：具有内在、合规律联系\u003c/li>\u003cli>\u003cspan class=\"blue\">复杂性\u003c/span>：可能一因多果、多因一果等\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>刑法上的因果关系问结果是不是这个行为引起的，它客观存在，还要结合具体条件查清。\u003c/p>","count":5,"chars":89,"gap":false},{"id":"criminal-1794794335373","n":35,"chapter":"第五章 犯罪客观方面 / 简答题","title":"刑法中的因果关系的地位","body":"\u003col>\u003cli>\u003cspan class=\"red\">确认行为与结果存在因果关系，是让行为人对该结果负刑事责任的客观基础\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">对行为犯来说\u003c/span>，一般不存在解决刑法因果关系的问题，但对实害犯，解决因果关系问题则有重要意义\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>要把结果算到一个人头上，得先查他的行为是否造成结果，再查他有没有应受处罚的过错。\u003c/p>","count":2,"chars":77,"gap":false},{"id":"criminal-1794794335374","n":36,"chapter":"第五章 犯罪客观方面 / 简答题","title":"刑法中的因果关系的地位、因果关系对承担刑事责任的意义","body":"\u003col>\u003cli>\u003cspan class=\"red\">如果不存在因果关系，则不能把某结果归责于行为人（即行为人不对该结果负刑事责任）\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">即使存在因果关系，也不意味着对结果当然负刑事责任\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>行为造成了结果，只解决结果能否归给这个人，是否担刑责、担多重还要看其他犯罪条件。\u003c/p>","count":2,"chars":63,"gap":false},{"id":"criminal-1794794335375","n":37,"chapter":"第五章 犯罪客观方面 / 简答题","title":"犯罪的时间、地点、方法对定罪、量刑的意义","body":"\u003col>\u003cli>\u003cspan class=\"red\">如果刑法把时间、地点、方法明文规定为某种犯罪的构成条件时，它们就成为构成该罪不可缺少的条件，故这些条件的有无也就成为区分罪与非罪的标准\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">在分则有些条文中\u003c/span>，特定的时间、地点、方法是\u003cspan class=\"blue\">法定量刑的情节\u003c/span>，如在公共场所当众强奸的，入户抢劫的，在公共交通工具上抢劫的\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>时间、地点、方法有时决定罪名能否成立，法条不把它们设成定罪条件时，也可能影响刑罚轻重。\u003c/p>","count":2,"chars":125,"gap":false},{"id":"criminal-1794794335376","n":38,"chapter":"第六章 犯罪主体 / 简答题","title":"刑事责任能力的概念、辨认行为能力与控制行为能力之间的关系","body":"\u003col>\u003cli>\u003cspan class=\"red\">刑事责任能力是辨认自己行为的社会性质和意义，并控制自己行为的能力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">两种能力须同时具备，才能认为具备完整的刑事责任能力\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">辨认能力是基础，先能认识行为的性质和后果\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">控制能力是关键，还须能按这种认识支配自己的行为\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>既得认得清自己在做什么，也得能管住自己的行为，两个能力缺一个都不算完整。\u003c/p>","count":4,"chars":100,"gap":false},{"id":"criminal-1794794335377","n":39,"chapter":"第六章 犯罪主体 / 简答题","title":"我国刑法对刑事责任年龄的法律规定","body":"\u003col>\u003cli>\u003cspan class=\"red\">不满12岁不负刑责\u003c/span>\u003cspan class=\"blue\">；16岁起全面负刑责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">12至14岁故杀故伤致死\u003c/span>，或特别残忍致重伤\u003cspan class=\"blue\">严重残疾\u003c/span>，情恶劣且最高检核准才追诉\u003c/li>\u003cli>14至16岁对杀、伤重死、奸、抢、贩毒、火、爆、投危险物质负刑责\u003c/li>\u003cli>\u003cspan class=\"blue\">未满18应从轻减轻；满75故意可、过失应从轻减轻\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先过年龄门槛：满12和满14只对特定罪负责，满16原则上全负责，未成年犯罪从宽。\u003c/p>","count":4,"chars":113,"gap":false},{"id":"criminal-1794794335378","n":40,"chapter":"第六章 犯罪主体 / 简答题","title":"其他影响刑事责任能力的因素","body":"\u003col>\u003cli>\u003cspan class=\"red\">行为时不能辨认或控制，经法定程序鉴定确认，不负刑责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">间歇性精神病人在精神正常时犯罪，应负刑责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">尚未完全丧失辨认或控制能力的\u003c/span>，应负刑责，可以从轻或减轻\u003c/li>\u003cli>\u003cspan class=\"blue\">醉酒犯罪仍应负刑责，吸毒后产生幻觉而犯罪也不当然免责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">又聋又哑的人或盲人犯罪，可以从轻、减轻或免除处罚\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>精神障碍看行为时能否辨认或控制，醉酒犯罪仍负责，又聋又哑或盲人犯罪可从宽。\u003c/p>","count":5,"chars":122,"gap":false},{"id":"criminal-1794794335379","n":41,"chapter":"第六章 犯罪主体 / 简答题","title":"一般主体与特殊主体","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">一般主体指有一般犯罪主体所要求的法定构成要件的自然人\u003c/span>，即达到法定责任年龄、有责任能力的自然人主体\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">特殊主体指除了有一般犯罪主体所要求的成立条件外\u003c/span>，还须有某些犯罪所要求的特定身份作为其构成要件的自然人主体\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>一般主体只要满足年龄和责任能力等要求，特殊主体还必须具备该罪规定的身份。\u003c/p>","count":2,"chars":100,"gap":false},{"id":"criminal-1794794335380","n":42,"chapter":"第六章 犯罪主体 / 简答题","title":"单位犯罪的概念和要件","body":"\u003col>\u003cli>\u003cspan class=\"red\">单位犯罪：公司、企业、事业单位、机关、团体实施的依法应负刑责的危害社会行为\u003c/span>\u003c/li>\u003cli>主体包括依法成立、符合条件的国有、集体、合资、独资及私营等单位\u003c/li>\u003cli>\u003cspan class=\"blue\">以刑法明文规定单位可犯罪为限\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须经单位决策，为本单位或全体成员谋非法利益\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>单位要为单位利益实施法律明文规定的犯罪，少数人借单位名义为自己谋利，按个人犯罪认定。\u003c/p>","count":4,"chars":103,"gap":false},{"id":"criminal-1794794335381","n":43,"chapter":"第六章 犯罪主体 / 简答题","title":"对单位犯罪的处罚","body":"\u003col>\u003cli>\u003cspan class=\"red\">两罚制：对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员判处刑罚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">对单位犯罪一般实行“两罚”原则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">单罚制\u003c/span>：只处罚\u003cspan class=\"blue\">直接负责的主管人员\u003c/span>和\u003cspan class=\"blue\">其他直接责任人员\u003c/span>，不处罚单位，即刑法分则有特别规定只实行“单罚”的，按规定\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>单位犯罪通常既罚单位的钱又罚直接责任人员，刑法分则或其他法律另有规定就按其规定。\u003c/p>","count":3,"chars":106,"gap":false},{"id":"criminal-1794794335382","n":44,"chapter":"第六章 犯罪主体 / 简答题","title":"对单位犯罪中的直接负责的主管人员、其他直接责任人员","body":"\u003col>\u003cli>\u003cspan class=\"red\">直接负责的主管人员，是在单位实施的犯罪中起决定、批准、授意、纵容、指挥等作用的人员，一般是单位的主管负责人，包括法定代表人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">其他直接责任人员\u003c/span>，是在单位犯罪中具体实施犯罪并\u003cspan class=\"blue\">起较大作用\u003c/span>的人员，既可以是单位的经营管理人员，也可以是单位的职工，包括聘任、雇用的人员\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>谁实际决定、批准或指挥，谁可能是主管人员，谁具体实施并起较大作用，谁可能是其他直接责任人员。\u003c/p>","count":2,"chars":127,"gap":false},{"id":"criminal-1794794335383","n":45,"chapter":"第六章 犯罪主体 / 法条分析题","title":"多大要负刑责","body":"\u003col>\u003cli>\u003cspan class=\"red\">16周岁负全面刑责\u003c/span>；14至16周岁对法定8种严重犯罪行为负刑责，看行为不只看罪名\u003c/li>\u003cli>\u003cspan class=\"blue\">12至14周岁故意杀人、故意伤害\u003c/span>，致死或以\u003cspan class=\"blue\">特别残忍手段\u003c/span>致重伤\u003cspan class=\"blue\">严重残疾\u003c/span>，情节恶劣，经\u003cspan class=\"blue\">最高检核准追诉\u003c/span>才担责\u003c/li>\u003cli>\u003cspan class=\"blue\">未成年犯罪应从轻或减轻\u003c/span>；未达责任年龄可依法责令管教、\u003cspan class=\"blue\">专门矫治教育\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>未成年人是否担刑责要分年龄和所做的事，最低年龄档还要看严重后果、恶劣情节和最高检核准。\u003c/p>","count":3,"chars":123,"gap":false},{"id":"criminal-1794794335384","n":46,"chapter":"第六章 犯罪主体 / 法条分析题","title":"七十五岁犯罪怎么罚","body":"\u003col>\u003cli>\u003cspan class=\"red\">犯罪时已满75周岁，故意犯罪可从轻或减轻\u003c/span>；过失犯罪应从轻或减轻\u003c/li>\u003cli>\u003cspan class=\"blue\">故意是希望或放任危害结果\u003c/span>；过失是应预见未预见，或轻信能避免\u003c/li>\u003cli>\u003cspan class=\"blue\">以特别残忍手段致死\u003c/span>，仍可依法从轻或减轻；死刑适用另按第49条判断\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>已满75周岁犯罪，故意的可从宽、过失的应从宽，特别残忍故意致死涉及的是死刑例外。\u003c/p>","count":3,"chars":92,"gap":false},{"id":"criminal-1794794335385","n":47,"chapter":"第六章 犯罪主体 / 法条分析题","title":"精神障碍与刑责","body":"\u003col>\u003cli>\u003cspan class=\"red\">精神病不负刑责须同时满足：医学上患病，行为时不能辨认或控制，经法定程序确认\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">强制医疗属于保安措施，不是刑罚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">犯罪后才患病不消灭刑责\u003c/span>；责任能力看行为时，案后患病主要影响诉讼、执行\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>精神病鉴定既看疾病也看犯罪当时的辨认或控制能力，强制医疗不是刑罚，案后患病也不抹掉原责任。\u003c/p>","count":3,"chars":86,"gap":false},{"id":"criminal-1794794335386","n":48,"chapter":"第六章 犯罪主体 / 法条分析题","title":"聋哑或盲人犯罪怎么罚","body":"\u003col>\u003cli>\u003cspan class=\"red\">“又聋又哑”须同时完全丧失听力和语言功能，单聋或单哑不属此项\u003c/span>；盲人指双目失明\u003c/li>\u003cli>\u003cspan class=\"blue\">又聋又哑者、盲人犯罪可从轻、减轻或免除\u003c/span>；结合\u003cspan class=\"blue\">生理缺陷\u003c/span>对辨认、控制能力的影响判断，不是一律从宽\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>本条说的是又聋又哑或双目失明，从不从宽须结合其实际辨认和控制能力、案情来判断。\u003c/p>","count":2,"chars":84,"gap":false},{"id":"criminal-1794794335387","n":49,"chapter":"第七章 犯罪主观方面 / 简答题","title":"犯罪主观方面概念、内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">主观方面：行为人对危害行为及结果的心理态度，是追究刑责的主观基础\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">故意、过失是必要要素；犯罪目的是部分犯罪的必要要素\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">犯罪动机通常不决定成立犯罪，但可影响量刑\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>犯罪主观方面讲人心里怎么想，故意或过失是基础，特定罪名还会问他想达到什么目的。\u003c/p>","count":3,"chars":77,"gap":false},{"id":"criminal-1794794335388","n":50,"chapter":"第七章 犯罪主观方面 / 简答题","title":"主观罪过责任原则","body":"\u003col>\u003cli>\u003cspan class=\"red\">罪过指犯罪行为人对自己行为造成的危害后果所持的故意或过失的心理态度，是犯罪主观方面的最主要的内容，在定罪量刑中有特别重要的意义\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">我国刑法对犯罪的认定坚持主观罪过责任原则\u003c/span>，即行为人对自己的危害社会行为须有罪过\u003c/li>\u003cli>\u003cspan class=\"blue\">行为人对自己的危害社会行为有故意或过失\u003c/span>，表明行为人有犯罪的心理态度，故应对其\u003cspan class=\"blue\">危害行为\u003c/span>进行谴责\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>不能因为结果严重就定罪，先查行为人对它有没有故意或过失。\u003c/p>","count":3,"chars":148,"gap":false},{"id":"criminal-1794794335389","n":51,"chapter":"第七章 犯罪主观方面 / 简答题","title":"无罪过事件：意外事件、不可抗力、期待可能性","body":"\u003col>\u003cli>\u003cspan class=\"red\">无罪过事件：有损害结果，但由不能抗拒或不能预见的原因引起，且行为人无故意或过失，不构成犯罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">意外事件\u003c/span>：实际\u003cspan class=\"blue\">没有预见\u003c/span>，按当时客观情况和本人认识能力也不可能预见\u003c/li>\u003cli>\u003cspan class=\"blue\">不可抗力\u003c/span>：即使尽力也没法抵抗外力、阻止结果\u003c/li>\u003cli>\u003cspan class=\"blue\">期待可能性\u003c/span>：站在行为人当时的具体处境，看能否合理要求他采取合法做法\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>没有故意或过失，坏结果又是根本想不到或根本拦不住的，就不是犯罪，能否要求行为人守法也要看当时处境。\u003c/p>","count":4,"chars":131,"gap":false},{"id":"criminal-1794794335390","n":52,"chapter":"第七章 犯罪主观方面 / 简答题","title":"不可抗力和意外事件的异同","body":"\u003col>\u003cli>\u003cspan class=\"red\">客观上都造成了损害结果\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主观上行为人都对危害结果的发生持反对态度\u003c/span>，都没有故意或过失\u003c/li>\u003cli>不可抗力事件中的行为人已经认识到自己的行为会发生\u003cspan class=\"blue\">危害社会的结果\u003c/span>，但是客观上不可能阻止结果\u003c/li>\u003cli>意外事件中的行为人没有认识到自己的行为会发生\u003cspan class=\"blue\">危害社会的结果\u003c/span>，因为主观上不可能预见结果\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>二者都造成了损害，行为人都没有故意、过失，不构成犯罪。\u003c/p>","count":4,"chars":126,"gap":false},{"id":"criminal-1794794335391","n":53,"chapter":"第七章 犯罪主观方面 / 简答题","title":"犯罪故意的概念和特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">犯罪故意：明知自己的行为会发生危害社会的结果，并希望或放任结果发生\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">认识\u003c/span>：知道行为、结果、两者联系和它们的\u003cspan class=\"blue\">社会危害性\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">意志\u003c/span>：希望\u003cspan class=\"blue\">结果发生\u003c/span>，或容许\u003cspan class=\"blue\">结果发生\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>知道行为会带来危害，仍想看到结果或由着它发生，就是犯罪故意。\u003c/p>","count":3,"chars":74,"gap":false},{"id":"criminal-1794794335392","n":54,"chapter":"第七章 犯罪主观方面 / 简答题","title":"犯罪故意的种类：直接故意和间接故意","body":"\u003col>\u003cli>\u003cspan class=\"red\">直接故意：明知自己行为会发生危害社会的结果，并希望结果发生\u003c/span>，即主动追求这个结果\u003c/li>\u003cli>\u003cspan class=\"blue\">间接故意\u003c/span>：明知自己行为可能发生\u003cspan class=\"blue\">危害社会的结果\u003c/span>，仍然放任\u003cspan class=\"blue\">结果发生\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>直接故意是想让坏结果发生，间接故意是知道可能发生但不管它发生不发生。\u003c/p>","count":2,"chars":70,"gap":false},{"id":"criminal-1794794335393","n":55,"chapter":"第七章 犯罪主观方面 / 简答题","title":"直接故意和间接故意的异同","body":"\u003col>\u003cli>\u003cspan class=\"red\">相同点：都明知行为会带来危害，都不排斥危害结果发生\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">认识\u003c/span>：直接故意可明知\u003cspan class=\"blue\">结果\u003c/span>必然或可能发生，间接故意只明知\u003cspan class=\"blue\">结果\u003c/span>可能发生\u003c/li>\u003cli>\u003cspan class=\"blue\">意志\u003c/span>：直接故意希望\u003cspan class=\"blue\">结果发生\u003c/span>，间接故意放任\u003cspan class=\"blue\">结果发生\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">结果\u003c/span>：直接故意未实现\u003cspan class=\"blue\">结果\u003c/span>仍可能成立预备、未遂等，间接故意通常以实际发生相应\u003cspan class=\"blue\">结果\u003c/span>为成立条件\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>两种故意都明知危害，主要分在知道结果的程度不同，以及对结果是希望还是放任。\u003c/p>","count":4,"chars":126,"gap":false},{"id":"criminal-1794794335394","n":56,"chapter":"第七章 犯罪主观方面 / 简答题","title":"犯罪过失的概念和特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">犯罪过失：应当预见行为可能造成危害结果，却因疏忽没预见，或已经预见却轻信能避免\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">没有犯罪故意\u003c/span>：既不希望，也不放任\u003cspan class=\"blue\">结果发生\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">没尽应有的注意义务\u003c/span>：本该想到却没想到，或已经想到却轻信能避免\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>过失不想也不放任坏结果，但要么本该想到却没想到，要么想到了却轻信能避开。\u003c/p>","count":3,"chars":89,"gap":false},{"id":"criminal-1794794335395","n":57,"chapter":"第七章 犯罪主观方面 / 简答题","title":"疏忽大意的过失和过于自信的过失的异同","body":"\u003col>\u003cli>\u003cspan class=\"red\">疏忽大意：应当且能够预见危害结果，却因疏忽没预见，结果发生\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">过于自信\u003c/span>：已预见可能发生结果，却轻信能避免，结果仍发生\u003c/li>\u003cli>\u003cspan class=\"blue\">共同点\u003c/span>：均排斥结果；区别：前者未预见、属无认识过失，后者已预见、属有认识过失\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>两者都是没尽注意义务，一种没想到本应想到的风险，另一种想到了却太相信自己能躲开。\u003c/p>","count":3,"chars":94,"gap":false},{"id":"criminal-1794794335396","n":58,"chapter":"第七章 犯罪主观方面 / 简答题","title":"意外事件与疏忽大意的过失的异同","body":"\u003col>\u003cli>\u003cspan class=\"red\">二者的相似之处是行为人对危害结果的发生都没有预见\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">二者的区别是行为人对危害结果的发生是否应预见\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>同样是没想到后果，本该且能想到而没想到是疏忽大意，本来就不可能想到是意外。\u003c/p>","count":2,"chars":46,"gap":false},{"id":"criminal-1794794335397","n":59,"chapter":"第七章 犯罪主观方面 / 简答题","title":"犯罪目的在犯罪构成中的作用","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">犯罪目的指行为人希望经实施某种犯罪行为实现某种犯罪结果的心理态度\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">目的在犯罪构成中的作用\u003c/span>：\u003cspan class=\"blue\">直接故意\u003c/span>的基本内容就是追求某种犯罪结果的发生，包含着犯罪目的，所以刑法对\u003cspan class=\"blue\">故意犯\u003c/span>罪通常不明示犯罪目的\u003c/li>\u003cli>\u003cspan class=\"blue\">不具备法律规定的特定目的，就不构成该种犯罪\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有的罪名不仅要求故意，还要证明行为人想达到法条规定的特定结果，缺这个目的就不能定该罪。\u003c/p>","count":3,"chars":114,"gap":false},{"id":"criminal-1794794335398","n":60,"chapter":"第七章 犯罪主观方面 / 简答题","title":"犯罪动机在定罪量刑中的作用","body":"\u003col>\u003cli>\u003cspan class=\"red\">犯罪动机指推动行为人实施犯罪行为的内心起因\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">动机在定罪量刑中的作用\u003c/span>：犯罪动机虽然一般不是犯罪构成的主观要素，但它反映犯罪人的主观恶性，对量刑有重要的意义\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>动机解释为什么想做这件事，通常不拿它决定罪名，但会影响对行为和量刑轻重的判断。\u003c/p>","count":2,"chars":75,"gap":false},{"id":"criminal-1794794335399","n":61,"chapter":"第七章 犯罪主观方面 / 法条分析题","title":"希望或放任是故意","body":"\u003col>\u003cli>\u003cspan class=\"red\">故意：明知行为会发生危害结果，仍希望或放任结果发生\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">明知可由证据推定，结果包括必然发生和可能发生\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">希望是主动追求；放任是不追求也不阻止，任其发生\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">具备故意且满足其他犯罪要件，才依法负刑责\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>判断故意要先问人知道什么，再问他是想要坏结果还是任其发生，最后还要看该罪其他要件。\u003c/p>","count":4,"chars":90,"gap":false},{"id":"criminal-1794794335400","n":62,"chapter":"第七章 犯罪主观方面 / 法条分析题","title":"没料到风险或轻信能避开","body":"\u003col>\u003cli>\u003cspan class=\"red\">应当预见：既有注意义务，又有预见能力，结合当时情况判断\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">疏忽大意\u003c/span>：该预见、能预见，却没预见\u003c/li>\u003cli>\u003cspan class=\"blue\">过于自信\u003c/span>：预见可能发生，却无可靠根据地相信能避免\u003c/li>\u003cli>\u003cspan class=\"blue\">过失行为仅在法律明文规定时才负刑责\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先问按当时情况该不该想到风险，再分没想到和想到了却轻信能避开，法律明文规定才罚过失。\u003c/p>","count":4,"chars":85,"gap":false},{"id":"criminal-1794794335401","n":63,"chapter":"第八章 正当化事由 / 简答题","title":"正当化事由的概念和种类","body":"\u003col>\u003cli>\u003cspan class=\"red\">正当化事由：行为表面符合某罪的客观构成要件，实际上不具备犯罪的社会危害性，因此依法不成立犯罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">刑法明文规定\u003c/span>：\u003cspan class=\"blue\">正当防卫\u003c/span>、紧急避险\u003c/li>\u003cli>\u003cspan class=\"blue\">刑法未明文规定\u003c/span>：依法履职、执行命令、正当业务、被害人承诺、自救\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>行为表面像犯罪却有正当理由，就可以挡住定罪，防卫、避险是明文规定的常见情形。\u003c/p>","count":3,"chars":93,"gap":false},{"id":"criminal-1794794335402","n":64,"chapter":"第八章 正当化事由 / 简答题","title":"正当防卫的概念和成立条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">正当防卫：为保护合法权益，制止正在进行的不法侵害，对侵害人实施防卫\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">起因\u003c/span>：现实不法侵害；\u003cspan class=\"blue\">时间\u003c/span>：已经开始、\u003cspan class=\"blue\">尚未结束\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">对象\u003c/span>：侵害人本人；\u003cspan class=\"blue\">主观\u003c/span>：保护合法权益\u003c/li>\u003cli>\u003cspan class=\"blue\">限度\u003c/span>：不得\u003cspan class=\"blue\">明显超过必要限度\u003c/span>并造成重大损害\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有人正在侵害合法权益时，可以出于保护目的制止侵害者，但不能明显超限并造成重伤或死亡。口诀：真、时、人、心、度（真侵害、正当时、打本人、有目的、不超限）。\u003c/p>","count":4,"chars":93,"gap":false},{"id":"criminal-1794794335403","n":65,"chapter":"第八章 正当化事由 / 简答题","title":"特别防卫的概念和成立条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">特别防卫：对正在严重危及人身安全的暴力犯罪进行防卫，造成侵害人伤亡，不属防卫过当，不负刑责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">条件\u003c/span>：先满足正当防卫的起因、时间、对象和\u003cspan class=\"blue\">主观条件\u003c/span>，再看暴力性质\u003c/li>\u003cli>\u003cspan class=\"blue\">行凶、杀人、抢劫、强奸、绑架等须严重危及人身安全\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">看实际暴力行为，即使用这种方式犯的是其他罪也可适用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">其他暴力犯罪须有造成重伤、死亡的紧迫危险和现实可能\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>遇到正在严重危及人身安全的暴力犯罪，可以针对加害人特别防卫，即使造成其伤亡也不算过当。口诀：四关先达标，看暴不看名，危险可反杀。\u003c/p>","count":5,"chars":150,"gap":false},{"id":"criminal-1794794335404","n":66,"chapter":"第八章 正当化事由 / 简答题","title":"防卫过当与事后防卫的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">防卫过当：侵害正在进行，防卫明显过限且造成重大损害\u003c/span>；事后防卫：侵害已结束再还击\u003c/li>\u003cli>\u003cspan class=\"blue\">过当通常为过失，事后防卫通常为故意\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">防卫过当应减轻或免除处罚\u003c/span>；事后防卫不适用这一法定从宽规则\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>防卫过当是侵害还在但反击明显过头并造成重大损害，事后防卫是事情已经结束才动手。\u003c/p>","count":3,"chars":84,"gap":false},{"id":"criminal-1794794335405","n":67,"chapter":"第八章 正当化事由 / 简答题","title":"紧急避险的概念和成立条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">紧急避险：为保合法权益，不得已损害较小合法利益，避开正在发生的危险\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">起因\u003c/span>：\u003cspan class=\"blue\">现实危险\u003c/span>；\u003cspan class=\"blue\">时间\u003c/span>：正在发生且紧迫\u003c/li>\u003cli>\u003cspan class=\"blue\">对象\u003c/span>：第三人合法利益；目的：保护合法权益\u003c/li>\u003cli>\u003cspan class=\"blue\">手段\u003c/span>：别无选择；\u003cspan class=\"blue\">限度\u003c/span>：损害须小于保护利益\u003c/li>\u003cli>\u003cspan class=\"blue\">职务、业务负特定责任者，不得为避本人危险而擅离职责\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>眼前有真实危险、实在没别的办法时，可以用较小的损害保住较大的合法利益。\u003c/p>\u003cp>真危险正发生委屈三护利益没招了必小于。\u003c/p>","count":5,"chars":116,"gap":false},{"id":"criminal-1794794335406","n":68,"chapter":"第八章 正当化事由 / 简答题","title":"紧急避险与正当防卫的异同","body":"\u003col>\u003cli>\u003cspan class=\"red\">相同：保合法权益，应对现实紧迫威胁\u003c/span>；合法不担刑责，过当应减轻或免除\u003c/li>\u003cli>\u003cspan class=\"blue\">来源\u003c/span>：防卫限人\u003cspan class=\"blue\">不法侵害\u003c/span>，避险还含天灾等\u003c/li>\u003cli>\u003cspan class=\"blue\">对象\u003c/span>：防卫对\u003cspan class=\"blue\">侵害人\u003c/span>，避险损第三人利益\u003c/li>\u003cli>\u003cspan class=\"blue\">必要性\u003c/span>：避险须别无办法\u003c/li>\u003cli>\u003cspan class=\"blue\">限度\u003c/span>：避险须损小保大；防卫不明显过限致\u003cspan class=\"blue\">重大损害\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">特定职责者不得为避本人危险擅离职责\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>两者都为救合法权益，防卫针对侵害人，避险是在走投无路时牺牲第三方的较小利益。\u003c/p>\u003cp>保权益正进行不负责过减免人祸天灾，侵与三，没招无限，小保大 不超限。\u003c/p>","count":6,"chars":121,"gap":false},{"id":"criminal-1794794335407","n":69,"chapter":"第八章 正当化事由 / 法条分析题","title":"正当防卫与防卫过当","body":"\u003col>\u003cli>\u003cspan class=\"red\">不法侵害须已开始、未结束，含犯罪及部分侵权违法行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">必要限度结合侵害强度、危害及可行手段\u003c/span>，按当时制止侵害的需要判断\u003c/li>\u003cli>\u003cspan class=\"blue\">明显过限且致重大损害才过当；重大损害指重伤、死亡\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">过当免刑仍属有罪，不等于无罪\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先看侵害是否正在发生，再看防卫是否明显超限且造成重伤或死亡，过当可以免罚但仍可能有罪。\u003c/p>","count":4,"chars":94,"gap":false},{"id":"criminal-1794794335408","n":70,"chapter":"第八章 正当化事由 / 法条分析题","title":"严重暴力下的特殊防卫","body":"\u003col>\u003cli>\u003cspan class=\"red\">特殊防卫针对正在进行、严重危及人身安全的暴力犯罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行凶指严重暴力侵害\u003c/span>；杀人、抢劫、强奸、绑架看实际暴力行为，不拘罪名\u003c/li>\u003cli>\u003cspan class=\"blue\">其他暴力须有现实紧迫的重伤、死亡危险\u003c/span>；防卫致侵害人伤亡不属过当，不负刑责\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>特别防卫看眼前的暴力是否严重危及人身安全，不能只看案件最后定了什么罪名。\u003c/p>","count":3,"chars":93,"gap":false},{"id":"criminal-1794794335409","n":71,"chapter":"第八章 正当化事由 / 法条分析题","title":"紧急避险的条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">危险须现实、紧迫，来源可为自然灾害、动物、违法犯罪或生理病理原因\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不得已\u003c/span>：没有其他可行手段，只能牺牲较小合法利益\u003c/li>\u003cli>\u003cspan class=\"blue\">必要限度\u003c/span>：造成损害须小于保护利益，不能相等或更大\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>遇到现实危险，别无办法才能避险，而且不能为了保较小利益反而造成更大的损失。\u003c/p>","count":3,"chars":79,"gap":false},{"id":"criminal-1794794335410","n":72,"chapter":"第九章 故意犯罪的停止形态 / 简答题","title":"故意犯罪停止形态的概念和特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">故意犯罪的停止形态，指在故意犯罪过程中因为某种原因而停止所呈现的状态，可以分为完成形态与未完成形态两大类：犯罪既遂是犯罪的完成形态\u003c/span>；\u003cspan class=\"blue\">犯罪预备\u003c/span>、未遂、中止是犯罪的未完成形态\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">它是故意犯罪进展的结局状态\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">它是依据法律规定认定的犯罪进展形态\u003c/span>，对每一个犯罪的结局状态依法进行评价后，最终确定其犯罪的法律形态\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>直接故意犯罪一路走下来，停在准备、动手未成、主动停止或做成，分别对应不同的停止形态。\u003c/p>","count":3,"chars":147,"gap":false},{"id":"criminal-1794794335411","n":73,"chapter":"第九章 故意犯罪的停止形态 / 简答题","title":"犯罪既遂的概念和标准","body":"\u003col>\u003cli>\u003cspan class=\"red\">犯罪既遂：行为齐备该罪的全部既遂构成要件\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">结果说\u003c/span>：法定结果发生即既遂\u003c/li>\u003cli>\u003cspan class=\"blue\">目的说\u003c/span>：行为人的犯罪目的达到即既遂\u003c/li>\u003cli>\u003cspan class=\"blue\">通说采构成要件齐备说\u003c/span>，不是所有罪都要等实际损害或本人目的实现\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>既遂不等于目的都实现，而是法条给这一罪名设的既遂要件已经全部满足。\u003c/p>\u003cp>结果说：法条要的结果真出来了才算既遂。目的说：自己想达成的目标实现了才算既遂。构成要件齐备说：法条要求的全套要件凑齐才算既遂（通说）。\u003c/p>","count":4,"chars":80,"gap":false},{"id":"criminal-1794794335412","n":74,"chapter":"第九章 故意犯罪的停止形态 / 简答题","title":"犯罪既遂的形态","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">实害犯指行为须已造成法定实害后果，才是该罪的既遂\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">危险犯指只要行为足以造成某种严重后果发生的危险\u003c/span>，就是该罪既遂\u003c/li>\u003cli>\u003cspan class=\"blue\">行为犯指犯罪行为实施到一定程度即构成既遂（程度犯）\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有的罪要真有损害，有的出现法定危险就够，有的做到法定行为或程度就算既遂。\u003c/p>","count":3,"chars":79,"gap":false},{"id":"criminal-1794794335413","n":75,"chapter":"第九章 故意犯罪的停止形态 / 简答题","title":"犯罪预备的概念和特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">犯罪预备，指为了犯罪，准备工具、制造条件的行为\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">行为人具有为便利实行、完成某种犯罪的主观意图\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客观上犯罪人进行了准备工具、制造条件等犯罪的预备活动\u003c/span>\u003c/li>\u003cli>犯罪的预备行为由于罪犯\u003cspan class=\"blue\">意志以外的原因\u003c/span>被阻止在犯罪准备阶段，未能进展到着手实行犯罪阶段\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有明确犯罪目的，已经备工具或造条件，还没着手就因外因停下，是犯罪预备。\u003c/p>","count":4,"chars":113,"gap":false},{"id":"criminal-1794794335414","n":76,"chapter":"第九章 故意犯罪的停止形态 / 简答题","title":"犯意表示、犯罪预备、实行行为的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">犯意表示：只把犯罪想法说出、写出，尚无准备行为，通常不罚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">犯罪预备\u003c/span>：为实行犯罪\u003cspan class=\"blue\">准备工具\u003c/span>、制造条件，已跨出想法阶段\u003c/li>\u003cli>\u003cspan class=\"blue\">实行行为\u003c/span>：开始实施该罪基本构成行为\u003c/li>\u003cli>\u003cspan class=\"blue\">区别关键\u003c/span>：是否直接、现实地威胁\u003cspan class=\"blue\">犯罪客体\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>嘴上说想犯罪只是表露想法，着手准备才叫预备，开始做直接威胁法益的行为才叫实行。\u003c/p>","count":4,"chars":91,"gap":false},{"id":"criminal-1794794335415","n":77,"chapter":"第九章 故意犯罪的停止形态 / 简答题","title":"犯罪未遂的概念和特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">犯罪未遂：已着手实行，因意志外原因未得逞\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">已着手\u003c/span>：行为对犯罪客体形成直接、现实危险\u003c/li>\u003cli>\u003cspan class=\"blue\">未得逞\u003c/span>：未齐备既遂要件\u003c/li>\u003cli>\u003cspan class=\"blue\">停止原因违背本人意愿，区别于主动中止\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>已经着手、还没做到既遂，而且是被意志之外的原因拦住，才是犯罪未遂。\u003c/p>","count":4,"chars":69,"gap":false},{"id":"criminal-1794794335416","n":78,"chapter":"第九章 故意犯罪的停止形态 / 简答题","title":"犯罪未遂的分类","body":"\u003col>\u003cli>\u003cspan class=\"red\">按实行是否完成：实行终了未遂、未实行终了未遂\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按实际能否完成\u003c/span>：\u003cspan class=\"blue\">能犯未遂\u003c/span>、\u003cspan class=\"blue\">不能犯未遂\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">不能犯未遂包括工具、对象认识错误等\u003c/span>，须与毫无现实危险的迷信犯区别\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>未遂可以按动作做没做完分，也可以按手段或对象在具体情况下能不能达到既遂分。\u003c/p>","count":3,"chars":72,"gap":false},{"id":"criminal-1794794335417","n":79,"chapter":"第九章 故意犯罪的停止形态 / 简答题","title":"迷信犯与不能犯未遂的区别","body":"\u003col>\u003cli>\u003cspan class=\"red\">不能犯未遂：对工具效能、对象性质误认，行为仍具刑法上的现实危险，可罚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">迷信犯\u003c/span>：用迷信等手段幻想犯罪，根本不能造成危害，无刑法危险性，通常不构成犯罪\u003c/li>\u003cli>\u003cspan class=\"blue\">关键不是本人想不想，而是行为客观上有没有危险\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>靠迷信方法没有现实危害，不算犯罪，手段或对象碰巧不行却有刑法上的危险，才可能算不能犯未遂。\u003c/p>","count":3,"chars":94,"gap":false},{"id":"criminal-1794794335418","n":80,"chapter":"第九章 故意犯罪的停止形态 / 简答题","title":"犯罪中止的概念和特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">犯罪中止：在犯罪过程中主动放弃犯罪，或主动且有效地阻止犯罪结果发生\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">时间性\u003c/span>：从预备开始到既遂前\u003c/li>\u003cli>\u003cspan class=\"blue\">自动性\u003c/span>：自己认为\u003cspan class=\"blue\">还能继续\u003c/span>却主动停下\u003c/li>\u003cli>\u003cspan class=\"blue\">有效性\u003c/span>：没实行完，真正停手即可；实行完而结果未出，要靠自己的行动\u003cspan class=\"blue\">有效阻止\u003c/span>结果\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>还做得下去却自己主动停，或主动补救并真让结果没发生，才是犯罪中止。\u003c/p>","count":4,"chars":101,"gap":false},{"id":"criminal-1794794335419","n":81,"chapter":"第九章 故意犯罪的停止形态 / 简答题","title":"犯罪中止的分类","body":"\u003col>\u003cli>\u003cspan class=\"red\">预备阶段中止：在准备犯罪、尚未着手实行时主动放弃\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">未实行终了\u003c/span>：着手后没做完，能做却主动停下\u003c/li>\u003cli>\u003cspan class=\"blue\">已实行终了\u003c/span>：动作已经做完、结果尚未发生，主动采取措施并\u003cspan class=\"blue\">有效防止\u003c/span>结果\u003c/li>\u003cli>\u003cspan class=\"blue\">犯罪进度不同，评价和处理要区分\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">还没做完通常只须主动停\u003c/span>，已经做完则须主动、有效地防止结果\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>准备时或动手后都可中止，没做完的重在主动停，做完的要主动防止结果且真的拦住。\u003c/p>","count":5,"chars":120,"gap":false},{"id":"criminal-1794794335420","n":82,"chapter":"第九章 故意犯罪的停止形态 / 法条分析题","title":"犯罪还没动手","body":"\u003col>\u003cli>\u003cspan class=\"red\">犯罪预备：为实行具体犯罪准备工具、制造条件\u003c/span>；只为继续准备而准备不算\u003c/li>\u003cli>\u003cspan class=\"blue\">工具是作案物品；制造条件包括排除障碍、安排机会等\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">因意志外原因停在预备阶段的\u003c/span>，可比照既遂犯从轻、减轻或免除\u003c/li>\u003cli>\u003cspan class=\"blue\">从轻须在法定刑幅度内判较轻刑罚\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>为特定犯罪备工具、造条件，没着手就被拦下属于预备，处罚可以比既遂轻、减或免。\u003c/p>","count":4,"chars":100,"gap":false},{"id":"criminal-1794794335421","n":83,"chapter":"第九章 故意犯罪的停止形态 / 法条分析题","title":"已动手却没得逞","body":"\u003col>\u003cli>\u003cspan class=\"red\">犯罪未遂：已着手实行，因意志以外原因未得逞\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">着手\u003c/span>：开始实行\u003cspan class=\"blue\">基本构成\u003c/span>行为，给犯罪客体造成直接、现实、紧迫危险\u003c/li>\u003cli>\u003cspan class=\"blue\">未得逞\u003c/span>：未齐备既遂要件\u003c/li>\u003cli>\u003cspan class=\"blue\">意志外原因\u003c/span>：违背本人意愿、迫使犯罪停止；可比照既遂犯从轻或减轻\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>从直接动手开始算着手，没达既遂要件且停下是因为外因，就按未遂判断。\u003c/p>","count":4,"chars":94,"gap":false},{"id":"criminal-1794794335422","n":84,"chapter":"第九章 故意犯罪的停止形态 / 法条分析题","title":"主动停手或阻止结果","body":"\u003col>\u003cli>\u003cspan class=\"red\">中止发生在预备开始至既遂之前\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">自动性\u003c/span>：能继续却自愿停止；有效性：实行终了后须实际阻止结果\u003c/li>\u003cli>\u003cspan class=\"blue\">中止造成损害的应减轻；没有造成损害的应免除\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">损害指构成要件结果外的实际损害\u003c/span>；制度鼓励主动停止、避免结果\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>中止要在犯罪还在进行时主动停下或有效挡住结果，没损害免罚，有损害减罚。\u003c/p>","count":4,"chars":93,"gap":false},{"id":"criminal-1794794335423","n":85,"chapter":"第十章 共同犯罪 / 简答题","title":"共同犯罪的概念、构成特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">共同犯罪是二人以上共同故意犯罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主体\u003c/span>：至少有两个符合法定条件的\u003cspan class=\"blue\">犯罪主体\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客观\u003c/span>：有\u003cspan class=\"blue\">共同犯罪行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主观\u003c/span>：有共同犯罪的故意\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>共同犯罪得有两名以上合格主体，他们互相配合做同一犯罪，并有共同故意。\u003c/p>","count":4,"chars":55,"gap":false},{"id":"criminal-1794794335424","n":86,"chapter":"第十章 共同犯罪 / 简答题","title":"因缺乏共同故意而不构成共同犯罪的情形","body":"\u003col>\u003cli>\u003cspan class=\"red\">共同过失：各负其责，不按共犯\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">间接正犯\u003c/span>：利用无责任、不知情者作工具\u003c/li>\u003cli>\u003cspan class=\"blue\">事后帮助\u003c/span>：事前无通谋，事后才帮助\u003c/li>\u003cli>\u003cspan class=\"blue\">实行过限\u003c/span>：超出共同故意，由实施者负责\u003c/li>\u003cli>\u003cspan class=\"blue\">同时犯\u003c/span>：同时作案但无\u003cspan class=\"blue\">意思联络\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">片面帮助\u003c/span>：对方不知情，欠缺共同故意联络\u003c/li>\u003c/ol>","memory":"\u003cp>过、工、后、超、同、片（共同过失、间接正犯、事后帮助、实行过限、同时犯、片面帮助）。\u003c/p>","understanding":"\u003cp>碰巧同时做、只有共同过失、彼此没共同故意或一人干了超出共谋的事，都不能一锅端按共犯处理。\u003c/p>\u003cp>没一起商量、没共同故意，就不算共犯；各管各的、拿人当工具、事后才帮、超计划、各干各的、暗中帮忙对方不知道。\u003c/p>","count":6,"chars":99,"gap":false},{"id":"criminal-1794794335425","n":87,"chapter":"第十章 共同犯罪 / 简答题","title":"共同犯罪的形式","body":"\u003col>\u003cli>\u003cspan class=\"red\">共同犯罪形式是共同犯罪人的结合结构\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按能否任意组成\u003c/span>：任意、\u003cspan class=\"blue\">必要共同犯罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按通谋时间\u003c/span>：事前通谋、事前无通谋\u003c/li>\u003cli>\u003cspan class=\"blue\">按有无分工\u003c/span>：简单、\u003cspan class=\"blue\">复杂共同犯罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按组织程度\u003c/span>：一般、\u003cspan class=\"blue\">特殊共同犯罪\u003c/span>；犯罪集团须3人以上、较固定，为共同犯罪组成\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>能不能随便凑人：任意/必要啥时候商量：事前通谋/事前无通谋有没有分工：简单/复杂有没有组织：一般/特殊（集团）集团：三人以上、骨干固定、常作案、有老大、有预谋、危险大。口诀：随不随、早不早、分不分、有组织；三固常首预危大。\u003c/p>","count":5,"chars":102,"gap":false},{"id":"criminal-1794794335426","n":88,"chapter":"第十章 共同犯罪 / 简答题","title":"共犯人的分类","body":"\u003col>\u003cli>\u003cspan class=\"red\">按分工：实行犯、组织犯、教唆犯、帮助犯\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按作用\u003c/span>：主犯、从犯、胁从犯\u003c/li>\u003cli>\u003cspan class=\"blue\">两套分类交叉\u003c/span>：实行犯可因作用不同成为主犯、从犯或胁从犯，教唆犯可为主犯或从犯，帮助犯通常属从犯，受胁迫的还可能是胁从犯\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>分工看干啥：动手、组织、教唆、帮忙；作用看功劳：主、从、胁从；两套能交叉，不是一一对应。口诀：分工四件套（实组教帮），作用主从胁，交叉不卡死。\u003c/p>","count":3,"chars":91,"gap":false},{"id":"criminal-1794794335427","n":89,"chapter":"第十章 共同犯罪 / 简答题","title":"主犯及其刑事责任","body":"\u003col>\u003cli>\u003cspan class=\"red\">主犯指组织、领导犯罪集团进行犯罪活动的或在共同犯罪中起主要作用的罪犯\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">组织、领导犯罪集团进行犯罪活动的首要分子\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">在犯罪集团或一般共同犯罪中起主要作用的罪犯\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">刑事责任\u003c/span>：对组织、领导犯罪集团的首要分子，按照集团所犯的全部罪行处罚；对其他主犯，应当按照其所参与的或组织、指挥的全部犯罪处罚\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>主犯看谁组织领导集团或起主要作用，集团首要分子担集团全部罪行，其他主犯按其参与或组织指挥的范围担责。\u003c/p>","count":4,"chars":138,"gap":false},{"id":"criminal-1794794335428","n":90,"chapter":"第十章 共同犯罪 / 简答题","title":"首要分子和主犯的关系","body":"\u003col>\u003cli>\u003cspan class=\"red\">首要分子是犯罪集团或聚众犯罪中起组织、策划、指挥作用的人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">两者是交叉关系。犯罪集团的首要分子是主犯\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">聚众犯罪先看法条处罚范围\u003c/span>：全体参加者、首要分子和积极参加者，或仅首要分子\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>犯罪集团的首要分子一定是主犯，聚众犯罪的首要分子是否是主犯还要看有没有形成共同犯罪。\u003c/p>\u003cp>先看法条罚谁；只有一个老大担责、没别的同伙，就不算共犯、不硬定主犯。\u003c/p>","count":3,"chars":84,"gap":false},{"id":"criminal-1794794335429","n":91,"chapter":"第十章 共同犯罪 / 简答题","title":"从犯及其刑事责任","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">从犯指在共同犯罪中起次要或辅助作用的罪犯\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">在共同犯罪中起次要作用的实行犯\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">在共同犯罪中辅助他人实行犯罪的帮助犯\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">刑事责任\u003c/span>：对从犯，应当从轻、\u003cspan class=\"blue\">减轻处罚\u003c/span>或免除处罚\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>在共同犯罪中起次要或辅助作用的是从犯，依法应从轻、减轻或免除处罚。\u003c/p>","count":4,"chars":76,"gap":false},{"id":"criminal-1794794335430","n":92,"chapter":"第十章 共同犯罪 / 简答题","title":"胁从犯及其刑事责任","body":"\u003col>\u003cli>\u003cspan class=\"red\">胁从犯：受暴力强制或精神威逼，被迫参加犯罪者\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">从犯通常自愿参加且作用次要、辅助\u003c/span>；胁从犯参加被动，二者均可能作用较小\u003c/li>\u003cli>\u003cspan class=\"blue\">对胁从犯应按其犯罪情节减轻或免除处罚\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>被胁迫参加犯罪且作用较小的人，要按受胁迫程度和所起作用减轻或免除处罚。\u003c/p>","count":3,"chars":74,"gap":false},{"id":"criminal-1794794335431","n":93,"chapter":"第十章 共同犯罪 / 简答题","title":"教唆犯的概念、特点、成立条件","body":"\u003col>\u003cli>\u003cspan class=\"red\">教唆犯：故意使他人产生犯罪意图并实施特定犯罪的人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">特点\u003c/span>：自己可未\u003cspan class=\"blue\">实行犯\u003c/span>罪，仍可因引起他人犯罪意图而担责\u003c/li>\u003cli>\u003cspan class=\"blue\">主观上希望或放任他人因教唆而产生犯罪故意\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">客观上向特定人教唆特定犯罪\u003c/span>，方式可为劝说、怂恿、诱骗等\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>教唆是故意让别人产生犯意，要看他有没有对特定人唆使特定犯罪，对方是否实行还会影响处罚。\u003c/p>","count":4,"chars":97,"gap":false},{"id":"criminal-1794794335432","n":94,"chapter":"第十章 共同犯罪 / 简答题","title":"教唆犯的刑事责任","body":"\u003col>\u003cli>\u003cspan class=\"red\">教唆犯的定罪教唆犯虽然具有独立的犯罪性或可罚性，却不是独立的罪名\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">对教唆犯按照其在共同犯罪中所起的作用处罚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">如果被教唆人没有犯被教唆的罪\u003c/span>，教唆犯独自构成犯罪，但可以从轻或\u003cspan class=\"blue\">减轻处罚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">教唆不满18周岁的人犯罪的，应当从重处罚\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>教唆犯按在共犯中起的作用处罚，教唆不满18周岁者从重，对方没犯所教唆的罪时可从轻或减轻。\u003c/p>","count":4,"chars":107,"gap":false},{"id":"criminal-1794794335433","n":95,"chapter":"第十章 共同犯罪 / 简答题","title":"共同犯罪与犯罪预备、未遂、既遂","body":"\u003col>\u003cli>\u003cspan class=\"red\">一人既遂，通常整体既遂\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">共同实行因外因归于未遂，全体按未遂\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">全体主动且有效地停止共同犯罪，按中止\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">实行犯既遂或未遂，教唆、帮助者原则上随同认定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">因外因尚未着手，实行者和帮助者按预备\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>共犯是否进入预备、未遂或既遂，要看共同犯罪进展，通常一个实行犯既遂就会影响其他共犯的认定。\u003c/p>","count":5,"chars":86,"gap":false},{"id":"criminal-1794794335434","n":96,"chapter":"第十章 共同犯罪 / 简答题","title":"共同犯罪与犯罪中止","body":"\u003col>\u003cli>\u003cspan class=\"red\">共犯中止须自动停止并有效阻止共同犯罪结果，仅消极退出不够\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">部分人主动停止且有效阻止结果，可单独成立中止\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">中止效力只及本人，不当然惠及其他共犯\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">未有效阻止结果，不能单独成立中止\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>共犯想单独中止，不能只说退出，还要切断自己的作用，必要时有效阻止共犯继续或结果发生。\u003c/p>","count":4,"chars":84,"gap":false},{"id":"criminal-1794794335435","n":97,"chapter":"第十章 共同犯罪 / 法条分析题","title":"共同犯罪须有共同故意","body":"\u003col>\u003cli>\u003cspan class=\"red\">共犯须两个以上犯罪主体、共同犯罪行为、共同故意\u003c/span>；单位也可与单位共同犯罪\u003c/li>\u003cli>\u003cspan class=\"blue\">共同过失不以共同犯罪论，各按本人犯罪担责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">例如两人无共同故意地推石砸死人，分别判断过失责任\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>两人一起过失造成死亡也不算共犯，各担各的责任，有共同故意和共同行为的两个单位则可能成立共犯。\u003c/p>","count":3,"chars":79,"gap":false},{"id":"criminal-1794794335436","n":98,"chapter":"第十章 共同犯罪 / 法条分析题","title":"从犯怎么认定和处罚","body":"\u003col>\u003cli>\u003cspan class=\"red\">从犯包括起次要作用的实行犯和起辅助作用的帮助犯\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">应从轻、减轻或免除；减轻是在对应法定刑幅度以下处罚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按本人作用及自首、立功、累犯等分别量刑\u003c/span>，不简单照主犯减一档\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>从犯有次要实行和辅助两种，减轻要到法定最低刑以下，是否从宽还要看他自己的情节。\u003c/p>","count":3,"chars":77,"gap":false},{"id":"criminal-1794794335437","n":99,"chapter":"第十一章 罪数形态 / 简答题","title":"罪数的概念、意义","body":"\u003col>\u003cli>\u003cspan class=\"red\">罪数：一人所犯罪的数量，区分一罪、数罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">判断以犯罪构成为标准\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">决定是否数罪并罚，避免把一行为重复评价或把数罪漏罚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须区分实质一罪、法定一罪、处断一罪等情形\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>先把行为数、符合的罪名和法律处理方式分开，才能判断定一罪还是多罪、是否要并罚。\u003c/p>","count":4,"chars":74,"gap":false},{"id":"criminal-1794794335438","n":100,"chapter":"第十一章 罪数形态 / 简答题","title":"判断罪数的标准的学说","body":"\u003col>\u003cli>\u003cspan class=\"red\">行为说：数自然意义上行为，一个行为即使有数个结果也按一罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法益说\u003c/span>：数被侵害的法益，专属法益看主体，非专属法益看归属\u003c/li>\u003cli>\u003cspan class=\"blue\">意思说\u003c/span>：数行为人的犯罪意思，意思单一原则上按\u003cspan class=\"blue\">一罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">构成要件说\u003c/span>：看符合几个犯罪构成，符合一次为\u003cspan class=\"blue\">一罪\u003c/span>，符合数次为数罪，这是我国理论的主流标准\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>判断罪数有数行为、数法益、数犯罪意思的说法，我国主流看符合了几个犯罪构成。\u003c/p>","count":4,"chars":123,"gap":false},{"id":"criminal-1794794335439","n":101,"chapter":"第十一章 罪数形态 / 简答题","title":"继续犯的概念、特征、类型、意义","body":"\u003col>\u003cli>\u003cspan class=\"red\">继续犯：同一行为从着手到终了，行为与不法状态同时继续\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">一个犯罪故意，侵犯同一客体\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">侵害持续不断，不法状态依赖犯罪行为继续\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">类型\u003c/span>：持有型、不作为型、侵犯人身自由型\u003c/li>\u003cli>\u003cspan class=\"blue\">追诉期限从行为终了起算\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行为继续时仍可正当防卫，他人这时加入也可能成立共犯\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">行为横跨新旧刑法并持续至新法生效后\u003c/span>，按教材观点全案适用新法，仍为一罪\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>继续犯是一个行为和违法状态一起持续，所以追诉从停下才算，持续时还可能防卫或成立共犯。\u003c/p>","count":7,"chars":147,"gap":false},{"id":"criminal-1794794335440","n":102,"chapter":"第十一章 罪数形态 / 简答题","title":"即成犯与状态犯的概念和特点","body":"\u003col>\u003cli>\u003cspan class=\"red\">即成犯指犯罪行为发生侵害法益结果的同时，犯罪行为即告终了，犯罪行为终了，随之法益被消灭\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">状态犯指发生侵害一定法益的事实同时\u003c/span>，犯罪行为虽然结束，但在其后侵害法益的状态可能依然存在\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>即成犯完成时行为和侵害状态都结束，状态犯是行为结束了但留下的违法状态还在。\u003c/p>","count":2,"chars":87,"gap":false},{"id":"criminal-1794794335441","n":103,"chapter":"第十一章 罪数形态 / 简答题","title":"法定一罪的概念及种类","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：指数个独立的犯罪行为依据刑法的规定作为一罪定罪处罚的情况\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">种类\u003c/span>：主要有\u003cspan class=\"blue\">结合犯\u003c/span>、\u003cspan class=\"blue\">集合犯\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>法定一罪是法律直接把多种行为合成一个罪来定，主要看结合犯和集合犯。\u003c/p>","count":2,"chars":44,"gap":false},{"id":"criminal-1794794335442","n":104,"chapter":"第十一章 罪数形态 / 简答题","title":"集合犯的概念和特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">集合犯，指行为人以实施不定次数的同种犯罪行为为目的，实施了数个同种犯罪行为，刑法规定作为一罪论处的犯罪形态\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">行为人以实施不定次数的同种犯罪行为为目的\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">实施了数个同种的犯罪行为\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">刑法将数个同种犯罪行为规定为一罪\u003c/span>，\u003cspan class=\"blue\">集合犯\u003c/span>是法律规定的一罪\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>集合犯是法律把本来可能反复干的同类行为作为一个罪处理，要看法条预定的营业性、职业性或常习性。\u003c/p>","count":4,"chars":113,"gap":false},{"id":"criminal-1794794335443","n":105,"chapter":"第十一章 罪数形态 / 简答题","title":"处断的一罪的概念及种类","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">概念：指数行为犯数罪按一罪定罪处罚的情况\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">种类\u003c/span>：包括\u003cspan class=\"blue\">连续犯\u003c/span>、\u003cspan class=\"blue\">牵连犯\u003c/span>、吸收犯\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>处断的一罪是符合数罪却按一罪处罚，常见是连续做、手段目的相牵连或一个行为被另一行为吸收。\u003c/p>","count":2,"chars":36,"gap":false},{"id":"criminal-1794794335444","n":106,"chapter":"第十一章 罪数形态 / 简答题","title":"吸收犯的概念和特征、形式","body":"\u003col>\u003cli>\u003cspan class=\"red\">吸收犯：数个犯罪行为因紧密联系，其中一行为吸收其他行为，只按吸收行为定罪\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须数行为、各可独立成罪且有吸收关系\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">形式\u003c/span>通常为重行为吸收轻行为、实行吸收预备、主行为吸收从行为\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>吸收犯是几行为各可成罪，但关系密切，其中较完整、较重或主要的行为把另一行为吸收。\u003c/p>","count":3,"chars":82,"gap":false},{"id":"criminal-1794794335445","n":107,"chapter":"第十一章 罪数形态 / 法条分析题","title":"帮信又犯别的罪怎么判","body":"\u003col>\u003cli>\u003cspan class=\"red\">一个帮助信息网络犯罪行为同时符合帮信罪和其他罪，属想象竞合\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">同一行为触犯数罪名，从一重处断，不实行数罪并罚\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>同一行为同时够两个罪名属于想象竞合，按处罚较重的那个规定定罪处罚。\u003c/p>","count":2,"chars":52,"gap":false},{"id":"criminal-1794794335446","n":108,"chapter":"第十二章 刑事责任 / 简答题","title":"刑事责任的概念与特征","body":"\u003cp class=\"definition\">\u003cspan class=\"red\">刑事责任指行为人因其犯罪行为所应承受的、代表国家的司法机关根据刑事法律对该行为所做的否定评价和对行为人进行谴责的可能性\u003c/span>\u003c/p>\u003col>\u003cli>\u003cspan class=\"blue\">刑事责任包含对犯罪行为的非难性和对犯罪人的谴责性\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">刑事责任具有社会性与法律性\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">刑事责任具有必然性与平等性\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">刑事责任具有严厉性与专属性\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>人做了犯罪行为，就要承担刑法上的不利后果，刑事责任由国家依法追究。\u003c/p>","count":5,"chars":122,"gap":false},{"id":"criminal-1794794335447","n":109,"chapter":"第十二章 刑事责任 / 简答题","title":"刑事责任与刑罚的关系","body":"\u003col>\u003cli>\u003cspan class=\"red\">刑事责任是犯罪依法产生的否定评价、承担后果的责任\u003c/span>；刑罚是主要实现手段\u003c/li>\u003cli>\u003cspan class=\"blue\">刑责先于刑罚，是判刑依据；刑罚落实刑责\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">刑责不等于刑罚\u003c/span>，可定罪免刑或用其他方式解决；无刑责不能判刑\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>刑事责任是犯了罪要承担的法律后果，刑罚是实现责任的主要方式之一。\u003c/p>","count":3,"chars":82,"gap":false},{"id":"criminal-1794794335448","n":110,"chapter":"第十二章 刑事责任 / 简答题","title":"刑事责任在刑法理论上的地位","body":"\u003col>\u003cli>\u003cspan class=\"red\">基础理论说：刑事责任是刑法学的基础，犯罪论、刑罚论等是其具体展开，应把它放在犯罪论之前\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">罪、责平行说\u003c/span>：犯罪是责任前提，\u003cspan class=\"blue\">责任是犯罪后果\u003c/span>，刑罚只是实现责任的方式之一，体系按犯罪论和刑事责任论组织\u003c/li>\u003cli>\u003cspan class=\"blue\">罪、责、刑平行说\u003c/span>：三者相对独立又相互联系，刑事责任承接犯罪、\u003cspan class=\"blue\">连接刑罚\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有人把刑事责任放在犯罪论或刑罚论里，也有人单列，因为它把犯了什么罪和要受什么处理接起来。\u003c/p>","count":3,"chars":128,"gap":false},{"id":"criminal-1794794335449","n":111,"chapter":"第十二章 刑事责任 / 简答题","title":"刑事责任的哲学根据、法律根据与事实根据","body":"\u003col>\u003cli>\u003cspan class=\"red\">哲学根据：相对的意志自由\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">法律根据\u003c/span>：刑法规定的犯罪构成是判断刑事责任有无的唯一\u003cspan class=\"blue\">法律根据\u003c/span>，也是判断轻重的主要依据\u003c/li>\u003cli>\u003cspan class=\"blue\">事实根据\u003c/span>：符合犯罪构成的事实是判断刑事责任有无的唯一\u003cspan class=\"blue\">事实根据\u003c/span>，也是判断轻重的基础\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>人本可选择守法是哲学根据，刑法规定的要件是法律根据，实际做出来的犯罪事实是事实根据。\u003c/p>","count":3,"chars":94,"gap":false},{"id":"criminal-1794794335450","n":112,"chapter":"第十二章 刑事责任 / 简答题","title":"刑事责任的解决方式","body":"\u003col>\u003cli>\u003cspan class=\"red\">定罪判刑：有罪并判处刑罚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">定罪免刑\u003c/span>：认定有罪，但依法免除刑罚\u003c/li>\u003cli>\u003cspan class=\"blue\">消灭处理\u003c/span>：法定事由使刑事责任消灭\u003c/li>\u003cli>\u003cspan class=\"blue\">转移处理\u003c/span>：依法由\u003cspan class=\"blue\">外交途径\u003c/span>而非我国司法机关解决\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有刑事责任后可判刑、用非刑罚办法处理、依法免刑，也可能因法定事由不再追究。\u003c/p>","count":4,"chars":67,"gap":false},{"id":"criminal-1794794335451","n":113,"chapter":"第十二章 刑事责任 / 法条分析题","title":"定罪免刑与其他处理","body":"\u003col>\u003cli>\u003cspan class=\"red\">犯罪情节轻微、无须判刑的，可免予刑事处罚，属于定罪免刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">训诫、具结悔过、道歉、赔偿、行政处罚或处分等\u003c/span>，属非刑罚处理，不是主刑或附加刑\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>情节轻微可定罪免刑，训诫、写悔过书、道歉或赔偿仍是非刑罚的处理办法。\u003c/p>","count":2,"chars":65,"gap":false},{"id":"criminal-1794794335452","n":114,"chapter":"第十三章 刑罚概述 / 简答题","title":"刑罚的目的","body":"\u003col>\u003cli>\u003cspan class=\"red\">刑罚的目的：国家制定刑罚及对罪犯适用、执行刑罚所期望达到的结果\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">刑罚报应观念\u003c/span>：刑罚是对犯罪的公平报应，在对犯罪科处刑罚时，不应抱有防止犯罪等目的性的考虑\u003c/li>\u003cli>\u003cspan class=\"blue\">预防犯罪目的\u003c/span>：适用刑罚，除了出于对罪犯进行报应外，还有预防再次犯罪的目的\u003c/li>\u003cli>\u003cspan class=\"blue\">迄今为止所出现的预防犯罪目的\u003c/span>，大体上分为\u003cspan class=\"blue\">特殊预防\u003c/span>和一般预防两大类\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>惩罚犯罪既可解释为对过去行为的报应，也可解释为防止本人再犯和警示其他人。\u003c/p>","count":4,"chars":143,"gap":false},{"id":"criminal-1794794335453","n":115,"chapter":"第十三章 刑罚概述 / 简答题","title":"刑罚的种类","body":"\u003col>\u003cli>\u003cspan class=\"red\">刑罚的种类，可以根据两种方法加以区分\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">一是学理分类\u003c/span>，即以刑罚所剥夺或限制罪犯的权利和利益的性质为标准，将刑罚方法分为生命刑、自由刑、财产刑、资格刑四类\u003c/li>\u003cli>\u003cspan class=\"blue\">二是刑法中的分类\u003c/span>，即以某种刑罚方法只能单独适用还是可以附加适用为标准，将刑罚分为主刑与附加刑两类\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>主刑能独立用且一罪只用一个，附加刑可以单用、跟主刑合用，也能同时用多种。\u003c/p>","count":3,"chars":122,"gap":false},{"id":"criminal-1794794335454","n":116,"chapter":"第十三章 刑罚概述 / 简答题","title":"管制的概念和特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">管制：不关押、限制一定自由，依法社区矫正的主刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">通常3个月至2年，并罚最高3年\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">须遵守监管，可同时适用禁止令\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">其余合法权利仍受保护\u003c/span>，未附加\u003cspan class=\"blue\">剥夺政治权利\u003c/span>者仍有相应权利；劳动同工同酬\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>管制不关押，但要接受社区矫正、按要求活动，先行羁押1天折抵2天管制。\u003c/p>","count":4,"chars":86,"gap":false},{"id":"criminal-1794794335455","n":117,"chapter":"第十三章 刑罚概述 / 简答题","title":"管制执行期间应遵守的规定","body":"\u003col>\u003cli>\u003cspan class=\"red\">依法社区矫正，守法服从监督\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">六项政治自由须经批准方可行使\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">按规定报告活动，遵守会客规则\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">离开居住市县或迁居须批准\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有禁止令的，遵守特定活动、场所、接触对象限制\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>被管制期间仍要守法、接受监督、按规矩报告和会客，特定活动或外出迁居须事先批准。\u003c/p>","count":5,"chars":75,"gap":false},{"id":"criminal-1794794335456","n":118,"chapter":"第十三章 刑罚概述 / 简答题","title":"拘役的概念和特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">拘役是短期剥夺罪犯的自由，就近执行并实行劳动改造的刑罚方法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">剥夺罪犯的自由\u003c/span>，即将罪犯羁押于特定的设施或场所之中，剥夺其人身自由\u003c/li>\u003cli>\u003cspan class=\"blue\">期限较短\u003c/span>，为\u003cspan class=\"blue\">1个月以上6个月以下\u003c/span>，数罪并罚时，拘役刑期最高不能超过\u003cspan class=\"blue\">1年\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">被判拘役的罪犯在执行期间具有某些优于有期徒刑的待遇\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>拘役是公安机关就近执行的短期关押，期间可以按规定回家，参加劳动可酌给报酬。\u003c/p>","count":4,"chars":122,"gap":false},{"id":"criminal-1794794335457","n":119,"chapter":"第十三章 刑罚概述 / 简答题","title":"有期徒刑的概念和特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">有期徒刑：剥夺一定期限自由，强制有劳动能力者劳动并接受教育改造\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">通常6个月至15年\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">并罚总和不足35年\u003c/span>，最高\u003cspan class=\"blue\">20年\u003c/span>；总和达\u003cspan class=\"blue\">35年\u003c/span>，最高25年\u003c/li>\u003cli>\u003cspan class=\"blue\">在监狱或法定其他场所执行\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有期徒刑是在一定时间内关押改造，通常由监狱等场所执行，先押1天折刑1天。\u003c/p>","count":4,"chars":80,"gap":false},{"id":"criminal-1794794335458","n":120,"chapter":"第十三章 刑罚概述 / 简答题","title":"无期徒刑的概念和特征","body":"\u003col>\u003cli>\u003cspan class=\"red\">无期徒刑是剥夺罪犯的终身自由，强制其参加劳动并接受教育改造的刑罚方法\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">没有刑期限制，罪犯终身被剥夺自由\u003c/span>\u003c/li>\u003cli>被判无期徒刑的罪犯在判决执行以前的羁押时间不存在折抵刑期的问题\u003c/li>\u003cli>\u003cspan class=\"blue\">对被判无期徒刑的罪犯，必须剥夺政治权利终身\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>无期徒刑没有预定结束日期，须关押改造，但符合条件仍可能减刑或假释。\u003c/p>","count":4,"chars":102,"gap":false},{"id":"criminal-1794794335459","n":121,"chapter":"第十三章 刑罚概述 / 简答题","title":"死刑的概念和对死刑适用的限制","body":"\u003col>\u003cli>\u003cspan class=\"red\">死刑：剥夺犯罪人生命的最严厉刑罚，仅适用罪行极其严重者\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">犯罪时未满18、审判时怀孕者不适用\u003c/span>；审判时满75原则不适用，特别残忍致死除外\u003c/li>\u003cli>\u003cspan class=\"blue\">立即执行须最高法核准，死缓可由高院判决、核准\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">非必须立即执行的可判死缓\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>死刑只给罪行极其严重的人，还要过不适用人群和最高法院核准等关口。\u003c/p>","count":4,"chars":99,"gap":false},{"id":"criminal-1794794335460","n":122,"chapter":"第十三章 刑罚概述 / 简答题","title":"死刑缓期2年执行的概念和法律后果","body":"\u003col>\u003cli>\u003cspan class=\"red\">死缓：应判死刑但不必立即执行，宣告缓期2年，不是独立刑种\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">期满无故意犯罪减无期；重大立功减25年有期\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">故意犯罪情节恶劣\u003c/span>，报最高法核准执行死刑；其他\u003cspan class=\"blue\">故意犯\u003c/span>罪\u003cspan class=\"blue\">重新计算\u003c/span>死缓并备案\u003c/li>\u003cli>\u003cspan class=\"blue\">特定罪犯可限制减刑\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>死缓还是死刑，先观察两年，再根据有没有故意犯罪、情节和重大立功决定下一步。\u003c/p>","count":4,"chars":93,"gap":false},{"id":"criminal-1794794335461","n":123,"chapter":"第十三章 刑罚概述 / 简答题","title":"对被判处死刑缓期执行罪犯的限制减刑","body":"\u003col>\u003cli>\u003cspan class=\"red\">死缓累犯及因故意杀人、强奸、抢劫、绑架、放火、爆炸、投放危险物质、有组织暴力犯罪被判死缓者，法院可同时限制减刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">限制减刑死缓\u003c/span>：期满减无期后实际执行不少于\u003cspan class=\"blue\">25年\u003c/span>；减\u003cspan class=\"blue\">25年\u003c/span>有期后实际执行不少于\u003cspan class=\"blue\">20年\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>特定死缓罪犯可被限制减刑，仍能减，但减为无期或25年有期后各有更高的实际服刑底线。\u003c/p>","count":2,"chars":96,"gap":false},{"id":"criminal-1794794335462","n":124,"chapter":"第十三章 刑罚概述 / 简答题","title":"罚金的概念、适用方式和执行方式","body":"\u003col>\u003cli>\u003cspan class=\"red\">罚金：法院判个人、单位向国家交一定钱款的刑罚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">适用可单处、并处、选处、并处或单处，依分则规定\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">限期一次或分期交\u003c/span>，逾期强制缴纳；未缴足发现财产随时追缴\u003c/li>\u003cli>\u003cspan class=\"blue\">因不可抗拒灾祸等确有困难，可依法延期、减免\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>罚金是向国家交钱的刑罚，可按法条单用或附加，执行看缴纳能力，也可能强制、追缴或依法变更。\u003c/p>","count":4,"chars":93,"gap":false},{"id":"criminal-1794794335463","n":125,"chapter":"第十三章 刑罚概述 / 简答题","title":"剥夺政治权利的概念和内容","body":"\u003col>\u003cli>\u003cspan class=\"red\">剥夺政治权利：依法剥夺参与国家管理、政治活动权利的资格刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">选举权、被选举权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">言论、出版、集会、结社、游行、示威自由\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国家机关任职权\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">国有公司、企业、事业单位、人民团体领导职务任职权\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>剥夺政治权利就是暂时或终身不能投票参选、行使特定自由或担任法定职务。\u003c/p>","count":5,"chars":86,"gap":false},{"id":"criminal-1794794335464","n":126,"chapter":"第十三章 刑罚概述 / 简答题","title":"剥夺政治权利的适用范围和对象","body":"\u003col>\u003cli>\u003cspan class=\"red\">剥夺政治权利可依法独立或附加适用\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">危害国家安全犯罪，应附加\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">故意杀人\u003c/span>、强奸、放火、爆炸、投毒、抢劫等严重破坏社会秩序犯罪，可附加\u003c/li>\u003cli>\u003cspan class=\"blue\">死刑、无期徒刑，应附加终身剥夺\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>危害国家安全犯罪应附加剥夺政治权利，严重破坏社会秩序的某些罪可附加，死刑和无期应终身剥夺。\u003c/p>","count":4,"chars":77,"gap":false},{"id":"criminal-1794794335465","n":127,"chapter":"第十三章 刑罚概述 / 简答题","title":"剥夺政治权利的期限","body":"\u003col>\u003cli>\u003cspan class=\"red\">管制附加剥夺政治权利：期限同管制，通常3个月至2年\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">独立适用或有期、拘役附加\u003c/span>：1至5年\u003c/li>\u003cli>\u003cspan class=\"blue\">死刑、无期\u003c/span>：终身剥夺\u003c/li>\u003cli>\u003cspan class=\"blue\">死缓或无期减为有期后，附加剥夺期限改为3至10年\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>剥夺政治权利通常1至5年，随管制则同期限，死刑和无期终身，依法减刑时相应调整。\u003c/p>","count":4,"chars":76,"gap":false},{"id":"criminal-1794794335466","n":128,"chapter":"第十三章 刑罚概述 / 简答题","title":"没收财产的概念和适用方式","body":"\u003col>\u003cli>\u003cspan class=\"red\">没收财产：将罪犯个人合法财产部分或全部无偿收归国有的刑罚\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">并处没收\u003c/span>：必须附加\u003c/li>\u003cli>\u003cspan class=\"blue\">可以并处\u003c/span>：是否附加由法院依法裁量\u003c/li>\u003cli>\u003cspan class=\"blue\">并处罚金或没收\u003c/span>：两者择一，必须附加一种\u003c/li>\u003cli>\u003cspan class=\"blue\">不得没收家属财产，应保留本人、扶养家属必要生活费用\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>没收财产只能没收犯罪人自己的部分或全部财产，按法条可并用或在允许时选用，还应保留必要生活费用。\u003c/p>","count":5,"chars":97,"gap":false},{"id":"criminal-1794794335467","n":129,"chapter":"第十三章 刑罚概述 / 简答题","title":"非刑罚处理方法的概念和种类","body":"\u003col>\u003cli>\u003cspan class=\"red\">非刑罚处理方法，指人民法院对罪犯适用的刑罚以外的处理方法，包括判处赔偿经济损失、责令赔偿经济损失、训诫、责令具结悔过、责令赔礼道歉、由主管部门给予行政处罚或行政处分、禁止令、从业禁止等\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>构成犯罪却不用判刑时，仍可训诫、要求悔过、道歉或赔偿，也可由主管部门作行政处理。\u003c/p>","count":1,"chars":92,"gap":false},{"id":"criminal-1794794335468","n":130,"chapter":"第十三章 刑罚概述 / 简答题","title":"禁止令","body":"\u003col>\u003cli>\u003cspan class=\"red\">禁止令：判管制、宣告缓刑时，禁止特定活动、进入特定场所、接触特定人\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">期限可短于或等于管制、缓刑考验期\u003c/span>；管制至少\u003cspan class=\"blue\">3个月\u003c/span>，缓刑至少\u003cspan class=\"blue\">2个月\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">违反通常由公安机关处罚；缓刑违反且情节严重的撤销缓刑\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>法院可对管制和缓刑的人限制特定活动、地点或接触对象，违反时依法处理。\u003c/p>","count":3,"chars":91,"gap":false},{"id":"criminal-1794794335469","n":131,"chapter":"第十三章 刑罚概述 / 法条分析题","title":"主刑有哪些","body":"\u003col>\u003cli>\u003cspan class=\"red\">主刑只能独立适用，一罪只能判一种\u003c/span>；包括管制、拘役、有期、无期、死刑\u003c/li>\u003cli>\u003cspan class=\"blue\">附加刑既可独立也可附加适用，一罪可判多种\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">主刑是刑罚体系核心，不能附加于其他刑罚\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>主刑是基本刑罚，一个罪只能选一种主刑，附加刑可随主刑一起判，也可以依法单独判。\u003c/p>","count":3,"chars":72,"gap":false},{"id":"criminal-1794794335470","n":132,"chapter":"第十三章 刑罚概述 / 法条分析题","title":"附加刑能单独判吗","body":"\u003col>\u003cli>\u003cspan class=\"red\">附加刑包括罚金、剥夺政治权利、没收财产\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">罚金\u003c/span>：命犯罪个人或单位向国家交钱\u003c/li>\u003cli>\u003cspan class=\"blue\">剥夺政治权利\u003c/span>：剥夺参与国家管理和政治活动的权利，属\u003cspan class=\"blue\">资格刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">独立适用须有分则依据，不能任意单处\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>罚金让人交钱，剥夺政治权利让人不能行使法定权利，两者在法律允许时都可单独用。\u003c/p>","count":4,"chars":80,"gap":false},{"id":"criminal-1794794335471","n":133,"chapter":"第十三章 刑罚概述 / 法条分析题","title":"外国人如何被驱逐出境","body":"\u003col>\u003cli>\u003cspan class=\"red\">驱逐出境：强制犯罪的外国人离开我国国境，属于特殊附加刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">可以独立适用，也可在主刑之外附加；仅适用外国人\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>对犯罪的外国人，驱逐出境既可单独判，也可在其他刑罚之外附加判。\u003c/p>","count":2,"chars":50,"gap":false},{"id":"criminal-1794794335472","n":134,"chapter":"第十三章 刑罚概述 / 法条分析题","title":"刑罚和赔偿谁优先","body":"\u003col>\u003cli>\u003cspan class=\"red\">赔偿经济损失是非刑罚处理，不是主刑、附加刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">民事赔偿优先\u003c/span>：既负赔偿责任又判罚金，财产不足时先赔被害人；单处罚金、并处罚金均如此\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>赔偿是给被害人补损失，属于民事责任，遇到刑事财产处罚和同案民事赔偿冲突时民事赔偿优先。\u003c/p>","count":2,"chars":62,"gap":false},{"id":"criminal-1794794335473","n":135,"chapter":"第十三章 刑罚概述 / 法条分析题","title":"罪轻何时可以免刑","body":"\u003col>\u003cli>\u003cspan class=\"red\">犯罪已成立，但性质、情节、危害轻且无须判刑，可定罪免刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">训诫\u003c/span>：当庭公开谴责教育\u003c/li>\u003cli>\u003cspan class=\"blue\">具结悔过\u003c/span>：书面保证悔改、不再犯\u003c/li>\u003cli>\u003cspan class=\"blue\">道歉是承认错误、表示歉意；造成经济损失的可责令赔偿\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有罪但很轻、无需用刑时可免刑，法院仍可教育警告、要书面悔过、道歉或赔偿。\u003c/p>","count":4,"chars":78,"gap":false},{"id":"criminal-1794794335474","n":136,"chapter":"第十三章 刑罚概述 / 法条分析题","title":"犯罪后何时禁止从业","body":"\u003col>\u003cli>\u003cspan class=\"red\">从业禁止属于保安处分，不是主刑、附加刑\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">相关期限从主刑执行完毕或假释之日起算\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">违反法院从业禁止决定\u003c/span>，由公安依法处罚；情节严重的，以拒不执行判决、裁定罪处罚\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>借职业便利或违反职业义务犯罪，法院可依法限制其刑满或假释后从事有关职业，违令须承担相应责任。\u003c/p>","count":3,"chars":75,"gap":false},{"id":"criminal-1794794335475","n":137,"chapter":"第十三章 刑罚概述 / 法条分析题","title":"管制和社区矫正","body":"\u003col>\u003cli>\u003cspan class=\"red\">管制：不关押，限制一定自由，依法社区矫正\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">禁止令\u003c/span>：判管制或宣告缓刑时，限制特定活动、场所、接触人员\u003c/li>\u003cli>\u003cspan class=\"blue\">社区矫正\u003c/span>：对管制、缓刑、假释、暂予\u003cspan class=\"blue\">监外执行\u003c/span>者，在社区监督管理、教育帮扶\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>管制让罪犯在社区接受管束而不用坐牢，法院还能按案情下禁止令，社区矫正负责日常监管改造。\u003c/p>","count":3,"chars":83,"gap":false},{"id":"criminal-1794794335476","n":138,"chapter":"第十三章 刑罚概述 / 法条分析题","title":"管制期间要守什么规矩","body":"\u003col>\u003cli>\u003cspan class=\"red\">管制不剥夺法定政治权利，但行使言论、出版、集会、结社、游行、示威自由须经批准，便于监督改造\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">管制在社会执行、不关押，参加劳动应同工同酬\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>管制只是让某些自由先经批准，并没有剥夺权利，劳动仍同工同酬，体现不关押、在社会中改造。\u003c/p>","count":2,"chars":66,"gap":false},{"id":"criminal-1794794335477","n":139,"chapter":"第十三章 刑罚概述 / 法条分析题","title":"管制怎么算刑期","body":"\u003col>\u003cli>\u003cspan class=\"red\">管制刑期从判决开始执行当日起算，当日计入\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">判决执行前\u003c/span>，因同一犯罪被刑事拘留、逮捕羁押的，\u003cspan class=\"blue\">1日\u003c/span>折抵管制\u003cspan class=\"blue\">2日\u003c/span>；行政、司法拘留不属此处\u003cspan class=\"blue\">先行羁押\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>管制从实际执行起算，先关押过的天数按1天抵2天管制算。\u003c/p>","count":2,"chars":67,"gap":false},{"id":"criminal-1794794335478","n":140,"chapter":"第十三章 刑罚概述 / 法条分析题","title":"拘役怎么执行","body":"\u003col>\u003cli>\u003cspan class=\"red\">拘役由公安机关就近执行，不交监狱执行\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">每月可回家1至2日，参加劳动可酌给报酬\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">拘役较轻，通过短期关押、保留家庭联系促使改造\u003c/span>\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>拘役由公安机关就近关押，让人每月可回家1至2天、劳动可得报酬，便于维系家庭和改造。\u003c/p>","count":3,"chars":59,"gap":false},{"id":"criminal-1794794335479","n":141,"chapter":"第十三章 刑罚概述 / 法条分析题","title":"有期无期怎么服刑","body":"\u003col>\u003cli>\u003cspan class=\"red\">成年有期徒刑通常在监狱执行\u003c/span>；交付前余刑3个月以下，由看守所代为执行\u003c/li>\u003cli>\u003cspan class=\"blue\">未成年犯在未成年犯管教所执行\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">有劳动能力者应劳动\u003c/span>，并接受思想、文化、职业技术教育，促进改造\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>有期或无期一般在指定场所关押，有劳动能力就要参加劳动、受教育，学会出狱后怎么生活。\u003c/p>","count":3,"chars":77,"gap":false},{"id":"criminal-1794794335480","n":142,"chapter":"第十三章 刑罚概述 / 法条分析题","title":"死刑谁来核准","body":"\u003col>\u003cli>\u003cspan class=\"red\">死刑仅适用罪行极其严重者，危害特别重大\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">死刑立即执行须最高法核准；死缓可由高院判决或核准\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"blue\">严格核准统一标准、防止错杀\u003c/span>；死缓是执行方式，不是独立刑种\u003c/li>\u003c/ol>","memory":"","understanding":"\u003cp>死刑先看罪与危害是否极重，立即执行通常由最高法院核准，死缓可由高院判决或核准。\u003c/p>","count":3,"chars":71,"gap":false},{"id":"criminal-1794794335481","n":143,"chapter":"第十三章 刑罚概述 / 法条分析题","title":"哪些人不能判死刑","body":"\u003col>\u003cli>\u003cspan class=\"red\">犯罪时不满18周岁，不适用死刑\u003c/span>\u003cspan class=\"blue\">，即使审判时已成年\u003c/span>\u003c/li>\u003cli>\u003cspan clas
